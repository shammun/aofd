  par: ['∥ parallel: a·b = +|a||b|, no area', 'info'],
  anti: ['⇅ anti-parallel: a·b = −|a||b|, no area', 'info'],
  perp: ['⟂ perpendicular: a·b = 0, biggest area', 'good'],
  acute: ['↗ θ < 90°: the shadow points along b, a·b > 0', 'info'],
  obtuse: ['↙ θ > 90°: the shadow points backwards, a·b < 0', 'info']

  return {
    zero: 'One arrow has zero length, so there is no angle, no shadow, no rectangle and no parallelogram: both products are 0.',
    par: String.raw`The arrows point the same way: the shadow is the whole of $\mathbf a$ (${fm(q.sp, 3)} = $|\mathbf a|$), so $\mathbf a\cdot\mathbf b = |\mathbf a||\mathbf b|$ = ${fm(q.d, 3)}, the biggest it can be. The parallelogram is flat: $\mathbf a\times\mathbf b = 0$, no turning.`,
    anti: String.raw`The arrows point opposite ways. The shadow is not missing: it is the whole of $\mathbf a$, lying on b's line but pointing backwards, so its foot lands at ${fm(q.sp, 3)} and $\mathbf a\cdot\mathbf b = $ ${fm(q.sp, 3)} × ${fm(q.nb, 3)} = ${fm(q.d, 3)}. No area.`,
    perp: String.raw`No shadow at all, so $\mathbf a\cdot\mathbf b = 0$; the area is as big as it gets, $|\mathbf a||\mathbf b|$ = ${fm(q.area, 3)}.` + adv + String.raw`wind along the temperature contours gives $\mathbf u\cdot\nabla T = 0$: no warmer or colder air arrives.`,
    acute: String.raw`$\mathbf a$ has a positive share along $\mathbf b$ (shadow ${fm(q.sp, 3)} of its ${fm(q.na, 3)}).` + adv + String.raw`$\mathbf u\cdot\nabla T > 0$, the wind blows toward warmer air, so colder air is carried in (cold advection).`,
