# Our own schematic Southern Ocean currents for the Fig. 21.23 analogue (figs/ch21/fig_21_23.py).
#
# Written by hand from general oceanographic knowledge and the open data in this repo: the ACC path follows the
# midpoint of the Orsi SAF and PF read off data/derived/ch21/fig_21_23_fronts_orsi.npz every 20 deg of longitude;
# the Agulhas retroflection and the Brazil-Malvinas confluence follow the GDP mean velocity
# (data/derived/ch21/fig_21_23_gdp_mean_velocity.nc). Nothing here is traced from any book figure.
#
# Each current: points = [[lon degE, lat degN], ...] in flow order (arrowheads point downstream);
# arrows = fractions of the path length where an arrowhead is drawn; labels = [[text, lon, lat], ...];
# kind = acc | gyre | boundary (sets the line width).
