<div class="scene" id="scene">
  <header class="scene-top">
    <div class="scene-title"><b>The 500 hPa surface</b><span class="scene-sub"> · a bumpy sheet whose slopes make the wind · 6 Jan 2014</span></div>
    <div class="scene-transport">
      <button class="scene-btn" id="bPrev" type="button" title="Previous card" aria-label="Previous card">⏮</button>
      <button class="scene-btn primary" id="bPlay" type="button" title="Play the tour" aria-label="Play the tour">▶</button>
      <button class="scene-btn" id="bNext" type="button" title="Next card" aria-label="Next card">⏭</button>
      <button class="scene-btn" id="bReset" type="button" title="Reset the view to this card's camera" aria-label="Reset view">⟲</button>
      <button class="scene-btn only-narrow" id="bPanel" type="button" title="Show or hide the side panel" aria-label="Toggle panel">☰</button>
    </div>
  </header>
  <main class="scene-main">
    <div class="scene-stage" id="stage">
      <div class="scene-caption" id="caption" aria-live="polite">
        <div class="cap-head"><span class="cap-k" id="capK">1 / 8</span><span class="cap-title" id="capTitle"></span><span class="cap-dots" id="dots"></span></div>
        <div class="cap-text" id="capText"></div>
      </div>
      <div class="scene-key" id="arrowKey" hidden><svg id="keySvg" width="40" height="10"><line id="keyLine" x1="1" y1="5" x2="32" y2="5" stroke="#0fa39c" stroke-width="2.5"/><polygon id="keyHead" points="40,5 31,1 31,9" fill="#0fa39c"/></svg><span>20 m/s</span></div>
    </div>
    <aside class="scene-panel" id="panel">
      <nav class="sp-tabs" role="tablist">
        <button class="sp-tab" type="button" role="tab" data-tab="idea" aria-selected="true">Idea</button>
        <button class="sp-tab" type="button" role="tab" data-tab="eq" title="Eqs. (2.215) and (2.234b)">Eq.</button>
        <button class="sp-tab" type="button" role="tab" data-tab="probe">Probe</button>
        <button class="sp-tab" type="button" role="tab" data-tab="ctl" title="Controls">Ctrl</button>
        <button class="sp-tab" type="button" role="tab" data-tab="about">About</button>
      </nav>
      <section class="sp-pane" data-pane="idea" id="paneIdea"></section>
      <section class="sp-pane" data-pane="eq" id="paneEq" hidden></section>
      <section class="sp-pane" data-pane="probe" id="paneProbe" hidden></section>
      <section class="sp-pane" data-pane="ctl" id="paneCtl" hidden>
        <div class="sp-ctl"><label for="sEx"><span>Height exaggeration</span><b id="vEx">×200</b></label>
          <input id="sEx" type="range" min="1" max="500" step="1" value="200" aria-label="Height exaggeration">
          <div class="sp-small" id="exNote"></div></div>
        <div class="sp-ctl"><label for="sCi"><span>Height lines every</span><b id="vCi">60 m</b></label>
          <input id="sCi" type="range" min="30" max="240" step="30" value="60" aria-label="Contour interval"></div>
        <label class="sp-check"><input id="cArrows" type="checkbox"> <span>Geostrophic arrows <span class="c-teal">(teal)</span></span></label>
        <label class="sp-check"><input id="cIso" type="checkbox"> <span>Height lines (bold: 5400 m ± 240 m steps)</span></label>
        <label class="sp-check"><input id="cShell" type="checkbox"> <span>Grey shell at the mean height Z̄</span></label>
        <label class="sp-check"><input id="cLabels" type="checkbox" checked> <span>Labels</span></label>
      </section>
      <section class="sp-pane sp-links" data-pane="about" id="paneAbout" hidden></section>
    </aside>
  </main>
</div>

  Viz.loadKatex().then(() => { Viz.typeset(document.getElementById('paneIdea')); setPanelLive(); paginate(visiblePane(), true); });
  setControls(); setPanelLive();

  Viz3D.scene($('stage'), {
    backend: 'webgl', camera: { fov: 35, up: 'z', near: 0.01, far: 100, position: presets().space.pos, target: [0, 0, 0] },
    controls: { orbit: true, damping: 0.1, minDistance: 1.25, maxDistance: 12 },
    background: 'token:--viz-bg', lazy: false, fallback: 'proj3', provenance: true, audit: Viz3D.auditFromUrl(), onPick
  }).then(sc => {
    if (!sc) { $('stage').insertAdjacentHTML('beforeend', '<div class="scene-note">This scene needs WebGL or a canvas. The side panel still explains the idea.</div>'); return; }
    S = sc;
    S.add(Viz3D.globe({ id: 'surface', radius: 1, lut: LUT, range: RANGE, graticule: 30, coast: true, nLon: MESH_LON, nLat: MESH_LAT,
      displace: displaceDesc(ST.ex),
      provenance: { kind: 'data', text: 'NCEP/NCAR R1 · 2014-01-06 · 2.5° · public domain', title: D.attribution } }));
    S.add(Viz3D.globe({ id: 'refShell', radius: 1, color: '#9aa7c7', opacity: 0.2, coast: false, graticule: 0, nLon: 96, nLat: 48, pick: false, visible: false,
      provenance: { kind: 'schematic', text: 'grey shell = mean height Z̄' } }));
    S.add(Viz3D.vectorField(Object.assign({ id: 'arrows', color: '#0fa39c', pick: false, visible: false, maxArrows: 4000,
      provenance: { kind: 'computed', text: 'arrows: geostrophicWindFromHeight, Eq. (2.215)' } }, arrowData(ST.ex))));
    S.add(Viz3D.vectorField({ id: 'probe', points: [[0, 0, 1]], vectors: [[0, 0, 0.01]], color: n => PROBE_COLORS[n], radius: 0.0055, pick: false, visible: false,
      provenance: { kind: 'computed', text: 'probe: −g₀∇Z − f k×u = 0' } }));
    S.add(Viz3D.labels(labelItems(ST.ex), { id: 'labels', maxVisible: 'auto' }));
    S.add(Viz3D.legend({ id: 'legend', lut: LUT, range: [ZBAR + RANGE[0], ZBAR + RANGE[1]], units: 'm', title: '500 hPa height' }));
    S.add(Viz3D.cameraPresets(presets(), { tween: 900, reducedMotion: 'cut' }));
    window.addEventListener('resize', () => { Object.assign(S.presets, presets()); });
    if (S.active) buildIso();
    if (S.fallback) {                 // candidate layer → proj3, and cull the far side (proj3 draws through the globe)
      const base = S._prims.bind(S);
      S._prims = () => {
        const o = base(), st = S.P.state, cp = Math.cos(st.phi), d = [cp * Math.cos(st.theta), cp * Math.sin(st.theta), Math.sin(st.phi)];
        const vis = (p, m) => { const n = Math.hypot(p[0], p[1], p[2]) || 1; return (p[0] * d[0] + p[1] * d[1] + p[2] * d[2]) / n > m; };
        const lines = [];
        o.lines.concat(isoProj3()).forEach(l => { let run = []; l.pts.forEach(p => { if (vis(p, 0)) run.push(p); else { if (run.length > 1) lines.push(Object.assign({}, l, { pts: run })); run = []; } }); if (run.length > 1) lines.push(Object.assign({}, l, { pts: run })); });
        o.lines = lines; o.arrows = o.arrows.filter(a => vis(a.from, 0.15)); o.labels = o.labels.filter(a => vis(a.p, 0.15));
        return o;
      };
      const later = ms => { if (!ST.arrows) return; clearTimeout(arrowTimer); arrowTimer = setTimeout(() => rebuildArrows(false), ms); };
      S.P.canvas.addEventListener('pointerup', () => later(50)); S.P.canvas.addEventListener('wheel', () => later(150));
    }
    const disp = S.dispose.bind(S); S.dispose = () => { disposeIso(); return disp(); };
    S.on('contextrestored', () => { if (iso || ST.iso) { buildIso(); S.render(); } });
    S.on('frame', onFrame);
    goCard(startCard);
    if (!Viz3D.audit && !Viz3D.reducedMotion && !q.get('card')) setPlaying(true);
    else if (Viz3D.reducedMotion && !Viz3D.audit) $('capText').textContent += ' (Reduced motion: press ▶ to step through.)';
  });

  /* ================= selftest: parity rows (py rows are evaluated by tools/shot.py with fluidpy) ================= */
  const PYF = "data.psl.open_daily(data.aofd_repo() / 'data/derived/ch00/ncep_r1_z500_20140106.nc', 'z')";
  const PYZ = '(np.round((np.asarray(' + PYF + '.values, dtype=np.float64) - 4500.0) / 0.05) * 0.05 + 4500.0)';
  const PYLAT = '(np.arange(73) * 2.5 - 90.0)', PYLON = '(np.arange(144) * 2.5)';
  const PYUV = 'geo.atmos.geostrophic_wind_from_height(' + PYZ + ', ' + PYLAT + ', ' + PYLON + ', lat_min=15.0)';
  const PYBAND = '((' + PYLAT + ' >= 30.0) & (' + PYLAT + ' <= 60.0))[:, None]';
  const PYARG = 'np.unravel_index(np.argmin(np.where(' + PYBAND + ', ' + PYZ + ', np.inf)), (73, 144))';
  function circulation(j0, i0, n) {     // ∮ u_g · dl round the box of nodes j0±n, i0±n, path east → north → west → south
    let G = 0;
    const seg = (ja, ia, jb, ib) => { const ka = idx(ja, ia), kb = idx(jb, ib);
      if (ja === jb) { const c = Math.cos(LAT[ja] * D2R); G += 0.5 * (WIND.u[ka] + WIND.u[kb]) * A_EARTH * c * (ib - ia) * D.dlon * D2R; }
      else G += 0.5 * (WIND.v[ka] + WIND.v[kb]) * A_EARTH * (jb - ja) * D.dlat * D2R; };
    for (let i = i0 - n; i < i0 + n; i++) seg(j0 - n, i, j0 - n, i + 1);
    for (let j = j0 - n; j < j0 + n; j++) seg(j, i0 + n, j + 1, i0 + n);
    for (let i = i0 + n; i > i0 - n; i--) seg(j0 + n, i, j0 + n, i - 1);
    for (let j = j0 + n; j > j0 - n; j--) seg(j, i0 - n, j - 1, i0 - n);
    return G;
  }
  function selftest() {
    const rows = [];
    const add = (name, js, o) => rows.push(Object.assign({ name, js }, o));
    // 1. data spot values (decoded uint16 vs the float32 file; atol = half the quantisation step) — lat orientation
    [[60, 0], [45, 270], [-30, 150]].forEach(([la, lo]) => { const [j, i] = nodeOf(la, lo);
      add('data: decoded Z at ' + la + '°, ' + lo + '°E vs the file (uint16, step 0.05 m)', Z[idx(j, i)], { py: PYF + '.sel(lat=' + la.toFixed(1) + ', lon=' + lo.toFixed(1) + ').item()', rtol: 0, atol: 0.025 + 1e-9 }); });
    add('data: lat not flipped — latitude of the lowest Z in 30–60°N (Great Lakes trough)', LAT[LOW_NA.j], { py: PYLAT + '[' + PYARG + '[0]]', rtol: 0, atol: 1e-9 });
    add('data: longitude of that minimum (°E)', LON[LOW_NA.i], { py: PYLON + '[' + PYARG + '[1]]', rtol: 0, atol: 1e-9 });
    add('data: value of that minimum (m)', LOW_NA.value, { py: 'np.min(np.where(' + PYBAND + ', ' + PYZ + ', np.inf))', rtol: 0, atol: 1e-9 });
    add('data: trough (deepest zonal anomaly 30–70°N) sits at 42.5°N, 270°E (lat not flipped)', +(LAT[TROUGH.j] === 42.5 && LON[TROUGH.i] === 270), { expect: 1, rtol: 0, atol: 0 });
    add('data: NH zonal-mean Z falls poleward (20 → 40 → 60 → 80°N)', +([20, 40, 60, 80].map(la => ZM[nodeOf(la, 0)[0]]).every((v, n, a) => n === 0 || v < a[n - 1])), { expect: 1, rtol: 0, atol: 0 });
    add('data: area-weighted mean Z̄ (m)', ZBAR, { py: 'np.average(' + PYZ + ', weights=np.broadcast_to(np.cos(np.deg2rad(' + PYLAT + '))[:, None], (73, 144)))', rtol: 1e-12 });
    // 2. geostrophic wind: JS mirror vs fluidpy.geo.atmos on the same quantised field
    [[60, 0], [45, 270], [-30, 150], [LAT[JET.j], LON[JET.i]]].forEach(([la, lo]) => { const [j, i] = nodeOf(la, lo), k = idx(j, i);
      add('u_g at ' + la + '°, ' + lo + '°E (m/s)', WIND.u[k], { py: PYUV + '[0][' + j + ', ' + i + ']', rtol: 1e-9 });
      add('v_g at ' + la + '°, ' + lo + '°E (m/s)', WIND.v[k], { py: PYUV + '[1][' + j + ', ' + i + ']', rtol: 1e-9 }); });
    let nn = 0; for (let k = 0; k < WIND.u.length; k++) if (isNaN(WIND.u[k])) nn++;
    add('mask: NaN nodes (|ϑ| < 15° and the poles)', nn, { py: 'np.isnan(' + PYUV + '[0]).sum()', rtol: 0, atol: 0 });
    let zu = 0, cu = 0; const j45 = nodeOf(45, 0)[0]; for (let i = 0; i < NX; i++) { zu += WIND.u[idx(j45, i)]; cu++; }
    add('zonal-mean u_g at 45°N (m/s; westerlies)', zu / cu, { py: 'np.nanmean(' + PYUV + '[0][' + j45 + '])', rtol: 1e-9 });
    add('zonal-mean u_g at 45°N > 0 (westerlies)', +(zu / cu > 0), { expect: 1, rtol: 0, atol: 0 });
    let smax = 0; for (let k = 0; k < WIND.u.length; k++) { const s = Math.hypot(WIND.u[k], WIND.v[k]); if (s > smax) smax = s; }
    add('max geostrophic speed (m/s)', smax, { py: 'np.nanmax(np.hypot(' + PYUV + '[0], ' + PYUV + '[1]))', rtol: 1e-9 });
    // 3. drawing invariants
    let worst = 0; for (let k = 0; k < WIND.u.length; k++) { if (!isFinite(WIND.u[k])) continue; const [zx, zy] = gradXY(k), u = WIND.u[k], v = WIND.v[k], den = Math.hypot(u, v) * Math.hypot(zx, zy); if (den > 0) worst = Math.max(worst, Math.abs(u * zx + v * zy) / den); }
    add('invariant: wind ⟂ height gradient, max |u_g·∇Z|/(|u_g||∇Z|) over all unmasked nodes', worst, { expect: 0, rtol: 0, atol: 1e-9 });
    const cNA = circulation(LOW_NA.j, LOW_NA.i, 2), cNH = circulation(LOW_NH.j, LOW_NH.i, 2), cSH = circulation(LOW_SH.j, LOW_SH.i, 2);
    add('NH low (' + LAT[LOW_NA.j] + '°N, ' + lon180(LON[LOW_NA.i]) + '°): ∮u_g·dl > 0 — anticlockwise seen from above (' + Viz.fmt(cNA, { sig: 3 }) + ' m²/s)', +(cNA > 0), { expect: 1, rtol: 0, atol: 0 });
    add('NH lowest (' + LAT[LOW_NH.j] + '°N, ' + LON[LOW_NH.i] + '°E): ∮u_g·dl > 0 — anticlockwise', +(cNH > 0), { expect: 1, rtol: 0, atol: 0 });
    add('SH low (' + LAT[LOW_SH.j] + '°, ' + LON[LOW_SH.i] + '°E): ∮u_g·dl < 0 — clockwise seen from above', +(cSH < 0), { expect: 1, rtol: 0, atol: 0 });
    const res = Math.hypot(JP.pgf[0] + JP.cor[0], JP.pgf[1] + JP.cor[1]) / Math.hypot(JP.pgf[0], JP.pgf[1]);
    add('balance glyph at the jet probe: |−g₀∇Z − f k×u_g| / |g₀∇Z| (head-to-tail closes)', res, { expect: 0, rtol: 0, atol: 1e-12 });
    let gworst = 0; for (let j = 0; j < NY; j++) { const lat = -90 + 180 * j / MESH_LAT; for (let i = 0; i < NX; i++) { const lon = -180 + 360 * i / MESH_LON, [jj, ii] = nodeOf(lat, lon < 0 ? lon + 360 : lon), g = Viz3D.gridSample({ data: GKIT, w: NX, h: NY, latOrder: 'S->N', lon0: KIT_LON0 }, lon, lat); gworst = Math.max(gworst, Math.abs(g - (Z[idx(jj, ii)] - ZBAR))); } }
    add('kit grid: Viz3D.gridSample at every mesh vertex = Z − Z̄ at that node, max error (m)', gworst, { expect: 0, rtol: 0, atol: 1e-9 });
    // gradient wind (2.234b) at the jet node vs the independent numpy reference written by embed_z500.py
    const PJ = D.py.jetnode;
    add('jet node (' + PJ.lat + '°N, ' + PJ.lon + '°E) = the scene probe node', +(LAT[JP.j] === PJ.lat && LON[JP.i] === PJ.lon), { expect: 1, rtol: 0, atol: 0 });
    add('gradient wind: radius of the bend R at the jet node (m) vs numpy', JP.R, { expect: PJ.R, rtol: 1e-9 });
    add('gradient wind: Rossby number U_g/(fR) at the jet node vs numpy', JP.Ro, { expect: PJ.Ro, rtol: 1e-9 });
    add('gradient wind: U from (2.234b) at the jet node (m/s) vs numpy (geostrophic 67.7 → ~49)', JP.Ugr, { expect: PJ.U, rtol: 1e-9 });
    add('(2.234b) residual |U²/R + fU − fU_g| / |fU_g| at the jet node', Math.abs(JP.Ugr ** 2 / JP.R + JP.f * JP.Ugr - JP.f * JP.speed) / Math.abs(JP.f * JP.speed), { expect: 0, rtol: 0, atol: 1e-12 });
    add('gradient wind → geostrophic as R → ∞ (R = 1e15 m)', gradientWindSpeed(JP.speed, JP.f, 1e15), { expect: JP.speed, rtol: 1e-6 });
    add('gradient wind: a cyclonic bend slows the wind (U < U_g at the trough base)', +(JP.Ugr < JP.speed), { expect: 1, rtol: 0, atol: 0 });
    // equal-area arrow sampling: zonal ground spacing / meridional spacing per row, for every spacing step
    let eaWorst = 0; ARROW_STEPS.forEach(sd => { for (let j = 0; j < NY; j++) { const la = LAT[j]; if (Math.abs(la) < LAT_MIN || Math.abs(la) >= 89.9 || Math.abs(la / sd - Math.round(la / sd)) > 1e-9) continue;
      const stride = Math.max(1, Math.round(sd / (D.dlon * Math.cos(la * D2R)))); eaWorst = Math.max(eaWorst, Math.abs(stride * D.dlon * Math.cos(la * D2R) / sd - 1)); } });
    add('arrows equal-area: max |zonal ground spacing / meridional spacing − 1| over all rows and spacings', eaWorst, { expect: 0, rtol: 0, atol: 0.35 });
    let cosMax = 0; const nA = arrowNodes(5, null); for (let a = 0; a < nA.length; a++) cosMax = Math.max(cosMax, Math.abs(LAT[nA[a][0]]));
    add('arrows: none within 15° of the equator or at the poles (5° sample, ' + nA.length + ' arrows)', +(nA.every(([j]) => Math.abs(LAT[j]) >= LAT_MIN && Math.abs(LAT[j]) < 89.9)), { expect: 1, rtol: 0, atol: 0 });
    const kT = idx(TROUGH.j, TROUGH.i), rCPU = 1 + ST.ex * (Z[kT] - ZBAR) / A_EARTH;
    add('displacement (CPU): r at the trough = 1 + ex·(Z − Z̄)/a, kit dispRadius vs formula', rCPU, { expect: 1 + ST.ex * Viz3D.gridSample({ data: GKIT, w: NX, h: NY, latOrder: 'S->N', lon0: KIT_LON0 }, lon180(LON[TROUGH.i]), LAT[TROUGH.j]) / A_EARTH, rtol: 0, atol: 1e-12 });
    let lworst = 0; isoLevels(ST.ci).slice(0, 6).forEach(L => marchingSquares(L).forEach(s => [s.a, s.b].forEach(e => { const za = Z[idx(e[0], e[1])], zb = Z[idx(e[2], e[3])]; lworst = Math.max(lworst, Math.abs(za + e[4] * (zb - za) - L)); })));
    add('isolines: every drawn point interpolates to its level (m)', lworst, { expect: 0, rtol: 0, atol: 1e-9 });
    if (S && S.active) {
      const surf = S.get('surface');
      if (surf && surf.obj) {
        const pos = surf.obj.userData.mesh.geometry.attributes.position, k = TROUGH.j * (MESH_LON + 1) + ((TROUGH.i + NX / 2) % NX);
        add('drawn vertex radius at the trough = 1 + ex·(Z − Z̄)/a (float32 buffer)', Math.hypot(pos.getX(k), pos.getY(k), pos.getZ(k)), { expect: rCPU, rtol: 1e-6, atol: 0 });
      }
      const ar = S.get('arrows');
      if (ar && ar.obj) {
        const T3 = S.THREE, m = new T3.Matrix4(), head = ar.obj.userData.head, n = Math.min(head.count, 300); let aw = 0, tw = 0;
        const pts = arrowData(ST.ex, false).points;
        for (let a = 0; a < n; a++) {
          head.getMatrixAt(a, m); const y = new T3.Vector3(0, 1, 0).applyMatrix4(m).sub(new T3.Vector3().setFromMatrixPosition(m)).normalize();
          const [j, i] = CUR_ARROWS[a], [zx, zy] = gradXY(idx(j, i)), g3 = Viz3D.math.unit(Viz3D.math.add(Viz3D.math.scale(eEast(LON[i]), zx), Viz3D.math.scale(eNorth(LON[i], LAT[j]), zy)));
          aw = Math.max(aw, Math.abs(y.x * g3[0] + y.y * g3[1] + y.z * g3[2])); const up = Viz3D.math.unit(pts[a]); tw = Math.max(tw, Math.abs(y.x * up[0] + y.y * up[1] + y.z * up[2]));
        }
        add('drawn arrows ⟂ ∇Z: max |cos| between drawn arrow and the height gradient (float32 instance matrices, ' + n + ' arrows)', aw, { expect: 0, rtol: 0, atol: 1e-5 });
        add('drawn arrows tangent to the sphere: max |cos| with the local vertical (float32)', tw, { expect: 0, rtol: 0, atol: 1e-5 });
      }
      const t = (Z[kT] - ZBAR - RANGE[0]) / (RANGE[1] - RANGE[0]), ti = Math.round(t * 255), tex = Viz3D.lut(LUT), gpu = S.gpuSample(tex, (ti + 0.5) / 256, 0.5); tex.dispose();
      add('GPU read-back: LUT texel for the trough colour (' + LUT + ', red) = CPU table (float target)', gpu, { expect: Viz3D.lutRGB(LUT)[3 * ti] / 255, rtol: 1e-5, atol: 1e-6 });
      if (iso) add('isolines drawn: segments at ' + ST.ci + ' m (candidate layer)', +(iso.n > 100), { expect: 1, rtol: 0, atol: 0 });
    }
    const out = rows.concat(S ? S.selftestRows() : []);
    out.forEach(r => { if (r.py === undefined && r.expect !== undefined && r.ok === undefined) { const v = +r.js; r.ok = isFinite(v) && Math.abs(v - r.expect) <= (r.atol || 0) + (r.rtol === undefined ? 1e-6 : r.rtol) * Math.abs(r.expect); } });
    return out;
  }

  window.SCENE = {
    selftest, goCard, state: ST, get S() { return S; }, setEx, setProbeAt(lat, lon) { const [j, i] = nodeOf(lat, lon); ST.probe = probeData(j, i); applyProbe(); },
    info: () => ({ zbar: ZBAR, trough: [LAT[TROUGH.j], LON[TROUGH.i]], jet: [LAT[JET.j], LON[JET.i], JP.speed], arrows: CUR_ARROWS.length, arrowSpacingDeg: ARROW_DEG, isoSegments: iso ? iso.n : 0,
      dataBytes: D.b64.length, drawCalls: S && S.renderer ? S.renderer.info.render.calls : null }),
    geostrophicWindFromHeight, coriolisParameter
  };
})();
</script>
