# PoC D (PLANNING §12 step 11; R1 §4.4 step 1) — 20-second setup test clip, NOT a Chapter-0 movie.
# PoC OVERRIDE: target_duration_s = 20 instead of the 120–180 s rule (book.yaml → project.movie_seconds); the QA gate for
# this clip is 20.0 ± 0.1 s and ≤ 4 MB (movies/MOVIES_BUDGET.md). For the same reason the end card is a 1.5-s lower-third
# strip inside s3 rather than a separate scene.
# Scene boundaries follow the MEASURED Kokoro narration (af_bella ×1.0, tools/tts.py dry run 2026-10-21: 19.30 s audio,
# fixed gaps 0.35 s / 0.8 s, lead 0.3 s), so they sit at 6.0 / 11.2 s rather than the nominal 6 / 13 s of the brief;
# the motion-builder takes the final cut points from timing.json and holds the last 0.7 s silent on the end strip.
# Physics decision Q2 (analysis/ch00_poc_design.md): the globe shows only f = 2Ω sin ϑ by latitude — no
# "frictionless puck straight in space on a sphere" (frames.great_circle_earth_frame is NOT used).
id: poc_coriolis_turntable
title: "Coriolis: straight in space, curved on the turntable"
concepts: [C0B-PoC1]          # PoC B concept (Coriolis on a rotating table / planet); movie id M-PoC
target_duration_s: 20
fps: 30
size: [1920, 1080]
style: house-dark-v1
audio: {voice: af_bella, speed: 1.0, music: none, loudness_lufs: -16}
measured_narration_s: 19.30
words: 38                     # 38 words / 20 s = 114 words per minute (limit 150)

scenes:
  - id: s1_inertial
    t: [0.0, 6.0]
    visual: >-
      Camera fixed in the room, looking straight down on a flat circular turntable of radius 1.0 m (dark disc, light
      rim, eight radial spokes and a small orange target mark on the rim due east of the centre so the spin is
      visible). The room is a faint fixed square grid behind the table with a small "room view (inertial)" chip top-left.
      The table turns anticlockwise seen from above at 0.5 rad/s, in real time (1 s of film = 1 s of table time; it
      turns 3 rad ≈ 172° in the 6 s). At t = 0 a puck (white disc, 6 cm drawn) leaves the centre heading east at
      0.15 m/s; its trail is a solid slate line that grows as a dead-straight segment from (0, 0) to (0.9 m, 0).
      The target mark rotates away from the puck's line. Curved arrow by the rim: "table spins anticlockwise (seen
      from above) — like the Northern Hemisphere". ScaleBadge "not to scale: table 0.5 rad/s, Earth 7.29×10⁻⁵ rad/s".
      Hook: the puck starts moving in frame 0.
    voiceover: "A puck slides on a spinning table. From the room, it goes straight."
    on_screen_eq: null
    physics_source:
      fn: fluidpy.geo.frames.turntable_puck
      params: {t: "linspace(0, 6, 181) s", x0: 0.0, y0: 0.0, u0: 0.15, v0: 0.0, Omega: 0.5, launch: rotating}
      outputs: [x_inertial, y_inertial, angle]   # straight line x_I = 0.15 t, y_I = 0; table angle Ωt
      vallis: "§2.1, Eq. (2.7) v_I = v_R + Ω×r (launch from the axis: Ω×r = 0, so v_I = v_R = 0.15 m/s east)"
      test: >-
        ../Fluid Dynamics/tests/geo/test_frames.py::test_turntable_puck_V1_matches_rotating_frame_ode,
        ::test_turntable_puck_matches_kundu_projectile_paths, ::test_turntable_puck_V4_jacobi_integral_and_radius,
        ::test_turntable_puck_V7_limits_and_deflection_sense
    exaggeration:
      - "table rotation 0.5 rad/s (one turn in 12.6 s), not Earth's 7.29×10⁻⁵ rad/s (one turn in 23 h 56 min) — not to scale"
      - "puck drawn 6 cm wide for visibility"
      - "flat, frictionless table (idealisation: no centripetal support, so the puck keeps its straight line in space)"

  - id: s2_rotating
    t: [6.0, 11.2]
    visual: >-
      Same throw, camera now rides with the table: spokes and the orange rim mark stay still, the room grid turns
      clockwise behind it; chip changes to "table view (rotating)". A dashed slate arrow from the centre to the rim mark
      shows "aimed here". The puck leaves the centre heading east and its violet trail bends steadily to the RIGHT of
      its motion (clockwise seen from above), ending at (−0.89 m, −0.13 m) after sweeping about half-way round —
      missing the mark. A short violet arrow on the puck, always at right angles to its table-frame velocity and
      pointing to its right, labelled "Coriolis −2Ω×v". Small footnote chip, bottom-left: "flat table: centrifugal
      also acts here (at most half the Coriolis push on this path)". Playback: the 6 s of table time are replayed in
      4.5 s (×1.33), then the finished curve holds 0.7 s with the s1 straight trail drawn faintly for comparison in the
      room-frame inset (top-right, 320×320 px). ScaleBadge "not to scale" + "time ×1.33".
    voiceover: "Now ride with the table. It curves to the right."
    on_screen_eq: null
    physics_source:
      fn: fluidpy.geo.frames.turntable_puck
      params: {t: "linspace(0, 6, 136) s", x0: 0.0, y0: 0.0, u0: 0.15, v0: 0.0, Omega: 0.5, launch: rotating}
      outputs: [x_rotating, y_rotating]   # rotating-frame path; |x_R| = |x_I| = 0.15 t
      vallis: "§2.1, Eq. (2.12): in the rotating frame the path obeys dv_R/dt = −2Ω×v_R − Ω×(Ω×r)"
      test: "../Fluid Dynamics/tests/geo/test_frames.py::test_turntable_puck_V1_matches_rotating_frame_ode, ::test_turntable_puck_V4_jacobi_integral_and_radius, ::test_turntable_puck_V7_limits_and_deflection_sense"
    physics_source_extra:
      - fn: fluidpy.geo.frames.coriolis_acceleration_horizontal
        params: {u: "u_R(t) from d/dt of x_rotating (analytic, Eq. 2.7: v_R = R(−Ωt)v_I − Ω×r_R)", v: "v_R(t)", f: 1.0}
        purpose: "violet arrow −f k×v_R with f = 2Ω = 1.0 s⁻¹ (table), drawn ⟂ v_R, to the right"
        test: "../Fluid Dynamics/tests/geo/test_frames.py::test_coriolis_acceleration_V1_perpendicular_magnitude_and_core, ::test_coriolis_horizontal_V7_right_in_NH_left_in_SH_zero_at_equator"
    exaggeration:
      - "table rotation 0.5 rad/s, not Earth's 7.29×10⁻⁵ rad/s — not to scale"
      - "time compressed ×1.33 (6 s of table time in 4.5 s)"
      - "Coriolis arrow length not to scale (direction exact)"
      - "flat frictionless table: the curve includes the centrifugal term too (ratio centrifugal/Coriolis = Ωt / (2√(1+Ω²t²)) ≤ 0.5 along this path)"

  - id: s3_equation
    t: [11.2, 20.0]
    visual: >-
      Left 60 %: EqLine with Vallis (2.12) written in full in KaTeX, equation number "(2.12)" right-aligned; the Coriolis
      term −2Ω×v_R highlighted violet with an underbrace "Coriolis", the centrifugal term −Ω×(Ω×r) in slate with an
      underbrace "centrifugal". Under it, a one-line grey caption "both are apparent ('as if') forces, seen only from the
      rotating frame". At 15.5 s (with the second sentence) a second line fades in: f = 2Ω sin ϑ with "(2.80)" and a
      note "ϑ = latitude". Right 40 %: a small 3-D globe (house Globe, 360 px, graticule every 30°, no coastlines),
      north pole up, tilted 20° toward the camera, turning slowly anticlockwise seen from above the North Pole
      (one turn per 10 s of film, labelled). Latitude bands shaded by f with the house diverging map centred at 0
      (violet for f > 0, its mirror for f < 0), legend in s⁻¹; readouts: 90°N 1.46×10⁻⁴ · 45°N 1.03×10⁻⁴ · 0° 0 ·
      45°S −1.03×10⁻⁴. Small hemisphere labels: "NH: turns right", "SH: turns left", "equator: f = 0".
      Inset under the globe: "table: 2Ω = 1 s⁻¹ · Earth at 45°N: f ≈ 1.0×10⁻⁴ s⁻¹ — the table is ~10 000× faster".
      18.5–20.0 s: end strip (LowerThird) "Explore it: Coriolis globe explainer · Chapter 0B notebook (Coriolis block)".
    voiceover: "Coriolis adds minus two Omega cross v. On Earth, f is two Omega sine latitude."
    on_screen_eq:
      latex: "\\left(\\frac{\\mathrm{d}\\boldsymbol{v}_R}{\\mathrm{d}t}\\right)_{\\!R} = \\left(\\frac{\\mathrm{d}\\boldsymbol{v}_I}{\\mathrm{d}t}\\right)_{\\!I} \\underbrace{{}-2\\boldsymbol{\\Omega}\\times\\boldsymbol{v}_R}_{\\text{Coriolis}} \\underbrace{{}-\\boldsymbol{\\Omega}\\times(\\boldsymbol{\\Omega}\\times\\boldsymbol{r})}_{\\text{centrifugal}}"
      vallis_eq: "(2.12)"
      page_png: chapters/pages/ch02/p077.png      # Vallis §2.1.2, printed p. 57 (PDF 77); read from the image 2026-10-21
      page_text: "(dv_R/dt)_R = (dv_I/dt)_I − 2Ω×v_R − Ω×(Ω×r)  — upright d, bold italic v, Ω, r"
      highlight: [{term: "-2\\boldsymbol{\\Omega}\\times\\boldsymbol{v}_R", colour: violet}, {term: "-\\boldsymbol{\\Omega}\\times(\\boldsymbol{\\Omega}\\times\\boldsymbol{r})", colour: slate}]
    on_screen_eq_extra:
      - latex: "f = 2\\Omega\\sin\\vartheta"
        vallis_eq: "(2.80)"                     # first equality of (2.80); also f₀ = 2Ω sin ϑ₀ in the text under (2.78)
        page_png: chapters/pages/ch02/p089.png    # Vallis §2.3.2, printed p. 69 (PDF 89); read from the image
        page_text: "f = 2Ω sin ϑ ≈ 2Ω sin ϑ₀ + 2Ω(ϑ − ϑ₀) cos ϑ₀ (2.80) — we show only the exact first part"
        highlight: [{term: "2\\Omega\\sin\\vartheta", colour: violet}]
    physics_source:
      fn: fluidpy.geo.frames.coriolis_parameter
      params: {lat: "deg2rad(linspace(-90, 90, 181))", Omega: 7.292115e-5}
      outputs: [f]    # spot values: f(90°) = 1.4584e-4, f(45°) = 1.0313e-4, f(0) = 0, f(−45°) = −1.0313e-4 s⁻¹
      vallis: "§2.3, Eq. (2.80) f = 2Ω sin ϑ (wraps fluidpy.core.rotating.coriolis_parameter)"
      test: "../Fluid Dynamics/tests/geo/test_frames.py::test_coriolis_parameter_V1_field_and_V7_odd, ::test_coriolis_parameter_V5_value_at_45deg; core: ../Fluid Dynamics/tests/test_ch13.py::test_planetary_V1_coriolis_parameter_beta_and_rotation_vector"
    exaggeration:
      - "globe spin speeded up: one turn per 10 s of film instead of 23 h 56 min — not to scale"
      - "f shown as coloured latitude bands (a field, not a force on anything); band boundaries every 15°"
      - "table vs Earth rotation rates differ by ~10⁴ (stated in the inset)"

honesty_notes:
  - "Coriolis and centrifugal are apparent ('as if') forces that appear only in the rotating frame (Vallis's text under (2.12)); s1 shows no force acts in the room frame — the path is straight."
  - "The table spins anticlockwise seen from above, like the Northern Hemisphere seen from above the North Pole; that is why the puck turns RIGHT. A clockwise table (Southern-Hemisphere-like) turns it left — stated on the globe in s3."
  - "On the flat frictionless table the rotating-frame curve is Coriolis plus centrifugal; along this path the centrifugal push is at most half the Coriolis push (Ωt/(2√(1+Ω²t²)) ≤ 0.5). The narration says Coriolis 'adds' the term — it does not claim Coriolis acts alone, and (2.12) on screen shows both terms."
  - "On Earth the centrifugal term is absorbed into effective gravity (the planet's bulge balances it), so for horizontal motion only the local-vertical part of 2Ω matters: f = 2Ω sin ϑ (traditional approximation). The globe shows f only; no frictionless puck on a sphere is drawn (decision Q2)."
  - "f is zero at the equator and negative in the Southern Hemisphere; the globe labels both."
  - "Numbers: table 2Ω = 1 s⁻¹ versus Earth f(45°N) = 1.03×10⁻⁴ s⁻¹, so the table is ~9700× faster; 'not to scale' badge on every scene."
  - "ϑ is latitude (Vallis's symbol), not colatitude; narration says 'sine latitude' so the symbol is never ambiguous."
quiz_hook: "If the table spun clockwise seen from above (like the Southern Hemisphere), which way would the puck curve — and what is f at the equator?"
