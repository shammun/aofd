  voiceover: How far do we walk when one coordinate changes by a small step? In Part 1, on a ring of radius r, turning by a small angle delta theta walks
    r times delta theta. So for theta, the distance walked is r times the step. That multiplier, the metres walked per unit of the coordinate, is called
    a scale factor. For theta, the scale factor is r. On the Earth, stepping north by delta phi walks the Earth's radius times delta phi, so the scale factor
    of latitude is the Earth's radius. Stepping east by delta lambda walks round a parallel, a circle whose radius is the Earth's radius times cosine phi.
    So the scale factor of longitude is the Earth's radius times cosine phi. Let's put numbers on it at Brest, at forty eight point four degrees north.
    One degree is zero point zero one seven four five radians. So one degree north walks six thousand three hundred and seventy one kilometres times zero
    point zero one seven four five, about a hundred and eleven point two kilometres. [beat] The cosine of forty eight point four degrees is zero point six
    six four. So one degree east walks a hundred and eleven point two times zero point six six four, only about seventy three point eight kilometres. [beat]
    The same one-degree step gives two different distances, and the scale factors keep track of that.
