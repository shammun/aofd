  voiceover: 'Sailors used a different route for centuries. It''s called the rhumb line: a route that keeps the same compass bearing all the way, so it
    crosses every meridian at the same angle. From London to Los Angeles, the rhumb line holds a bearing of about two hundred and fifty eight and a half
    degrees, a little south of due west. It stays further south than the great circle, and it''s about nine thousand seven hundred and thirty three kilometres
    long. [beat] How much longer is that? Nine thousand seven hundred and thirty three divided by eight thousand seven hundred and fifty five is about one
    point one one, so the rhumb line is about eleven percent longer. [beat] The extra is about nine hundred and seventy eight kilometres, more than an hour
    of flying at nine hundred kilometres per hour. [beat] And if you kept following a rhumb line, it would spiral round and round towards a pole.'
