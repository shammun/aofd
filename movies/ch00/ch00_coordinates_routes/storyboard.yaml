    \ a small Mercator chart with a ruler laid from London to Los Angeles along the straight slate line and a protractor reading 258.5\xB0. AT(12, 'rhumb-line\
    \ legs') on the globe, the gold great circle with four slate rhumb-line legs hugging it. AT(13, 'in Part 7') keyword 'Part 7: maps' (54 px) under the\
    \ Mercator chart. REMAKE 2026-11-07: the last sentence (the Part 7 line) is cut: the teaser is said once, in the recap (continuity \xA76); the keyword\
    \ stays as 'why straight: Part 7' (gold, y 840) 1 s after 'a straight line'."
  voiceover: 'So why would anyone choose the longer route? There are three reasons. The first is steering. A rhumb line needs one compass setting for the
    whole trip: set two hundred and fifty eight and a half degrees, and hold it. The great circle needs a new heading all the time, from three hundred and
    twelve degrees at London to two hundred and fourteen at Los Angeles. Before satellites and computers, a ship''s navigator with a compass could steer a
    rhumb line easily, but a great circle only with a lot of calculation. The second reason is that, on short trips, the extra distance is tiny. From Brest
    to Lisbon, about one thousand one hundred and thirty eight kilometres, the rhumb line is only about a hundred and fifty metres longer. [beat] The third
    reason is a map. On the most famous flat map, the Mercator map, a rhumb line is a straight line. So a navigator could draw the route with a ruler, read
    off its angle, and steer by it. That''s why long voyages were often split into a few rhumb-line legs that follow the great circle closely: each leg is
    easy to steer, and the whole route is nearly the shortest.'
