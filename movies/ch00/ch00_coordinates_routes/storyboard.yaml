    \ a question mark (the Part 7 teaser). Each spoken number on screen at its words. REMAKE 2026-11-07: S7 + S8 are the two-sentence teaser (R3): the Mercator\
    \ mini with '?' and 'Part 7: maps' on S7, 'care near the poles' (y 815) on S8."
  voiceover: To sum up, curvilinear coordinates have curved lines, unit vectors that turn, and scale factors that turn a change of coordinate into a distance.
    On the Earth, the scale factor of latitude is the Earth's radius, and of longitude, the radius times cosine phi. The shortest way between two places follows
    a great circle, whose centre is the Earth's centre. Its length is the Earth's radius times sigma, the angle at the centre, and the cosine of sigma is
    the dot product of the two position arrows. From London to Los Angeles, that's about seventy eight point seven degrees, or about eight thousand seven
    hundred and fifty five kilometres. Along the great circle, the compass heading changes all the way, from three hundred and twelve degrees to two hundred
    and fourteen. A rhumb line keeps one compass bearing, so it's easy to steer, but here it's about eleven percent longer. In Part 7, we'll flatten the Earth
    onto maps, and work out exactly what each map stretches. That explains why the rhumb line comes out straight on the most famous map of all, and why weather
    data on a grid need care near the poles.
