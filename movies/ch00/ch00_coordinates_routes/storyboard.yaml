quiz_hook: 'A plane flies from 60 deg N, 0 deg E to 60 deg N, 90 deg E. Which is shorter, the rhumb line (due east along the parallel) or the great circle,
  and which way does the great circle leave? (The great circle: about 4605 km against 5004 km; it leaves heading north-east, at about 49 deg, and bulges
  towards the pole, up to 67.8 deg N at 45 deg E.)'
