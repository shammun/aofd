  visual: "Three pictures across the top from frame 0 (centred at y 300, x1.15, Should 8): a radar's polar grid, the Part 2 hurricane cylinder, a globe graticule.\
    \ AT(2, 'curvilinear coordinates') keyword 'curvilinear' (54 px) below. AT(4, 'coordinate lines are curves') the rings, the cylinder's circles and the\
    \ meridians/parallels light gold in turn. AT(5, 'unit vectors change') r\u0302, \u03B8\u0302 (orange) at three points round the radar grid and i, j at\
    \ three points on the globe, visibly pointing different ways. AT(7, 'one degree can mean') two 1\xB0 wedges on the globe, one near the equator and one\
    \ near the pole, their ground arcs in teal, with '\u2248 111 km' and '\u2248 23 km' under them (keywords below the pictures, y 560-700). REMAKE 2026-11-07:\
    \ under 'polar', 'cylindrical', 'latitude, longitude' the gold tags 'Part 1', 'Part 2', 'Part 3' (y 565, fading with the names on S5): where each system\
    \ was met (R16)."
  voiceover: 'Let''s start by putting our coordinate systems side by side: polar coordinates on a flat map, cylindrical coordinates round a hurricane, and
    latitude and longitude on the Earth. They''re all called curvilinear coordinates, which means coordinates whose lines can curve. They share three features.
    First, the coordinate lines are curves: the rings round a radar, the circles of latitude, and the meridians. Second, the unit vectors change from place
    to place: r hat and theta hat turn as we go round, and so do the east and north arrows on the globe. Third, a change in a coordinate isn''t a distance
    by itself. Turning by one degree can mean a short walk or a long one, depending on where you are. That third feature needs a name, so let''s look at it
    closely.'
