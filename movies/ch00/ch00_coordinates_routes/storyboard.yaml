  beat: recap ('To sum up'); last sentence the teaser to Part 7
  visual: 'One beat per sentence, mini pictures reused (no headings): the three curvilinear pictures; the scale-factor table (θ: r, φ: a, λ: a cos φ); the
    globe with the slicing sheet; the face-on disc ''d = a σ'' with ''cos σ = r̂₁ · r̂₂''; ''78.7°'', ''≈ 8755 km''; the compass strip 312° -> 214°; the
    rhumb line beside the great circle ''+11 %''; a Mercator thumbnail with a straight slate line and a question mark (the Part 7 teaser). Each spoken number
    on screen at its words.'
  voiceover: To sum up, curvilinear coordinates have curved lines, unit vectors that turn, and scale factors that turn a change of coordinate into a distance.
    On the Earth, the scale factor of latitude is the Earth's radius, and of longitude, the radius times cosine phi. The shortest way between two places
    follows a great circle, whose centre is the Earth's centre. Its length is the Earth's radius times sigma, the angle at the centre, and the cosine of
    sigma is the dot product of the two position arrows. From London to Los Angeles, that's about seventy eight point seven degrees, or about eight thousand
    seven hundred and fifty five kilometres. Along the great circle, the compass heading changes all the way, from three hundred and twelve degrees to two
    hundred and fourteen. A rhumb line keeps one compass bearing, so it's easy to steer, but here it's about eleven percent longer. In Part 7, we'll flatten
    the Earth onto maps, see what each map stretches, and find out why the rhumb line is straight on the most famous map of all.
