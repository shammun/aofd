  beat: recap ('To sum up', one beat per sentence)
  visual: 'One mini picture per sentence (no headings): (1) the s03 halfway tick and a line; (2) two lines with a rose ''×'' and a closed loop; (3) ''1020
    − 1016 = 4''; (4) crowded Fuji lines with an orange grad arrow across them; (5) Everest glyphs: loops, bent Vs, hourglass; (6) the chart with H, L,
    ridge, trough, col; (7) the four icons isobar, isotherm, isohypse, isobath. Each number spoken is on screen at its words.'
  voiceover: To sum up, an isoline, or contour line, joins places where a field has the same value. Lines never cross, and they close into loops or run
    off the map. The contour interval is the step between neighbouring lines, found by subtracting two labels. Crowded lines mean a large gradient, and
    the gradient points straight across them, towards higher values. Closed loops mark peaks and hollows, bent lines mark ridges and valleys, and an hourglass
    marks a col. On weather maps, the same shapes become highs, lows, ridges, troughs and cols of pressure. Isobars, isotherms, isohypses and isobaths are
    all the same idea, applied to pressure, temperature, height and depth.
