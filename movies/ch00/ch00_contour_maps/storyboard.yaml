  beat: 'why: three good reasons for contour maps'
  visual: 'Three beats, one per reason, mini pictures reused: (1) the Everest map with peak, ridge, valley and col glyphs lighting in turn, keyword ''whole
    shape at a glance''; (2) the Fuji map with crowded lines glowing and an orange grad arrow across them, keyword ''gradient for free''; (3) the msl map:
