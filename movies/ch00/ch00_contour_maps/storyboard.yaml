  visual: 'Picture zone: the 200-m Fuji map; at three points orange grad-h arrows (10 px, 40-px heads) at right angles to the lines (RightTick), the longest
    near the summit. Maths zone: the equation builds with gold underbraces ''interval'', ''spacing''; CalcStack ''200 m / 350 m ≈ 0.57'' -> ''≈ 57 m up
    per 100 m''; then ''200 m / 2000 m = 0.1'' -> ''10 m up per 100 m''. S7: keyword ''no calculus needed''. S8: ''crowded → big gradient'' with the gradient-movie
    thumbnail.'
  voiceover: 'That walk straight across the lines is exactly the gradient from the gradient movie. Grad h, the gradient of the height, points the way the
    height increases fastest, so it''s at right angles to the contour lines, pointing towards the higher ones. And its length, the steepest slope, is the
    contour interval divided by the spacing between the lines. Near the summit, that''s two hundred metres over three hundred and fifty metres, about zero
    point five seven. [beat] That means about fifty seven metres up for every hundred metres along. On the lower slopes, it''s two hundred over two thousand,
    which is zero point one, or ten metres up for every hundred along. [beat] So the map gives us the gradient without any calculus: its direction is across
    the lines, and its size is the interval over the spacing. Crowded lines mean a big gradient.'
  on_screen_eq: {latex: '|\nabla h| \approx \frac{\Delta h}{\Delta n} = \frac{\text{contour interval}}{\text{spacing}}', vallis_eq: 'none (not a book equation):
