  voiceover: Lines of equal temperature are called isotherms. Here is the average temperature two metres above the ground in January, over the thirty years
    from nineteen ninety one to twenty twenty, from ERA5, with isotherms every five degrees Celsius. Let's follow the zero-degree isotherm, the line where
    the average is exactly freezing. Over the middle of North America, it runs at about forty degrees north. But over the north-east Atlantic, off the coast
    of Norway, it bends far to the north, to about seventy degrees north. [beat] That's about three thousand three hundred kilometres further north. So
    isotherms don't simply follow the lines of latitude. Over the warm North Atlantic, January is much milder than over the middle of a continent at the
    same latitude. And where the isotherms crowd together, like along the east coast of North America, the temperature changes fast across a short distance.
