  beat: 'building block: what an isoline is (interpolation in words)'
  visual: 'Picture zone: a 3 x 3 patch of the s02 grid enlarged (four of its points 1014, 1018, 1015, 1019 from the real grid, DM02). S2: all points equal
    to 1016 searched (none exactly). S3-S4: between 1014 and 1018 a gold tick slides to halfway; maths zone CalcStack ''(1016 − 1014) / (1018 − 1014) =
    2 / 4 = ½''. S5: between 1015 and 1019 the tick lands a quarter of the way, CalcStack ''(1016 − 1015) / (1019 − 1015) = ¼''. S6-S7: the ticks join into
    a smooth line (teal) across the patch, then across the whole s02 grid. S8-S9: keywords ''isoline'' / ''contour line'' and ''iso = equal''. S10: the
    1020 line draws, then the others.'
  voiceover: Here's how the lines are made. Pick one value, say a thousand and sixteen hectopascals. Now find every place where the pressure is exactly
    a thousand and sixteen. Between two grid points, one with a thousand and fourteen, and its neighbour with a thousand and eighteen, the value a thousand
    and sixteen lies halfway between them. [beat] So the line passes halfway between the two points. If the neighbours were a thousand and fifteen and a
    thousand and nineteen, it would pass a quarter of the way along, nearer the fifteen. [beat] Join all those crossing points, and you get one smooth line.
    A line that joins places with the same value is called an isoline, or a contour line. Iso comes from the Greek word for equal. Then we pick the next
    value, a thousand and twenty, and draw its line too, and so on.
  on_screen_eq: null
  physics_source:
