  beat: 'building block: the contour interval, reading values, filled contours'
  visual: 'Picture zone: isobars every 4 hPa with in-line labels 1012, 1016, 1020 (44 px, full values). S2: the three labels pulse. S3-S4: CalcStack ''1020
    − 1016 = 4 hPa'' (keyword ''contour interval''). S5-S6: a gold dot midway between the 1016 and 1020 lines with ''≈ 1018'' beside it. S8-S10: three small
    maps of the same field side by side (contours every 1, 10 and 4 hPa) with keywords ''tangle'', ''too few'', ''just right''; the 4-hPa one grows back.
    S11-S13: the bands between lines fill with one colour each (cmocean ''dense'', 4-hPa classes) and a stepped colour bar appears beside the map; one band
    and its bar step are linked in gold.'
  voiceover: 'The steps between the lines are called the contour interval. On this map, the lines are drawn every four hectopascals: a thousand and twelve,
    a thousand and sixteen, a thousand and twenty. [beat] To find the interval on any map, take two neighbouring labels and subtract. One thousand and twenty
    minus one thousand and sixteen is four. [beat] A place between two lines has a value between them. Halfway between the sixteen and the twenty lines,
    the pressure is about a thousand and eighteen. [beat] The interval is a choice. Let''s draw the same pressure map three ways. Every hectopascal, the
    lines crowd into a tangle. Every ten hectopascals, the small shapes disappear. Every four hectopascals, which is what weather maps use, we see the shapes
    without the clutter. Many maps also fill the space between two lines with one colour. Then each colour band is one interval, and the colour bar beside
    the map says which values it holds.'
  on_screen_eq: null
  physics_source:
