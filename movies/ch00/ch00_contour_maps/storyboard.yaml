  voiceover: 'So contour lines come in a whole family, and the names all follow the same pattern: iso, meaning equal, plus a Greek word for the thing being
    measured. Isobars join equal pressure. Isotherms join equal temperature. Isohypses join equal height, and isobaths join equal depth under the sea. You''ll
    meet a few more. Isohyets join places with equal rainfall. Isotachs join equal wind speed. And in the ocean, isopycnals join water of equal density.
    Different words, but the same idea, and the same rules.'
