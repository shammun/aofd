quiz_hook: On a map with isobars every 4 hPa, two neighbouring lines are 1012 and 1016 hPa. What is the pressure halfway between them, and if the lines
  are 40 km apart in one place and 200 km apart in another, where is the pressure gradient larger, and by how much?
