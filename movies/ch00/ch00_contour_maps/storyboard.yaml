  voiceover: 'Why do scientists draw so many maps this way? There are three good reasons. The first is that a contour map shows the whole shape of a field
    at a glance: the peaks, the hollows, the ridges, the valleys and the passes, without reading a single number. The second reason is that the gradient
    is drawn for free. Wherever the lines crowd together, the field changes fast, and it changes fastest straight across the lines. The third reason is
    that lines leave room for other things. On one map we can draw pressure as lines over temperature as colours, and read both at once.'
