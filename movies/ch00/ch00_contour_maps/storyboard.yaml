  beat: 'building block: the four rules of contour lines'
  visual: 'Picture zone: the s03 map with its isobars. S2 rule 1: a teal walker glides along the 1016 line with a readout ''1016'' that never changes. S3
    rule 2: two lines are dragged towards each other and a rose ''×'' with ''1016 and 1020?'' flashes once (not a full-screen flash) where they would touch.
    S4-S5 rule 3: one line traced to its loop, another to the frame edge, a third shown wrongly ending mid-map (rose dashed, ''−'') and fading. S6 rule
    4: the two sides of one line tint ''higher'' (warm) and ''lower'' (cool). Keywords ''1  same value'', ''2  never cross'', ''3  close or leave'', ''4  higher
    | lower'' accumulate in the maths zone (no box).'
  voiceover: 'Contour lines follow a few simple rules, and each one comes from the same fact: every place has exactly one value. First, every point on a
    line has the same value, so walking along a contour line, the value never changes. Second, two lines with different values can never cross or touch,
    because the crossing point would need two values at once. Third, a line never just stops in the middle of a map. It either closes into a loop, or it
    runs off the edge. Fourth, a line splits the map into two sides: higher values on one side, and lower values on the other. So once you know which side
    is higher, you can read the whole map.'
  on_screen_eq: null
  physics_source:
    fn: fluidpy.diag.contours.isolines (F2)
    params: {}
    test: CHECK DM04 (no crossings; closed or leaving)
