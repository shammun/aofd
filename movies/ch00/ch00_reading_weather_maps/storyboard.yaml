  beat: building blocks · distance along a meridian
  visual: 'Picture: the globe cut along the Brest meridian (a half-disc, BMNG on the rim). S1 keywords ''φ latitude'', ''λ
    longitude'' (54 px). S3 a teal walker arrow climbs the meridian. S4 radius ''a'' (orange 6 px). S5 a radian wedge: an
    arc exactly one radius long pulses gold. S6 ''1° = π/180 rad''. S7 the small step: gold arc ''δφ'' at the centre and the
    matching surface arc ''δy'' (teal bracket), the equation δy = a δφ appears in the maths zone. S8 CalcStack: 6371 km ×
    π/180 ≈ 111.2 km; gold link from ''111'' to a 1-degree bracket on the meridian.'
  voiceover: 'Now, how far apart are two places? Let''s give our angles symbols: phi, a Greek letter, for latitude, and lambda
    for longitude. First, let''s walk due north, along a meridian. A meridian is part of a circle centred on the middle of
    the Earth, with the Earth''s radius, a. On any circle, an arc is as long as the radius times the angle, when the angle
    is in radians. One radian is the angle whose arc is exactly one radius long, and one degree is pi over one hundred and
    eighty radians. So a small step in latitude, delta phi, carries us a distance delta y, equal to a times delta phi. With
    a equal to six thousand three hundred and seventy-one kilometres, one degree of latitude is about one hundred and eleven
    kilometres, everywhere on Earth.'
  on_screen_eq:
    latex: \delta y = a\,\delta\varphi
    vallis_eq: 'unnumbered, §2.2.2 (text before (2.27)): Cartesian increments (δx, δy, δz) = (r cos ϑ δλ, r δϑ, δr), here
