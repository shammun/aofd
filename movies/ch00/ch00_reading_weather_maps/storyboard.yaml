id: ch00_reading_weather_maps
title: 'Reading weather maps: from the first report to tomorrow''s forecast'
version: 3
concepts:
- 0A B.5 spherical coordinates (latitude, longitude, arc length δx = a cos φ δλ, δy = a δφ)
- '0C map projections (E26 sphere_to_map: plate carrée, Mercator, Equal Earth, polar stereographic, Lambert conformal conic;
  Tissot)'
- '0C contours and contour intervals (E25: isobars every 4 hPa, labels, spacing)'
- '0B geopotential height and the 500 hPa surface (E27 height_map_reader: troughs and ridges)'
- 0C reading a synoptic chart (H/L, fronts incl. occluded and stationary, troughs, wind barbs, station models, METAR/SYNOP)
- 0C satellite imagery (visible, infrared, water vapour; geostationary vs polar orbit)
- '0B Buys Ballot''s rule observed (why: Coriolis and geostrophic movies)'
- 0C reading a chart's small print (units, contour interval, colour bar, source, UTC vs local, initial vs valid time)
- 0B sea-level pressure reduction; geostrophic wind from isobar spacing (worked); pressure tendency and isallobars
- 0C fronts of every kind incl. squall lines and drylines; station model in full (oktas, present weather, tendency, METAR
  remarks)
- 0B standard levels (850/700/500/300/250 hPa), temperature advection, cut-off lows, jets and isotachs, thickness and the
  rain-snow line, a radiosonde sounding
- 0C weather radar (ranging, dBZ, Marshall-Palmer, beam height); forecast charts (forecast hour, verification), ensembles
  and spaghetti plots
- 0B weather vs climate (a 30-year mean chart)
- '0C comparing forecasts: two models at the same lead time (GFS vs ECMWF IFS), a physics model vs a machine-learning model
  (IFS vs AIFS), the root mean square error of a map; the ECMWF 51-member ensemble as a spaghetti plot and its spread shrinking
  with lead time'
