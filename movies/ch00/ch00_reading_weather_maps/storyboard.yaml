latest_data_policy: 'frozen: WPC/GFS/GOES 18 UTC 27 Oct 2026; GFS/Himawari 00 UTC 27 Oct 2026; GFS forecasts valid 18 UTC
  27 Oct 2026 from the 22/24/26 Oct 18 UTC runs (rolling THREDDS archive: fetch at once, data_needs N3); v3: ECMWF open data
  (AWS mirror, permanent history): IFS and AIFS runs 18Z 24 Oct +72 h and 18Z 27 Oct step 0; ENS runs 12Z 22 Oct +126 h, 24
  Oct +78 h, 26 Oct +30 h, all valid 18 UTC 27 Oct 2026'
honesty_notes:
- Latitude is written φ (series convention, as in the cross-product movie); Vallis writes ϑ. The arc-length increments δx
  = a cos φ δλ and δy = a δφ are Vallis's §2.2.2 increments at r = a (provenance only, never on screen).
- The Earth is treated as a sphere of radius 6371 km throughout (a mean radius); the real Earth is slightly flattened, which
  changes the distances by less than 0.5 %.
- Tissot circles are 500-km-radius circles on the sphere, projected exactly (not a small-circle approximation); their drawn
  size is their true size on each map.
- 'The Greenland/Africa size claim: true areas from cited sources and from spherical polygon areas of Natural Earth outlines;
  ''almost as big'' is the Mercator-drawn area ratio checked by RM08.'
- Polar stereographic true at 60° and Lambert with standard parallels 40/60° are stated as common choices ('usually', 'we
  might choose'), not universal rules.
- Isobars on the Ciarán maps are ERA5 reanalysis, called 'the reanalysis'; on the 27 Oct 2026 chart the isobars are the GFS
  analysis while lows, highs and fronts are the WPC forecasters' own (said in s76).
- The Ciarán fronts in s28 come from an objective thermal-front method on smoothed 850-hPa temperature, said in the narration;
  not a forecaster's analysis.
- 'Geopotential height is described as height above sea level ''to within a fraction of a percent'' (true in the troposphere:
  g varies by < 0.3 % up to 10 km).'
- 's46 is a thought example: isothermal columns at 250 K and 270 K with 1000 hPa at the ground (Vallis (2.166) with T constant);
  real columns are not isothermal.'
- The 500-hPa surface heights are exaggerated ×500 in s44-s45 (said); front side views ×50 in s24 (said); streakline motion
  is time-compressed (manifest).
- 'Wind barbs: staff towards the source, feathers 5/10/50 kt (WMO/NOAA); rounding to the nearest 5 kt is shown in every example.'
- Station models use °C and hPa (WMO practice); the METAR pressure Q0963 is QNH, described as 'reduced to sea level the way
  pilots use it'; the SYNOP pressure 969.6 hPa is the sea-level pressure.
- The METAR line on screen drops the '///' (missing cloud-type) and TCU/TEMPO groups; recorded in the manifest.
- 'Satellite images: visible = reflected sunlight; infrared = brightness temperature of the emitting surface (cold = white
  by convention); water vapour (6.2 µm) senses the middle/upper troposphere; the GIBS band-31 palette is inverted to values
  and re-coloured grey (no rainbow palette shown).'
- 'The cloud-top height in s60 uses a single 6.5 °C/km lapse rate: a rough estimate, said with ''about''.'
- 'Buys Ballot''s rule is stated as an observation (NH: low on the left with your back to the wind; SH: on the right; fails
  near the equator); rotation senses always carry ''as seen from above''; the why is left to the Coriolis and geostrophic
  movies.'
- At Brest the low is 74.5° to the left, not 90°, which the narration attributes to friction near the ground; the 500-hPa
  contrast (≈ 90°) is checked (RM38).
- The typhoon in s18 is unnamed (not confirmed); its pressure is the GFS analysis minimum.
- Impacts and history (s75, s76) are said only if the cited sources check out (C1-C3, C6); otherwise the sentences are cut.
- 'Maps follow the cartography skill: conformal projections for weather charts, no rainbow colour maps, labels never draped
  on 3-D surfaces, no scale bar on continental maps, no titles or credits on screen.'
- 'v2: the Mercator calculus, great circle and rhumb line scenes of v1 are left to the coordinates movie (#5, s29-s32), pointed
  to in s02/s06/s08; the Mercator y formula is no longer on screen.'
- 'v2: the 500-hPa trough axis is drawn from fluidpy.diag.axes (bends east north of 48.5 N to the cut-off low), never a straight
  line (verifier RM19).'
- 'v2: Irish, Dutch and Belgian SYNOPs decoded with wind_unit=''m/s'' (ISD drops iw).'
- 'v2: Brest''s 84-kt (156 km/h) gust is not called Ciaran''s strongest; Lanveoc ~170 km/h is named as ''even stronger … such
  as''.'
- 'v2: the geostrophic worked number (s16) uses rho = 1.25 kg/m3 and f at 44 N; the measured/balance ratio ~0.7 is attributed
  to surface friction (curvature small where the isobars are straight).'
- 'v2: the dryline (s26) uses two real METARs 44 km apart; the Moore tornado is mentioned without casualty numbers unless
  C8 is verified.'
- 'v2: radar numbers use Marshall-Palmer Z = 200 R^1.6, said as ''a rough rule''; radar mosaics are NWS NEXRAD composites
  via IEM (n0q); the squall-line cartoon (s26, S1) is decorative.'
- 'v2: thickness rules of thumb (5400 m North America, 5280 m Britain) are said as rules of thumb with the Brest counter-example
  (rain under 5371 m).'
- 'v2: forecast-verification numbers come from GFS runs valid 18 UTC 27 Oct 2026, tracked by continuity from the WPC 982 low
  (planning read 2026-10-29, re-asserted RM81).'
- 'v2 (v3: now 20 of 51, see below): the gale probability (s72) is a thought example, said with ''if''.'
- 'v2: Trappes sounding launched 23:15 UTC 1 Nov 2023 (nominal 00 UTC 2 Nov); freezing level interpolated between standard
  levels; tropopause by the WMO lapse-rate rule.'
- 'v2: the climate map (s82) is the NCEP/NCAR R1 November mean 1991-2020 (a different reanalysis from ERA5; said only as ''the
  average'').'
- 'v3: ECMWF open data are a 0.25-deg subset of the operational output (CC BY 4.0); ''the ECMWF analysis'' is step 0 of the
  IFS 18Z 27 Oct run (the analysis at open-data resolution); the GFS and ECMWF analyses of the 982 low are checked to agree
  (RM97) before the narration says ''both centres'' analyses''.'
- 'v3: map scores (root mean square error of MSLP, cos-latitude weighted, 25-70 N, 80 W-0) compare each model with its own
  centre''s analysis (usual verification practice); RM99/RM100 also score against the other centre''s analysis, and if the
  order of the models flips the narration says ''about the same''.'
- 'v3: AIFS is described only by cited facts (C20-C22: machine-learning model, trained on ERA5 and fine-tuned on operational
  analyses, 6-h step, starts from the ECMWF analysis); no claim about its general skill or speed; the narration says one case
  cannot decide which model is better. The ''smoother'' sentence is said only if RM101 passes on these fields.'
- 'v3: the ECMWF ensemble has 51 members (control + 50 perturbed: perturbed starting states and stochastic perturbations of
  the physics, said as ''small random nudges to the model''s physics'').'
- 'v3: member lows are found by F24 match_low: the nearest closed low (at least one closed 2-hPa isobar) within 1200 km of
  the analysis 982 low, never a box minimum; members without one are counted and said, not drawn; an ambiguous match (a second
  closed low within 1.5 x the distance) is drawn hollow and listed in the manifest.'
- 'v3: spaghetti colours: all members one teal hue at 55 % opacity (bunches read brighter), the analysis bold gold with a
  dark casing; GEFS lows orange triangles vs ECMWF teal dots (hue and shape).'
- 'v3: GEFS starts at 18Z, the ECMWF ensemble at 12Z, so their lead times differ (120 vs 126 h), said as ''started six hours
  later''.'
- 'v3: the 20-of-51 gale probability (s72) is a thought example, said with ''if''.'
- 'v3: the three-point root-mean-square example (s71c) uses made-up numbers, said as an example.'
quiz_hook: 'You stand in Sydney with a strong wind at your back blowing from the south-west, so you face north-east. Where
  is the low? (Southern hemisphere: on your right, which is south-east; friction near the ground puts it a little in front
  of your right shoulder, so roughly east-south-east.)'
