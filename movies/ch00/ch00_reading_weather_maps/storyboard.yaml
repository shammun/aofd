  beat: recap
  visual: 'House recap (s12 of the reference): one mini picture per sentence, arranged on a 4 x 2 grid that fills the content
    area, each appearing on its sentence; no headings. v3: eight beats: globe + conformal map · legend + clock · packed isobars
    + Buys Ballot icon (N/S) · front symbols + station model · stacked levels + thickness slab · satellite thumbnails + radar
    sweep · four forecast L markers + the shrinking spread circles (s73b) · three panels GFS | IFS | AIFS (s71b, s71e).'
  from_v1: s59_recap
  voiceover: 'To sum up, latitude and longitude pin down any place, and weather charts use conformal projections, which keep
    angles. Read the small print first: units, contour interval, colour bar, source and time. Isobars show the sea-level pressure;
    the closer they are, the stronger the wind, with the low on your left in the north and on your right in the south. Fronts
    carry symbols on the side they move towards, and station models pack a report into a tiny picture. Upper-air maps show
    the height of a pressure surface, and the thickness tells a layer''s temperature. Satellites show the clouds and the moisture
    aloft, and radar shows the rain. Forecasts sharpen as the lead time gets shorter, and ensembles show how sure they are
    through their spread. And comparing models, physical or machine-learned, shows where the forecast is still uncertain.'
  on_screen_eq: null
  physics_source: null
