    and the low pressure is on your left. Let''s test it at Brest, at three in the morning during Ciarán. The wind came from
    the west, so with your back to it, you face east. The centre of the low was about one hundred and eighty kilometres away,
    to the north-north-east: on your left, and a little in front, about seventy-five degrees to the left rather than ninety.
    [beat] Near the ground, friction turns the wind partly towards the low, which puts the low a little ahead of your left
    shoulder.'
