  voiceover: Forecasters also subtract one height map from another. The height of the five hundred hectopascal surface minus
    that of the one thousand hectopascal surface is the thickness of the layer. By the same rule, it's the layer's scale height
    times the natural log of two, so it depends only on the layer's average temperature. At Brest at midday, the thickness
    was about five thousand three hundred and seventy metres. [beat] Turned round, that's an average of about two hundred
    and sixty-five kelvin, or minus eight degrees, through the lowest five and a half kilometres. [beat]
