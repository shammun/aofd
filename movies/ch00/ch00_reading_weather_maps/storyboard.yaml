  voiceover: 'So which forecast should we believe? A single forecast can''t say how sure it is. Tiny errors in the starting
    state grow as the model runs, a sensitivity called chaos. So forecast centres run an ensemble: the same model many times,
    each from a slightly different starting state, with small random nudges to the model''s physics. Each of these runs is
    called a member. The European ensemble has fifty-one members: one control, started from the best analysis, and fifty with
    small changes. [beat] If twenty of the fifty-one bring a gale to a place, the chance of a gale there is about thirty-nine
    percent. [beat]'
