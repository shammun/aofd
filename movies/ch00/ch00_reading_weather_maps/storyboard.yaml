  voiceover: 'Weather charts need true angles, because the angle between the wind and the isobars matters, so forecasters
    use conformal maps: Mercator near the equator, and near the poles the polar stereographic projection, the view from above
    a pole. In the middle latitudes they use the Lambert conformal conic projection: picture a cone set over the globe like
    a lampshade, cutting it along two standard parallels, where the scale is exactly right. With standard parallels at forty
    and sixty degrees north, the scale stays within about two percent from thirty-five to sixty-five degrees. [beat] Maps
    that compare amounts, like rainfall totals, use equal-area projections instead.'
