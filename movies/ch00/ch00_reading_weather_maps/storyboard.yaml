  voiceover: Data files and computer code don't write north or west; they use signs. Latitudes north of the equator are positive,
    and south of it they're negative. Longitudes east of Greenwich are positive, and west of it they're negative. So Brest
    becomes forty-eight point four, minus four point five. Some data sets count longitude all the way round instead, from
    zero to three hundred and sixty degrees east. There, Brest is at three hundred and fifty-five point five, which is the
    same meridian. The net of parallels and meridians drawn on a map is called the graticule.
