  visual: 'Globe from the side, axis drawn (slate). S2 the Brest parallel ring and its centre on the axis (dot). S3 radius
    from the axis to Brest, orange, label ''a cos φ'' with a gold right-angle tick and the angle φ at the centre. S4 the equation
    pair (δx = a cos φ δλ above δy = a δφ, aligned at ''=''). S5-S7 a 1-degree east step (teal bracket) slides from the equator
    to Brest to 60° N, its length readout ''111 km'' -> ''74 km'' -> ''56 km'' on the words; S8 the meridians converge on
    the pole: ''0''.'
  voiceover: Now let's walk due east, along a parallel. A parallel is a circle too, but its centre lies on the Earth's axis,
    so it's smaller. Its radius is our place's distance from the axis, which is a times cosine phi. So a small step in longitude,
    delta lambda, is a distance delta x, equal to a cosine phi times delta lambda. At the equator, cosine phi is one, so a
    degree of longitude is again about one hundred and eleven kilometres. At Brest, it's about seventy-four kilometres. At
    sixty degrees north, cosine phi is one half, so it's about fifty-six. And at the poles it's zero, because all the meridians
    meet there.
  on_screen_eq:
    latex: \delta x = a\cos\varphi\,\delta\lambda
    vallis_eq: 'unnumbered, §2.2.2 (text before (2.27)): δx = r cos ϑ δλ at r = a'
