  beat: building blocks · how weather radar works
  visual: 'Picture zone 3-D: a radar dome on a hill (illustrative) with a pulse (gold ring segment) travelling out to a rain
    shaft and an echo travelling back; a clock glyph ''t = 1 ms''. Maths zone: r = c Delta t / 2 (84 px) with underbraces
    ''speed of light'', ''there and back''; CalcStack ''3 x 10^8 m/s x 10^-3 s / 2 = 150 km''. S5: the beam sweeps 360 deg,
    painting a ring of echoes (decorative).'
  voiceover: Satellites see the tops of clouds. To see the rain itself, forecasters use weather radar. A radar dish sends
    out short pulses of microwaves and listens for echoes from raindrops, snowflakes and hail; it sees precipitation, not
    cloud. The pulse travels at the speed of light, out and back again, so an echo that returns after one thousandth of a
    second comes from about one hundred and fifty kilometres away. [beat] Turning the dish round and round builds up a map
    of the rain.
  on_screen_eq:
