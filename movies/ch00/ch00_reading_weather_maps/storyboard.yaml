  voiceover: 'When the wind blows across the isotherms, it carries warmer or colder air with it. That''s temperature advection,
    the dot product from the dot product movie: minus the wind dot the temperature gradient. Over the south of France, the
    wind here blows at about eighteen and a half metres per second from the west-north-west, straight across isotherms where
    the temperature changes by about five point two degrees every hundred kilometres. Eighteen and a half, times five point
    two over one hundred thousand, times three thousand six hundred seconds in an hour, is about three and a half degrees
    per hour of cooling. [beat] Wind blowing from cold air towards warm is called cold advection, and from warm towards cold,
    warm advection.'
