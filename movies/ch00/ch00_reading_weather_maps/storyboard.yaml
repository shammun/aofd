glossary_proposed:
  Ensemble: Many runs of the same forecast model from slightly different starting states (and with small random nudges), used
    to show how sure a forecast is.
  Ensemble member: One run of an ensemble; the control member starts from the best analysis without changes.
  Lead time: The time between a forecast's start (initial time) and the time it is valid for.
  Spread: How far the ensemble members are from one another, e.g. the standard deviation of a field or the root-mean-square
    distance of the members' low centres from their average.
  Spaghetti plot: One chosen contour drawn from every ensemble member on one map.
  Root mean square error: 'The typical size of a forecast''s miss: square the differences from the analysis, average them
    (area-weighted on a map), take the square root.'
  Machine-learning weather model: A forecast model that learned how the atmosphere changes from past data (e.g. ECMWF's AIFS,
    trained on ERA5) instead of solving the equations of motion.
