  visual: 'Picture zone: two code-drawn translucent air columns on the ground plate, slate (250 K) and orange (270 K), each
    with a ring at its 500-hPa height; maths zone: S2 ''H = RT/g'' recalled (68 px); S4 z₅₀₀ = (R T̄/g) ln(p₀/p) with underbraces
    ''scale height'', ''ln 2 for 1000 → 500''; S5-S6 CalcStack with each column''s number appearing on its ring (gold links);
    S7 gold bracket ''≈ 400 m lower'' between the rings; S8 a third, shorter column from ''956 hPa'' marked ''Ciarán''.'
  from_v1: s26_why_dips
  voiceover: 'Why does it dip over the storm? Remember the scale height, R T over g: in colder air it''s smaller, so the pressure
    falls faster with height. Take two columns with a thousand hectopascals at the ground, and pretend each has the same temperature
    all the way up. The pressure halves at the scale height times the natural log of two. At two hundred and fifty kelvin,
    that''s about five thousand and seventy metres. [beat] At two hundred and seventy kelvin, it''s about five thousand four
    hundred and eighty. [beat] So under a cold column, the five hundred hectopascal surface sits about four hundred metres
    lower, and a low at the ground, like Ciarán, starts lower still.'
  on_screen_eq:
    latex: z_{500} = \frac{R\,\bar T}{g}\,\ln\frac{p_0}{500\ \mathrm{hPa}}
    vallis_eq: (2.166) z(p2) − z(p1) = −(R/g) ∫ T d ln p, with T constant (the layer mean T̄), p1 = p0, p2 = 500 hPa
    page_png: chapters/pages/ch02/p103.png
  physics_source:
    fn: fluidpy.geo.atmos.hypsometric_thickness
    params:
