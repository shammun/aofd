  voiceover: 'To sum up, latitude and longitude are two angles that pin down any place on the Earth. A degree of latitude
    is about one hundred and eleven kilometres, while a degree of longitude shrinks with cosine phi. No flat map can keep
    everything, so weather charts use conformal projections, which keep angles: Mercator in the tropics, Lambert in the middle
    latitudes, and polar stereographic near the poles. Isobars show the pressure, and the closer they are, the stronger the
    wind. Upper-air maps show the height of the five hundred hectopascal surface, which dips where the air below is cold.
    Barbs show the wind in knots, and station models pack a whole weather report into a tiny picture. Fronts are drawn with
    symbols on the side they move towards, and visible, infrared and water vapour images show the clouds, their heights, and
    the moisture aloft. And with your back to the wind, the low is on your left in the northern hemisphere, and on your right
    in the southern.'
