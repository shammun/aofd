    Let''s pretend the temperature is the same all the way up. Then the pressure halves to five hundred at a height of the
    scale height times the natural log of two. If the column averages two hundred and fifty kelvin, that''s about five thousand
    and seventy metres. If it averages two hundred and seventy kelvin, it''s about five thousand four hundred and eighty.
    So under a cold column, the five hundred hectopascal surface sits about four hundred metres lower. And a low at the ground,
    like Ciarán, starts lower still.'
