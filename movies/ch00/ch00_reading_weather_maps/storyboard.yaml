  voiceover: One low is only one spot on the map. To score a whole map, forecasters use the root mean square error. Take the
    difference between the forecast and the analysis at every grid point, and square each one, so that too high and too low
    can't cancel. Average the squares, and take the square root. With three points off by one, minus two and two hectopascals,
    the squares are one, four and four, their average is three, and the square root of three is about one point seven hectopascals.
    [beat] On a real map, grid points crowd together towards the pole, so each one counts in proportion to the area it covers.
    Over this North Atlantic map, the three-day forecast missed by about three point one hectopascals for the GFS, and about
    two point six for the European model. [beat] That's the typical size of the miss, everywhere on the map at once.
