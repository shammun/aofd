  beat: building blocks · reflectivity, decibels and rain rate
  visual: 'Maths zone: dBZ = 10 log10 Z (84 px; Z in mm^6 m^-3, underbrace ''drop diameter to the sixth power''); a log ladder
    10 -> 100 -> 1000 -> 10 000 with ''10 dBZ, 20, 30, 40''; then Z = 200 R^1.6 (84 px) and CalcStack ''R = (Z / 200)^(1/1.6)'':
    ''20 dBZ: (100/200)^0.625 ~ 0.65 mm/h'', ''40 dBZ: (10^4/200)^0.625 ~ 11.5 mm/h'', ''50 dBZ: ~ 49 mm/h''. Picture zone:
    the house radar colour bar (perceptual, 5-dBZ steps, 52 px) with the three rain rates pinned on it; drops of three sizes
    (illustrative).'
  voiceover: 'The strength of the echo is called the reflectivity, capital Z. A drop''s echo grows with its diameter to the
    sixth power, so Z spans many powers of ten, and radar uses a logarithmic scale in decibels, called d B Z: ten times the
    log, base ten, of Z. Every ten more d B Z is ten times stronger. [beat] A rough rule found by Marshall and Palmer in nineteen
    forty-eight links it to rainfall: Z equals two hundred times the rain rate to the power one point six. So twenty d B Z
    is light rain, about two thirds of a millimetre per hour; forty is heavy rain, about eleven and a half; and fifty is a
    downpour of nearly fifty millimetres per hour. [beat]'
  on_screen_eq:
  - latex: \mathrm{dBZ} = 10\,\log_{10} Z
    vallis_eq: none (radar meteorology convention; Z in mm^6 m^-3)
    page_png: null
  - latex: Z = 200\,R^{1.6}
    vallis_eq: none (Marshall & Palmer 1948, J. Meteor. 5, 165-166)
    page_png: null
