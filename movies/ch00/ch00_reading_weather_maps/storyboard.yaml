    ''pressure push, high -> low'' and violet arrow ''Coriolis'' growing until equal and opposite; the teal wind arrow then
    runs along the isobars. Maths zone (96 px): V_g = (1/(rho f)) Delta p / Delta n with gold underbraces ''density'', ''Coriolis
    parameter'', ''pressure change across the isobars''; then f = 2 Omega sin phi (84 px) with ''Earth''s spin'' under Omega.'
  voiceover: Why? We built the answer in the geostrophic wind movie. Away from the ground, the push of the pressure, from
    high towards low, is balanced by the Coriolis effect of the Earth's spin, which pushes moving air sideways. Then the wind
    blows along the isobars, at a speed of one over the density times f, times how fast the pressure changes across the isobars.
    Here f is the Coriolis parameter, two Omega sine phi.
