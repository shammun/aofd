    latitude, delta phi, is really a delta phi long. Mercator stretches it by one over cosine phi, so on the map it becomes
    a delta phi over cosine phi. Adding up all these little steps from the equator is an integral. Its answer is y equals
    a, times the natural log of the tan of pi over four plus phi over two.
