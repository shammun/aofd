    on AT(9, "kept falling at the rate") the ground tangent draws as a gold dashed line and on AT(9, "exactly H") it reaches
    p = 0 where a gold tick ''H'' marks the height axis; on S10 the curve is highlighted ''falls more slowly'' as it bends
    away from the tangent. S11 keyword ''H = how deep the air is''. S12 two small 3-D columns to scale (no numbers): ''colder:
    smaller H'' (slate) and ''warmer: bigger H'' (orange), heights from scale_height(263 K) and scale_height(303 K).'
  voiceover: 'Look at the new rule: the three numbers R, T and g always appear together, as g over R T. So let''s give the
    upside-down group, R T over g, its own name: the scale height, capital H. With it, our rule becomes much simpler: partial
    p by partial z equals minus p over H. What kind of quantity is H? Let''s check its units. R is in joules per kilogram
    per kelvin, and a joule per kilogram is a metre squared per second squared. Multiply by T in kelvin, divide by g in metres
    per second squared, and we''re left with metres: a height. So what does this height mean? The rule says that if the pressure
    kept falling at the rate it has at the start, it would reach zero after a climb of exactly H. It never actually gets there,
    because the fall slows down as the pressure gets smaller, but H tells us the size of climb that matters. So H is one number
    that tells us how deep the atmosphere is: the bigger H is, the more slowly the pressure falls, and the higher the air
    reaches. And because T is on top of the fraction, warmer air has a bigger scale height and reaches higher than colder
    air.'
