  voiceover: 'Before we look at real maps, let''s pin down two words. Weather is the state of the atmosphere at one place
    and time: its temperature, pressure, humidity, wind, clouds and rain, right now or over the next few days. Climate is
    the statistics of the weather over many years, usually thirty: what''s normal, and how far the weather usually strays
    from it. Here is the daily temperature at Brest, in north-western France, for every day of twenty twenty-three. Behind
    it is Brest''s climate for each day of the year, the average over nineteen ninety-one to twenty twenty, with a band that
    holds eight days out of ten. The weather line jumps around from day to day, but most of the time it stays inside the band.
    Climate is what you expect; weather is what you get.'
