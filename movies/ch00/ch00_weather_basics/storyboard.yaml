    per

    second-of-animation (seeded, illustrative) and orange arrows 1x vs 2x; keyword ''p ∝ ρ''. Case 2 (S3): same dot

    count, faster dots, arrows grow; keyword ''p ∝ T''. Maths zone: S4 Layered TeX ''p = \rho R T'' (96 px) built term by

    term: ''p'' orange, ''\rho'' brown, ''R'' warm white, ''T'' gold; S5-S6 gold underbraces ''pressure (Pa)'', ''density
    (kg/m³)'',

    ''gas constant'', ''temperature (K)''; ''R = 287\ \mathrm{J\,kg^{-1}\,K^{-1}}'' (68 px).

    '
  voiceover: 'Now let''s connect pressure, density and temperature. Think about what makes the molecules push harder on a
    wall. If we pack more molecules into each cubic metre, more of them hit the wall each second, so the pressure goes up
    with the density. If the molecules move faster, each one hits harder and more often, so the pressure goes up with the
    temperature. Put together, the pressure is proportional to density times temperature: p equals rho R T. This is called
    the ideal gas law. Here p is the pressure in pascals, rho is the density, T is the temperature in kelvin, and R is a fixed
    number for dry air, called the gas constant: two hundred and eighty-seven joules per kilogram per kelvin.'
