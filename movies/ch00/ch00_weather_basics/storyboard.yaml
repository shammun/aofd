  voiceover: 'Meteorologists name a wind by where it comes from, not where it''s going. A westerly wind blows from the west,
    towards the east. The direction is given in degrees, measured clockwise from north as seen from above: north is zero,
    east ninety, south one hundred and eighty, and west two hundred and seventy. Our wind blows towards the north-east, so
    it comes from the south-west. Its direction is about two hundred and thirty-three degrees, and we call it a south-westerly.
    [beat] Careful: ocean currents use the opposite habit, and are named by where they go, so an eastward current flows towards
    the east.'
