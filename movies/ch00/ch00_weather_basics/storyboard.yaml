    Take a thin slab of air inside our column, standing on one square metre, with a small thickness, delta z. Here z is height,
    and delta z means a small step in height. The slab is at rest, so the forces on it must balance. The air below pushes
    it up, with a force equal to the pressure at its bottom, because the area is one square metre. The air above pushes it
    down, with the pressure at its top. And gravity pulls it down with its weight.
