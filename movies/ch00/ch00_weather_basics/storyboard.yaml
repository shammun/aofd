  voiceover: A reanalysis fills in the gaps. It starts from a weather forecast model, a computer program that steps the laws
    of physics forward in time, including the hydrostatic balance and the gas law we just met. Every few hours, it nudges
    the model towards all the observations made at that time, trusting the more reliable ones more. The result is a complete
    picture of the atmosphere, at every place and height, every hour, for decades. The one we use in this video is called
    ERA5, made by the European Centre for Medium-Range Weather Forecasts. It runs from nineteen forty to today, on a grid
    with points about thirty kilometres apart. It's like a jigsaw with missing pieces, filled in using the pieces around them
    and the rules of physics. Unlike a photograph, though, where observations are sparse the result leans more on the model,
    so it's least certain there.
