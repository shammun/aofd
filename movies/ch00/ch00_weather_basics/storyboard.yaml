  voiceover: 'What does the slab weigh? First, its volume: its base is one square metre and its thickness is delta z, so its
    volume, capital V, is one square metre times delta z. Next, its mass: mass is density times volume, so m equals rho times
    V, which is rho, times one square metre, times delta z. Last, its weight: weight is mass times g, so W equals rho g delta
    z, times one square metre. [beat] Now the balance. Each push is a pressure times the area it pushes on, one square metre.
    The push up, minus the push down, equals the weight. The square metre appears in every term, so we can cancel it: p at
    the bottom, minus p at the top, equals rho g delta z. The pressure at the bottom is bigger, by exactly the weight of the
    slab on each square metre.'
