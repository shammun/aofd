    pressure''. S7 keyword ''real services: more careful version'' (44 px).


    UF1: [beat] after S6 (worked number).'
  voiceover: 'So how do we compare a mountain town with a seaside town? We imagine what the pressure would be if each place
    were at sea level. Suppose a weather station sits one thousand six hundred and nine metres up, about the height of Denver
    in the United States, and reads eight hundred and thirty-five hectopascals, with an air temperature of fifteen degrees.
    We add the weight of an imaginary column of air, reaching from the station down to sea level. With our exponential rule
    run downwards, that''s eight hundred and thirty-five times e to the power of one point six oh nine divided by eight point
    four three. That''s about one thousand and ten hectopascals: a perfectly ordinary sea-level reading. [beat] This is called
    the sea-level pressure. Real weather services use a slightly more careful version of the same idea.'
