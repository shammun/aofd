  voiceover: 'Here''s another way to see why the curve bends. Let''s cut our column into ten slabs that each hold the same
    amount of air: one tenth of the total, about a thousand kilograms above each square metre. The bottom slab is only about
    nine hundred metres thick, because it carries the weight of all the air above it and is squeezed the most. Each slab higher
    up has less air pressing down on it, so it''s squeezed less and is thicker. The ninth slab reaches up to about nineteen
    kilometres, and the last one thins out with no sharp top at all. It''s like a stack of foam mattresses: the bottom ones
    are squeezed the most, because they carry everything above them. Unlike mattresses, though, the air''s layers aren''t
    separate, and how much they squeeze also depends on their temperature.'
