    whenever the globe shows air.

    '
  voiceover: Let's start with the air itself. The atmosphere is the layer of air that wraps around the Earth, held down by
    gravity. It's much thinner than most pictures suggest. The layer where our weather happens is only about twelve kilometres
    deep, while the Earth's radius is six thousand three hundred and seventy-one kilometres. On a globe thirty centimetres
    across, that layer would be about a third of a millimetre thick, like three sheets of paper. So from now on, we'll draw
    the air fifty times thicker than it really is, just so we can see it.
