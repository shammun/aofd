    markers ''z = 0, p₀'' at the ground and ''z, p'' higher up on S1. Maths zone, one line per sentence (CalcStack <= 3 lines):
    S2 ''\int_{p_0}^{p} \dfrac{dp''}{p''} = -\dfrac{1}{H}\int_{0}^{z} dz'''' + keyword ''add up small steps = integrate'';
    S3 left side → ''\ln p - \ln p_0'' (left half highlighted); S4 right side → ''-\dfrac{z}{H}'' (right half highlighted);
    S5 ''\ln p - \ln p_0 = \ln\dfrac{p}{p_0}''; S6 ''\ln\dfrac{p}{p_0} = -\dfrac{z}{H}'' (84 px); S7 keyword ''e ≈ 2.72''
    with a small π-and-circle glyph beside it (like π for circles); S8 ''p = p_0\, e^{-z/H}'' (96 px) while the slate curve
    p0 e^{-z/H} (H = 8.43 km) draws upward on the main graph with ''p₀ = 1013 hPa'' at its foot; [beat]. S9 keyword ''same
    T all the way up''.'
  voiceover: Now we add up those small falls, from the ground, where z is zero and the pressure is p zero, up to height z,
    where the pressure is p. Adding up small changes is what an integral does, so we integrate both sides. On the left, adding
    up the changes in the log of p gives the log of p, minus the log of p zero. On the right, minus one over H for every metre,
    over a climb of z metres, adds up to minus z over H. And the log of p, minus the log of p zero, is the log of p over p
    zero. So the log of p over p zero equals minus z over H. The natural log is built on a special number called e, about
    two point seven two, which turns up with growth and decay just as pi turns up with circles. To undo the log, we raise
    e to the power of each side, and we get p equals p zero times e to the minus z over H. [beat] This tells us the pressure
    at any height z, in air that has the same temperature all the way up.
