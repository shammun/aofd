  beat: recap
  visual: 'No heading. One beat per sentence, each a mini picture from its scene (thumbnail re-renders, 60 % size) with its

    keyword: s02 globe; s05 column ''1013 hPa''; s19 curve ''p = p_0 e^{-z/H}'', ''H ≈ 8 km''; s12 cubes ''p = \rho R T'';

