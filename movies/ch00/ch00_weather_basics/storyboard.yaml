    s38 globe ''reanalysis''.

    '
  voiceover: To sum up, the atmosphere is a thin shell of air, and almost all our weather happens in its lowest layer, the
    troposphere. Air pressure is the weight of the air above each square metre, about one thousand and thirteen hectopascals
    at sea level. By hydrostatic balance, it falls with height, roughly exponentially, with a scale height of about eight
    kilometres. The gas law, p equals rho R T, ties pressure, density and temperature together, so warm air is lighter than
    cold air. Relative humidity compares the vapour with its saturation value, and cooling air to its dew point makes clouds.
    Winds are named by where they come from, and are measured in metres per second or knots. Sea-level pressure maps show
    highs and lows, and fronts are the boundaries between air masses. Weather is what happens now, climate is its long-term
    statistics, and a reanalysis gives us both, everywhere, every hour.
