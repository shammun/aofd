  voiceover: 'Why does the air get colder as we go up, when that brings us closer to the sun? Because sunlight mostly passes
    straight through the air and warms the ground first. The ground then warms the air touching it, so the troposphere is
    heated from below, like a pan of water on a stove. Here''s a real sunny morning over northern France, on the twenty-fourth
    of June, twenty twenty-four, seen from a satellite. Heights in this picture are drawn twenty times taller than distances
    on the map. Warm air near the ground rises, in bubbles called thermals. As it rises, it moves into lower pressure, so
    it expands. Expanding air pushes its surroundings away, and that work costs it energy, so it cools: by almost ten degrees
    for every kilometre it rises, as long as no cloud forms. A weather balloon launched near Paris at midday that day agrees:
    in the lowest one and a half kilometres, the temperature fell by about ten degrees for every kilometre. [beat] By the
    early afternoon, the rising air had cooled enough to make clouds, and the satellite saw the sky fill with them. We''ll
    work out exactly where those clouds begin a little later.'
