  voiceover: Why does air move at all? The simplest reason is pressure. Where the pressure is higher on one side than on the
    other, the air is pushed from high pressure towards low pressure, just as air rushes out of a punctured tyre. But on our
    spinning Earth, moving air is gradually turned aside, so over large distances the wind ends up blowing around areas of
    high and low pressure, rather than straight into them. We'll see how that turning works in later videos on the Coriolis
    effect and the geostrophic wind.
