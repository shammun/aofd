  voiceover: Lows and highs bring different weather, and now we can see why. Near the ground, air drifts in towards the centre
    of a low. It can't pile up there, so it rises. Rising air expands and cools, it reaches its dew point, and clouds and
    rain form. That's why lows bring cloudy, wet and windy weather. Around a high, air sinks from above and spreads out near
    the ground. Sinking air is squeezed and warms, so it moves away from its dew point, and clouds evaporate. That's why highs
    usually bring settled, dry weather.
