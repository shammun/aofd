  voiceover: 'Now let''s solve this rule, to find the pressure at any height. To keep the steps simple, let''s assume the
    temperature is the same at every height, so that H is one fixed number. That''s a simplification: the real temperature
    changes with height, as we''ll see soon, but it gives us a clean formula that makes a good first guess. First, divide
    both sides by p: one over p, times partial p by partial z, equals minus one over H. Here''s a useful fact from calculus:
    the slope of the natural log of p is one over p. So, by the chain rule, the left side is just the rate of change of the
    natural log of p with height. That means the log of p falls by the same amount, one over H, for every metre we climb.'
