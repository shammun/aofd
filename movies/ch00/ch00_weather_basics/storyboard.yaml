  voiceover: 'Temperature measures how fast the molecules jiggle on average: the warmer the air, the faster they move. Weather
    reports use degrees Celsius, but physics uses kelvin. To get kelvin, add two hundred and seventy-three point one five
    to the Celsius number, so fifteen degrees Celsius is two hundred and eighty-eight point one five kelvin. A kelvin step
    is the same size as a degree Celsius step; only the starting point moves. Zero kelvin is the coldest anything can be,
    so a temperature in kelvin is never negative. That''s why the gas law, which comes next, uses kelvin.'
