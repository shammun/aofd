    which is about twelve percent. But the pressure shrinks a little as we climb through that kilometre, so the real fall
    is slightly less: one minus e to the minus one over eight point four three, which is about eleven percent. [beat] Eleven
    percent of what? Of the pressure at the bottom of that kilometre. So the first kilometre takes one thousand and thirteen
    hectopascals down to about nine hundred, and the next takes nine hundred down to about eight hundred. Each kilometre takes
    away the same fraction, so the drops get smaller as we go up: about a hundred and thirteen hectopascals in the first kilometre,
