    at the bottom of the picture it credits (y <= 850, never in the caption band 880-1040), fades with its picture, never
    spoken.'
  voiceover: 'Since pressure is the weight of the air above, the pressure at any height also tells us how much air is left
    above it. At the ground, the pressure p zero is the weight of the whole column, and at height z, the pressure p is the
    weight of only the air above z. So p over p zero is the share of all the air that''s above us, and the share below is
    one minus p over p zero. This time, let''s use the standard atmosphere, an average of real measurements that gets colder
    as we go up. At about five and a half kilometres, its pressure is about five hundred and five hectopascals, close to half
    of one thousand and thirteen. So p over p zero is about one half, and one minus a half is a half: half of all the air
    is below us. [beat] That''s a little lower than our five point eight kilometres, because colder air has a smaller scale
    height. At sixteen kilometres, the pressure is about one tenth of its ground value, so nine tenths of the air is below.
    And by about thirty-one kilometres, ninety-nine percent of the air is below. That''s why the atmosphere is such a thin
    shell.'
