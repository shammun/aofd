    both sides by delta z, and let the slab get thinner and thinner. Delta p over delta z becomes the derivative, partial
    p by partial z: how fast the pressure changes with height. Partial means only the height changes; the place and the time
    stay fixed. So partial p by partial z equals minus rho g. This is called hydrostatic balance: at every height, the pressure
    holds up the weight of the air above.'
