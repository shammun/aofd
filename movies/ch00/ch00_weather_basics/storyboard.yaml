  voiceover: 'So how far must we cool this air before it''s saturated? We need the temperature at which the saturation vapour
    pressure has fallen to fifteen hectopascals. That''s about thirteen degrees. [beat] This is the dew point: the temperature
    to which air must be cooled, keeping its water, to become saturated. On a clear night, grass cools below the dew point
    of the air touching it, and dew forms. When a whole layer of air near the ground cools to its dew point, we get fog. And
    when rising air cools to its dew point, we get a cloud.'
