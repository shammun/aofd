    is called the saturation vapour pressure. It depends only on temperature, and it climbs steeply: about six hectopascals
    at zero degrees, twelve at ten, twenty-three at twenty, and forty-two at thirty. It roughly doubles for every ten degrees
    of warming. People often say warm air can hold more water, like a bigger sponge. Unlike a sponge, though, the air isn''t
    doing the holding: the limit is set by the temperature, and it would be the same with no air at all.'
