  voiceover: 'Let''s start with the air itself. The atmosphere is the layer of air that wraps around the Earth, held down
    by gravity. It''s much thinner than most pictures suggest. The layer where our weather happens is only about twelve kilometres
    deep, while the Earth''s radius, the distance from its centre to its surface, is six thousand three hundred and seventy-one
    kilometres. How thin is that, really? Let''s shrink the whole Earth down to a desk globe, thirty centimetres across, so
    its radius is fifteen centimetres, or one hundred and fifty millimetres. First, we find what fraction of the Earth''s
    radius the weather layer is: twelve divided by six thousand three hundred and seventy-one, which is about two thousandths.
    Then we shrink the layer by the same factor as the Earth: two thousandths of one hundred and fifty millimetres is about
    three tenths of a millimetre. [beat] That''s like three sheets of paper, painted onto the desk globe. So from now on,
    we''ll draw the air fifty times thicker than it really is, just so we can see it.'
