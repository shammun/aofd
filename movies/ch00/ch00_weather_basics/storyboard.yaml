honesty_notes:
- The atmosphere is drawn 50x thicker on globes from s02 S5 on and the frontal side views 50x taller (s48 says so); both listed
  as exaggerations, no badges.
- 'Pressure falls exponentially only for constant temperature: s19 states the assumption, s21 shows the real sounding falling
  faster aloft because the air is colder (smaller H).'
- H = RT/g is evaluated at 288.15 K (8.43 km); the recap says 'about eight kilometres'; Vallis quotes 7 km at 240 K and 8.2
  km at 280 K (text after (2.166)).
- The ideal gas law is built from molecules qualitatively (more molecules / faster molecules); R = 287 J/(kg K) is dry air;
  humidity changes it by < 1 % (not said).
- Saturation vapour pressure from Vallis (18.28) with L constant (Vallis's constants); it depends on temperature only, not
  on the presence of air (the sponge Unlike).
- The 9.8 °C per km cooling of rising unsaturated air is quoted with a plain-words reason (expansion work) and derived in
  a later movie; the dew-point fall of about 1.8 °C per km is computed by the new LCL function.
- The sea-level reduction in s40 is a thought example with the isothermal rule; the narration says real services use a more
  careful version.
- Wind direction is where the wind comes FROM, clockwise from north seen from above; ocean currents are named the opposite
  way (said).
- 'Rotation sense: winds circle Ciarán anticlockwise as seen from above (NH), the high clockwise seen from above; reversed
  in the SH (said); why is left to the Coriolis movie.'
- Brest numbers are the ERA5 grid point nearest to Brest (48.5N 4.5W), called 'the reanalysis', never 'the station'; times
  in UTC (said in s54).
- Fronts on the real map come from an objective thermal-front method on smoothed 850-hPa temperature, not from a forecaster's
  chart; the side views are schematic.
- Satellite images are NASA GIBS daytime true colour; night-time hours use the Blue Marble/relief base, never a black map.
- No references, book or author names, equation numbers, URLs or badges on screen; provenance (vallis_eq, page_png) lives
  only in this file.
quiz_hook: 'A mountain station 3 km up reads 700 hPa at 0 °C. Is its sea-level pressure high or low? (H = 287 x 273 / 9.81
  ≈ 8.0 km; 700 x e^(3/8.0) ≈ 1018 hPa: a slightly high reading.)'
