    ''1 kg'': ''air'' with 100 small teal dots and ''vapour'' with 161 slate-blue dots (dot counts from 1/ε), molecule glyphs
    ''29'' (air) and ''18'' (water) on S7, ''\dfrac{29}{18} \approx 1.61'' (68 px) on S8, keyword ''share of molecules = 1.61
    × share of mass'' on S9. S10-S11 CalcStack ''q = 20\ \mathrm{g/kg} = 0.020'', ''p \approx 1000\ \mathrm{hPa}'', ''e \approx
    1.61 \times 0.020 \times 1000 \approx 32\ \mathrm{hPa}'' (gold underline), keyword ''out of ≈ 1000 hPa''; [beat]. UF1
    R1: R1 source line(s) as listed in this scene''s source_line field: muted #9aa6bd, 30 px (>= 28), one line, left-aligned
    at the bottom of the picture it credits (y <= 850, never in the caption band 880-1040), fades with its picture, never
    spoken.'
  voiceover: 'How big is that share? There''s a handy rule for it: e is about one point six one, times q, times p. Here e
    is the vapour pressure, q is the specific humidity written in kilograms of vapour per kilogram of air, and p is the air
    pressure. Careful: this e is just the usual letter for vapour pressure, not the number e from before. Where does one point
    six one come from? Pressure comes from molecules hitting things, so the vapour''s share of the pressure is its share of
    the molecules. A water molecule is lighter than an average air molecule: it weighs about eighteen atomic mass units, against
    about twenty-nine. So a kilogram of vapour holds about twenty-nine divided by eighteen, or one point six one, times as
    many molecules as a kilogram of air. That''s why the vapour''s share of the molecules, and so of the pressure, is about
    one point six one times its share of the mass, q. Let''s try the steamiest tropical air: q is twenty grams per kilogram,
    which is zero point zero two, and p is about a thousand hectopascals. So e is about one point six one times zero point
    zero two times a thousand, which is about thirty-two hectopascals, out of about a thousand. [beat]'
  on_screen_eq:
