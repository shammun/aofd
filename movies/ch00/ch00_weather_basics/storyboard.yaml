  voiceover: 'Air is a mixture of gases. By volume, about seventy-eight percent is nitrogen, twenty-one percent is oxygen,
    and almost one percent is argon. Carbon dioxide is only about four hundredths of one percent, and water vapour comes and
    goes, from almost nothing to a few percent. All of it is made of molecules that zip around at hundreds of metres per second,
    bumping into each other billions of times every second. We can''t follow single molecules, so meteorologists talk about
    air parcels. An air parcel is a small volume of air that moves with the flow: big enough to hold countless molecules,
    but small compared with the weather around it. Here''s one, drawn far bigger than life, riding the real wind over north-western
    France. Wherever the wind goes, the parcel goes, and it carries its own temperature and water vapour along with it.'
