  voiceover: Does the real atmosphere follow this curve? Let's check it against a real weather balloon. Twice a day, at hundreds
    of places around the world, meteorologists launch a balloon carrying a small instrument package called a radiosonde. As
    it rises, it radios back the pressure, the temperature and the humidity, and from its drift we get the wind. This one
    was launched near Paris around midnight, at the start of the first of November, twenty twenty-three. In the picture, heights
    are drawn ten times taller than distances on the map, so that we can see the climb. Near the ground, its pressure follows
    our curve closely. Higher up, the real pressure falls a little faster, because the real air up there is colder, and colder
    air has a smaller scale height. So our curve is a good first guess, and the measurements tell us where it needs correcting.
