    above them. Unlike mattresses, though, the air''s layers aren''t separate, and how much they squeeze also depends on their
    temperature. So the pressure halves about every five point eight kilometres: to about five hundred hectopascals at five
    point eight kilometres, and about two hundred and fifty at eleven point seven.'
