  beat: building blocks · pressure
  visual: 'Picture zone: the molecule box of s03 with its right wall highlighted; each bounce leaves a tiny orange tick on
    the

    wall; the ticks merge into one steady orange arrow (6 px) on a 1-m square patch outlined on the wall. Maths zone:

    TeX ''p = \dfrac{\text{force}}{\text{area}}'' (84 px) on AT(3, "force divided by"). S4: a small 3-D cube (ThreeCanvas,

    az 35°, el 25°) in still air with six equal orange arrows pushing on its faces, keyword ''equal in every direction''.

    S5: ''1\ \mathrm{Pa} = 1\ \mathrm{N/m^2}'' (68 px).

    '
  voiceover: 'Now let''s look at air pressure. Those fast molecules keep hitting every surface they meet: your skin, the walls
    of a room, the surface of the sea. Each hit is a tiny push, and billions of them add up to a steady force. Pressure is
    that force divided by the area it pushes on. In air at rest, it pushes equally in every direction: up, down and sideways.
    Its unit is the pascal, one newton of force on each square metre.'
  on_screen_eq:
    latex: p = \dfrac{\text{force}}{\text{area}}
    vallis_eq: definition (our words; pressure introduced in Vallis §1.3 text)
