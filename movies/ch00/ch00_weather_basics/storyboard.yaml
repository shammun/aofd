    '
  voiceover: Now let's zoom out to the whole planet, and ask why the weather moves at all. It starts with sunlight. Picture
    a beam of sunlight one metre wide, at noon at an equinox, in March or September, when the sun is overhead at the equator.
    At the equator, it lands on one metre of ground. At sixty degrees north, the ground is tilted to the beam, and the same
    beam is spread over two metres, so each square metre gets half as much. So the tropics are heated much more than the poles,
    and the atmosphere and the ocean carry heat from the tropics towards the poles. Storms like Ciarán are one of the ways
    the atmosphere does it.
