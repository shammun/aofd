  voiceover: Wind speed comes in several units. Metres per second is the scientific one. Multiply by three point six to get
    kilometres per hour, so ten metres per second is thirty-six kilometres per hour. Sailors and pilots use knots. A knot
    is one nautical mile per hour, and a nautical mile, one thousand eight hundred and fifty-two metres, is about one sixtieth
    of a degree of latitude along the Earth's surface. So one knot is about point five one metres per second, and our ten
    metres per second wind is about nineteen knots. [beat]
