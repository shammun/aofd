  voiceover: 'Now let''s look at wind. Wind is air moving across the Earth''s surface, and it has both a speed and a direction,
    so it''s a vector: an arrow. We can split the arrow into two parts, called components. The eastward part is written u,
    and the northward part is written v. Take a wind blowing towards the north-east, with u equal to eight and v equal to
    six metres per second. By Pythagoras, its speed is the square root of eight squared plus six squared, which is ten metres
    per second. [beat]'
