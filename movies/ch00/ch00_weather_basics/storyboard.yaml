  voiceover: 'So how deep is our air? Let''s work out H for a typical day at sea level. R is two hundred and eighty-seven,
    the gas constant for dry air. T is fifteen degrees, which is two hundred and eighty-eight point one five kelvin. And g
    is nine point eight one metres per second squared. So H is two hundred and eighty-seven times two hundred and eighty-eight
    point one five, divided by nine point eight one, which is about eight point four three kilometres. [beat] Here''s a nice
    way to picture that number. Imagine squashing all the air in our column to the same density all the way up: the sea-level
    density, one point two two five kilograms per cubic metre, which we found with the gas law. How tall would that column
    be, if it still had to weigh the same as the real one? Its weight on each square metre would be rho g times its height,
    and that must equal the sea-level pressure, p zero. So its height is p zero over rho g: one hundred and one thousand three
    hundred and twenty-five, divided by one point two two five times nine point eight one. That''s again about eight point
    four three kilometres. [beat] So the scale height is how tall the atmosphere would be if all its air were as dense as
    it is at sea level.'
