  beat: building blocks · pressure is weight
  visual: 'Picture zone: ThreeCanvas: a square 1 m x 1 m patch of ground (gold outline, label ''1 m²'' 54 px) with a sky-blue

    column rising out of frame and fading with height (density from data/atmos.json -> ussa_rho); a brown weight arrow

    at its foot (gravity colour, TipLabel ''weight''); camera tilts up the column on S2. S4: ''101\,325\ \mathrm{Pa}''

    (68 px) on the patch. Maths zone: S5 ''weight = m\,g'' and ''g = 9.81\ \mathrm{m/s^2}''; S6-S7 CalcStack:

    ''m = p_0 / g'' -> ''= 101\,325 / 9.81'' -> ''\approx 10\,300\ \mathrm{kg}'' with the unit cancellation shown

    (Pa = N/m² = kg m⁻¹ s⁻², ''÷ m/s²'' -> kg/m², the ''/m²'' read as ''per square metre''); gold CurvedLink from ''10 300
    kg''

    to a row of seven code-drawn car icons (''≈ 7 cars'', each 1.5 t). S8: keyword ''pressure = weight of the air above''.

    '
  voiceover: So how big is the pressure at the ground, and where does it come from? Picture a tall column of air standing
    on one square metre of ground, reaching all the way to the top of the atmosphere. Gravity pulls all that air down, and
    the ground has to hold up its weight. At sea level, the average pressure is one hundred and one thousand three hundred
    and twenty-five pascals. Weight is mass times g, where g is the pull of gravity, nine point eight one metres per second
    squared. So the mass in our column is the pressure divided by g. That's about ten thousand three hundred kilograms of
    air above every square metre, as heavy as seven cars. So the pressure at the ground is the weight of all the air above
    it, spread over each square metre.
  on_screen_eq:
    latex: m = \dfrac{p_0}{g} = \dfrac{101\,325}{9.81} \approx 10\,300\ \mathrm{kg}
    vallis_eq: 'worked number (hydrostatic: pressure = weight of the fluid above, Vallis §1.3.3 text after (1.51))'
    page_png: chapters/pages/ch01/p032.png
  physics_source:
