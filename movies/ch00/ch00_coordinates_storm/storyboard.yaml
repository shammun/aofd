  voiceover: 'Now let''s meet our second storm, on the other side of the world, in the Bay of Bengal, between India and Myanmar, with Bangladesh at its
    northern end. Remember, here a tropical cyclone is simply called a cyclone. In May twenty twenty, Cyclone Amphan formed in the south of the Bay. On
    the eighteenth of May, its winds reached the top class on the India Meteorological Department''s scale, called a super cyclonic storm. No storm in the
    Bay of Bengal had reached that class since nineteen ninety nine. That class measures only the strongest wind over the sea, not the harm on land. In
    between, weaker storms hit Bangladesh very hard: Cyclone Sidr in two thousand and seven killed thousands of people, and Cyclone Aila in two thousand
    and nine flooded Khulna and Satkhira for months. On the twentieth, it came ashore in the Sundarbans, the huge mangrove forest on the border between
    India''s state of West Bengal and Bangladesh. Its centre then passed close to Kolkata. It passed about forty five kilometres west of Satkhira, and about
    seventy nine kilometres west of Khulna, both in Bangladesh. So the Khulna and Satkhira districts of Bangladesh took much of its flooding.'
