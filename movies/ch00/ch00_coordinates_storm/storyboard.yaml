  beat: recap ('To sum up'); last sentence the teaser to Part 3
  visual: 'S0-S6 unchanged; S7 the coast with along / across; S8-S9 the gauges with the two across-shore numbers; S10 the three events'' across-shore arrows
    onto the land; S11 the flood pictures; S12-S13 the teaser (Part 3: the Earth; latitude, longitude → km).'
  voiceover: 'To sum up, the tip of r hat moves along a circle of radius one, so for a small turn delta theta, it moves delta theta along theta hat. That
    gave us the slopes of cosine and sine: minus sine, and cosine. So d r hat by d theta is theta hat, and d theta hat by d theta is minus r hat: each arrow
    swings towards the other one. The product rule says that a number times an arrow changes through both of them. On a ring, the angle grows at v over
    r, the velocity is v theta hat, and the acceleration is minus v squared over r, times r hat: inward, even at a steady speed. For Ian''s ring, that''s
    about zero point zero four eight metres per second squared, about two hundred times smaller than gravity. Adding the height z gives cylindrical coordinates,
    and averaging round the rings shows a tropical cyclone''s in, up and out, in Ian and in Amphan alike. Turning the axes to fit the coast split Ian''s
    wind into its parts along and across the shore. At Fort Myers Beach, about thirty one point five metres per second blew onto the land, and the gauge
    up the river at Fort Myers rose about two point two metres. At Saint Petersburg, about twelve point one blew out to sea, and the water fell about one
    point eight metres. Before the floods after Amphan, Nargis and Idai, the across-shore wind blew onto the land too: about twenty two point four, seventeen
    point eight and twenty one metres per second in ERA5. Radar saw Amphan''s flood through the clouds, and false colour showed the floods after Nargis
    and Idai. In Part 3, we''ll take these ideas to the biggest round shape of all: the Earth. There, we''ll learn to turn latitudes and longitudes into
    kilometres, the rule behind the kilometre maps we used for today''s coasts.'
