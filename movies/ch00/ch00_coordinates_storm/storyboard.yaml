    with √125 ≈ 11.2 km. Source line under the picture.'
  voiceover: 'So what did satellites see of Amphan''s flood? For days after landfall, thick clouds covered the ground, so ordinary pictures from space can''t
    show it. And the flooded patches are small, so the coarse pixels of those pictures, two hundred and fifty metres wide, blur them into the land around
    them. But radar sees through clouds. The Sentinel-1 radar satellite sends out microwaves and measures how much of them bounces back. Calm water reflects
    the microwaves away, like a mirror, so in a radar picture, water looks dark. Here''s the coast near Satkhira and the Sundarbans on the sixteenth of
    May, before Amphan, and on the twenty second, two and a half days after landfall. [beat] As the line moves across, new dark patches appear where the
    fields were dry before. We count the pixels that turned dark, marked here in cyan: about thirty four thousand seven hundred of them. Each pixel is a
    square sixty metres on each side, so it covers three thousand six hundred square metres, or zero point zero zero three six square kilometres. Thirty
    four thousand seven hundred times zero point zero zero three six is about a hundred and twenty five square kilometres of new water. [beat] That''s about
