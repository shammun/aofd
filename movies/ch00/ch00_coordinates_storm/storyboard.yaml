  beat: 'Cyclone Nargis as a case study: globe → Myanmar, the Irrawaddy delta, the track and dates, the eye, the zoom into the delta'
  visual: (unchanged) S0 fact row 10 ('some of the best-known'); S12 leads into the wind scene.
  voiceover: 'Some of the best-known flood pictures from space of a Bay of Bengal cyclone come from Cyclone Nargis, in May two thousand and eight. Let''s
    go to Myanmar, on the eastern side of the Bay. Here, the Irrawaddy River, which Myanmar calls the Ayeyarwady, fans out into many channels before it
    reaches the sea. This is the Irrawaddy delta: a huge, flat plain of rice fields, most of it only a few metres above the sea. Nargis formed in the south
    of the Bay in late April. It moved west, then north, then turned east, straight towards the delta. On the second of May, it came ashore at the delta''s
    south-western corner, with winds of about ninety knots, averaged over three minutes. A knot is one point eight five two kilometres per hour, so ninety
    knots is about a hundred and sixty seven kilometres per hour. A kilometre per hour is a thousand metres in three thousand six hundred seconds, so we
    divide by three point six, and get about forty six metres per second. [beat] Then it crossed the whole delta, eastward, towards Yangon, the country''s
    largest city. Here''s Nargis that day, seen by a NASA satellite a few hours before landfall, with its eye just off the coast. Its storm surge and heavy
    rain flooded the low delta, far inland. Before we look at the flood, let''s see which way its wind blew on the delta''s coast.'
