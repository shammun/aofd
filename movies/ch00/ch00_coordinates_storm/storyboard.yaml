  voiceover: 'Now let''s put an air parcel on Ian''s ring, twenty five kilometres from the centre, going round at a steady speed. We''ll call
    its speed v. On this ring, v is about thirty five metres per second. As the parcel goes round, its angle theta grows. How fast? Let''s find
    out, one step at a time. In a short time, delta t, the parcel moves a distance v times delta t along the ring. [beat] By the arc rule, a distance
    along a circle is the radius times the angle. So the angle it turns through is that distance divided by the radius: v delta t over r. [beat]
    Now divide by delta t, and let it shrink. The rate at which theta grows, d theta by d t, is v over r. [beat] The derivatives movie didn''t
    show this one, so let''s put in the numbers. Thirty four point eight metres per second, divided by twenty five thousand metres, is about zero
    point zero zero one three nine radians per second. [beat] The metres cancel, and radians per second are left. That''s about zero point zero
    eight degrees every second, or about five degrees every minute. [beat] So one full lap, two pi radians, takes two pi divided by zero point
    zero zero one three nine. That''s about four thousand five hundred seconds, or about seventy five minutes. [beat]'
