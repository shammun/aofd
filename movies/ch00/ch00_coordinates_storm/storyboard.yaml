  visual: '(unchanged ring) + S1-S7 recall: u_r = u cos θ + v sin θ, u_θ = −u sin θ + v cos θ ''derived in Part 1: radial and tangential wind''; Part 1''s
    worked point (east wind 10 m/s at θ ≈ 53°: u_r = 6, u_θ = −8) drawn at the ring point; the 72-point ring average ≈ 34.8 m/s; v = that speed.'
  voiceover: 'Now let''s put an air parcel on Ian''s ring, twenty five kilometres from the centre, going round at a steady speed. How fast does the air
    go round on that ring? We measured it in Part 1. At each point, we split the wind''s east and north parts, u and v, into a radial and a tangential part:
    u sub r equals u cosine theta plus v sine theta, and u sub theta equals minus u sine theta plus v cosine theta. For example, take an east wind of ten
    metres per second, so u is ten and v is zero, at the balloon''s point from Part 1, where cosine theta is zero point six and sine theta is zero point
    eight. Then u sub r is ten times zero point six, which is six, and u sub theta is minus ten times zero point eight, which is minus eight. [beat] Round
    Ian''s ring, we did this at seventy two points, one every five degrees, and averaged them: the sum of the seventy two values of u sub theta, divided
    by seventy two, is about thirty four point eight metres per second. In this part, we''ll call that speed round the ring v, so from now on, v means the
    speed, not the north part of the wind. As the parcel goes round, its angle theta grows. How fast? Let''s find out, one step at a time. In a short time,
    delta t, the parcel moves a distance v times delta t along the ring. [beat] By the arc rule, a distance along a circle is the radius times the angle.
    So the angle it turns through is that distance divided by the radius: v delta t over r. [beat] Now divide by delta t, and let it shrink. The rate at
    which theta grows, d theta by d t, is v over r. [beat] Now let''s put in the numbers. Thirty four point eight metres per second, divided by twenty five
    thousand metres, is about zero point zero zero one three nine radians per second. [beat] The metres cancel, and radians per second are left. That''s
    about zero point zero eight degrees every second, or about five degrees every minute. [beat] So one full lap, two pi radians, takes two pi divided by
    zero point zero zero one three nine. That''s about four thousand five hundred seconds, or about seventy five minutes. [beat]'
