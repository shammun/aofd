    unit vectors. R hat, cosine theta, sine theta, points straight away from the origin. Theta hat, minus sine theta, cosine theta, is r hat turned by ninety
    degrees anticlockwise, and it points the way theta grows. The parts of a wind along these two arrows are the radial wind, u sub r, and the tangential
    wind, u sub theta. Round Hurricane Ian''s eye, twenty five kilometres out, the air went round at about thirty five metres per second, and in at about
    thirteen. And we saw that r hat and theta hat turn as we go round. Today, we find out exactly how fast.'
