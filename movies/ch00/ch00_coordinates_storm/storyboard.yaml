  voiceover: Picture an air parcel, a small volume of air that moves with the flow, going round the eye of a tropical cyclone at a steady speed, never faster
    and never slower. Is it accelerating? Hold on to your guess, because we'll answer it with arrows that turn. A tropical cyclone is a huge spinning storm
    that forms over a warm ocean. Near America it's called a hurricane, and near India and Bangladesh it's called a cyclone, but it's the same kind of storm.
    This is the second of seven parts on coordinates. In this part, we find out exactly how the arrows of polar coordinates change as we go round. Then
    we look inside two real storms, each with its own job. Hurricane Ian, which hit Florida in twenty twenty two, has the most detailed wind data, so it
    shows us the storm in three dimensions, and its storm surge. Cyclone Amphan, which hit India and Bangladesh in twenty twenty, shows that the same picture
    fits a storm in another ocean. At the end, Amphan and two more cyclones, Nargis in Myanmar and Idai in Mozambique, show us the floods that storms leave
