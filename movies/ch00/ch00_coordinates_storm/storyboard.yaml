  beat: the wind's three parts; only r-hat and theta-hat turn
  visual: '(unchanged) + u_r, u_θ lines ''derived in Part 1: radial and tangential wind'' on S1-S4.'
  voiceover: 'In cylindrical coordinates, the wind has three parts. The radial wind, u sub r, points along r hat: in or out. The tangential wind, u sub
    theta, points along theta hat: round the eye. And the vertical wind, w, points along z hat: up or down. Written as one arrow, the wind is u sub r times
    r hat, plus u sub theta times theta hat, plus w times z hat. Z hat points straight up everywhere, just like x hat points east everywhere, so z hat never
    turns. Only r hat and theta hat turn as we go round, by the same rules we found today. So everything we''ve learned about turning arrows works in three
    dimensions too.'
