  visual: 'House globe (s21 look): from the Bay of Bengal view the globe turns east to Myanmar (S1), country names; S2-S3 zoom to the delta with the MODIS
    natural-colour picture of 21 Apr draped on it (the channels), labels Yangon, Pathein, ''Irrawaddy delta''; keyword ''mostly ≤ 5 m above the sea''. S4-S7:
    the IBTrACS track draws on with a date readout (25 Apr → 3 May): west, north, east; landfall ring 2 May at the SW corner; the 90 kt → 167 km/h → 46
