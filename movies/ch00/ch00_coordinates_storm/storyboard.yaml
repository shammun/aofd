  beat: recap ('To sum up'); last sentence the teaser to Part 3
  visual: 'One beat per sentence, mini pictures reused (no headings): the unit circle with Δθ along θ̂; the two slope graphs; the two turning
    rules with gold swing arrows; the three product-rule pieces; the ring with v/r, v θ̂ and the inward arrow; ''0.048 m/s² ≈ g/200''; the cylinder
    with u_r, u_θ, w, and the two radius-height sections (Ian, Amphan) with in-up-out arrows (small source lines under them); the coast with along/across
    bands and the surge sheet; a thumbnail of the s30 swipe (pending v3); a small globe for the Part 3 teaser. Each spoken number on screen at
    its words.'
  voiceover: 'To sum up, the tip of r hat moves along a circle of radius one, so for a small turn delta theta, it moves delta theta along theta
    hat. That gave us the slopes of cosine and sine: minus sine, and cosine. So d r hat by d theta is theta hat, and d theta hat by d theta is
    minus r hat: each arrow swings towards the other one. The product rule says that a number times an arrow changes through both of them. On
    a ring, the angle grows at v over r, the velocity is v theta hat, and the acceleration is minus v squared over r, times r hat: inward, even
    at a steady speed. For Ian''s ring, that''s about zero point zero four eight metres per second squared, about two hundred times smaller than
    gravity. Adding the height z gives cylindrical coordinates, and averaging round the rings shows a tropical cyclone''s in, up and out, in Ian
    and in Amphan alike. Wind blowing onto a coast piles up a storm surge. Tide gauges measured Ian''s, and satellites can map the floods a surge
    leaves behind. In Part 3, we''ll take these ideas to the biggest round shape of all: the Earth.'
