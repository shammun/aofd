  derivation:
    id: D15
    goal: 'how a number times an arrow changes when both change (owner: here)'
    steps:
    - - before and after
      - v\hat{\mathbf d}\ \to\ (v+\Delta v)(\hat{\mathbf d}+\Delta\hat{\mathbf d})
      - both the number and the arrow change
      - the product changes
    - - multiply out
      - v\hat{\mathbf d}+\Delta v\,\hat{\mathbf d}+v\,\Delta\hat{\mathbf d}+\Delta v\,\Delta\hat{\mathbf d}
      - distribute (each piece times each piece)
      - four pieces
    - - subtract the old product
      - \Delta(v\hat{\mathbf d})=\Delta v\,\hat{\mathbf d}+v\,\Delta\hat{\mathbf d}+\Delta v\,\Delta\hat{\mathbf d}
      - the change = after − before
      - three pieces of change (checked with numbers)
    - - the tiny piece
      - \Delta v\,\Delta\hat{\mathbf d}\propto(\Delta t)^2
      - halving Δt halves Δv and Δd̂, so their product quarters
      - it vanishes after ÷Δt as Δt → 0
    - - divide by Δt and shrink
      - \frac{d}{dt}(v\hat{\mathbf d})=\frac{dv}{dt}\hat{\mathbf d}+v\frac{d\hat{\mathbf d}}{dt}
      - the limit
      - the product rule
