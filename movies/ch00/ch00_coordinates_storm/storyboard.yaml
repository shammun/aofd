- 's17: the model''s calm centre is 17 km WSW of the radar eye and the model is weaker (960 vs 938 hPa); said, and the two centres are never drawn on one
  data picture.'
- 's18-s20: one centre (the model''s 10-m calm centre) for every level; the vortex tilt is ignored (research §1d: 500-hPa dipole); ring means at 100 km
  and the section average it out.'
- 's20: the rising air is computed and measured (2026-11-05): continuity of the HRRR f00 ring-mean inflow says ≈ 1 m/s, shown as the box estimate w = 2h|u_r|/r
  = 2 × 1000 × 16 / 30 000 ≈ 1 m/s (fix 0 B13; CHECK DS30 box 1.04 vs integral 1.04 m/s); the NOAA P-3 tail Doppler radar measured a ring-mean peak of 3.3
  m/s at 8.5 km (said ''about three … eight and a half kilometres up'') and single updraughts to 11.6 m/s (''single towers near ten''). The radar is ≈ 8
  h before the HRRR 18 UTC winds (source line only, not voiced). Sinking in the clear eye is not measured (no echoes): grey band in words only, no number.
  The HRRR analysis vertical velocity is not used (≈ 0 at hour 0). s24 keeps schematic in-up-out arrows (no measured w for Amphan).'
- 's20: the 10-m spin (34.8 m/s at 25 km) is weaker than the 850-hPa spin (55 m/s at 30 km): said as the sea slowing the air near the surface.'
- 's14 (fix 0 B1, 2026-11-05): in this northern-hemisphere cyclone the air goes round anticlockwise (seen from above), so the Coriolis push (to the right
  of the motion) points OUTWARD, about 1/20 of the turning; the inward push is the pressure force, which must be a little stronger than v²/r alone (0.048
  + 0.002 m/s²). Said and drawn outward; the violet arrow is drawn 6× longer (listed).'
- 's21: ''first super cyclonic storm in the Bay since 1999'' is IMD''s statement (cited in the manifest); intensity classes are left to U15.'
- 's23: ERA5 cannot resolve Amphan''s eye (0.25-deg boxes vs a pinhole eye); the ring is at ERA5''s strongest-spin radius (50 km), not the eyewall; ERA5
  is weaker than the official estimate, compared like with like (fix 0 B14): lowest pressure ERA5 967 vs official 956 hPa; the official 90 kt (≈ 46 m/s,
