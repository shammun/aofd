  beat: 'B1: back to Ian''s coast; Part 1''s turned axes recalled exactly (''derived in Part 1: turned axes''), the matrix form, then the same rule for
    the wind (along / across tags); x̂′ along the coast so ŷ′ points out to sea; sign meaning'
  visual: 'S0-S2 the HRRR 20 UTC speed map with the FMB wind and the along / across arrows; S3 on the Part 1 diagram (east / north axes, x̂′, ŷ′ at α =
    30°, gold α arc); S8-S9 a wind arrow and its two parts (slate along, teal across); S10-S11 a coast along x̂′ with sea / land and + / − across arrows.
    Column: x̂′, ŷ′, the matrix, x′ / y′ (Part 1''s exact lines), along / across.'
  voiceover: 'Now let''s come back down to the ground, to the landfall of Hurricane Ian, the storm we measured in Part 1, on the coast of Florida. On a
    coast, east and north are not the most useful directions. What matters is how much of the wind blows along the shore, and how much blows across it,
    onto the land or out to sea. To split a wind that way, we turn our axes to line up with the coast, just as we learned in Part 1. There, we turned the
    x axis by an angle alpha, measured anticlockwise from east, as seen from above. The new axis, x hat prime, is cosine alpha, sine alpha, and y hat prime,
    a quarter turn anticlockwise from it, is minus sine alpha, cosine alpha. And we derived the coordinates in the turned axes: x prime equals x cosine
    alpha plus y sine alpha, and y prime equals minus x sine alpha plus y cosine alpha. In matrix form, that''s one rotation matrix times the column x,
    y. A wind is an arrow too, so the same rule works for it, with x and y replaced by the wind''s east and north parts, u and v. So the wind''s part along
    the shore is u cosine alpha plus v sine alpha, and its part across the shore is minus u sine alpha plus v cosine alpha. We''ll point x hat prime along
    the coast, so that y hat prime points out to sea. Then a positive across-shore part blows out to sea, and a negative one blows onto the land. So everything
    hangs on one number: the coast''s angle, alpha.'
  on_screen_eq:
    latex: x'=x\cos\alpha+y\sin\alpha,\qquad y'=-x\sin\alpha+y\cos\alpha
    vallis_eq: Coordinates Part 1 (Kundu (K 2.8) rotated components)
