  visual: 'Three mini pictures built one per reason across the picture zone (no boxes): (1) a messy plan-view u_r layer (s18 925 hPa) folding
    round its axis into the s20 slice (''shape''); (2) the ring with v theta-hat and the inward rose arrow next to an east/north pair whose u,
    v both wiggle on two small sine-like curves (''physics''; the curves are the Part 1 ring curves, data_block.ian, reused small); (3) three
    arrows ''in'', ''round'', ''up'' on the cylinder (''meaning''). Keywords ''shape'', ''physics'', ''meaning'' in the maths zone on their words.'
  voiceover: 'So why do scientists who study tropical cyclones use cylindrical coordinates? There are three good reasons. The first is shape.
    A tropical cyclone is nearly round, so averaging round the rings turns a messy storm in three dimensions into one clear slice. The second
    is physics. With turning arrows, the inward acceleration, minus v squared over r, appears the moment we write the velocity down. With east
    and north arrows, the same acceleration hides inside changes of both parts. The third is meaning. The three parts, in, round and up, are exactly
    what we want to know: how fast the storm draws air in, how fast it spins, and where the air rises.'
  on_screen_eq:
    latex: \mathbf a=-\dfrac{v^2}{r}\,\hat{\mathbf r}
