  voiceover: 'So what does minus r hat mean in the picture? Let''s go back to the balloon, five kilometres from the station, and move it round
    its circle. At each place, draw theta hat at the balloon. Due east of the station, theta hat points north. A little further round, it leans
    to the west, towards the station''s side. Now slide those arrows so that their tails touch. Their tips swing round, and the small change from
    one arrow to the next points back towards the station. That''s minus r hat: from the balloon, back towards the centre of its circle. That''s
    what we mean when we say that theta hat''s tip moves towards the centre. [beat] Let''s check with numbers. At fifty three degrees, theta hat
