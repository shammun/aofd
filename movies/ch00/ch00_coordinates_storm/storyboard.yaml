  voiceover: 'Before we look inside Ian, let''s check where its eye really was, because different instruments see it differently. A weather radar
    on the coast near Tampa measures the rain round the storm. At six in the evening, its picture shows a ring of heavy rain, the eyewall, about
    thirty kilometres in radius, round an eye with almost no rain. This is the best picture of where the eye was. [beat] The weather model analysis
    that gives us Ian''s winds in three dimensions puts its own calm centre about seventeen kilometres west-south-west of the radar''s eye. And
    its lowest pressure is nine hundred and sixty hectopascals, while the official estimate is nine hundred and thirty eight. [beat] So the model
    is close, but a little off, and a little too weak. That''s normal: a model with grid points every three kilometres can''t hold the sharpest
    part of a storm exactly. So here''s our rule. For where the eye is, we use the radar and the satellite. For the winds, we use the model, measured
    round the model''s own centre. And we never mix the two centres in one picture.'
