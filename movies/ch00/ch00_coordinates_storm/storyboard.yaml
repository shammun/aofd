  voiceover: Now let's come back down to the ground, to Ian's landfall on the coast of Florida. On a coast, east and north are not the most useful directions.
    What matters is how much of the wind blows along the shore, and how much blows across it, onto the land or out to sea. At eight in the evening, universal
    time, about an hour after landfall, the model's wind at Fort Myers Beach was about thirty three metres per second, from the south-west. The coast there
    runs towards the north-north-west, so that wind blew almost straight onto the land. In Part 4, we'll turn our axes to line up with the coast, and measure
    exactly how much of it pushed straight onto the coast.
