  voiceover: 'Now let''s look inside Ian, layer by layer. Weather models store the wind on pressure levels: surfaces where the air pressure has one value,
    like nine hundred and twenty five hectopascals. Since the pressure drops as we go up, each level sits at a height, and we''ll write that height beside
    it. Here are five layers round Ian''s eye, from the model, at six in the evening. Each layer is a square about five hundred kilometres across. The lowest
    is at nine hundred and twenty five hectopascals, about seven hundred metres above the sea. We don''t use a lower level, because near the eye the pressure
    at the sea surface was below nine hundred and seventy five hectopascals, so that level would lie under the sea there. Then come eight hundred and fifty
    hectopascals, about one point four kilometres up, five hundred, about six kilometres, two hundred, about twelve kilometres, and one hundred and fifty,
    about fourteen kilometres. [beat] The colour on each layer is the radial wind, u sub r. Rose, with a minus sign, means that the air flows in, towards
    the eye. Blue, with a plus sign, means that it flows out. Pale means neither, and a dark line marks where the radial wind is exactly zero. We drew the
    layers evenly spaced, and much farther apart than they really are, so that we can read each one.'
