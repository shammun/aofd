  voiceover: The next few minutes build these rules step by step, for anyone who wants to see every move. You don't need them for the weather,
    the climate science or the maps later on, so if it feels like too much, jump to the time on the screen, and you'll get the main idea there.
    Let's start with r hat on its own. Why do we care how it changes? Because we write winds with r hat and theta hat, and when an air parcel
    goes round, these arrows turn under it. To find the parcel's acceleration, we'll need to know how fast they turn. So draw r hat from the origin.
    Its length is one, so its tip sits on a circle of radius one, called the unit circle. And the tip is exactly the point cosine theta, sine
    theta. Now turn theta by a small amount. We call this small turn delta theta, where delta just means a small change. The tip slides along
    the unit circle. How far? By the arc rule, the distance is the radius times the angle, and the radius is one. So the tip slides a distance
    of one times delta theta, which is just delta theta. [beat] For example, a turn of zero point one radians, about six degrees, slides the tip
    about zero point one along the circle. [beat] And which way does it slide? Sliding along a circle is at right angles to the radius, and theta
    grows anticlockwise. That's exactly the direction of theta hat, as we found in Part 1. So, for a small turn, the tip of r hat moves a distance
    delta theta, in the direction of theta hat.
