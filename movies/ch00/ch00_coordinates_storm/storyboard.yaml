    about three to four and a half metres. [beat] What did satellites see of Ian''s surge? Almost nothing. The surge peaked in the evening, under the storm''s
    clouds, and drained back to the sea within hours, so the pictures taken from space and from survey planes in the next days show the damage, not the
    surge itself. So the two gauge lines are the surge, measured. The wind along a coast matters too, because it can bring cold water up from below, which
