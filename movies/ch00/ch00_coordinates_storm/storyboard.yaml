  beat: 'intuition: a tall storm needs height; cylindrical coordinates; the eyewall (Must 1, 2 guards)'
  visual: '(GOES plate, in/up/out) + R11: the flat polar grid on the sea (S7), a point (r, θ) lifted by z (S8), the grid copies lifted to heights, ''polar
    + height = cylindrical'' (S9), x = r cos θ, y = r sin θ, z = z ''derived in Part 1: polar coordinates'' (S10), the cylinder (S11).'
  voiceover: 'So far, our storm has been flat. But a real tropical cyclone is tall. Near the sea, the air spirals in. Close to the eye, it rises in a ring
    of towering clouds called the eyewall. And near the top, about twelve to fifteen kilometres up, it flows out again. Here''s Ian from above, seen by a
    weather satellite at six in the evening, universal time. The clear hole in the middle is the eye, and the ring of bright cloud round it is the eyewall.
    On the flat map, polar coordinates use two numbers: the distance r and the angle theta. To describe a tall storm, we add a third number: the height z,
    measured straight up from the sea. Polar coordinates plus this height are called cylindrical coordinates: r, theta and z. Nothing else changes: r and
    theta mean exactly what they meant in Part 1, so x is still r cosine theta, y is still r sine theta, and z is simply the height. They''re called cylindrical
    because all the places at one distance r form a cylinder round the storm''s axis.'
  on_screen_eq:
