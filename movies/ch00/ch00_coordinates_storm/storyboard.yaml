    m/s scale). S7: anticlockwise arc + ''northern hemisphere'' keyword. S8: slate ''official estimate: 90 kt (3-min) ≈ 167 km/h''. S10-S11: a compact two-column
    comparison in the maths zone (no box): ''Ian · 25 km · HRRR'' | ''Amphan · 100 km · ERA5''; rows ''round 34.8 | 20.1'', ''in −13.3 | −6.0'', ''inflow
    angle ≈ 21° | ≈ 17°'' with the tan rows ''13.3/34.8 ≈ 0.38'', ''6.0/20.1 ≈ 0.30''. Source line under the map.'
  voiceover: 'Let''s measure Amphan''s winds the same way we did Ian''s. There''s no fine model like Ian''s over the Bay of Bengal, so we use a global data
    set called ERA5. It''s a reanalysis: a best estimate of past weather, made by blending observations with a weather model. Its grid boxes are about twenty
    eight kilometres wide, wider than Amphan''s eye, so it smooths the storm a lot. Here''s Amphan at six in the morning, universal time, on the twentieth
    of May, about four hours before landfall. We put the origin at ERA5''s own centre, and draw a ring fifty kilometres out, where ERA5''s spin is strongest.
    Ten metres above the sea, the tangential wind averages about twenty metres per second, and the radial wind about minus six. [beat] The air goes round
    anticlockwise as seen from above, just like Ian''s, because both storms are in the northern hemisphere. The official estimate at that hour, averaged
    over three minutes, was about ninety knots, which is about forty six metres per second, and a lowest pressure of nine hundred and fifty six hectopascals.
    ERA5''s lowest pressure is only about nine hundred and sixty seven, so the reanalysis storm is much too weak. [beat] But the shape is right. Six over
    twenty is zero point three, so Amphan''s inflow angle is about seventeen degrees, close to Ian''s twenty one. [beat] Two storms, in two different oceans,
    both spiral in at a similar angle.'
