    small share (≈ 1 cm per hPa; Ian 941 hPa at the 19:05 UTC landfall: 72 hPa → ≈ 72 cm); the prediction'
  visual: 'two schematic cross-sections (onto the land: surface tilts up to the coast; out to sea: tilts down), then the ETOPO shelf profile with a rising
    water band (×20), then a small map with ''?'' at the two stations.'
  voiceover: 'What does that do to the sea? Wind blowing onto the land drags the sea surface with it, and the water piles up against the coast. Wind blowing
    out to sea drags the water away from the coast, and the level drops. Where the water piles up, the sea rises far above the normal tide, and this rise
    is called a storm surge. The wind''s push does most of the work, especially over a wide, shallow sea floor like the one off southwest Florida. The low
    pressure helps a little: the sea rises by about one centimetre for every hectopascal that the pressure drops. We get that centimetre by dividing one hectopascal,
    a hundred pascals, by the sea water''s density, about one thousand and twenty five kilograms per cubic metre, times gravity, nine point eight one metres
    per second squared. When Ian came ashore, its centre''s pressure was about nine hundred and forty one hectopascals, against a normal one thousand and
    thirteen, so the sea under the eye rose by only about seventy two centimetres. So what should the water have done at our two stations?'
