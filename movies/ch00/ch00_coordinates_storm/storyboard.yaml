    dv/dt = 0'' strikes the first term; S5-S8 chain rule with underbraces ''−r̂ (s06)'' and ''v/r (s09)'', the s06 mini picture (theta-hat''s
    tip swinging to −r-hat) recalled beside it (U-CO-020); S9 result (96 px) ''a = −(v²/r) r̂''. Picture: on S10 an inward rose arrow at the parcel
    pointing at the centre (''−'' glyph), keyword ''centripetal: towards the centre'' on S11. S12-S14 units row with ''m'' struck once.'
  voiceover: 'Now we can answer the opening question. Acceleration is the rate of change of velocity. So we need the rate of change of v theta
    hat, which is a number times an arrow again. By the product rule, it''s d v by d t times theta hat, plus v times d theta hat by d t. [beat]
    The parcel goes round at a steady speed, so d v by d t is zero, and the first term drops out. [beat] For the second term, we use the chain
    rule again. D theta hat by d t equals d theta hat by d theta, times d theta by d t. Remember the turning arrows: d theta hat by d theta is
    minus r hat, because theta hat swings towards minus r hat. And d theta by d t is v over r. So d theta hat by d t is minus r hat, times v over
    r. [beat] Now multiply by v. The acceleration is minus v squared over r, times r hat. [beat] The minus sign means that it points along minus
    r hat: inward, towards the centre of the ring. An acceleration that points to the centre of a circle is called a centripetal acceleration.
    Let''s check the units. V squared is in metres squared per second squared. Dividing by r, in metres, leaves metres per second squared, which
    are the units of an acceleration. [beat]'
