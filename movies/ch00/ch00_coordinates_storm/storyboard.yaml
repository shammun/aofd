  voiceover: Satellites caught a cyclone's flood most clearly for Cyclone Nargis, in the same Bay of Bengal, in May two thousand and eight. Here's a before
    and after picture from NASA's MODIS instrument. It's in false colour. The satellite measures light that our eyes can't see, shortwave infrared and near
    infrared, and we paint them red and green, with ordinary red light painted blue. In these colours, plants look bright green, bare ground looks brown,
    clouds look white, and water looks dark blue or black. That makes water easy to spot. On the left is the twenty first of April, eleven days before landfall.
    On the right is the fifth of May, about three days after. [beat] As the line glides across, dark water spreads over land that was green before. [beat]
    Both pictures are pinned to the same latitudes and longitudes, so every pixel compares the same patch of ground. Even so, the picture shows what the surge
    left behind, not the surge itself. How to map floods from space has its own movie later in this series.
