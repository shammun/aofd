  voiceover: 'So what does minus r hat mean in the picture? Let''s go back to the balloon, five kilometres from the station, and move it round its circle.
    At each place, draw theta hat at the balloon. Due east of the station, theta hat points north. A little further round, it leans to the west, towards
    the station''s side. Now slide those arrows so that their tails touch. Their tips swing round, and the small change from one arrow to the next points
    back towards the station. That''s minus r hat: from the balloon, back towards the centre of its circle. That''s what we mean when we say that theta
    hat''s tip moves towards the centre. [beat] Let''s check with numbers. The rate of change of theta hat is its small change, divided by the small turn
    that caused it. For the small turn, let''s take delta theta equal to zero point zero one radians, which is about half a degree. At fifty three degrees,
    theta hat is minus zero point eight, zero point six. After a turn of zero point zero one radians, it''s minus zero point eight zero six, zero point
    five nine two. The change is minus zero point zero zero six, minus zero point zero zero eight. Now divide each number by delta theta, zero point zero
    one, and we get minus zero point six, minus zero point eight. [beat] Now put it next to r hat, which is zero point six, zero point eight. Every number
    has the same size, but the opposite sign, so the answer is minus r hat. [beat] We can also check it one part at a time with the new slopes. The slope
    of minus sine theta is minus cosine theta, and the slope of cosine theta is minus sine theta. Together, that''s minus cosine theta, minus sine theta:
    minus r hat again. [beat] So here''s the whole rule in words: turn the angle, and each arrow swings towards the other one. R hat swings towards theta
    hat, and theta hat swings towards minus r hat.'
