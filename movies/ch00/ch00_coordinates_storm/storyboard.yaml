    west. So the coast leans west of north, by an angle whose tangent is the opposite side, the west leg, over the adjacent side, the north leg. That''s about
    zero point six zero one, and the angle is about thirty one degrees. [beat] So the coast runs thirty one degrees west of north: measured clockwise from
    north, that''s a compass bearing of three hundred and twenty nine degrees. [beat] In Part 1, we found that a compass bearing is ninety degrees minus the
    maths angle, so the maths angle is ninety degrees minus the bearing. So alpha is ninety degrees minus the bearing, which comes out negative, and adding
    a full turn gives a hundred and twenty one degrees. [beat] The cosine of a hundred and twenty one degrees is about minus zero point five one five, and
    its sine is about zero point eight five seven. So x hat prime is about minus zero point five one five, zero point eight five seven: it points up the coast,
    towards the north-north-west. And y hat prime is about minus zero point eight five seven, minus zero point five one five: it points west-south-west, out
    into the Gulf of Mexico. [beat] That''s why we picked the north-north-west way along the coast, and not the south-south-east way: then y hat prime points
    out to sea.'
