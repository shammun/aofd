  beat: 'D19: steady speed, changing velocity; what supplies the push (pointers M03, R01)'
  visual: 'Left: two velocity arrows one minute apart on the ring (teal), the turn ''≈ 0.084 rad ≈ 5°'' as a gold wedge at the centre (drawn ×3 so it is
    visible, listed). S4-S5: both arrows lift off and slide tail to tail (one common tail beside the ring); the short difference arrow (rose) from tip to
    tip grows and points at the eye — a gold link from it to the eye. S6-S7: the two tips sit on a dashed circle of radius 34.8 (slate), the small arc between
    them labelled; CalcStack ''34.8 × 0.084 ≈ 2.9 m/s'' then ''2.9 ÷ 60 s ≈ 0.048 m/s²'' with a gold ''same as s13'' tick. S9-S11: the eye''s low pressure
    (a ring of three code-drawn isobars, ''L'' in the eye) and an orange pressure-force arrow at the parcel pointing in (term colour: pressure orange);
    a violet arrow for the Earth''s spin push pointing OUTWARD (northern hemisphere, anticlockwise: Coriolis to the right of the motion, a = −f ẑ × v θ̂
    = +f v r̂), with a head, 51 px = 6× its true 1/20 length, keyed in the column ''pressure force: inward'', ''Earth''s spin: ≈ 1/20, outward'', ''(violet
    arrow drawn 6× longer)''; S16 rows ''turning: 0.048 m/s² (inward)'', ''Earth''s spin: ≈ 0.0023 m/s² (outward)'', ''0.048/0.0023 ≈ 21'', ''pressure push
    ≈ 0.048 + 0.002 = 0.050 m/s²'' and the slate note ''Earth''s spin: worked out in the Coriolis movie'' (fix 0 B1, 2026-11-05). S12: keyword ''more: Wind
    on weather charts''; S13: keyword ''more: Circular motion''. The s01 gold question mark resolves to ''yes: it turns'' at S8.'
  voiceover: 'So how can a steady speed still mean an acceleration? The answer is that velocity is more than speed. Velocity is speed and direction together.
    Let''s see it with two velocity arrows, one minute apart. In one minute, theta grows by zero point zero zero one three nine times sixty, which is about
    zero point zero eight four radians, or about five degrees. [beat] Both arrows are thirty four point eight metres per second long, but they point in
    slightly different directions. Now slide them so that their tails touch. The short arrow from the first tip to the second is the change in velocity.
    It points towards the eye. [beat] How long is it? Its two ends lie on a circle of radius thirty four point eight, a small turn apart. So by the arc
    rule, it''s about thirty four point eight times zero point zero eight four, which is about two point nine metres per second. [beat] Divide by sixty
    seconds, and we get about zero point zero four eight metres per second squared: the same acceleration, found with no formula at all. [beat] So a steady
    speed means no acceleration only when the direction stays the same too. Something must push the parcel inward all the time. In a tropical cyclone, that
    push is the pressure force, because the pressure is lowest in the eye. The Earth''s spin pushes the other way, a little outward, about twenty times
    weaker, so the pressure force has to be a little stronger than the turning alone needs. How winds balance these pushes has its own movie later in this
    series: Wind on weather charts. And if you rode with the parcel, you''d feel this as a push outward, called the centrifugal force, which also has its
    own movie: Circular motion.'
