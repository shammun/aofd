  visual: 'Cross-fade from the stack: a vertical slice through the stack''s axis rotates to face the camera and becomes the 2-D radius-height section (picture
    zone x 80-1000, y 80-800): x = radius 0-200 km (linear, ticks 0, 50, 100, 150, 200 km), y = height 0-16 km (ticks 0, 4, 8, 12, 16 km), filled colours
    = ring-mean u_r from all nine HRRR levels (975 masked where below ground), the stack''s diverging map and zero contour, the SAME colour bar in the column;
    dark contour lines of ring-mean u_theta every 10 m/s with labels on the lines (no label over another). S1-S3: an animated ring at one height shrinks
    to a single point on the slice (''average round the ring → one point (r, z)''), Layered TeX of the average in the column. S7-S8: the inflow core marked
    with a gold dot ''≈ −16 m/s, 30 km, 0.7 km up'' (SideCallout); S9: the outflow region ''≈ +9 m/s'' at 150 km, 15 km up; S10-S11: the u_theta maximum
    marked ''≈ 55 m/s, 30 km, 1.4 km up''. S12: the 10-m ring mean 34.8 at 25 km as a small teal tick at the bottom edge (weaker at the sea surface). S12
    (rewritten 2026-11-05, measured rising air): at its start, keyword ''the inflow says: rise ≈ 1 m/s'' (gold) and a dashed gold up-arrow at r ≈ 22 km
    on the HRRR section (the continuity w that the ring-mean inflow implies, DS30); on ''radar'' the axes zoom to r 0-100 km, z 0-14 km and the radar''s
    ring-mean w panel cross-fades in (cmocean dense, 0 … +4 m/s, ≤ 0 drawn as 0, its own colour bar ''rising air''), the eye 0-22 km a grey band ''no echoes''
    (no number for sinking); gold upward arrows with animated dashes along the outward-leaning updraught (through the measured strong-ascent radii 33 /
    44 / 45 / 55 km at 2 / 5 / 8 / 11 km, thickness ∝ w) replace the old ''must rise'' arrow; on ''about three'' a gold dot at the ring-mean peak (45 km,
    8.5 km) with the readout ''≈ 3.3 m/s, 8.5 km up''; on ''single towers'' the line ''single towers ≈ 10-12 m/s'' (text only). Source line switches to
    the radar + HRRR line with the caption ''≈ 8 h earlier than the model winds''. S13: ''rises in the eyewall, leaning outward''. S14: schematic in (bottom)
    and out (top) gold arrows on the w panel with the measured up arrows. S15: keyword ''more: How tropical cyclones form''.'
  voiceover: 'Five layers still leave gaps, and cylindrical coordinates give us a neater picture. On every level, we can average round each ring, just as
    we averaged round one ring in Part 1. An average round a ring depends only on the distance r and the height z, because going all the way round removes
    theta. [beat] So we can draw the whole storm on one slice, with the distance from the centre along the bottom, and the height going up. This picture
    is called a radius-height section. Each colour is a ring average of the radial wind, now from all nine levels of the model. Near the sea, there''s a
    thin layer of strong inflow. Its strongest ring average is about minus sixteen metres per second, thirty kilometres from the centre, about seven hundred
    metres up. [beat] Near the top, from about twelve kilometres up, the air flows out, at up to about plus nine metres per second. [beat] The dark lines
    show the tangential wind. Its strongest ring average is about fifty five metres per second, also thirty kilometres from the centre, about one point
    four kilometres up. [beat] It''s weaker right at the sea surface, where the sea slows the air, and it gets weaker higher up. Here''s a quick check.
    Air flows in through the side of a cylinder thirty kilometres in radius, in a layer about one kilometre deep, at about sixteen metres per second. All
    of it has to leave through the cylinder''s lid, which is a much bigger area, so it rises more slowly: two times one thousand times sixteen, divided
    by thirty thousand, is about one metre per second. [beat] And radar on a hurricane-hunter aircraft measured it: about three metres per second, eight
    and a half kilometres up, with single towers near ten. [beat] It rises in the eyewall, close to the eye. In, up and out: that''s a tropical cyclone''s
    overturning circulation, and cylindrical coordinates show it in one picture. How a tropical cyclone keeps this engine running has its own movie later
