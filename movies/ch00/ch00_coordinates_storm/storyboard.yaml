    S5-S6: after the turn, the legs change: the east leg shrinks by a rose sliver labelled ''≈ −sin θ Δθ'', the north leg grows by a teal sliver ''≈ cos
    θ Δθ'', each with a gold link to its sliver. Maths zone: the slope definition from the derivatives movie (S2: ''slope = change ÷ change, as both shrink''),
    then the two rules (S8-S9, Layered TeX with gold underbraces ''slope of cos θ'', ''slope of sin θ''). S10: a small arrow at the tip pointing west, keyword
    ''east part shrinks''. S11-S16: the numeric check as a CalcStack at the balloon''s angle, inputs row ''θ ≈ 53°, cos θ = 0.6, sin θ = 0.8, Δθ = 0.01
    rad'' first; each result on its words. Right side x 1420-1840 under the CalcStack: two small graphs of cos θ and sin θ (0-360 deg) with the tangent
    line at 53 deg drawn on each and its slope ''−0.8'' / ''0.6'' (orange solid / dashed, end labels).'
  voiceover: 'This little picture gives us something that no earlier movie in this series has shown: how fast cosine and sine change. In the derivatives
    movie, we met the slope, or derivative: the small change in a quantity, divided by the small change that caused it, as both shrink towards zero. The
    tip''s east part is cosine theta, and its north part is sine theta. The tip moved delta theta along theta hat, which is minus sine theta, cosine theta.
    So its east part changes by about minus sine theta times delta theta. And its north part changes by about cosine theta times delta theta. [beat] Now
    divide both changes by delta theta, and let delta theta shrink towards zero. The slope of cosine theta is minus sine theta. And the slope of sine theta
    is cosine theta. [beat] The minus sign makes sense: turning anticlockwise from east, the tip moves towards the west, so its east part shrinks. Let''s
    check with numbers, at the balloon''s angle from Part 1, about fifty three degrees, where the cosine is zero point six and the sine is zero point eight.
    Turn by zero point zero one radians, about half a degree, to fifty three point seven degrees. The cosine drops from zero point six zero zero to zero
    point five nine two, a change of minus zero point zero zero eight. Divided by zero point zero one, that''s minus zero point eight: minus the sine. [beat]
    The sine grows from zero point eight zero zero to zero point eight zero six, a change of zero point zero zero six. Divided by zero point zero one, that''s
    zero point six: the cosine. [beat] So the rule works. These two slopes will come back again and again in this series.'
