conventions:
  polar angle: theta from east, anticlockwise as seen from above; compass bearing from north, clockwise as seen from above; wind direction = 'from'
  spoken symbols: '''r hat'', ''theta hat'', ''delta theta'', ''d r hat by d theta'', ''d theta by d t'', ''v squared over r'', ''u sub r'', ''u sub theta'',
    ''w'', ''z hat'', ''x hat prime''; never a lone ''a'''
  hemisphere: 'Ian and Amphan are northern hemisphere: cyclonic = anticlockwise seen from above'
  radial sign: u_r < 0 inflow (towards the centre), > 0 outflow
  centres: radar/satellite pictures use the radar eye (26.552 N, 82.278 W); every wind number uses the model's own calm centre (HRRR 10-m wind minimum 26.506
    N, 82.441 W); never both on one data picture (research §1c)
colour_contract: 'unit vectors orange (r-hat, theta-hat, z-hat, x-hat'', y-hat''); the measured arrow (position, velocity, wind) teal with moving dashes
  when it is a wind; inward acceleration and inflow rose with a ''−'' glyph; u_r field: diverging rose (−) ↔ pale ↔ blue (+), symmetric, bold dark zero
  contour, no hatch; u_theta contours dark; tangential dashes on the stack warm white; pressure-force arrow orange, Earth''s-spin push violet (term colours);
  gold for pointers, links, wedges and ''same'' ticks; slate for the ''books write'' form and the easy-number rows.'
