  voiceover: 'Now theta hat. How does theta hat change when theta grows? Let''s take this slowly, one step at a time, and assume nothing. Step
    one. Theta hat is also an arrow of length one. So let''s draw it from the origin too, from the same starting point as r hat. Its tip sits
    on the same unit circle. Step two. Theta hat is always r hat turned by ninety degrees. So its tip sits on the circle a quarter turn ahead
    of r hat''s tip. Step three. Now turn theta by delta theta. R hat turns by delta theta, and theta hat, which always stays a quarter turn ahead,
    turns by the same delta theta. So its tip also slides a distance delta theta along the unit circle. Step four. Which way does it slide? The
    same rule as before: a tip sliding anticlockwise along the circle moves along its own arrow, turned by ninety degrees. So theta hat''s tip
    moves along theta hat, turned by ninety degrees. [beat] Step five. Let''s turn theta hat with Part 1''s rule: swap the two numbers, and put
    a minus on the first. Theta hat is minus sine theta, cosine theta. Swapping gives cosine theta, minus sine theta. And a minus on the first
    gives minus cosine theta, minus sine theta. [beat] That''s exactly minus r hat: the arrow r hat, flipped to point the other way. [beat] So,
    for a small turn, theta hat changes by about minus r hat times delta theta. And its rate of change with theta, d theta hat by d theta, is
    minus r hat.'
