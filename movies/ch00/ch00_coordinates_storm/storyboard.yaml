  visual: 'Swipe as captests/A5_before_after/swipe_offline_capture.mp4: a wide false-colour pair in one frame, the gold vertical line GLIDING across at
    one eased rate (hold BEFORE 1.2 s → glide 3.2 s → pause → back to 62 % → settle 50 %), ''before · <date>'' / ''after · <date>'' tags at the top of each
    half (each dims while its side is hidden), haloed 44-px place names, scale bar + north arrow, NO inundation overlay, same sensor and one fixed stretch
    on both dates. MODIS Terra 7-2-1, 21 Apr vs 5 May 2008, Irrawaddy delta 94.15-96.45 E, 15.7-17.1 N (S0: the Nargis bridge, keyword ''Cyclone Nargis
    · Myanmar · 2008''). S3-S4: three-row band legend under the image (''shortwave infrared → red'', ''near infrared → green'', ''red light → blue''); S5:
    colour key swatches ''plants · bare ground · clouds · water''. S6-S7: the date tags on their words. S8: the line glides; dark water over the delta.
    S10: keyword ''what the surge left, not the surge'' (slate). S11: keyword ''more: Floods from space''. Source line under the image. [REWORKED user notes
    2026-11-06 item 8: natural colour (MODIS 1-4-3, same granules, box, pinning) first with its own swipe; then 7-2-1 with the reason; the key swatches
    sampled from the picture (dry fields pink).]'
  voiceover: 'First, here''s the delta in natural colour, the way our eyes would see it from space. On the left is the twenty first of April, eleven days
    before landfall. On the right is the fifth of May, about three days after. [beat] As the line glides across, look for the flood. In natural colour,
    it''s hard to see: muddy floodwater and wet soil both look brown. So flood mappers use false colour. The satellite measures light that our eyes can''t
    see, shortwave infrared and near infrared, and we paint them red and green, with ordinary red light painted blue. In these colours, plants look bright
    green, dry fields and bare ground look pink, clouds look white, and water looks dark blue or black. Water soaks up both kinds of infrared light, so
    it stays dark, even when it''s muddy. That makes water easy to spot. Here are the same two days in false colour. As the line glides across, dark water
    spreads over land that was pink and green before. [beat] Both pictures are pinned to the same latitudes and longitudes, so every pixel compares the
    same patch of ground. Even so, the picture shows what the surge left behind, not the surge itself.'
