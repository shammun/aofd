  beat: the wind's three parts; only r-hat and theta-hat turn
  visual: 'Same 3-D view, camera holds. S1-S4: at one point on the cylinder wall, three component arrows grow on their words: u_r (rose, pointing in, ''−''),
    u_theta (teal, along the ring), w (slate, up) with KaTeX TipLabels (Must 2); the unit arrows r-hat, theta-hat, z-hat (orange) beside them. S5: the equation
    (84 px) in the column. S6: z-hat copies at three points round the cylinder, identical (gold ''same'' ticks); S7: r-hat and theta-hat at the same three
    points visibly turned (gold ''turn'' arcs); keyword ''only r̂, θ̂ turn''.'
  voiceover: 'In cylindrical coordinates, the wind has three parts. The radial wind, u sub r, points along r hat: in or out. The tangential wind, u sub
    theta, points along theta hat: round the eye. And the vertical wind, w, points along z hat: up or down. Written as one arrow, the wind is u sub r times
    r hat, plus u sub theta times theta hat, plus w times z hat. Z hat points straight up everywhere, just like x hat points east everywhere, so z hat never
    turns. Only r hat and theta hat turn as we go round, by the same rules we found today. So everything we''ve learned about turning arrows works in three
    dimensions too.'
  on_screen_eq:
    latex: \mathbf u=u_r\,\hat{\mathbf r}+u_\theta\,\hat{\boldsymbol\theta}+w\,\hat{\mathbf z}
    vallis_eq: 'none in Vallis; Kundu App. B §B.5 (cylindrical coordinates, printed p. 865, page image read 2026-11-05): e_R = e_x cos φ + e_y sin φ, e_φ
      = −e_x sin φ + e_y cos φ, ∂e_R/∂φ = e_φ, ∂e_φ/∂φ = −e_R; Kundu''s (R, φ, z) = our (r, θ, z)'
    page_png: _private/Kundu_AppendixB_Mathematical_Tools.pdf page 9 (printed p. 865)
