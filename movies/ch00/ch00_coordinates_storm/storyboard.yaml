    in three dimensions puts its own calm centre about seventeen kilometres west-south-west of the radar''s eye. And its lowest pressure is nine hundred
    and sixty hectopascals, while the official estimate is nine hundred and thirty eight. [beat] So the model is close, but a little off, and a little too
    weak. That''s normal: a model with grid points every three kilometres can''t hold the sharpest part of a storm exactly. So here''s our rule. For where
    the eye is, we use the radar and the satellite. For the winds, we use the model, measured round the model''s own centre.'
