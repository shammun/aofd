    with √125 ≈ 11.2 km. Source line under the picture.'
  voiceover: So what did satellites see of Amphan's flood? For days after landfall, thick clouds covered the ground, so ordinary pictures from space can't
    show it. And the flooded patches are small, so the coarse pixels of those pictures, two hundred and fifty metres wide, blur them into the land around
    them. But radar sees through clouds. The Sentinel-1 radar satellite sends out microwaves and measures how much of them bounces back. Calm water reflects
    the microwaves away, like a mirror, so in a radar picture, water looks dark. Here's the coast near Satkhira and the Sundarbans on the sixteenth of May,
    before Amphan, and on the twenty second, two and a half days after landfall. [beat] As the line moves across, new dark patches appear where the fields
    were dry before. The radar finds about a hundred and twenty five square kilometres of new water in this picture. [beat] That's about the size of a square
    eleven kilometres on each side. [beat]
