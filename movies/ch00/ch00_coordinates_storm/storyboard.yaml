  voiceover: 'So far, our storm has been flat. But a real tropical cyclone is tall. Near the sea, the air spirals in. Close to the eye, it rises
    in a ring of towering clouds called the eyewall. And near the top, about twelve to fifteen kilometres up, it flows out again. Here''s Ian
    from above, seen by a weather satellite at six in the evening, universal time. The clear hole in the middle is the eye, and the ring of bright
    cloud round it is the eyewall. To describe a tall, round storm, we add a third coordinate to polar coordinates: the height, z, measured straight
    up. The distance r, the angle theta and the height z are called cylindrical coordinates. That''s because all the places at one distance r
    form a cylinder round the storm''s axis.'
