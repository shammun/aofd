id: ch00_coordinates_storm
title: 'Coordinates, Part 2 — Inside a tropical cyclone: turning arrows and cylindrical coordinates'
title_card:
  line1: Coordinates · Part 2
  line2: Inside a tropical cyclone
  subtitle: turning arrows and cylindrical coordinates
  spoken: short (s00 sentence only)
version: 1
concepts:
- 'how r-hat changes: its tip slides delta-theta along theta-hat on the unit circle (Kundu App. B §B.5)'
- 'the slopes of cosine and sine (owned here): d cos/d theta = -sin, d sin/d theta = cos'
- d r-hat/d theta = theta-hat and d theta-hat/d theta = -r-hat, from scratch (Kundu App. B §B.5)
- the product rule for a number times an arrow (owned here)
- d theta/dt = v/r from the arc rule; velocity = rate of change of position, r r-hat -> v theta-hat
- centripetal acceleration -(v^2/r) r-hat; a steady speed with a turning direction is an acceleration
- cylindrical coordinates (r, theta, z); u = u_r r-hat + u_theta theta-hat + w z-hat; only r-hat, theta-hat turn
- 'application: Hurricane Ian in 3-D (radar eye vs model centre; HRRR layer stack; the ring-average radius-height section: in, up, out)'
- 'the general term tropical cyclone (hurricane, cyclone = regional names); two storms with two roles: Ian (detailed 3-D winds, coast, surge)
  and Amphan (another ocean, same picture; floods)'
- 'application: Cyclone Amphan (Bay of Bengal, 2020): eye, ERA5 ring means, inflow angle, section'
- the wind onshore at a coast (numbers in Part 4); storm surge and its sign flip; tide gauges as the record of Ian's surge
- 'before/after imagery: Ian (Sentinel-2, aerial) and Amphan (Sentinel-1 new water, 147 km2)'
