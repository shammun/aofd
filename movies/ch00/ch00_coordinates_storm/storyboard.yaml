  voiceover: 'So why do scientists who study tropical cyclones use cylindrical coordinates? There are three good reasons. The first is shape. A tropical
    cyclone is nearly round, so averaging round the rings turns a messy storm in three dimensions into one clear slice. The second is physics. With turning
    arrows, the inward acceleration, minus v squared over r, appears the moment we write the velocity down. With east and north arrows, the same acceleration
    hides inside changes of both parts. The third is meaning. The three parts, in, round and up, are exactly what we want to know: how fast the storm draws
    air in, how fast it spins, and where the air rises.'
