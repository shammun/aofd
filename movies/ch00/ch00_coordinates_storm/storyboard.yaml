  beat: 'R14/R14b: Nargis''s across-shore wind from ERA5 at 2008-05-02T11:00 UTC, before its before/after: delta coast S of Bogale 15.778 N 95.174 E; coast
    69.5 km W, 10.8 km N, 9°, 279°, α 171°; u 9.6, v 16.5 → across ≈ −1.5 − 16.3 ≈ −17.8; IMD 962 hPa → ≈ 51 cm; ERA5 ≈ 0.55'
  visual: ERA5 10-m speed map (cmocean speed 0-30 m/s, bar in the column) with animated ERA5 arrows, Natural Earth coast, the ERA5 centre, the coast segment
    and its km legs, the point with x̂′ / ŷ′, the wind and its across-shore arrow (rose); CalcStacks for the angle and the across part; the inverse-barometer
    row.
  voiceover: 'We use ERA5 again, at eleven in the morning, universal time, on the second of May, around the time of landfall. Again, ERA5''s storm is too
    weak, at only about half of the official wind, so we use it for the direction. Our point is on the delta''s coast, south of the town of Bogale. Going
    west along the coast there, we move about sixty nine point five kilometres west and ten point eight kilometres north. The north leg over the west leg
    gives the tangent, so the coast runs about nine degrees north of west. Measured clockwise from north, that''s a bearing of two hundred and seventy nine
    degrees. So alpha, ninety degrees minus the bearing, plus a full turn, is about a hundred and seventy one degrees, with a cosine of about minus zero point
    nine eight eight and a sine of about zero point one five six. Then y hat prime points south, out to sea. ERA5''s wind there was about nineteen metres
    per second, from the south-south-west: u about plus nine point six, and v about plus sixteen point five. Across the shore, we take minus u sine alpha,
    and v cosine alpha, and add them. Together, that''s about minus seventeen point eight metres per second: onto the land. [beat] At the white circle, ERA5''s
    lowest pressure is about nine hundred and eighty two hectopascals, but its storm is too weak, so we take the official value. The official centre pressure
    at that hour was about nine hundred and sixty two hectopascals, so the sea under the eye rose about fifty one centimetres. So Nargis drove the sea onto
    the delta, where most of the land lies only a few metres above it. There''s no tide-gauge record of the water there in our data, so next come the pictures
    from space. Let''s zoom in, to see the delta before and after the storm.'
