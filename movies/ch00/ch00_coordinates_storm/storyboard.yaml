    the globe.'
  voiceover: 'The clearest flood pictures from space of any cyclone in the Bay of Bengal come from Cyclone Nargis, in May two thousand and eight. Let''s
    go to Myanmar, on the eastern side of the Bay. Here, the Irrawaddy River, which Myanmar calls the Ayeyarwady, fans out into many channels before it
    reaches the sea. This is the Irrawaddy delta: a huge, flat plain of rice fields, most of it only a few metres above the sea. Nargis formed in the south
    of the Bay in late April. It moved west, then north, then turned east, straight towards the delta. On the second of May, it came ashore at the delta''s
    south-western corner, with winds of about ninety knots, about forty six metres per second, averaged over three minutes. [beat] Then it crossed the whole
    delta, eastward, towards Yangon, the country''s largest city. Here''s Nargis that day, seen by a NASA satellite a few hours before landfall, with its
    eye just off the coast. Its storm surge and heavy rain flooded the low delta, far inland. Let''s zoom in, to see the delta before and after the storm.'
