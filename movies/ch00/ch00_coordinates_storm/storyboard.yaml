  visual: '(unchanged) + ''derived in Part 1: ring average'' under the ring-average equation.'
  voiceover: 'Five layers still leave gaps, and cylindrical coordinates give us a neater picture. On every level, we can average round each ring, just as
    we averaged round one ring in Part 1. An average round a ring depends only on the distance r and the height z, because going all the way round removes
    theta. [beat] So we can draw the whole storm on one slice, with the distance from the centre along the bottom, and the height going up. This picture is
    called a radius-height section. Each colour is a ring average of the radial wind, now from all nine levels of the model. Near the sea, there''s a thin
    layer of strong inflow. Its strongest ring average is about minus sixteen metres per second, thirty kilometres from the centre, about seven hundred metres
    up. [beat] Near the top, from about twelve kilometres up, the air flows out, at up to about plus nine metres per second. [beat] The dark lines show the
    tangential wind. Its strongest ring average is about fifty five metres per second, also thirty kilometres from the centre, about one point four kilometres
    up. [beat] It''s weaker right at the sea surface, where the sea slows the air, and it gets weaker higher up. Here''s a quick check. Air flows in through
    the side of a cylinder thirty kilometres in radius, in a layer about one kilometre deep, at about sixteen metres per second. All of it has to leave through
    the cylinder''s lid, which is a much bigger area, so it rises more slowly: twice the depth times the inflow speed, divided by the radius, is about one
    metre per second. [beat] And radar on a hurricane-hunter aircraft measured it: about three metres per second, eight and a half kilometres up, with single
    towers near twelve. [beat] It rises in the eyewall, close to the eye. In, up and out: that''s a tropical cyclone''s overturning circulation, and cylindrical
    coordinates show it in one picture. How a tropical cyclone keeps this engine running has its own movie later in this series: How tropical cyclones form.'
