    sea-level sheet in a small three.js side-section inset beside the map (×50 vertical, listed) rises; keyword ''storm surge''. S3: a shallow
    sea-floor profile under the sheet from ETOPO 2022 along a line WSW from Fort Myers Beach (''wide, shallow shelf''). S4: keyword ''≈ 1 cm per
    hPa'' (slate). S5: ''NHC: 10-15 ft above ground ≈ 3-4.5 m'' (slate, ''above the ground'', Should 11). S6: the Fort Myers (upriver) tide-gauge
    curve (residual above predicted tide) draws itself to ''≈ +2.2 m''. S7: the camera pans north to Tampa Bay; the coast line ''runs almost due
    north'' and the wind arrow there pointing out to sea (keyword ''out to sea''). S8: the Saint Petersburg gauge curve drops to ''≈ −1.8 m''
    (Should 11 labels kept). S9: two small arrows side by side ''onto the land'' (rose) and ''out to sea'' (blue) with a gold ''surge flips''
    bracket. S11-S12: keywords ''more: Friction and Ekman layers'' and ''more: Storm surge''. Sound: water draining, −30 LUFS, under S8 only.'
  voiceover: 'That onshore push piles sea water up against the coast. The sea rises far above the normal tide, and this rise is called a storm surge. The
    wind''s push does most of the work, especially over a wide, shallow sea floor like the one off southwest Florida. The low pressure helps a little: the
    sea rises by about one centimetre for every hectopascal that the pressure drops, and Ian''s centre was about seventy five hectopascals below normal, so
    that''s only about seventy five centimetres. [beat] At Fort Myers Beach, the official report found water ten to fifteen feet above the ground: about three
    to four and a half metres. [beat] A tide gauge up the river, at Fort Myers, measured the water about two point two metres above the normal tide. [beat]
    Now go about a hundred and sixty kilometres north, to Tampa Bay, on the other side of the storm''s spin. There, the coast runs almost due north, and the
    wind blew out to sea. So the water was pushed away, and the gauge at Saint Petersburg read about one point eight metres below the normal tide. [beat]
    Same storm, opposite sides of the eye: onto the land on one side, out to sea on the other, and the surge flips with it. The wind along a coast matters
    too, because it can bring cold water up from below, which is a story for the movie on Friction and Ekman layers. And the full story of storm surge has
    its own movie later in this series.'
