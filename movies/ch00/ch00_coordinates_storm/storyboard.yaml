  visual: 'S0 = block B1 takeaway: keyword ''what to keep: r̂ → θ̂, θ̂ → −r̂'' (gold swing arrows on a mini circle). MATHS-SKIP CHIP (block B2) on S1-S2:
    ''every step · skip to 19:49''. Left x 80-1000: a grid (1 m/s per 60 px). S8: the arrow 10 (1, 0) (teal) from the origin. S9-S10: the direction arrow
    turns 0.1 rad (orange unit arrow, gold wedge ''0.1 rad'') and the speed grows to 11: the product 11 (0.995, 0.1) drawn (teal), the old one faded to
    40 %. S11: the change arrow (gold) from tip to tip, ''(0.945, 1.1)''. S12-S15: the change is split into three arrows laid tip to tail along the gold
    arrow, each in its own colour and built on its words: Δv d̂ (slate), v Δd̂ (orange), Δv Δd̂ (rose, tiny); a gold ''sum'' tick at the end. S16: a rectangle-free
    ''halve the step'' animation: the three pieces redrawn for Δt = 1 s, 0.5 s, 0.25 s side by side — the first two halve, the third quarters (bars with
    numbers under them). Maths zone: inputs row first; CalcStack rows on their words; S18: the rule (96 px) with gold underbraces ''number''s rate × arrow'',
    ''number × arrow''s rate''.'
  voiceover: 'If you skipped, here''s what to keep: as the angle grows, r hat swings towards theta hat, and theta hat swings towards minus r hat, back towards
    the centre. Next comes one more stretch with every step, from a new tool all the way to the acceleration. If you''d rather, jump to the time on the
    screen. Before we use these rules on a moving air parcel, we need one more tool, which no earlier movie in this series has shown. It''s called the product
    rule. Here''s the question it answers: how does a number times an arrow change, when both the number and the arrow change? Let''s try easy numbers first.
    Take a speed of ten metres per second, along an arrow pointing east, one, zero, which we''ll call d hat. Their product is the arrow ten, zero. [beat]
    One second later, the speed has grown to eleven. And the arrow has turned by zero point one radians, to about zero point nine nine five, zero point
    one. The product is now eleven times that, which is ten point nine four five, one point one. So the product changed by zero point nine four five, one
    point one. [beat] Where does that change come from? There are three pieces. First, the change in the number, times the old arrow: one times one, zero,
    which is one, zero. Second, the old number times the change in the arrow, which went from one, zero to zero point nine nine five, zero point one, a
    change of minus zero point zero zero five, zero point one: ten times that is minus zero point zero five, one. Third, the two changes multiplied together:
    one times minus zero point zero zero five, zero point one, which is minus zero point zero zero five, zero point one. [beat] Add the three pieces, and
    we get zero point nine four five, one point one: the whole change. [beat] Now the key step. The third piece is a small change times a small change.
    If we halve the time step, the first two pieces halve, but the third one shrinks to a quarter. Divide each piece by the time step: the first two stay
    at about one, but the third goes from zero point one to zero point zero five to zero point zero two five, so as the time step shrinks, the third piece
    vanishes. What''s left is the product rule. The rate of change of a number times an arrow is the number''s rate times the arrow, plus the number times
    the arrow''s rate. [beat]'
