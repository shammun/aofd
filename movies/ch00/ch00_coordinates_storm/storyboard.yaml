    else a dashed circle round the two cities, said). End: the camera zooms back out to the start view (zoom-tour rule). Source line under the
    globe.'
  voiceover: Now let's meet our second storm, on the other side of the world, in the Bay of Bengal, between India and Myanmar, with Bangladesh at its northern
    end. Remember, here a tropical cyclone is simply called a cyclone. In May twenty twenty, Cyclone Amphan formed in the south of the Bay. On the eighteenth
    of May, it became a super cyclonic storm, the strongest class there, and the first in the Bay of Bengal since nineteen ninety nine. On the twentieth,
    it came ashore in the Sundarbans, the huge mangrove forest on the border between India's state of West Bengal and Bangladesh. Its centre then passed close
    to Kolkata, about forty five kilometres west of Satkhira, and about seventy nine kilometres west of Khulna. So the Khulna and Satkhira districts of Bangladesh
    took much of its flooding.
