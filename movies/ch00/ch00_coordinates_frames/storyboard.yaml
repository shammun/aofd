    ''north'', ''up''; a faint ''Part 1: bold u'' tag crossed to ''bold v'' on S7. S11: ''i-hat × j-hat = k-hat'' with a right-hand glyph. S12-S13: a gravity arrow
    (brown, ''−k-hat'') and a wind-vane icon reading ''from north''.'
  voiceover: Now let's stand at a weather station at Brest. Brest sits at the western tip of Brittany, in France, with the Atlantic Ocean on three sides.
    A forecaster there doesn't use axes from the Earth's centre. She uses three arrows of length one, fixed to her own spot. I hat points east, j hat points
    north, and k hat points straight up, away from the Earth's centre. This is called the local east, north, up frame. In Part 1, we called the wind arrow
    bold u. With three parts, it's usual to call it bold v, and to keep small u, v and w for its parts. So the wind is u times i hat, plus v times j hat,
    plus w times k hat. Here, u is the eastward wind, v the northward wind, and w the upward wind. And i hat cross j hat is k hat, so the frame is right-handed,
    as in the cross product movie. Why these arrows? Gravity pulls along minus k hat, the ground lies along i hat and j hat, and wind directions are measured
    from north. So every weather report uses this frame.
