id: ch00_coordinates_frames
title: 'Coordinates, Part 4 — Moving frames: local axes and storm-relative winds'
title_card:
  line1: Coordinates · Part 4
  line2: Moving frames
  subtitle: local axes and storm-relative winds
version: 1
concepts:
- the local east-north-up frame (i-hat, j-hat, k-hat) and v = u i + v j + w k (Vallis (2.29))
- i-hat, j-hat, k-hat in the Earth's fixed axes, derived with Part 1's 90-deg rule in the top view and the meridian slice (Fig. 2.3 geometry)
- 'every place has its own frame: angles between local ups (Brest, Trappes, Singapore, Khulna)'
- 'a local frame turned on purpose: the coast frame; the coast bearing 329 deg from two coastline points (Part 3''s km); along/across components'
- 'how the local arrows turn as a parcel moves: Di/Dt, Dj/Dt, Dk/Dt from Part 2''s turning rules (Vallis (2.39a)-(2.39c), r = a)'
- 'Dv/Dt in spherical coordinates: product rule, the eastward part, metric terms (Vallis (2.44a), (2.45))'
- Galilean transformation x = x' + Ut, u = u' + U; accelerations unchanged (Kundu §3.3, (3.9))
- 'the air parcel''s acceleration: local change + advection; each piece frame-dependent, the sum not'
- storm-relative wind v' = v - U; ring means unchanged by a uniform shift (Storm Ciaran)
- 'change of variables to a moving frame: tau, dp/dt = dp/dtau - U.grad p (Kundu (B.2.2)); a fixed barometer at Plymouth'
