conventions:
  latitude: phi (Vallis writes a theta variant); longitude lambda, east positive
  local arrows: i-hat east, j-hat north, k-hat up (Vallis writes bold i, j, k; hats here, as in Parts 1-3; spoken 'i hat')
  Earth axes: x-hat (0 N, 0 E), y-hat (0 N, 90 E), z-hat (North Pole), as Part 3
  R-hat: 'capital R hat = (cos lambda, sin lambda, 0): straight away from the spin axis, level with the equator (defined s05)'
  wind arrow: bold v = (u, v, w) (Vallis); Part 1's 'bold u' renamed once in s03; Galilean scenes use u, U, u' along the track and bold v, bold U, bold v' for winds
  earth radius: a on screen; spoken 'the Earth's radius' or 'the radius' (Kokoro reads a lone 'a' as the article)
  D/Dt: '''capital D ... by D t'': rate following the air parcel (#4); ''d ... by d t'' for the train (one body)'
  tau: the rider's clock, tau = t, with x' = x - U t held fixed (Kundu's xi written x')
  rotation sense: every clockwise/anticlockwise carries 'as seen from above' (and the hemisphere for storms)
colour_contract: unit arrows orange (i, j, R, x', y', z) except up k-hat teal (as build 1); full winds ink or slate with moving dashes (Part 1 lessons D1, never teal; teal = the round/along part); storm motion U orange; rider/storm-relative
  result warm white; negative parts rose with hatch and '-' glyph; fixed observers (barometer, anemometer, station) slate; gravity brown; Coriolis violet; metric
  terms orange; gold for pointers, links, angle arcs, 'same' ticks, speed/radius braces
