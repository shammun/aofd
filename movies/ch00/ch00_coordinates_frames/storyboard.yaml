  voiceover: 'How big are they? Take the same wind, ten metres per second east and ten north, at forty five degrees, where the tangent is one. Let''s put
    these numbers into u v tangent phi over the radius, with the Earth''s radius, six point three seven one million metres. That gives about one point six
    times ten to the minus five metres per second squared. [beat] Let''s compare the Coriolis effect, from the cross product movies: f times v, where f is
    two Omega sine phi. With the Earth''s spin rate, Omega, seven point two nine times ten to the minus five per second, and the sine of forty five degrees,
    about zero point seven zero seven, f is about one point zero three times ten to the minus four per second. Multiplying by the northward wind, ten metres
    per second, gives about one point zero times ten to the minus three. [beat] So the metric term is about sixty six times smaller. [beat] In one weather
    system, metric terms are small. But they grow near the poles, where the tangent gets large, and over flows that span whole oceans or the whole globe,
    so weather and climate models keep them. We''ll meet them again in a later movie: From F equals mass times acceleration, to the equation of motion.'
