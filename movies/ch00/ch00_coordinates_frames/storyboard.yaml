  voiceover: Now a second kind of turning. Our arrows also turn by themselves, as you move over the round Earth. Suppose a plane flies due east along the
    parallel through Brest, at two hundred and fifty metres per second. In one hour, which is three thousand six hundred seconds, it covers nine hundred kilometres.
    [beat] As we found in Part 3, at Brest one degree of longitude is about seventy four kilometres, so that's about twelve degrees of longitude. [beat] Seen
    from above the North Pole, the plane has gone twelve degrees round the axis, and its east arrow has swung round by the same twelve degrees, just like
