honesty_notes:
- 's04-s09: unit vectors on a sphere (geocentric = geodetic here; the WGS-84 difference is < 0.2°). Screen values rounded to 3 decimals; CHECK rows at 1e-4.'
- 's08: the Trappes angle uses the arc rule (480 km / 6371 km) because a 3-decimal dot product is too coarse for 4°; the library dot product gives 4.32°.'
- 's09: Khulna at the split plan''s rounded 22.8 N, 89.6 E gives 75.76°; the Natural Earth point (22.8419, 89.5581) gives 75.7°; both are spoken ''about seventy six''.
  Amphan''s centre passed ≈ 78 km W of Khulna (data report §3, IBTrACS NI).'
- 's11-s12: the 329° comes from the NE 10 m coastline vertices nearest Naples and Venice (build-1 manifest pN, pV); flat triangle 329.0°, sphere 329.1° (DC42 329.13°).
  Coastline direction depends on the segment chosen; said as ''the coast between Naples and Venice''.'
- 's14: HRRR 3-km analysis wind at Fort Myers Beach, 20 UTC (a model analysis, said ''a weather model''); the data report (§1c) finds HRRR''s vortex ≈ 11-16 km SW
  of the radar eye: the eye marker, if drawn, is HRRR''s wind centre and the source line says so. ''Flooded Fort Myers Beach that afternoon'': NHC report (local time);
  surge numbers belong to Part 2/F19.'
- 's15: the eastbound plane is a thought experiment; 12.19° in 1 h at 250 m/s.'
- 's19: ''about twelve degrees in a day'' = 11.70° for 10 m/s at Brest.'
- 's26: a frictionless, non-spinning sphere; only the horizontal parts of Dv/Dt vanish (the surface pushes up); u, v from the analytic great circle (fluidpy.geo.frames.great_circle)
  by a centred difference.'
- 's27: ''about sixty six times'' = 1.031e-3 / 1.570e-5 = 65.7 (build 1 said ''sixty five''; corrected).'
- 's32: an idealised gust pattern (thought experiment); numbers from u = 10 + 5 sin(2π(x − 10 t)/200 km) at phase 45°: local −4.00, advection +5.41, rider +1.41 m/s
  per hour.'
- 's33-s37: Ciaran tracked by continuity (HOUSE_STYLE §7), ERA5 10-m winds; motion 00-06 UTC 2 Nov 14.58 m/s towards 71.0°. Sector means over ±45° about right/left
  of the track. ''its own winds were stronger on its northern side'' is said for this ring and hour only (land/sea friction mixes in; not interpreted further). Ring
  means 14.1/13.8 and −6.0/−5.9; the 0.26 m/s difference is meridian convergence (DC54).'
- 's38-s41: ∂p/∂t by a centred hourly difference of ERA5 msl at Plymouth (50.25 N, 4.25 W), 00 UTC 2 Nov; U·∇p with fluidpy.geo.sphere.gradient and the tracked motion;
  the residual −0.61 is ''the storm changing'' at Plymouth''s place in the pattern; the centre''s own −0.47 hPa/h is a size check, not the same quantity.'
- Exaggerations (tripod arrow lengths, magnified angle steps, half-Earth cuts, inset arrow scales) and time compression (flight, puck day, hourly loops, gust pattern)
  are listed per scene and in the manifest, not badged (HOUSE_STYLE §5).
quiz_hook: 'A parcel at 60 deg N moves due east at 20 m/s. Which way, and how fast, does its north arrow j-hat turn? (Towards the west: -i (u/a) tan phi, |Dj/Dt|
  = 20 / 6.371e6 x 1.732 = 5.4e-6 s^-1, about 27 deg a day.) And a barometer reads -2 hPa/h while a storm moving at 36 km/h has a pressure slope of 0.05 hPa/km along
  its path at that place: is the storm deepening? (dp/dtau = -2 + 1.8 = -0.2 hPa/h: slightly.)'
