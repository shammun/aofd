    and after one day its local tripod and its velocity arrow (teal) are drawn; readouts in the column (never on the globe), gold-linked to the puck: ''u = 10.0 ->
    11.5'', ''v = 10.0 -> 8.2'', ''speed 14.1 -> 14.1'' (the speed row with a gold ''same'' tick). S2-S5: ''(D bold v/Dt) · i-hat = 0 (nothing pushes along the ground)'',
    then ''Du/Dt = uv tan φ / a − uw/a'', ''w = 0 (stays on the ground)'', ''≠ 0''. Not on screen (honesty note): the ground''s upward push keeps the puck on the
    surface, so only the horizontal parts of D bold v/Dt vanish.'
  voiceover: What do the metric terms mean? Let's try a thought experiment. Imagine a puck gliding over a smooth Earth that doesn't spin, with nothing pushing
    it along the ground. Then the eastward part of its acceleration, capital D bold v by D t dot i hat, is zero. So capital D u by D t must equal u v tangent
    phi over the radius, minus u w over the radius. The puck stays on the ground, so w is zero, and that leaves u v tangent phi over the radius, which isn't
    zero. So the puck's eastward number changes, even though nothing pushes it. Let's start it at forty five degrees north, going north-east, at ten metres
    per second east and ten north. After one day, its east part has grown to about eleven and a half, and its north part has shrunk to about eight point two.
    [beat] But its speed is still fourteen point one metres per second. [beat] The puck goes straight, along a great circle, which we'll meet in Part 6. It's
    our arrows that turned under it. Metric terms never speed anything up or slow it down. They only share the same speed out between east and north, as the
    arrows turn.
