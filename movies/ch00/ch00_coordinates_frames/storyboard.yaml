  voiceover: What do the metric terms mean? Let's try a thought experiment. Imagine a puck gliding over a smooth Earth that doesn't spin, with nothing pushing it
    along the ground. Then the eastward part of its acceleration, capital D bold v by D t dot i hat, is zero. So capital D u by D t must equal u v tangent phi over
    the radius, minus u w over the radius. The puck stays on the ground, so w is zero, and that leaves u v tangent phi over the radius, which isn't zero. So the puck's
    eastward number changes, even though nothing pushes it. Let's start it at forty five degrees north, going north-east, at ten metres per second east and ten north.
    After one day, its east part has grown to about eleven and a half, and its north part has shrunk to about eight point two. [beat] But its speed is still fourteen
    point one metres per second. [beat] The puck goes straight, along a great circle, which we'll meet in Part 6. It's our arrows that turned under it. Metric terms
    never speed anything up or slow it down. They only share the same speed out between east and north, as the arrows turn.
