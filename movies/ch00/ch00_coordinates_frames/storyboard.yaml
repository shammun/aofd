  voiceover: 'Now east. Let''s look down on the Earth from far above the North Pole. From there, the circle of latitude through Brest, the parallel, is a circle round
    the Earth''s axis. Brest sits on it at the angle lambda from the x axis, measured anticlockwise as seen from above the North Pole. Going east means lambda grows,
    so Brest slides anticlockwise round this circle. This is exactly the picture from Part 1. The arrow pointing from the circle''s centre out to Brest plays the
    role of r hat. We''ll call it capital R hat: it points straight away from the Earth''s axis, level with the equator, and it''s cosine lambda, sine lambda, zero.
    East is the way the angle grows, so east plays the role of theta hat. In Part 1, we found theta hat by turning r hat by ninety degrees anticlockwise: swap the
