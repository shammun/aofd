cross_part:
  from_part1:
  - the 90-deg turn rule (p, q) -> (-q, p) (D02, s10)
  - theta-hat = r-hat turned +90 deg; 'the way the angle grows' (D01, D03)
  - polar r-hat = (cos theta, sin theta)
  - turned axes x-hat' = (cos alpha, sin alpha), y-hat' = (-sin alpha, cos alpha) (D05, s16)
  - components along unit arrows are dot products (D06, s17)
  - compass bearing from north, clockwise seen from above; maths angle = 90 deg - bearing (s06)
  - bearing -> east/north parts (speed x sin bearing, speed x cos bearing)
  - tan = opposite / next to; 'the angle whose tangent is' (s04)
  - wind arrow called 'bold u' in Part 1 (renamed bold v here, said in s03)
  from_part2:
  - d r-hat/d theta = theta-hat, d theta-hat/d theta = -r-hat (D13, D14)
  - d theta/dt = v/r (D16)
  - product rule for a number times an arrow (D15)
  - chain rule used on turning arrows (D17, D18)
  - '''speed over radius is how fast the arrows turn'''
  from_part3:
  - latitude phi from the equator, longitude lambda east of 0 deg; Brest 48.4 N, 4.5 W (48.39, -4.49)
  - 'Earth axes: x-hat to (0 N, 0 E), y-hat to (0 N, 90 E), z-hat to the North Pole (D23 step 1) -- Part 3 must use x-hat, y-hat, z-hat (or the movie re-labels)'
  - a = 6371 km (easy 6400), spoken 'the Earth's radius' (no lone 'a' in the voice)
  - r-hat = (cos phi cos lambda, cos phi sin lambda, sin phi); height a sin phi; distance from the axis a cos phi (Brest 4230 km)
  - 'Delta y = a Delta phi: 1 deg = 111.2 km; Delta x = a cos phi Delta lambda: 73.8 (74) km per deg at Brest'
  - the meridian slice (half-Earth face) and the parallel as a circle round the axis (TwoViewSlice)
  - Khulna 22.8 N, 89.6 E (NE 22.8419, 89.5581)
  from_earlier_movies:
  - 'dot product: cosine of the angle between unit arrows; advection (0.1b)'
  - cross product recipe; i x j = k; right-handed (#2)
  - f = 2 Omega sin phi, Omega = 7.29e-5 s^-1; Coriolis; dB/dt = Omega x B for an arrow carried by a spin (#3, 'The cross product at work')
  - limits, total differential, the traveller's chain rule dT/dt = dT/dt|place + speed x slope, DT/Dt = dT/dt + v.grad T, centred differences (#4)
