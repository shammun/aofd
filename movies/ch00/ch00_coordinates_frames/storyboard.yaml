    -> 22.0'' beside the track over one second (both ''+0.5'', gold ''same''); then a ball dropped on the train: straight down for the rider, a parabola for the ground
    observer; at three moments both views show the same downward acceleration arrow ''9.8 m/s²'' (brown).'
  voiceover: 'Here''s the beautiful part. What happens to accelerations? Let''s follow the same steps, one move at a time. Step one: at every moment, u equals capital
    U plus u prime. Step two: a short time later, each of them has changed a little, and the sum still holds. So delta u equals delta capital U plus delta u prime:
    the change of a sum is the sum of the changes. [beat] Step three: divide by delta t. Step four: let delta t shrink, as in the derivatives movie. That gives d
    u by d t equals d capital U by d t, plus d u prime by d t. [beat] Step five: the train''s speed never changes, so d capital U by d t is zero. So d u by d t equals
    d u prime by d t: the acceleration is the same in both frames. [beat] For example, if you speed up from one and a half to two metres per second in one second,
    the person beside the track sees you go from twenty one and a half to twenty two, in the same second. [beat] Drop a ball on a smooth train, and it speeds up downwards
    by nine point eight metres per second every second, for you, and for the person beside the track. And since Newton''s law says force equals mass times acceleration,
    the same forces explain the motion in both frames. If you skipped, here''s what to keep: in a frame moving steadily in a straight line, speeds change by the frame''s
    own speed, but accelerations, and so forces, stay the same.'
