  voiceover: 'The moving frame also explains what a fixed barometer sees. Let''s take Plymouth, on England''s south coast. Picture the pressure pattern as a frozen
    map, sliding east-north-east with the storm. A barometer that never moves sees the pressure fall as the low comes closer, even if the storm itself isn''t deepening
    at all. So the barometer''s reading mixes two things: the storm arriving, and the storm changing. To pull them apart, we need two observers. The first is the
    fixed barometer. Its rate is partial p by partial t: the change of pressure in time, at one fixed place. Here p is the pressure, and t is the time. [beat] The
    second is a rider, moving with the pressure pattern at bold capital U. The rider''s position, measured in the moving pattern, is x prime, which is x minus capital
    U t, as on the train. And the rider''s clock reads tau, the Greek letter t. Tau is the same time as t, but we give it a new name, because it marks a different
    thing held fixed. Partial p by partial tau is the change of pressure in time while x prime is held fixed: riding with the pattern. [beat] If the pattern really
    were frozen, the rider would see no change at all. So partial p by partial tau is the storm itself changing: negative when it deepens, and positive when it fills.'
  on_screen_eq:
    latex: x'=x-U\,t,\qquad \tau=t
    vallis_eq: none in Vallis; Kundu (B.2.1) change of variables ξ = x − Ut, τ = t (ξ written x′ here, as on the train)
