  voiceover: 'To sum up, a forecaster''s local frame has three arrows: i hat east, j hat north and k hat up, and the wind is u i hat, plus v j hat, plus w k hat.
    Up is the arrow from the Earth''s centre, east comes from turning in the view from above the pole, and north from turning in the meridian slice. Every place has
    its own frame: Brest''s up and Khulna''s up are about seventy five point eight degrees apart. Turning the frame to a coast, at a bearing of three hundred and twenty nine degrees,
    split Ian''s wind into about nine metres per second along the shore, and about thirty two onto the land. As the air moves, the arrows turn by themselves, at speeds
    divided by radii. So the eastward acceleration is capital D u by D t, minus u v tangent phi over the radius, plus u w over the radius: two metric terms that come
    only from the turning arrows. For an ordinary wind, they''re about sixty six times smaller than the Coriolis effect, but weather and climate models keep them.
    In Part 5, we''ll let the frame itself move, and see what a storm''s winds look like to someone riding along with it.'
