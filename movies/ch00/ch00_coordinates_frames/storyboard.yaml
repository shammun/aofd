  voiceover: 'Last, going east also tilts j hat and k hat. Look again at how they''re built: k hat is cosine phi capital R hat, plus sine phi z hat, and j
    hat is minus sine phi capital R hat, plus cosine phi z hat. Going east, phi stays the same, so the sines and cosines don''t change. Z hat lies along the
    Earth''s axis, and never turns. Only capital R hat turns. In the view from above, capital R hat plays r hat, so it changes towards i hat, which plays
    theta hat. Capital D capital R hat by D t equals i hat, times u over the Earth''s radius times cosine phi. [beat] So capital D k hat by D t is cosine
    phi times that. The cosines cancel, leaving i hat, u over the radius. [beat] And capital D j hat by D t is minus sine phi times the same thing: minus
    i hat, times u over the radius, times sine phi over cosine phi. Sine over cosine is the tangent, so that''s minus i hat, u over the radius, tangent phi.
    [beat] In words: going east, up leans towards the east, and north leans towards the west.'
