    arc on a globe and a flat map (Part 5 teaser). Each spoken number on screen at its words; small source lines under the data minis.'
  voiceover: 'To sum up, a forecaster''s local frame has three arrows: i hat east, j hat north and k hat up, and the wind is u i hat, plus v j hat, plus w k hat.
    Up is the arrow from the Earth''s centre, east comes from turning in the view from above the pole, and north from turning in the meridian slice. Every place has
    its own frame: Brest''s up and Khulna''s up are about seventy six degrees apart. Turning the frame to a coast, at a bearing of three hundred and twenty nine degrees,
    split Ian''s wind into about nine metres per second along the shore, and about thirty two onto the land. As the air moves, the arrows turn, at speeds divided
    by radii. So the eastward acceleration is capital D u by D t, minus u v tangent phi over the radius, plus u w over the radius: two metric terms that come only
    from the turning arrows. A frame moving steadily changes velocities by its own velocity, but leaves accelerations unchanged. Riding with Storm Ciarán changed
    the wind at every point, but left its average spin of about fourteen metres per second. And a fixed barometer''s rate is the storm changing, minus the pattern
    sliding past: at Plymouth, the fall of three point eight hectopascals per hour was mostly the storm arriving. In Part 5, we''ll find the shortest way round the
    Earth: great circles, and rhumb lines.'
