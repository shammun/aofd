  voiceover: 'Which other places share Brest''s latitude? Let''s put the Earth back together and turn it. Brest''s arrow sweeps round the Earth''s axis, always
    at forty eight point four degrees above the equator plane, and its tip traces a circle round the globe. Every place on that circle has the same latitude
    as Brest. This circle is called a parallel, because it runs parallel to the equator. Brest''s parallel runs east through central Europe, Ukraine, southern
    Russia, Kazakhstan, the far west of China, Mongolia, north-east China and Russia''s Far East. Then it crosses the Pacific, the southern tip of Vancouver
    Island, the northern United States and eastern Canada, and comes back across the Atlantic to Brest. Now let''s slice the Earth the other way: straight
    across, through Brest''s parallel, at right angles to the axis. The cut face is a flat disc, and its rim is Brest''s parallel. The centre of this disc
    is not the Earth''s centre. It sits on the Earth''s axis, above the equator plane. So a parallel is a circle round the Earth''s axis. The equator is the
    biggest parallel, and the parallels get smaller and smaller towards the poles, where they shrink to a point. We''ll measure the size of Brest''s parallel
    very soon.'
