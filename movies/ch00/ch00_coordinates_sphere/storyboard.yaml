  visual: 'Globe spinning slowly (one turn in 20 s), the axis slate; rings for the equator, Khulna, Brest, Longyearbyen (Singapore''s ring is
    the equator''s within 0.03 %); each ring gets a teal speed arrow pointing east with moving dashes, length ∝ Ω a cos φ. S1-S2: CalcStack ''T
    = 86 164 s'', ''Ω = 2π / 86 164 s ≈ 7.29 × 10⁻⁵ rad/s''. S3-S4: ''7.29 × 10⁻⁵ × 6.371 × 10⁶ m ≈ 465 m/s'' at the equator arrow. S5-S6: easy
