      - T=23\ \text{h}\ 56\ \text{min}
      - one turn against the stars (sidereal day)
      - the Earth's spin period
    - - distance in one turn
      - 2\pi\,a\cos\varphi
      - circumference of the parallel, radius a cos phi (s16)
      - one lap of its circle
    - - speed
      - U=2\pi a\cos\varphi/T
      - speed = distance / time
      - the ground speed
    - - pull out the spin rate
      - \Omega=2\pi/T
      - the part that is the same for every place
      - angle turned per second
    - - result
      - U=\Omega\,a\cos\varphi
      - substitute
      - radius times turning rate (Part 2)
