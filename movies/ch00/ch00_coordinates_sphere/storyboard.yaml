id: ch00_coordinates_sphere
title: 'Coordinates, Part 3 — Our round Earth: latitude, longitude, distances and areas'
version: 1
concepts:
- 'spherical coordinates: origin at the Earth''s centre, a distance r and two angles; the Earth''s radius a (Vallis §2.2.2)'
- latitude phi as an angle at the centre; colatitude 90 deg - phi and the sine/cosine swap (Kundu App. B uses colatitude)
- parallels (circles round the axis, radius a cos phi) and meridians (half great circles round the centre); the prime meridian
- longitude lambda (east positive; the 0-360 convention); the graticule; meridians cross parallels at right angles
- Earth-fixed axes x, y, z; the position vector x = a cos phi cos lambda, y = a cos phi sin lambda, z = a sin phi; r-hat
- ground speed of the spinning Earth U = Omega a cos phi, Omega = 2 pi / T (sidereal day)
- 'arc lengths on the sphere: Delta y = a Delta phi, Delta x = a cos phi Delta lambda (Vallis §2.2.2, text before (2.27))'
- latitude-longitude grid boxes of reanalysis data (ERA5 0.25 deg) and their true sizes
- area element dA = a^2 cos phi dphi dlambda; band area 2 pi a^2 sin phi by adding strips (integration, owned here); Archimedes' cylinder
- cos-latitude weighting of global means (fluidpy.diag.climatology.global_mean)
