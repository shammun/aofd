  voiceover: 'First, a quick look back. In Part 1, we met polar coordinates on a flat map: a distance r, and an angle theta, measured anticlockwise
    from east, as seen from above. We found that x equals r cosine theta, and y equals r sine theta. We met radians, and the arc length rule:
    the length of an arc is the radius times the angle, in radians. In Part 2, we watched arrows turn, and we found the slopes of sine and cosine.
    When an angle grows by a tiny step, its sine grows by about its cosine times that step. We saw that air going round a ring is always accelerating,
