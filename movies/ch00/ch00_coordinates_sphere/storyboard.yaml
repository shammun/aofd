  voiceover: If you skipped, here's what to keep. The colatitude is measured down from the pole, so a book that uses it has a cosine wherever
    we have a sine of the latitude, and the other way round. Now for the second angle. First, we need another kind of line on the globe. Start
    at the North Pole, and draw a line straight down the globe, heading due south all the way, until it reaches the South Pole. This half circle
    is called a meridian. All along one meridian, the Sun is highest in the sky at the same moment, at midday, and that's where the name comes
    from. Let's turn the globe and draw more of them, twelve, evenly spaced all the way round. Every meridian runs from pole to pole, and they
    all meet at the poles. Each one is half of a big circle whose centre is the Earth's centre. That's the difference from the parallels, whose
    centres sit on the axis.
