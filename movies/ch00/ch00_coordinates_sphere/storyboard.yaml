honesty_notes:
- The Earth is drawn and computed as a sphere of radius 6371 km (WGS-84 flattening ignored; < 0.5 % in distance, < 0.2 deg in latitude); the narration
  says 'very nearly a ball' (s03).
- Every sliced view is a thought experiment ('imagine slicing'); the interior layers are decorative and listed as illustrative.
- T = 23 h 56 min is the sidereal day; the four minutes to the solar day are explained in one sentence (s20). Omega = 7.292e-5 rad/s (fluidpy.geo.constants.OMEGA).
- U is the speed relative to the Earth's axis (an inertial frame not moving with the Earth's orbit), stated as 'how fast the ground is carried
  round'; 'we don't feel it' because everything moves with the ground.
- 's10: land crossings of the prime meridian are computed from Natural Earth 10 m admin-0 (shapely, 2026-11-05); sea names are the standard ones;
  Greenwich at 51.48 N (Airy transit circle; the modern IERS reference meridian lies about 100 m east, not mentioned).'
- 's06: the countries on 48.4 N are said in groups (central Europe, Ukraine, Kazakhstan, Mongolia, the northern United States, eastern Canada)
  and asserted by CHECK DS05.'
- 's19: Khulna as Amphan''s nearby city is pending the data report; the track drawn is IBTrACS.'
- 's26: ERA5''s 0.25-deg grid is the delivered latitude-longitude grid (interpolated from its ~31 km model grid); ''many modern models use other
  kinds of grid'' is said without naming them.'
- 's28: the flat-rectangle box area differs from the exact spherical cell area by < 0.02 % (Brest 513.13 vs 513.06 km2).'
- 's31: sin 30 deg = 1/2 is exact on a sphere; the 10-deg midpoint strips overestimate the 0-30 band by 0.13 %, 1-deg strips by 0.001 % (said
  only as ''thinner strips'').'
- 's34: the two-box planet is a thought experiment said as such; the ERA5 numbers are September 2026 monthly means (ERA5T may still be preliminary),
  1-deg grid, weighted 16.27 C vs plain 7.11 C.'
- Exaggerations (1-deg steps x5, 4.5-deg wedge x6 inset, one-minute step x60 inset, balloon height x50, area patch x20, lifted caps) and time
  compression (globe spins, the camera tour) are listed per scene and in the manifest, not badged (HOUSE_STYLE §5).
quiz_hook: Singapore is almost on the equator and Longyearbyen is at 78.2 N. How many kilometres is one degree of longitude at each, how fast
  does the ground move east at each, and what share of the northern hemisphere lies south of 78.2 N? (111.2 and 22.7 km; about 464 and 95 m/s;
  sin 78.2 deg = 0.979, about 98 %.)
