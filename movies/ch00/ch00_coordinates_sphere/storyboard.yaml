  voiceover: Now we can define the second angle. Let's look down on the Earth from far above the North Pole. From up here, every meridian looks
    like a spoke of a wheel, running out from the pole. Now slice the Earth across, along the equator, and look at the round face of the cut.
    Its centre is the Earth's centre, and the meridians meet its rim like the ends of the spokes. Longitude is the angle at the centre, from the
    prime meridian round to the meridian of the place. We write it with the Greek letter lambda. Seen from above the North Pole, east is anticlockwise,
    the same way the angle theta turned in Part 1. Places east of Greenwich have positive longitude, up to a hundred and eighty degrees east.
    Places to the west have negative longitude, down to minus a hundred and eighty. Brest is about four and a half degrees west of Greenwich,
    so its lambda is minus four point five degrees. [beat] Some data sets count longitude from zero to three hundred and sixty degrees, always
    going east. Then Brest is at three hundred and sixty minus four point five, which is three hundred and fifty five point five degrees. [beat]
    Both numbers point to the same meridian, so always check which way your data counts.
