  voiceover: Distances give us areas. Why do we care? Because to average anything over the Earth, like the temperature, we need to know how much
    area each grid box covers. The next few minutes build the area of a small patch, and then of whole bands round the Earth, one step at a time.
    They're for anyone who wants every step, and not needed for the intuition, so feel free to skip ahead to the time on screen. Take a small
    patch of the surface, between two meridians and two parallels. Its north-south side is the Earth's radius times delta phi. Its east-west side
    is the Earth's radius times cosine phi times delta lambda. The two sides meet at a right angle, because meridians cross parallels at right
    angles. And when the patch is small, it's almost flat, so it's almost a rectangle. The area of a rectangle is its width times its height.
    So the patch's area is about the east-west side times the north-south side. Collecting the pieces, that's the radius squared, times cosine
    phi, times delta phi, times delta lambda. As the patch shrinks, the bending of the surface matters less and less. In the limit, we write the
    tiny area as d capital A, and the tiny steps as d phi and d lambda. So d capital A equals the radius squared, times cosine phi, d phi, d lambda.
    From here on, delta means a small step, and a small d means a step so tiny that the approximation becomes exact. And the angles are always
    in radians.
