  voiceover: Now let's measure the first angle. On the cut face, draw a line from the centre out to the equator. Latitude is the angle between
    that line and the arrow to the place, measured at the centre. We write it with the Greek letter phi. For Brest, the arrow is turned up from
    the equator line by about forty eight point four degrees. [beat] That's why we say Brest is at forty eight point four degrees north. At the
    equator, phi is zero. Halfway from the equator to the North Pole, it's forty five degrees. At the North Pole itself, it's ninety degrees north.
    At the South Pole, it's ninety degrees south, which we write as minus ninety. So latitude says how far north or south a place is, from minus
    ninety to plus ninety degrees.
