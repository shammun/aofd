  voiceover: Distances give us areas. Why do we care? Because to average anything over the Earth, like the temperature, we need to know how much area each
    grid box covers. The next few minutes build the area of a small patch, and then of whole bands round the Earth, one step at a time. They're for anyone
    who wants every step, and not needed for the intuition of weather, climate science or mapping, so feel free to skip ahead to the time on screen. Take
    a small patch of the surface, between two meridians and two parallels. Its north-south side is the Earth's radius times delta phi. Its east-west side
    is the Earth's radius times cosine phi times delta lambda. The two sides meet at a right angle, because meridians cross parallels at right angles. And
