    can be pinned down by three numbers. The first is its distance from the centre, which we call r, just as on the flat map. The other two are
    angles, which say in which direction the point lies, as seen from the centre. A distance and two angles like this are called spherical coordinates.
    On the Earth, the two angles are the ones you know from maps: latitude and longitude. But the centre is hidden deep inside the Earth. So to
    see it, let''s cut the Earth open.'
