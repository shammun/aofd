  voiceover: 'This matters every time we use weather data. ERA5, the reanalysis we''ve used throughout this series, is a reconstruction of the past weather
    everywhere, made by combining observations with a weather model. It gives its values on a grid of latitude and longitude, every quarter of a degree. So
    each grid box is a quarter of a degree tall, and a quarter of a degree wide. The height is easy: a quarter of one hundred and eleven point two is about
    twenty seven point eight kilometres, at every latitude. [beat] The width depends on cosine phi. At Singapore, a box is about twenty seven point eight
    kilometres wide: nearly square. [beat] At Khulna, it''s about twenty five point six kilometres wide. [beat] At Brest, about eighteen and a half. [beat]
    At Longyearbyen, a box is still twenty seven point eight kilometres tall, but only about five point seven wide. [beat] So the boxes get thinner and thinner
    towards the poles. Forget the cosine, and a box at Longyearbyen comes out four point nine times, so about five times, too wide. [beat] Every east-west
    distance there would be five times too big, and every east-west slope five times too small. This is also how, in Part 4, we''ll turn a coast''s latitudes
    and longitudes into kilometres. And it''s one reason why many modern weather models use other kinds of grid, which don''t crowd together at the poles.'
