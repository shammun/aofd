    z. It''s the side opposite the angle phi. By the rule from Part 1, it''s the long side times sine phi. So z equals the Earth''s radius times sine phi.
    Now the numbers. The long side is the Earth''s radius, six thousand three hundred and seventy one kilometres. The sine of forty eight point four degrees
    is zero point seven four seven eight. Multiplying the two, z is about four thousand seven hundred and sixty four kilometres. [beat] With easy numbers,
