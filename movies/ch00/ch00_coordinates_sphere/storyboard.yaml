  visual: 'One beat per sentence, mini pictures reused (no headings): the globe with the centre and r; the sliced face with ''a ≈ 6400 km''; the
    phi wedge; the colatitude wedge with ''sin ↔ cos''; a parallel disc and a meridian; the lambda wedge from Greenwich; the two-view triangles
    with x, y, z; the spinning globe with the 465 m/s arrow; the 111-km step; the shrinking east steps; the dA tile; the staircase and the half-Earth
    band (30 S - 30 N); a small weather station at Brest with three arrows (east, north, up) and a question mark for the Part 4 teaser. Each spoken
    number on screen at its words.'
  voiceover: 'To sum up, a point on or around the Earth is pinned down by spherical coordinates: its distance from the centre, and two angles. On the ground,
    that distance is the Earth''s radius, about six thousand four hundred kilometres, which we call a. Latitude, phi, is the angle up from the equator plane,
    measured at the centre. The colatitude is ninety degrees minus phi, measured down from the pole, and it swaps sine and cosine. A parallel is a circle
    of constant latitude, round the Earth''s axis. A meridian is a half circle from pole to pole, round the Earth''s centre. Longitude, lambda, is the angle
    round the axis, from the prime meridian through Greenwich, positive to the east. Two slices give the position arrow: x is the radius times cosine phi
    times cosine lambda, y is the radius times cosine phi times sine lambda, and z is the radius times sine phi. The ground is carried east at capital Omega,
    times the radius, times cosine phi: about four hundred and sixty four point six metres per second at the equator. A step north is the radius times delta
    phi, about a hundred and eleven kilometres per degree, everywhere. A step east is the radius, times cosine phi, times delta lambda: about seventy four
    kilometres per degree at Brest, and it shrinks towards the poles. So a small patch has an area of the radius squared, times cosine phi, d phi, d lambda.
    Adding up strips shows that the band from the equator to latitude phi holds a share sine phi of its hemisphere, which is why global averages weight each
    latitude by cosine phi. For September twenty twenty six, that weighting turned ERA5''s plain average of about seven point one degrees Celsius into about
    sixteen point three. In Part 4, we''ll stand at a weather station and give it its own east, north and up arrows. As the air moves over the round Earth,
    those arrows turn by themselves, and that turning adds extra terms to how the wind changes.'
