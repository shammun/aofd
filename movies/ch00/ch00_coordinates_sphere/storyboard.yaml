    and the bottom leg ''opposite'' (a gold swap arrow between the two role tags). S16-S17: rows ''sin(90° − φ) = cos φ'', ''cos(90° − φ) = sin
    φ''. S18: CalcStack ''sin 41.6° ≈ 0.6639 = cos 48.4°''. S19: keyword ''books with colatitude: cos ↔ sin''. SKIP CHIP (user rule 2026-11-05;
    the one allowed chip): on AT(4,''skip ahead'') a small rounded chip, top-right of the column (x 1500-1840, y 60-150, 44 px, warm white on
