  voiceover: There's a second way to measure the same direction. You'll meet it in many maths and physics books. Instead of starting from the
    equator, start from the North Pole, and measure the angle down from the Earth's axis to the arrow. This angle is called the colatitude. Latitude
    and colatitude together fill the right angle between the equator plane and the axis. So the colatitude is ninety degrees minus the latitude.
    For Brest, it's ninety minus forty eight point four, which is forty one point six degrees. [beat] Be careful not to mix up two words here.
    The colatitude is an angle, measured at the centre. A parallel is a circle, made of all the places with the same latitude.
