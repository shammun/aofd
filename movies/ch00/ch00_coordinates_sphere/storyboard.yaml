  beat: 'derivation D27 (1)-(4): ground speed U = Omega a cos phi (U-CO-051)'
  visual: 'Globe with the spin axis (slate) and Brest''s parallel (orange ring, radius tag ''a cos φ''), spinning slowly. S5-S6: a clock glyph
    with a star icon, ''one turn: 23 h 56 min'', ''T'' (KaTeX). S7: a small sun-and-orbit glyph in the column (the Earth moving along its orbit:
    the extra 4 minutes). S8-S9: Brest''s dot travels once round its ring (gold trail); the column builds ''distance = 2π × a cos φ''. S10-S11:
    ''U = 2π a cos φ / T'' (Layered; the 2π/T part violet). S12-S14: the 2π/T part lifts out: ''Ω = 2π / T'' (violet, rotation colour), keyword
    ''spin rate, rad/s''. S15: ''U = Ω a cos φ'' (96 px). S16: mini Part 2 ring glyph ''speed = radius × turning rate''.'
  voiceover: 'That distance from the axis has a second meaning. The Earth spins round its axis, so every place on the ground is carried round a circle: its
    parallel. The radius of that circle is the distance from the axis, the Earth''s radius times cosine phi. How fast is the ground moving? Let''s work it
    out, one step at a time. First, how long does one turn take? Measured against the distant stars, the Earth turns once every twenty three hours, fifty
    six minutes and four seconds. We call this time capital T. It''s four minutes shorter than a day from noon to noon, because the Earth also moves along
    its orbit round the Sun. In a year of three hundred and sixty five days, the Earth goes once round the Sun, so each day it moves about one degree along
    its orbit. So from noon to noon, the Earth turns about three hundred and sixty one degrees, not three hundred and sixty. A day has one thousand four hundred
    and forty minutes, so each degree of turn takes four minutes. Next, how far does the place travel in one turn? Once round its circle, which is two pi
    times the radius of the circle. That''s two pi, times the Earth''s radius, times cosine phi. Then, speed is distance divided by time. So the ground speed,
    capital U, is two pi, times the Earth''s radius, times cosine phi, divided by capital T. Now we pull out the part that''s the same for every place: two
    pi divided by capital T. That''s the angle the Earth turns through each second, in radians. It''s called the Earth''s spin rate, and we write it capital
    Omega, as in the cross product movie. So capital U equals capital Omega, times the Earth''s radius, times cosine phi. [beat] It''s Part 2''s rule for
    a ring again: the speed is the radius times the turning rate.'
  on_screen_eq:
