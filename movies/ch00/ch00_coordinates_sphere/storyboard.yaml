    and is labelled within 1 s; its tip number appears on its words: ''Singapore ≈ 464'', ''Khulna 465 × 0.9219 ≈ 428'', ''Brest 465 × 0.6639
    ≈ 308'', ''Longyearbyen 465 × 0.2045 ≈ 95'' (m/s); facing() fades labels near the limb (Must 11); the pole ''0'' right of its dot. S12: a
    curved ''east'' arrow round the axis. S13-S14: column ''we move with the ground''; keyword ''cross product movie'' (pointer, spoken). KEEP
    LINE (user rule 2026-11-05): S1 is the ''If you skipped, here''s what to keep'' sentence; during it the takeaway keyword ''height a sin φ
    · from the axis a cos φ · ground east at Ω a cos φ'' (54 px, warm white, gold underline) sits at the top of the column, then moves to its
    usual place.'
  voiceover: If you skipped, here's what to keep. A place at latitude phi sits the Earth's radius times sine phi above the equator plane, and the radius times
    cosine phi from the Earth's axis. As the Earth spins, that place is carried east at capital Omega, times its distance from the axis. Now the numbers.
    Twenty three hours, fifty six minutes and four seconds is eighty six thousand one hundred and sixty four seconds. So capital Omega, two pi divided by
    capital T, is about seven point two nine two times ten to the minus five radians per second. [beat] At the equator, cosine phi is one. So the ground moves
    at capital Omega times the Earth's radius, which is about four hundred and sixty four point six metres per second. [beat] With easy numbers, the equator
    is about forty thousand kilometres round. And forty thousand kilometres in twenty four hours is about one thousand six hundred and seventy kilometres
    per hour. To turn metres per second into kilometres per hour, we multiply by three point six, because an hour has three thousand six hundred seconds,
    and a kilometre has a thousand metres. So four hundred and sixty four point six metres per second is also about one thousand six hundred and seventy kilometres
    per hour. A passenger jet flies at about nine hundred kilometres per hour, so the ground at the equator moves almost twice as fast. Singapore, at one
    point three five degrees north, almost on the equator, has cosine phi zero point nine nine nine seven, so it moves at about four hundred and sixty four
    metres per second. [beat] At Khulna, cosine phi is zero point nine two one nine, so it's about four hundred and twenty eight. [beat] At Brest, cosine
    phi is zero point six six three nine, so it's about three hundred and eight. [beat] At Longyearbyen, on the Arctic islands of Svalbard, seventy eight
    point two degrees north, cosine phi is zero point two zero four five. So the ground there moves at only about ninety five metres per second. [beat] And
    at the poles, cosine phi is zero, so the ground just turns on the spot. Every one of these speeds points east, the way the Earth turns. We don't feel
    any of it, because the air, the sea and we ourselves all move along with the ground. But this shrinking circle is part of the reason why the Earth's spin
    affects the winds differently at different latitudes, as we saw in the cross product movie.
