  voiceover: Why does it matter which angle a book uses? Because sine and cosine swap places. The next minute and a half shows exactly why, for anyone who
    likes to see every step. You don't need it for the intuition of weather, climate science or mapping, so feel free to skip ahead to the time on screen.
    Let's see why, on one triangle. Take the arrow to Brest, but shrink it to length one. From its tip, drop a line straight down to the equator plane, parallel
    to the axis. Together with the equator line, this makes a right triangle. From Part 1, the side next to an angle is the long side times the cosine, and
    the side opposite it is the long side times the sine. At the centre, the angle is the latitude, phi. The side next to it lies along the equator plane,
    so it's cosine phi. The side opposite it runs parallel to the axis, so it's sine phi. Now look from the triangle's other sharp corner, at Brest's end.
    The three angles of a triangle add up to a hundred and eighty degrees. The right angle takes ninety, so the two sharp angles share the other ninety. So
    the angle at Brest's end is ninety degrees minus phi, which is exactly the colatitude. From that corner, the side next to it is the one parallel to the
    axis, and the side opposite it is the one in the equator plane. Same triangle, same sides, but next and opposite have swapped. So the sine of the colatitude
    equals cosine phi, and the cosine of the colatitude equals sine phi. For Brest, the sine of forty one point six degrees is zero point six six three nine,
    and so is the cosine of forty eight point four degrees. [beat] So wherever this video has a sine of the latitude, a book that uses the colatitude has
    a cosine, and the other way round.
