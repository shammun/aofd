  beat: 'intuition: Archimedes'' cylinder (equal heights, equal areas)'
  visual: 'Globe inside a snug translucent cylinder (radius a, slate wireframe, 3-D, the camera orbiting slowly from outside at 15 deg elevation).
    S3: the band 0-phi (phi = 48.4) on the globe teal; horizontal arrows push it out onto the cylinder, where a matching teal band appears. S4:
    a bracket on the cylinder ''height a sin φ = z'' (ghost of s15''s z leg). S6: the cylinder band unrolls into a flat rectangle: ''length 2π
    a'', ''height a sin φ''. S7: ''2π a × a sin φ = 2π a² sin φ'' with a gold ''same'' tick to the band formula. S8-S10: a close look at one thin
    strip near 70 N on both surfaces: on the globe ''shorter round × cos φ'', along the slanted surface ''wider × 1/cos φ'', a cancel glyph. S11:
    keyword ''equal heights, equal areas''.'
  voiceover: 'There''s a lovely picture of this result, found by Archimedes more than two thousand years ago. Wrap the Earth in a cylinder that just touches
    it all round the equator, so the cylinder has the same radius as the Earth. Now take our band, from the equator up to latitude phi, and push it straight
    out sideways, away from the axis, onto the cylinder. On the cylinder, it covers a band whose height is the Earth''s radius times sine phi. That''s z,
    the height above the equator plane, from earlier. A cylinder band is a rectangle rolled up. Its length is two pi times the radius, and its height is the
    radius times sine phi. So its area is two pi, times the radius squared, times sine phi: exactly the same as the Earth''s band. [beat] Why do they match?
    Near the pole, a strip on the Earth is shorter round than on the cylinder, by a factor of cosine phi. But the Earth''s surface there is steep, so the
    strip is wider along the surface than its height, by one over cosine phi. The two effects cancel exactly. So slices of the Earth of equal height have
    equal areas, wherever they are.'
  on_screen_eq:
    latex: 2\pi a\times a\sin\varphi=2\pi a^2\sin\varphi
    vallis_eq: 'none: arithmetic or a definition (no book equation) (Archimedes'' hat-box theorem)'
