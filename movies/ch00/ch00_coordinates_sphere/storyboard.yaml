    frozen Arctic Ocean. It runs south between Greenland and Norway, over the Norwegian Sea and the North Sea, and comes ashore on the east coast of England,
    in Yorkshire. It passes through Greenwich, in east London, and leaves England on the south coast, near Brighton. It crosses the English Channel, and runs
    right through France, from Normandy in the north to the Pyrenees mountains in the south. Then it crosses the east of Spain, and reaches the Mediterranean
    Sea a little north of Valencia. In Africa, it crosses the Sahara desert in Algeria, then Mali, and Burkina Faso. Further south, it runs for a short way
    along the border between Togo and Ghana, then through Ghana, to the coast near the capital, Accra. Out in the Gulf of Guinea, part of the Atlantic Ocean,
    it crosses the equator. Then it runs south over the open South Atlantic and the Southern Ocean, all the way to Antarctica. It reaches the ice of Antarctica,
    and finally the South Pole.
