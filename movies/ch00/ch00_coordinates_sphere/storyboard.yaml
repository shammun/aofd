  voiceover: 'Now let''s measure distances on the ground, step by step. If you''d rather keep to the big picture, skip ahead to the time on screen: these
    steps aren''t needed for the intuition of weather, climate science or mapping. Let''s start with going north. Slice the Earth along a meridian again.
    Walking due north, you follow the meridian, and a meridian is part of a circle whose centre is the Earth''s centre. So the radius of that circle is the
    full radius of the Earth. As you walk north, your latitude grows, and latitude is exactly the angle at the centre of this circle. So by the arc length
    rule from Part 1, the distance walked is the radius times the change of angle, in radians. We write it like this: delta y, the distance north, equals
    the Earth''s radius times delta phi, the change in latitude. Let''s find the length of one degree. A full turn is three hundred and sixty degrees, or
    two pi radians. So one degree is pi over one hundred and eighty, which is zero point zero one seven four five radians. [beat] Times the Earth''s radius,
    six thousand three hundred and seventy one kilometres, that''s about one hundred and eleven point two kilometres. [beat] With easy numbers, it''s about
    one hundred and twelve: about the same. [beat] And it''s the same at every latitude, because every meridian has the same radius. So a degree north is
    always about a hundred and eleven kilometres.'
