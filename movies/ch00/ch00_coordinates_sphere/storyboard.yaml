  voiceover: One meridian is chosen as the starting line. It passes through Greenwich, in London, and it was agreed at an international meeting
    in eighteen eighty four. It's called the prime meridian. Let's follow it from the top of the globe to the bottom. It starts at the North Pole,
    in the middle of the frozen Arctic Ocean. It runs south between Greenland and Norway, over the Norwegian Sea and the North Sea, and comes
    ashore on the east coast of England, in Yorkshire. It passes through Greenwich, in east London, and leaves England on the south coast, near
    Brighton. It crosses the English Channel, and runs right through France, from Normandy in the north to the Pyrenees mountains in the south.
    Then it crosses the east of Spain, and reaches the Mediterranean Sea a little north of Valencia. In Africa, it crosses the Sahara desert in
    Algeria, then Mali, and Burkina Faso. Further south, it runs for a short way along the border between Togo and Ghana, then through Ghana,
    to the coast near the capital, Accra. Out in the Gulf of Guinea, part of the Atlantic Ocean, it crosses the equator. Then it runs south over
    the open South Atlantic and the Southern Ocean, for more than eight thousand kilometres. It reaches the ice of Antarctica, and finally the
    South Pole.
