  voiceover: 'Now let''s cover the globe with both kinds of line. First, the meridians, one every fifteen degrees of longitude: zero, fifteen east, thirty
    east, and all the way round. Then the parallels, one every fifteen degrees of latitude: the equator, fifteen north, thirty north, forty five, sixty and
    seventy five, and the same to the south. Together, they make a grid on the globe, called the graticule. Every meridian crosses every parallel at a right
    angle, because the meridians run north and south, and the parallels run east and west. Any place on Earth sits where one parallel meets one meridian.
    So two numbers, its latitude and its longitude, pin it down. Brest sits where the parallel at forty eight point four degrees north meets the meridian
    at four point five degrees west.'
