    three-line equation (96 px) building line by line on S2-S4, with an underbrace ''distance from the axis'' under a cos φ. S5: Brest row ''(4217,
    −332, 4764) km''. S6-S8: CalcStack ''√(4217² + 332²) ≈ 4230'' with a gold link to the in-plane diagonal, then ''√(4230² + 4764²) ≈ 6371''
    with a link to the arrow. S9: ''cos²φ + sin²φ = 1''. S10-S12: the arrow shrinks to length 1 (orange r-hat, KaTeX hat) pointing out of Brest;
    S13: ''r̂ = (cos φ cos λ, cos φ sin λ, sin φ)''; S14: ''≈ (0.662, −0.052, 0.748)''. S15: keyword ''Part 4: up''.'
  voiceover: 'Let''s put the two steps together. The distance from the axis is the Earth''s radius times cosine phi. So x is the Earth''s radius,
    times cosine phi, times cosine lambda. And y is the Earth''s radius, times cosine phi, times sine lambda. And z is the Earth''s radius times
    sine phi. For Brest, that''s four thousand two hundred and seventeen, minus three hundred and thirty two, and four thousand seven hundred
    and sixty four kilometres. [beat] Let''s check that this arrow really is as long as the Earth''s radius. First, Pythagoras in the equator
    plane: the square root of x squared plus y squared gives back the distance from the axis, four thousand two hundred and thirty. [beat] Then
    Pythagoras in the side view: the square root of four thousand two hundred and thirty squared, plus z squared, gives six thousand three hundred
    and seventy one. [beat] It works for every place, because cosine squared plus sine squared is always one. Now divide the arrow by its length,
    the Earth''s radius. We get an arrow of length one, pointing straight up from the place, away from the centre. We call it r hat, just as on
    the flat map. Its parts are cosine phi cosine lambda, cosine phi sine lambda, and sine phi. For Brest, they''re about zero point six six two,
    minus zero point zero five two, and zero point seven four eight. [beat] We''ll use this arrow again in Part 4, as the up direction of a weather
