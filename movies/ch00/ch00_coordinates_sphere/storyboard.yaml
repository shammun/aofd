  voiceover: 'Now stack the strips, from the equator all the way up to latitude phi. Each strip adds its own step in sine phi, like the steps of a staircase.
    And all the steps of a staircase add up to the height of the top, minus the height of the bottom. At the equator, sine phi is zero. So all the steps together
    add up to just sine phi. That means the area between the equator and latitude phi is two pi, times the radius squared, times sine phi. [beat] Let''s check
    with ten degree strips, from the equator to thirty degrees. Each strip''s step is the sine at its top minus the sine at its bottom. [beat] Together, they
    add up to zero point five, which is exactly the sine of thirty degrees. [beat] This adding up of thinner and thinner strips has a name: integration. We
    write it with a tall S, for sum, and a small d for the tiny steps. Inside, we call the latitude of each strip phi prime, so it isn''t mixed up with the
    top latitude, phi. So the integral of cosine phi prime, d phi prime, from zero up to phi, equals sine phi.'
