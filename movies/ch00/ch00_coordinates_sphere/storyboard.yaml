  voiceover: Latitude and longitude tell us where a place is on the surface. But in physics, we often want the place as an arrow in space, from
    the Earth's centre, with x, y and z parts, like the balloon's arrow in Part 1. For that, we first need three axes, all starting at the Earth's
    centre. The z axis runs up the Earth's spin axis, towards the North Pole. The x axis runs out to the point where the prime meridian meets
    the equator, in the Gulf of Guinea, off the coast of West Africa. The y axis runs out to the equator at ninety degrees east, in the Indian
    Ocean, south of the Bay of Bengal. The arrows of length one along them are called x hat, y hat and z hat. All three are at right angles to
    each other. They're arranged so that x hat cross y hat gives z hat, as in the cross product movie. And they turn with the Earth, so a city's
    x, y and z never change. Our goal now is to find Brest's x, y and z. We'll do it in two steps, with one slice each time.
