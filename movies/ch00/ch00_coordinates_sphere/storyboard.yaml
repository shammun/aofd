  visual: 'S1-S6 (toy): two 3-D tiles from s28, the equator one (area 1) and the 60 N one (area 1/2), each with a thermometer icon ''30 °C'' and
    ''0 °C''; CalcStack ''plain: (30 + 0) ÷ 2 = 15'', ''weights: cos 0° = 1, cos 60° = 1/2'', ''weighted: (30 × 1 + 0 × 1/2) ÷ 1.5 = 20 °C''.
    S7 on AT(7,''real data''): an Equal Earth map of ERA5 2-m temperature, September 2026 monthly mean, 1-deg grid (perceptual map, cmocean ''thermal''),
    colour bar beside it ''°C'' (−40 … +40, 52-px text), SourceBelow ''Data: ERA5 (Copernicus C3S) · 2-m temperature · September 2026 monthly
    mean · 1° grid''. S8: column ''plain average ≈ 7.1 °C'' (slate). S9: ''weighted by cos φ ≈ 16.3 °C'' (teal). S10: the map''s polar rows outlined
    as their many thin boxes (plate-carrée inset under the column at 40 %), keyword ''9 °C too cold''. S11: keyword ''cos φ weighting''. KEEP
    LINE (user rule 2026-11-05): S1 is the ''If you skipped, here''s what to keep'' sentence; during it the takeaway keyword ''boxes shrink by
    cos φ · half the Earth within 30° of the equator'' (54 px, warm white, gold underline) sits at the top of the column, then moves to its usual
    place.'
  voiceover: 'If you skipped, here''s what to keep. Grid boxes shrink towards the poles by cosine phi, so the tropics are huge and the polar caps are small:
    half of the whole Earth lies between thirty degrees south and thirty degrees north. Here''s where this matters for climate. Imagine a planet with just
    two grid boxes, the same size in degrees. One is on the equator, at thirty degrees Celsius. The other is at sixty degrees north, at zero degrees Celsius.
    A plain average says fifteen degrees. But the box at sixty degrees covers only cosine sixty degrees, which is one half of the area of the equator box.
    So the area-weighted average multiplies each temperature by its weight, adds them up, and divides by the sum of the weights. That''s twenty degrees. [beat]
    That''s why a global average gives each latitude a weight of cosine phi. We write the average temperature as T bar. The Greek capital letter sigma means
    add up over all the boxes, which we number with the letter j. So T bar is the sum of cosine phi times the temperature, divided by the sum of the cosines.
    Now let''s do it with real data: ERA5''s air temperature two metres above the ground, averaged over September twenty twenty six, on a one degree grid.
    A plain average of all the grid boxes gives about seven point one degrees Celsius. [beat] Weighted by cosine phi, it''s about sixteen point three degrees.
    [beat] The plain average is more than nine degrees too cold, because the many thin boxes near the poles, over the cold Arctic and the frozen Antarctic,
    count as much as the big tropical ones. This cosine weighting is how global average temperatures are worked out.'
  on_screen_eq:
    latex: \overline{T}=\dfrac{\sum_j\cos\varphi_j\,T_j}{\sum_j\cos\varphi_j}
