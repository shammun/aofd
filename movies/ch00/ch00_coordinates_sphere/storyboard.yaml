    usual place.'
  voiceover: If you skipped, here's what to keep. A place at latitude phi sits the Earth's radius times sine phi above the equator plane, and
    the radius times cosine phi from the Earth's axis. As the Earth spins, that place is carried east at capital Omega, times its distance from
    the axis. Now the numbers. Twenty three hours and fifty six minutes and four seconds is eighty six thousand one hundred and sixty four seconds. So capital
    Omega is two pi divided by eighty six thousand one hundred and sixty four, which is about seven point two nine times ten to the minus five
    radians per second. [beat] At the equator, cosine phi is one. So the ground moves at seven point two nine times ten to the minus five, times
    six point three seven one million metres, which is about four hundred and sixty five metres per second. [beat] With easy numbers, the equator
    is about forty thousand kilometres round, and forty thousand kilometres in twenty four hours is about one thousand six hundred and seventy
    kilometres per hour. That's almost twice as fast as a passenger jet. Singapore, almost on the equator, moves at about four hundred and sixty
    four metres per second. [beat] At Khulna, cosine phi is zero point nine two one nine, so it's about four hundred and twenty eight. [beat]
    At Brest, cosine phi is zero point six six three nine, so it's about three hundred and eight. [beat] At Longyearbyen, on the Arctic islands
    of Svalbard, seventy eight point two degrees north, cosine phi is zero point two zero four five. So the ground there moves at only about ninety
    five metres per second. [beat] And at the poles, cosine phi is zero, so the ground just turns on the spot. Every one of these speeds points
    east, the way the Earth turns. We don't feel any of it, because the air, the sea and we ourselves all move along with the ground. But this
    shrinking circle is part of the reason why the Earth's spin affects the winds differently at different latitudes, as we saw in the cross product
    movie.
