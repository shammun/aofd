  visual: 'Picture zone: the Brest 3-D axes with e1, e2, e3 (from s06). Maths: a 3 x 3 table (no boxes, aligned numbers 68
    px, row/column headers e1 e2 e3). S2: e1 with itself: shadow band of length 1 -> ''1'' in the table. S3: e1 with e2: right-angle
    tick, no shadow -> ''0''. S4: the rest fill in pairs. S5: keyword ''Kronecker delta'', delta_ij (96 px). S6: delta_ij
    = 1 if i = j, 0 if i ≠ j. S7: the diagonal ones pulse gold.'
  voiceover: 'Now for the first special symbol. Let''s take dot products of our unit vectors with each other. East with east
    gives one, because a unit vector has length one. East with north gives zero, because they''re at right angles. Doing all
    nine pairs, we get one whenever the two are the same, and zero whenever they''re different. This pattern has its own name:
    the Kronecker delta, written delta i j. It''s one if i equals j, and zero if i is not equal to j. As a table, it has ones
    along the diagonal and zeros everywhere else.'
  on_screen_eq:
    latex: \delta_{ij} = \begin{cases}1 & i = j\\ 0 & i\neq j\end{cases}
    vallis_eq: 'provenance only, not drawn as a reference: Kundu (2.16) (page image checked) and the identity-matrix form
      under it'
    page_png: ../Fluid Dynamics/chapters/pages/ch02/p077.png
