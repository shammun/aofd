  visual: 'Maths full width. S1-S2: delta_ij u_j (96 px) unfolds to delta_i1 u1 + delta_i2 u2 + delta_i3 u3. S3: i = 2 set
    (gold): delta_21 -> 0 and delta_23 -> 0 struck (Strike), delta_22 -> 1. S4: u2 remains. S6: delta_ij u_j = u_i (96 px);
    S7: a gold arrow shows j being replaced by i, and the delta fading out.'
  voiceover: The Kronecker delta has one very useful trick. Look at delta i j times u sub j, with j summed. Written out, it's
    delta i one times u one, plus delta i two times u two, plus delta i three times u three. For i equal to two, only delta
    two two is one, and the other two deltas are zero. So all that's left is u two. The same happens for every i. So delta
    i j times u sub j equals u sub i. The delta swaps the summed index j for its other index, i, and then it disappears.
  on_screen_eq:
    latex: \delta_{ij}u_j = \delta_{i1}u_1 + \delta_{i2}u_2 + \delta_{i3}u_3 = u_i
    vallis_eq: 'provenance only, not drawn as a reference: Kundu (2.17) and the line above it (page image checked)'
    page_png: ../Fluid Dynamics/chapters/pages/ch02/p078.png
