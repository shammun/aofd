  visual: 'Picture zone: three.js half-Earth slice through the axis and Brest (as in the cross-product movie), Omega violet
    along the axis, r (teal) from the centre to Brest, r split into r_parallel (along the axis, slate dashed) and r_perp (from
    the axis to Brest, gold). Maths: S2 -Ω x (Ω x r) (84 px). S3 = Ω² r - Ω(Ω·r). S4-S5: r = r_par + r_perp; Ω(Ω·r) = Ω² r_par
    cancels (Strike) ; = Ω² r_perp. S6: r_perp = 6371 km x cos 48.45° ≈ 4226 km. S7: Ω² r_perp ≈ 0.0225 m s⁻² ; ''≈ 0.23 %
    of g''. S8-S9: the globe silhouette morphs slightly to an exaggerated oblate shape (x50, the narration says ''bulges'';
    exaggeration recorded) with ''+21 km'' at the equator.'
  voiceover: One more. As Earth spins, it carries the air round in circles, and that gives a pull outwards, away from the
    axis, called the centrifugal effect. For each kilogram, it's minus Omega cross, open bracket, Omega cross r, where r is
    the arrow from Earth's centre to the place. Our rule turns this into Omega squared times r, minus Omega times Omega dot
    r. Split r into a part along the axis and a part straight out from the axis. The part along the axis cancels, and what's
    left is Omega squared times the part straight out from the axis. At Brest, that part is six thousand three hundred and
    seventy one kilometres times the cosine of the latitude, about four thousand two hundred and twenty six kilometres. Times
    Omega squared, the pull is about zero point zero two two metres per second squared, a quarter of one percent of gravity.
    Small as it is, it's why Earth bulges at the equator. Its radius there is about twenty one kilometres larger than at the
    poles. The Coriolis movie shows how this pull is folded into gravity.
