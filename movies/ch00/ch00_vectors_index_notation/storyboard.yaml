  beat: 'subtraction: definition'
  visual: 'House pair plane: p = (5, 1) teal, q = (1, 3) orange. S1: -q appears as a rose dashed copy of q pointing the other
    way (with ''-'' glyph). S2: p + (-q) tip to tail -> (4, -2). S3-S4: both from one point; the arrow from q''s tip to p''s
    tip (warm white) ''from q to p''. S5: q + (p - q) = p tip to tail check (gold ring). S6: maths (5, 1) - (1, 3) = (4, -2).'
  voiceover: 'Now subtraction. First, the negative of a vector is the same arrow, turned to point the opposite way: minus
    q has every component of q with its sign flipped. To subtract q from p, we add minus q: p minus q equals p plus minus
    q. There''s a handy picture too. Draw p and q from the same point. Then p minus q is the arrow from the tip of q to the
    tip of p. Let''s check it: q plus that arrow lands on the tip of p, so q plus, p minus q, is p. With easy numbers, if
    p is five, one, and q is one, three, then p minus q is four, minus two.'
  on_screen_eq:
