    thumbnail ; S7 epsilon cube + violet push to the right of the wind ; S8 epsilon-delta line ; S9 parallelepiped + curtain
    thumbnail.'
  voiceover: 'To sum up, a scalar is one number, like the temperature, and a vector is an arrow, like the wind. Its components
    are its steps along the unit vectors east, north and up, and its length, by Pythagoras, is the wind speed. Vectors add
    tip to tail, or component by component, and p minus q is the arrow from the tip of q to the tip of p: a wind change, a
    wind shear, or an anomaly. In index notation, u sub i stands for all three components, and a free index means three equations.
    A repeated index is summed: that''s the Einstein convention, so u sub j times partial T by partial x sub j is the advection
    of temperature. The Kronecker delta is one for equal indices and zero otherwise, and it swaps one index for another. Epsilon
    i j k builds the cross product, which gives the Coriolis push, at right angles to the right of the wind in the north.
    The epsilon delta relation turns two cross products into dot products. And the scalar triple product is a volume, or the
    air crossing a surface each second.'
  on_screen_eq:
    latex: u_j\frac{\partial T}{\partial x_j},\quad \delta_{ij},\quad \varepsilon_{ijk}
