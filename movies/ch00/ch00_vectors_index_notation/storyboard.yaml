  voiceover: 'So let''s set up three directions at Brest. One axis points east, one points north, and one points straight
    up, away from the ground. Along each axis we put a unit vector: an arrow exactly one unit long. We''ll call them e one,
    e two and e three, for east, north and up. Here the small numbers one, two and three don''t take part in any calculation.
    They just label the three directions. The three unit vectors are at right angles to each other, and together they''re
    called a basis.'
