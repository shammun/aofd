  voiceover: 'Now let''s meet a product of two vectors. The dot product of two vectors, p and q, multiplies their matching
    components and adds the results: p one q one, plus p two q two, plus p three q three. The answer is a single number, a
    scalar. It measures how much two arrows point the same way: it''s the shadow of one arrow on the other, times the other''s
    length. Here''s a weather example. How much of the wind blows along Brittany''s coast? The unit vector along the coast
    has components zero point nine eight five, zero point one seven four, and zero. Its dot product with the wind is five
    point eight times zero point nine eight five, plus thirty three point five times zero point one seven four, plus zero.
    That''s about eleven point five metres per second: the part along the coast that we measured a moment ago. So a dot product
    with a unit vector picks out the part of the wind along it. The dot product has a whole movie of its own in this series,
    where we take it apart fully.'
