    S6: the orange arrow slides so its tail sits on the teal tip (12-frame ease). S7: the warm-white sum arrow (10 px) from
    the first tail to the last tip, ''300 m/s'' (68 px); maths: 250 + 50 = 300. S8 keyword ''tip to tail''. S9: the aircraft
    turns west: 250 - 50 = 200 m/s, the orange arrow now opposes. S10: two short keywords ''east: faster'', ''west: slower''.
    S11: gold pointer to the jet maximum label ''about 70 m/s'' (read from D4, spoken number).'
  voiceover: 'Now let''s add vectors. Picture an airliner flying east at two hundred and fifty metres per second through the
    air. That''s its airspeed: an arrow pointing east. But the air itself is moving. High up, a fast band of wind called the
    jet stream blows from the west. Say the jet blows at fifty metres per second, towards the east. How fast does the plane
    move over the ground? To find out, we put the wind''s arrow with its tail at the tip of the plane''s arrow. The arrow
    from the first tail to the last tip is the sum: three hundred metres per second, towards the east. This is called adding
    vectors tip to tail. Flying the other way, against the jet, the sum is only two hundred metres per second. That''s why
    flights from North America to Europe are usually shorter than the flights back. On the day this video was made, the jet
    over the North Atlantic reached about seventy metres per second.'
  on_screen_eq:
    latex: 250 + 50 = 300\ \mathrm{m\,s^{-1}}
