  voiceover: 'Climate scientists subtract vectors all the time. An anomaly is the difference between what happened and what''s
    normal for that time of year. Normal here means the average over the thirty years from nineteen ninety one to twenty twenty,
    called the climatology. Over the equatorial Pacific Ocean, the trade winds normally blow from the east, towards Asia.
    This map shows the average wind for November in those thirty years. Next to it is November twenty twenty-three, during
    an El Niño, a warming of the tropical Pacific that shifts weather around the world. Subtract the climatology from November
    twenty twenty-three, arrow by arrow, and the anomaly arrows point east. In the central Pacific, the normal wind blew about
    six metres per second towards the west, but in twenty twenty-three only about three and a half. So the anomaly is about
    two and a half metres per second towards the east: the trade winds had weakened, as they do in an El Niño. El Niño gets
    its own long movie later in the series.'
