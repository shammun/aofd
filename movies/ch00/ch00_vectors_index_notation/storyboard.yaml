  voiceover: 'How big is this push? Three point seven times ten to the minus three metres per second squared sounds tiny.
    But it never stops. Acting for one hour, it could change the wind by about thirteen metres per second. That''s why the
    wind can''t blow straight from high pressure to low pressure for long: in the Northern Hemisphere, the Coriolis push keeps
    turning it to the right. South of the equator, the latitude counts as negative, so Omega''s up part is negative, and the
    push turns the wind to the left. How this push balances the push from pressure is the story of the geostrophic wind movie.'
  on_screen_eq:
    latex: 3.7\times10^{-3}\ \mathrm{m\,s^{-2}}\times3600\ \mathrm s\approx13\ \mathrm{m\,s^{-1}}
