  voiceover: 'Now the real wind at Brest. It comes from one hundred and fifty degrees, measured clockwise from north, as seen
    from above. So the air moves the opposite way, towards three hundred and thirty degrees. How much of it moves east, and
    how much north? The east part is the speed times the sine of three hundred and thirty degrees, which is minus a half.
    So it''s nine point three times minus a half: minus four point six five metres per second. The minus means the air moves
    partly towards the west. The north part is the speed times the cosine of three hundred and thirty degrees, about point
    eight six six. That gives eight point zero five metres per second. Meteorologists call the three components u, v and w:
    u towards the east, v towards the north, and w upwards. Near the ground, w is almost zero.'
