    (84 px) in rose with a dashed strike and a ''?'' (never hue alone: strike + ''?'').'
  voiceover: 'A repeated index is called a dummy index, because its letter doesn''t matter. p sub i q sub i and p sub j q
    sub j are exactly the same sum, just as a loop counter in a program can have any name. A term with no free index is a
    single number, a scalar. A term with one free index is a vector, three numbers. And one rule keeps everything safe: an
    index may appear at most twice in a term. Something like p sub i q sub i s sub i has no meaning, because we can''t tell
    which pair to add up.'
  on_screen_eq:
    latex: p_i q_i = p_j q_j
    vallis_eq: 'provenance only: dummy-index renaming (Kundu §2.1 text after (2.2); fluidpy.core.index_notation.rename_dummy)'
