    get u sub j times partial T by partial x sub j, with the repeated index j summed. This is the dot product of the wind
    with grad T, and it''s called the advection of temperature. Advection means being carried along by the flow. It tells
    us how fast the wind carries the parcel into warmer or colder places, in degrees per second.'
