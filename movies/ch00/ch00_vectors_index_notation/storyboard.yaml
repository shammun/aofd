    (orange) -> drifter velocity (warm white), easy numbers (0.5, 0) + (0, 0.2) = (0.5, 0.2) m/s shown, not spoken.'
  voiceover: 'What if the wind blows across the plane''s path? Let the plane head north at two hundred and fifty metres per
    second, while the jet blows east at fifty. Tip to tail, the sum points a little east of north. Now add them the other
    way round: the wind first, then the plane. We reach the same tip. The two routes make the sides of a parallelogram, and
    the sum is its diagonal. Calling the plane''s arrow p and the jet''s arrow q, that''s p plus q equals q plus p: the order
    of adding doesn''t matter. In components, adding is easy: we add the east parts, and we add the north parts. Zero plus
    fifty is fifty towards the east, and two hundred and fifty plus zero is two hundred and fifty towards the north. By Pythagoras,
    the ground speed is about two hundred and fifty five metres per second. The ocean works the same way. A drifting buoy
    is carried by the current and pushed by the wind, so its velocity is the current''s arrow plus the wind drift''s arrow.'
  on_screen_eq:
    latex: (0,\,250) + (50,\,0) = (50,\,250)
    vallis_eq: 'provenance only: component-wise addition (Kundu §2.1 components); our numbers'
