  voiceover: 'An index that appears once in a term is called a free index. An equation with a free index is really three equations,
    one for each value. Remember the wind''s change over an hour above Brest? In index notation, it''s one line: the change,
    d sub i, equals u sub i at six, minus u sub i at five. For i equal to one, it says minus one point eight equals five point
    eight minus seven point six. For i equal to two, it says ten point two equals thirty three point five minus twenty three
    point three. And for i equal to three, it does the same for the up component. So one line holds three equations, and adding
    or subtracting vectors means adding or subtracting their components. The rule is that a free index must appear in every
    term, on both sides, so that every term has the same number of components.'
  on_screen_eq:
