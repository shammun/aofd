honesty_notes:
- The Coriolis push -2 Omega x u is stated, not derived (s33 says so and points to the Coriolis movie); only its direction
  and size are computed here.
- 'Hemisphere sign: the flat Coriolis push is to the right of the wind in the NH and to the left in the SH (s42, s43; CHECK
  VI28); it vanishes at the equator.'
- 's23: ''the fixed thermometer''s rate is minus u_j dT/dx_j'' holds only if each parcel keeps its temperature; the narration
  says so.'
- 's27: the advection estimate (+3.7 K/h) is compared with ERA5 (+2.9 K/h); the gap is attributed in words to ascent/adiabatic
  cooling, which the sum does not contain; the station (2 m) and the 850 hPa level are named as different heights.'
- s22 and s26 leave out the vertical term u_3 dT/dx_3 explicitly ('leaving the up part aside'); it is not claimed to be zero.
- 's53-s54: the flux uses the Brest 850 hPa wind for the whole 186-km curtain (thought experiment, said); the curtain is 1
  km tall around the 850 hPa level.'
- 's54: atmospheric rivers are defined generically; no claim that this stream was a catalogued atmospheric river.'
- Vertical exaggerations (columns x10, parcel x5, curtain x20, bulge x50) and time compression (streaklines x20, balloon 1
  h in ~6 s, shear 10 min in ~4 s) are recorded here and in the manifest, not badged (HOUSE_STYLE §5).
- 'Arrow scales: accelerations (violet) and speeds (teal) share no physical scale; the factor is recorded per scene.'
- 'Local east-north-up axes are a tangent plane at Brest: over a few hundred km the basis is treated as fixed (the coordinates
  movie treats the curved case).'
- 's12a: the 250/50 m/s airliner numbers are a thought example; only the jet maximum (about 70 m/s) is real (D4, latest GFS);
  s12c forces are easy numbers chosen to be consistent with Brest (|u| = 9.2 m/s).'
- 's12d: near a deep, sharply curved low the surface geostrophic wind overestimates the real wind; the narration names friction
  and the tight curve.'
- 's12h: the anomaly numbers wait for D5 (planning values); El Nino 2023-24 status per NOAA CPC (cited in the manifest).'
- Every spoken number is a planning value from the tested library on the files on disk (2026-10-27) and is re-asserted by
  CHECK rows VI01-VI40 (data_needs.md); s09's w and s50/s54 density wait for D1.
