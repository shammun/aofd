  visual: 'Maths full width. S2: delta_ii = 1 + 1 + 1 = 3 (84 px) with a small 3-D axes glyph ''3 directions''. S3: delta_ij
    p_i q_j : a 3 x 3 grid of nine products collapses to its diagonal (three cells stay, six fade), = p_i q_i = p·q.'
  voiceover: 'Two more quick facts. Delta i i, with i summed, is one plus one plus one, which is three: the number of dimensions
    of space. And delta i j times p sub i q sub j turns a sum of nine terms into a sum of three, because it''s just p dot
    q. The Kronecker delta comes back in the tensors movie, as the simplest tensor of all.'
