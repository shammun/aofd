  beat: 'epsilon-delta relation: statement'
  visual: 'Maths full width. S1: two epsilon glyphs next to each other with a shared k (gold link). S2: epsilon_ijk epsilon_klm
    = delta_il delta_jm - delta_im delta_jl (96 px, built term by term). S3: BraceNotes ''2 cross products'' (left) / ''dot
    products'' (right). S4-S7: the mnemonic: the two k''s pulse ''next to each other''; gold arcs i-l, j-m on the first term
    (''first with first, second with second''); crossed arcs i-m, j-l on the second term with the ''-''.'
  voiceover: 'Now let''s connect the two special symbols. When two epsilons share one summed index, they can be replaced by
    deltas. This is the epsilon delta relation: epsilon i j k times epsilon k l m equals delta i l times delta j m, minus
    delta i m times delta j l. It''s useful because two epsilons mean two cross products, and the deltas turn them into dot
    products. Here''s a way to remember it. The summed index k sits in the middle, next to itself. On the right, the first
    indices, i and l, pair up, then the second ones, j and m. Then come the same pairs crossed over, with a minus sign.'
  on_screen_eq:
    latex: \varepsilon_{ijk}\varepsilon_{klm} = \delta_{il}\delta_{jm} - \delta_{im}\delta_{jl}
    vallis_eq: 'provenance only, not drawn as a reference: Kundu (2.19) and the remembering rule after it (page image checked)'
