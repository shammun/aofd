  voiceover: Here's a first use. Let's find the length of p cross q, squared, without drawing anything. From our one-line
    formula, the k component of p cross q is epsilon k i j times p sub i q sub j. Moving k two places to the end doesn't change
    epsilon, so it's also epsilon i j k times p sub i q sub j. The length squared is this component times itself, summed over
    k. For the second copy we use new dummy letters, l and m. That gives epsilon i j k times epsilon k l m, times p sub i,
    q sub j, p sub l and q sub m. Now the epsilon delta relation replaces the two epsilons with delta i l delta j m, minus
    delta i m delta j l.
