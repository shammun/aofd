    zero volume. With epsilon, it''s zero because swapping two equal edges must flip the sign, and the only number equal to
    its own negative is zero. So leaning the parcel like this doesn''t change its volume: it''s still ten to the eight cubic
    metres. Above Brest that evening, the wind a kilometre up was more than three times as strong as at the ground, so real
