  voiceover: Let's try easy numbers first. Suppose the wind blows ten metres per second towards the east and thirty towards
    the north. And suppose the temperature drops three degrees for every hundred kilometres east, and two degrees for every
    hundred kilometres north. A hundred kilometres is ten to the five metres, so the slopes are minus three and minus two,
    times ten to the minus five kelvin per metre. A kelvin step is the same size as a degree Celsius step. Leaving the up
    part aside for now, the sum is ten times minus three, plus thirty times minus two. That's minus ninety times ten to the
    minus five, or minus nine times ten to the minus four kelvin per second. Times three thousand six hundred seconds in an
    hour, it's about minus three point two kelvin per hour.
  on_screen_eq:
