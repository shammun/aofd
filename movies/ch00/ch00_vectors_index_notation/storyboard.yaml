  visual: 'One beat per sentence, mini pictures left, symbols right (no boxes): S1 globe thumbnail ''10.3 °C'' + the Brest
    wind arrow; S2 e1 e2 e3 with the wind''s legs and the √ line ''9.3''; S3 the same arrow with the axes turning, ''34''
    unchanged; S4 tip-to-tail sum, the parallelogram, and the ''from q to p'' difference with hodograph and anomaly thumbnails;
    S5 u_i with ''three equations''; S6 u_j ∂T/∂x_j with the summed j gold; S7 the Brest map thumbnail ''+3.7 K/h'' (rose
    fixed thermometer glyph); S8 the delta_ij table thumbnail and delta_ij u_j = u_i.'
  voiceover: 'To sum up, a scalar is one number, like the temperature, and a vector is an arrow, like the wind. Its components
    are its steps along the unit vectors east, north and up, and its length, by Pythagoras, is the wind speed. The components
    change when we turn the axes, but the arrow and its length don''t. Vectors add tip to tail, or component by component,
    and p minus q is the arrow from the tip of q to the tip of p: a wind change, a wind shear, or an anomaly. In index notation,
    u sub i stands for all three components, and a free index means three equations. A repeated index is summed: that''s the
    Einstein convention, so u sub j times partial T by partial x sub j is the advection of temperature. Over Brest, it brought
    warmer air at about three point seven degrees per hour. The Kronecker delta is one for equal indices and zero otherwise,
    and it swaps one index for another.'
  on_screen_eq:
    latex: u_i,\quad u_j\frac{\partial T}{\partial x_j},\quad \delta_{ij}u_j = u_i
    vallis_eq: 'provenance only: recap of Kundu (2.2) and (2.17) (page images checked)'
