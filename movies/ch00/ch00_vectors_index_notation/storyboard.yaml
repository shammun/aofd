    to the north, house red), the teal wind arrow towards ENE (8, 6) direction. S3: orange pressure push (0, 12.5) north.
    S4: violet Coriolis push (6, -8). S5: rose friction (-6, -4.5) opposite the wind (with ''-'' glyph cue: dashed). S6-S8:
    the three arrows slide tip to tail and close into a 3-4-5 triangle (gold check); maths: east 0 + 6 - 6 = 0, north 12.5
    - 8 - 4.5 = 0 (units 10⁻⁴ m s⁻²). S9 keyword ''balance''. S10: gold arc showing the wind crossing the isobars towards
    L (about 37 degrees).'
  voiceover: 'Forces add like this too. Picture an air parcel near the ground, where three pushes act on each kilogram. The
    pressure push points towards low pressure, here straight north, with a size of twelve point five, in units of ten to the
    minus four metres per second squared. The Coriolis push is an apparent push, which appears because we measure the wind
    on a spinning Earth, and here it has components six and minus eight. Friction with the ground pulls back against the wind:
    minus six and minus four point five. Let''s add them tip to tail. The east parts give zero plus six minus six, which is
    zero. The north parts give twelve point five minus eight minus four point five, also zero. The three arrows close into
    a triangle, so the total push is zero. That means the parcel''s wind doesn''t change: the three pushes balance. Here the
    wind blows towards the east-north-east, partly across the lines of equal pressure, towards the low. How each of these
    pushes arises gets its own movies later in the series.'
  on_screen_eq:
    latex: (0,\,12.5) + (6,\,-8) + (-6,\,-4.5) = (0,\,0)
    vallis_eq: 'provenance only: our easy numbers (units 10⁻⁴ m s⁻²); the three-force picture is treated in the geostrophic
      (#30) and Ekman (#31) movies'
