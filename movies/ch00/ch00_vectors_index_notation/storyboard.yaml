  voiceover: 'Here''s what that means for a weather balloon. Think of the east distance from Brest, x one, as a map: at each
    place, its value is how far east that place is. It grows by one metre for every metre east, and it doesn''t change at
    all going north or up. So partial x sub i by partial x sub j is just delta i j. Now let the wind carry this map, exactly
    as it carried temperature. We get u sub j times partial x sub i by partial x sub j, which is u sub j times delta i j,
    which is u sub i. In words: as the balloon is carried along, its position changes at the wind''s velocity. A kilometre
    above Brest, it would drift five point eight metres east and thirty three point five metres north every second, about
    one hundred and twenty kilometres north in an hour.'
