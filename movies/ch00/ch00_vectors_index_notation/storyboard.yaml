    nine point three metres per second, from the south-south-east. A single number can''t describe this. We need to know how
    fast the air moves, and which way it goes. A quantity with a size and a direction is called a vector, and we draw it as
    an arrow, which we name with a bold letter: the wind vector is bold u. The arrow''s length shows the speed, and the arrow
    points the way the air is moving. Careful, though: weather reports give the direction the wind comes from. This wind comes
    from the south-south-east, so the air moves towards the north-north-west.'
