    about 49 degrees towards the low. S8: the ageostrophic arrow in warm white from the geostrophic tip to the real tip; S10
    ''(-19.9, -7.6)''. S9: maths ''u = u_g + u_ag''. S11: keywords ''friction'', ''towards the low''. Twelve other sea points
    show the same construction faintly.'
  voiceover: 'Now a real map. Here''s Ciarán at the same moment, with lines of equal pressure, called isobars, drawn every
    four hectopascals. A hectopascal is the unit weather maps use for pressure. If the pressure push and the Coriolis push
    balanced exactly, the wind would blow along the isobars. That imagined wind is called the geostrophic wind, and the geostrophic
    wind movie explains it in full. Over the Bay of Biscay, south of Brittany, it would blow seventeen point eight metres
    per second towards the east and twenty one towards the north. The real wind, ten metres above the sea, blew minus two
    point one towards the east, so a little west, and thirteen point four towards the north. The arrow we must add to the
    geostrophic wind to reach the real wind is called the ageostrophic wind. So the real wind is the geostrophic wind plus
    the ageostrophic wind. Here the ageostrophic part is large: minus nineteen point nine and minus seven point six. Friction
    with the sea slows the air and turns it across the isobars, towards the low pressure.'
