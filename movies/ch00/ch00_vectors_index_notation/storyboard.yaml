    (top right). S9: keyword ''wind speed''.'
  voiceover: 'How long is the arrow? On a flat map, Pythagoras'' theorem gives the length from two components: the square
    root of six squared plus eight squared, which is ten. In three dimensions, we use Pythagoras twice. First across the floor,
    to the point straight below the tip, and then up to the tip. So the length is the square root of the sum of all three
    components squared. The length is also called the magnitude, and we write it with a straight bar on each side of bold
    u. For the real wind at Brest, it''s the square root of minus four point six five, squared, plus eight point zero five
    squared, plus zero squared. That''s nine point three, the speed the station reported. So the magnitude of the wind vector
    is the wind speed.'
  on_screen_eq:
    latex: '|\mathbf u| = \sqrt{u^2 + v^2 + w^2}'
    vallis_eq: 'provenance only: length by Pythagoras (Kundu §2.8 ''magnitude'', unnumbered; also u_i u_i of (2.2) with a
