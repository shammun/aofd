    L (about 37 degrees).'
  voiceover: 'Forces add like this too. Picture an air parcel near the ground, where three pushes act on each kilogram. The
    pressure push points towards low pressure, here straight north, with a size of twelve point five, in units of ten to the
    minus four metres per second squared. The Coriolis push, from Earth''s spin, has components six and minus eight. Friction
    with the ground pulls back against the wind: minus six and minus four point five. Let''s add them tip to tail. The east
    parts give zero plus six minus six, which is zero. The north parts give twelve point five minus eight minus four point
    five, also zero. The three arrows close into a triangle, so the total push is zero. That means the parcel''s wind doesn''t
    change: the three pushes balance. Here the wind blows towards the east-north-east, partly across the lines of equal pressure,
    towards the low. How each of these pushes arises gets its own movies later in the series.'
  on_screen_eq:
    latex: (0,\,12.5) + (6,\,-8) + (-6,\,-4.5) = (0,\,0)
