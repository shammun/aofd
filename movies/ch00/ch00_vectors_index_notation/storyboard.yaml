    p_i q_i ''repeated -> add for 1, 2, 3''. S8: p·q = p_i q_i (96 px) with both sides coloured teal/orange.'
  voiceover: 'The dot product is a sum of three terms. With a sigma, the Greek capital letter for sum, we write it as the
    sum of p sub i times q sub i, for i from one to three. Look at the index i: it appears twice in the same term. Albert
    Einstein noticed that whenever an index appears twice like this, it''s always summed. So he simply stopped writing the
    sigma. This is the Einstein summation convention. When an index is repeated in a term, we add up the terms for one, two
    and three, even though no sum sign is written. So p dot q is just p sub i q sub i.'
  on_screen_eq:
    latex: \mathbf p\cdot\mathbf q = \sum_{i=1}^{3} p_i q_i = p_i q_i
