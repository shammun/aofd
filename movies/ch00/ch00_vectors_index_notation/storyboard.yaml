  visual: 'Full width: the latest GFS 250 hPa wind map over the North Atlantic (NEW D4, day of production; cmocean ''speed''-family
    sequential shading 0-80 m/s, colour bar ''m/s'' 52 px, streamlines white 1.5 px, coasts), a great-circle route New York
