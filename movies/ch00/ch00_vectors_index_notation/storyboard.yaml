    - delta_12 delta_21 = 1 - 0 = 1, check glyph. S4-S5: case (1, 2, 2, 1): -1 = -1, check glyph. S6: a 9 x 9 grid of the
    81 cases (i j rows, l m columns) fills with ticks in 1.5 s (teal check marks; values +1 teal, -1 rose with ''-'', 0 grey)
    with counter ''81 / 81''. S7 keyword ''all agree''.'
  voiceover: 'Let''s check it with numbers. Take i equal to one, j equal to two, l equal to one and m equal to two. On the
    left, only k equal to three survives: epsilon one two three times epsilon three one two, which is one times one, so one.
    On the right, it''s delta one one times delta two two, minus delta one two times delta two one: one minus zero, which
    is also one. Now swap l and m, so l is two and m is one. The left is epsilon one two three times epsilon three two one:
    one times minus one, so minus one. The right is zero minus one, minus one again. There are eighty one combinations in
    all, and a computer checks every one of them in a moment. They all agree.'
  on_screen_eq:
