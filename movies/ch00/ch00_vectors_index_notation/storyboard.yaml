  beat: 'index notation: subscripts'
  visual: 'Maths-only full-width scene with a small persistent 3-D axes glyph (top left, 300 px). S1: a crowd of letters appears:
    u, v, w / x, y, z / e_x, e_y, e_z ... overflowing (54-84 px), then dims. S2: the overflow hits the right edge (no clipping:
    they wrap and fade). S3: the axis glyph''s labels flip from ''east/north/up'' to ''1/2/3''. S4: (u, v, w) morphs into
    (u1, u2, u3) (96 px). S5: u_i (128 px hero) with a gold BraceNote ''i = 1, 2 or 3''. S6: gold pointer to the small i:
    ''sub''. S7: brace from u_i back to (u1, u2, u3): ''the whole list''. S8: keywords ''index notation'', ''index''.'
  voiceover: 'Now we have a naming problem. The wind''s components are u, v and w, the position''s are x, y and z, and the
    unit vectors have names of their own. With many vectors we''d run out of letters, and every equation would have to be
    written out three times. So let''s number the directions instead: one for east, two for north and three for up. The wind''s
    components become u one, u two and u three. Then we write u sub i. Sub means the small letter written below, and i stands
    for any of the numbers one, two or three. So u sub i is the whole list of the wind''s components, in just two symbols.
    This way of writing is called index notation, and i is called an index.'
  on_screen_eq:
    latex: u_i,\quad i = 1, 2, 3
    vallis_eq: 'provenance only: Kundu §2.1 text ''components ... denoted with an italic symbol having one index'' (page image
      checked)'
    page_png: ../Fluid Dynamics/chapters/pages/ch02/p067.png
