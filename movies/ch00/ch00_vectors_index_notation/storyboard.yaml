  visual: 'Picture zone: three.js 3 x 3 x 3 cube of 27 cells (i, j, k axes labelled 1-3), slowly orbiting. S2 keyword ''alternating
    tensor'', ''permutation symbol''; epsilon_ijk (96 px). S3: ''27 values'' counter. S4: cells (1,2,3), (2,3,1), (3,1,2)
    light teal ''+1'' (glyph ''+''). S5: (3,2,1), (2,1,3), (1,3,2) light rose ''-1'' (glyph ''-'', hatched). S6: the 21 others
    grey ''0'' (one 8-frame wave). S7: ''6 of 27''. Maths zone: the definition (Kundu 2.18) as three rows.'
  voiceover: 'To write this pattern with indices, we need a symbol that knows the order of one, two and three. It''s called
    the alternating tensor, or permutation symbol, and it''s written epsilon i j k. It has three indices, so it has twenty
    seven values. Epsilon i j k is plus one when i, j, k are one, two, three, or that order shifted round: two, three, one,
    or three, one, two. It''s minus one when the order is reversed: three, two, one, or two, one, three, or one, three, two.
    And it''s zero whenever two of the indices are equal. So only six of the twenty seven values aren''t zero.'
  on_screen_eq:
    latex: \varepsilon_{ijk} = \begin{cases}+1 & ijk = 123,\ 231,\ 312\\ 0 & \text{two indices equal}\\ -1 & ijk = 321,\ 213,\
      132\end{cases}
