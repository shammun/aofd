    we move only east, while north and up stay fixed. Going north, it''s partial T by partial x two, and going up, partial
    T by partial x three. In index notation, all three are partial T by partial x sub i. Together they make an arrow called
    the temperature gradient, read grad T. It points the way the temperature increases fastest. Partial derivatives and the
    gradient each get their own movie later in the series.'
