    and eighteen towards the north. The arrow we must add to the geostrophic wind to reach the real wind is called the ageostrophic
    wind. So the real wind is the geostrophic wind plus the ageostrophic wind. Here the ageostrophic part is large, about
    minus twenty one and minus seven. Friction with the sea slows the air and turns it across the isobars, and the air is
    racing round a tight curve.
