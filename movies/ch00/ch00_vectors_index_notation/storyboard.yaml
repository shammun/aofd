  voiceover: 'Index notation really shines when we follow the wind itself, because the wind carries its own motion along too.
    The advection of the wind is u sub j times partial u sub i by partial x sub j. It has one free index, i, so it''s three
    equations. And it has one dummy index, j, so each equation has three terms. That''s nine terms in one short line. For
    i equal to one, they read: u one times partial u one by partial x one, plus u two times partial u one by partial x two,
    plus u three times partial u one by partial x three. Weather forecast models work out all nine of these at millions of
    points, every few minutes. We''ll read this term piece by piece in the second movie on vector identities.'
