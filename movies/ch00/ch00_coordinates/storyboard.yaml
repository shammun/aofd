  voiceover: 'First, the shortest way between two places. On a flat sheet, it''s a straight line. On a sphere, it''s part of a great circle: a circle whose
    centre is the Earth''s centre, like the equator or any meridian. Picture a flat sheet slicing through London, Los Angeles and the Earth''s centre. Where
