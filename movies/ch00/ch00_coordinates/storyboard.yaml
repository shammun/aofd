  visual: 'Same polar map. S1: at one point, the eastward arrow (teal) and θ̂ round the pole coincide (gold ''same''); S2: the northward arrow points to the centre:
    ''−r̂'' (rose). S3: anticlockwise arrow (seen from above the North Pole). S4-S5: a hurricane thumbnail (s11) beside the vortex, with a size bar (Ian ~ 100 km
    vs vortex ~ 6000 km). S7: a gold cross at the vortex centre ''78.7° N'' over Greenland, off the pole. S8: polar rings re-centred on the vortex centre; the radial
    parts shrink (ratio from the data). S10: stratosphere-movie thumbnail.'
  voiceover: 'In this view, the eastward wind is the tangential wind round the pole. And the northward wind is the radial wind with a minus sign, because blowing
    north means blowing in, towards the pole. Westerly winds, the winds from the west, turn anticlockwise as seen from above the North Pole. So the polar vortex is
    like the hurricane''s spin, only far wider and slower to change. Unlike a hurricane, though, it isn''t fed by a warm sea: it forms because the polar stratosphere
    cools in the long winter night. And look where its centre is: not at the pole, but at almost seventy three degrees north, over the Barents Sea, north of Russia.
    [beat] If we put the origin at the vortex''s own centre instead, its winds become far more purely tangential. Choosing the origin is part of choosing good coordinates.
    When the vortex weakens or splits, cold air can spill south, which is a story for the stratosphere movie.'
