  beat: 'building block: area element and the sin phi rule'
  visual: 'Globe: one small patch at 45 N (gold) with its sides ''a δφ'' and ''a cos φ δλ''; maths ''dA = a² cos φ dφ dλ'' (Layered, cos φ highlighted).
    S5-S6: bands of patches fill from the equator northwards; a running area gauge rises like sin φ (chart in the maths zone: x latitude 0-90,
    y fraction 0-1, the sin curve drawing). S8-S9: at 30 N the gauge reads ''1/2'' (CalcStack ''sin 30° = 0.5''); the globe shades 30 S - 30 N
    teal: ''half of the Earth''. S11: a mini global-mean thumbnail: equal-sized grid boxes vs cos-weighted boxes.'
  voiceover: Distances give us areas. A small patch of the Earth's surface is the radius times d phi tall, and the radius times cosine phi times
    d lambda wide. So its area is the radius squared, times cosine phi, times d phi, times d lambda. Here's a lovely consequence. Let's add up
    all the patches between the equator and some latitude. Adding up is integrating, and the integral of cosine phi is sine phi. So the area between
    the equator and latitude phi grows like sine phi. [beat] The sine of thirty degrees is one half. So half of the northern hemisphere lies between
    the equator and thirty degrees north, and half of the whole Earth lies between thirty south and thirty north. [beat] The tropics and subtropics
    are huge, and the polar caps are small. That's why a global average temperature has to weight each latitude by cosine phi. Otherwise, the
    small polar boxes would count as much as the big tropical ones.
  on_screen_eq: {latex: 'dA=a^2\cos\varphi\,d\varphi\,d\lambda,\qquad \int_0^{\varphi}\cos\varphi''\,d\varphi''=\sin\varphi', vallis_eq: product
