    sentence is spoken.'
  voiceover: 'So why are there so many coordinate systems? There are three good reasons. The first is shape. When the coordinates match the shape
    of the problem, the numbers become simple: a ring round the eye is just r equals a constant, and the Earth''s surface is just r equals its
    radius. The second is measurement. Use the coordinates your instruments use: a radar sees distance and direction, a station feels east, north
    and up, and the data come on a latitude and longitude grid. The third is meaning. The right coordinates split a vector into the parts that
    physics cares about: spin and inflow round a storm, or along and across a coastline, as we''ll see soon. Now let''s put these ideas to work
