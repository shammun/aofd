    two k arrows ''≈ 4°''; then a third at Singapore ''≈ 101°''.'
  voiceover: 'Now let''s stand at a weather station, at Brest. Brest sits at the western tip of Brittany, with the Atlantic Ocean on three sides. A forecaster there
    doesn''t use axes from the Earth''s centre. She uses three local arrows: i hat pointing east, j hat pointing north, and k hat pointing straight up, away from
    the Earth''s centre. This is the local east, north, up frame. In it, the wind is u times i hat, plus v times j hat, plus w times k hat. Here, u is the eastward
    wind, v the northward wind, and w the upward wind. And i hat cross j hat is k hat, so the frame is right-handed, as in the cross product movie. Each station has
    its own frame. Let''s zoom back out to the whole globe. At Trappes, near Paris, four hundred and eighty kilometres east of Brest, up points in a direction about
    four degrees different. [beat] At Singapore, near the equator, up differs from Brest''s up by about a hundred and one degrees. [beat]'
