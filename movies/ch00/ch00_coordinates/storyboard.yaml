    centre path (gold dots, one per hour, continuity tracker) and a clock glyph; storm motion arrow ''≈ 15 m/s ENE'' (orange) at S2. S4: freeze at 03 UTC; the 200-km
    ring (teal). S5: the south and north sectors highlighted (bands) with ''≈ 19 m/s'' and ''≈ 8 m/s'' at their sides. S7-S8: at the south side, spin arrow (teal)
