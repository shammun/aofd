    also acts; it is ~20x smaller at 25 km: f v = 6.5e-5 x 37 = 2.4e-3 vs 0.055 m/s^2).', 's14: the outflow-aloft sign comes from D2 (ERA5 pressure levels);
    if D2 is not fetched, S9 says ''in a hurricane'' generically (it already does) and the sign tags are drawn from the textbook structure, labelled illustrative
    in the manifest.', 's19: ''once a day'' is the sidereal day for Omega = 7.292e-5 rad/s; speeds are Omega a cos phi on a sphere.', 's22: ERA5''s 0.25
    deg grid is the delivered latitude-longitude grid (interpolated from its ~31 km model grid); ''many modern models use other kinds of grid'' (e.g. ECMWF''s
    octahedral reduced Gaussian grid, ICON''s icosahedral grid) is said without naming them.', 's23: sin 30 = 1/2 is exact on a sphere; the WGS-84 ellipsoid
    changes it by < 0.3 %.', 's24: up-vector angles from sphere.unit_vector on a sphere (geocentric = geodetic here; the difference is < 0.2 deg).', 's25:
    the eastbound plane is a thought experiment; 74 km per degree at Brest; 12.19 deg in 1 h.', 's26: metric-term example uses easy numbers (10 m/s, 45
    deg); ''about sixty five times smaller than the Coriolis effect'' = f v / (u v tan phi / a) = 1.031e-3 / 1.570e-5 = 65.7.', 's29-s30: great circle and
