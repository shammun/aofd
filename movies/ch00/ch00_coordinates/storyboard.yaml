  voiceover: 'So the local arrows change as you move, just like r hat and theta hat. Let''s see how. Suppose a plane flies due east along the parallel through
    Brest, at two hundred and fifty metres per second. In one hour, it covers nine hundred kilometres. That''s nine hundred divided by seventy four kilometres
    per degree: about twelve degrees of longitude. [beat] So its east arrow has swung round the Earth''s axis by those same twelve degrees, exactly like
    theta hat swinging round a circle. Going north tips the arrows too: after a hundred and eleven kilometres north, the up arrow has tilted one degree
    towards the north. Written out, the rates of change of i hat, j hat and k hat for a moving air parcel each have a speed divided by a radius, the same
    pattern we found round the hurricane. Speed over radius is how fast the arrows turn.'
