    doesn''t head west-south-west, the way Los Angeles looks on a flat map. It leaves London heading north-west, at a bearing of about three hundred
    and twelve degrees, and climbs to about sixty two degrees north, near the west coast of Greenland. [beat] That''s why flights from Europe
    to California pass over Greenland and northern Canada.'
