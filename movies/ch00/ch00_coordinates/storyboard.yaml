    angle mark showing the distortion ''≥ 30°''. S1-S2: a real climate example: the latest complete month''s 2 m temperature anomaly against 1991-2020 (D4, ERA5 monthly)
    shaded on Mercator vs Equal Earth, so the Arctic warm area shrinks to its true size on the honest map. S7: two keywords ''conformal → winds, directions'', ''equal-area
    → amounts''. S8: reading-weather-maps thumbnail.'
  voiceover: 'For climate maps, sizes matter more. If we want to know how much of the Earth is warmer than usual, a map that inflates the polar regions would mislead
    us. So climate scientists often use equal-area maps, like the Equal Earth map. On it, every patch keeps its true relative area, so Greenland is shown at its real
    size, about a fourteenth of Africa. The price now is shape: towards the poles, shapes get skewed. At sixty degrees north, away from the middle of this map, angles
    can be off by thirty degrees or more. [beat] No flat map can keep both areas and shapes right everywhere. So the rule is: pick the map for the job. Use conformal
    maps for winds and directions, and equal-area maps for comparing amounts. We''ll read many maps like these in the movie on reading weather maps.'
