id: ch00_coordinates
title: 'Coordinates: on a plane, a cylinder and a sphere (and how the winds round a hurricane, great-circle routes and moving storms use them)'
version: 4
concepts:
- Cartesian coordinates and constant unit vectors (Kundu App. B §B.5)
- plane polar coordinates (r, theta), x = r cos theta, y = r sin theta; radians and arc length s = r theta
- polar unit vectors and their rates d r-hat/d theta = theta-hat, d theta-hat/d theta = -r-hat (Kundu App. B §B.5)
- vector components in polar coordinates as dot products; centripetal acceleration -v^2/r from turning unit vectors
- cylindrical coordinates (r, theta, z) (Kundu App. B §B.5)
- 'spherical coordinates: latitude, longitude, colatitude; position vector (Vallis §2.2.2, Fig. 2.3)'
- arc lengths on the sphere delta y = a delta phi, delta x = a cos phi delta lambda (Vallis §2.2.2); area element a^2 cos phi
- local east-north-up frame v = i u + j v + k w (Vallis (2.29)); rates of change of i, j, k (Vallis (2.39)); metric terms (Vallis (2.45))
- curvilinear coordinates and scale factors; the gradient on the sphere (Vallis (2.31)) named
- great circles, rhumb lines; map projections (plate carree, Mercator, Equal Earth, polar stereographic)
- rotation of axes x'_j = x_i C_ij (Kundu (2.5))
- Galilean transformation and the invariance of acceleration (Kundu §3.3, (3.9)); changing variables d/dt = d/dtau - U.grad (Kundu (B.2.2))
