  voiceover: 'So the local arrows change as you move, just like r hat and theta hat. Let''s see how. Suppose a plane flies due east along the parallel through Brest,
    at two hundred and fifty metres per second. In one hour, it covers nine hundred kilometres. That''s nine hundred divided by seventy four kilometres per degree:
