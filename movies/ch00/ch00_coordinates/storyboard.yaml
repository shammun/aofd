    blowing out to sea, at about eleven and a half metres per second across the shore. [beat] So the water was pushed away from the coast, and the water level in
    the bay fell instead of rising. It''s the same storm, on opposite sides of the eye, and the across-shore part flips its sign. Turned axes make that difference
