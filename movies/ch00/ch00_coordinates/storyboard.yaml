  beat: 'building block: cylindrical coordinates (r, theta, z)'
  visual: 'Full-width 3-D: three.js view of Ian''s core from above and to the side: a translucent cylinder of radius 25 km and height 15 km over the sea surface (GOES
    true colour patch as the floor); air-parcel streaks spiral in near the floor (rose radial arrows), rise in the eyewall (brown/teal vertical arrows), and flow
    out at the top (orange radial outward). On AT(4,''height, z''): a z axis; keyword ''cylindrical'' on AT(5). S6: three component arrows at one point labelled u_r,
    u_θ, w. S7: ẑ (orange) identical at three points; r̂, θ̂ turn. S9: the sign tags ''−'' near the sea, ''+'' near the top, from the ERA5 pressure-level azimuthal
    means (D2). Vertical exaggeration x10 said in the storyboard (narration says the heights).'
  voiceover: 'A hurricane isn''t flat, though. The air spirals in near the sea, rises in a ring of towering clouds round the eye, called the eyewall, and flows out
    near the top, about twelve to fifteen kilometres up. To describe that, we add a third coordinate: the height, z, straight up. The distance r, the angle theta
    and the height z together are called cylindrical coordinates, because all the places with the same r form a cylinder round the axis. The wind now has three parts:
    radial, tangential and vertical. The vertical unit vector, z hat, is the same everywhere, just like x hat. Only r hat and theta hat turn. So cylindrical coordinates
    are just polar coordinates with a height added. In a hurricane, the radial wind is negative near the sea, flowing in, and positive near the top, flowing out.'
  on_screen_eq:
    latex: \mathbf u=u_r\,\hat{\mathbf r}+u_\theta\,\hat{\boldsymbol\theta}+w\,\hat{\mathbf z}
    vallis_eq: none in Vallis; Kundu App. B §B.5 cylindrical coordinates (printed p. 865), velocity names after Kundu §3.1 Fig. 3.3
