  visual: 'Picture: the 25-km ring, an air-parcel glyph circling at constant speed with its velocity arrow (teal, ''37 θ̂'') and, at each position,
    θ̂ and r̂; the velocity arrow visibly turns. S5-S6: the derivation builds as Layered TeX with gold underbraces: ''d θ̂/dθ = −r̂'' (from s09,
    recalled as a mini picture) and ''dθ/dt = v/r'' (arc length rule); result ''−(v²/r) r̂'' with an inward rose arrow at the parcel. S8: CalcStack
    ''37² / 25 000 ≈ 0.055 m/s²''. S9: a bar pair ''gravity 9.8'' vs ''0.055'' (log bars, Balance-style) ''≈ 1/180''; then the eye''s low pressure
    (isobar ring) pushes inward (orange pressure-gradient arrow) on AT(9,''pressure''). S11 keyword ''steady components ≠ no acceleration''.'
  voiceover: 'Here''s a surprise. Picture an air parcel, a small volume of air that moves with the flow, going round the eye at a steady thirty
    seven metres per second, on that twenty five kilometre ring. Its tangential wind never changes. Is it accelerating? Yes, because its direction
    keeps changing, and polar coordinates show exactly why. Its velocity is thirty seven times theta hat, and theta hat turns as the parcel goes
    round. By the chain rule, from the derivatives movie, the rate of change of theta hat in time is its rate of change with theta, which is minus
    r hat, times how fast theta changes, which is the speed divided by the radius. So the acceleration is minus the speed squared over the radius,
    times r hat: it points in, towards the eye. [beat] With our numbers, it''s thirty seven squared, over twenty five thousand metres, which is
    about zero point zero five five metres per second squared. [beat] That''s almost two hundred times smaller than gravity, but something has
    to supply it, and here it''s mostly the pressure force, because the pressure is lowest in the eye. We''ll come back to this balance in the
    movie on the gradient wind. The lesson for now: when unit vectors turn, steady components can still mean acceleration.'
  on_screen_eq: {latex: '\frac{d}{dt}\big(v\,\hat{\boldsymbol\theta}\big)=v\,\frac{d\hat{\boldsymbol\theta}}{d\theta}\,\frac{d\theta}{dt}=-\frac{v^2}{r}\,\hat{\mathbf
