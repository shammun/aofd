  visual: 'Maths zone: the i component of (2.45) (96 px) with gold underbraces: ''Du/Dt'' = ''change of the number u'', ''− uv tan φ / a + uw/a''
    = ''turning arrows'' (metric terms, keyword). Picture: an air parcel on the globe moving north-east along a great circle at constant speed,
    with its u and v read-outs changing although no force acts (thought experiment). S6-S7: CalcStack ''10 × 10 × tan 45° / 6.37 × 10⁶ ≈ 1.6 ×
    10⁻⁵ m/s²''. S8: log bars: metric 1.6 × 10⁻⁵ vs Coriolis f v = 1.0 × 10⁻³ m/s² (''≈ 65×'').'
  voiceover: 'Why does that matter? Because Newton''s law is about the change of the whole wind vector, not just of its numbers. When the arrows
    turn, the change of the wind has extra pieces, even when u, v and w stay the same. For the eastward part, it''s the rate of change of u, minus
    u v tangent phi over the radius, plus u w over the radius. Those extra terms are called metric terms. They come only from the turning arrows
    of the coordinates. How big are they? For a wind of ten metres per second east and ten north, at forty five degrees, u v tangent phi over
    the radius is a hundred times one, over six point three seven million: about one point six times ten to the minus five metres per second squared.
    [beat] That''s about sixty five times smaller than the Coriolis effect on the same wind. So in one weather system they''re small, but across
    whole oceans and the whole globe, they add up. We''ll meet them again in the movie on the equations of motion.'
  on_screen_eq: {latex: '\frac{D\mathbf v}{Dt}\cdot\mathbf i=\frac{Du}{Dt}-\frac{uv\tan\varphi}{a}+\frac{uw}{a}', vallis_eq: '(2.45), i component,
