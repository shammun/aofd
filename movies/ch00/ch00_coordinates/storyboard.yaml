    kilometres. [beat] At Longyearbyen, cosine phi is zero point two, so one degree east is only about twenty three kilometres. [beat] And at the pole, where all
    the meridians meet, it''s zero. Like the segments of an orange, the meridians are widest apart at the equator, and they come together at the poles.'
