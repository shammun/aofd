honesty_notes:
- 's11: HRRR 3-km 10-m winds are an analysis, weaker than the official best track (IBTrACS USA 135 kt at 18 UTC 28 Sep 2022); the narration says so. Ring means from
  fluidpy.diag.cyclone.storm_relative_wind about the HRRR pressure centre (960.3 hPa).'
- 's12: ''about nineteen degrees'' is the ring-mean inflow angle at 25 km (18.6 deg, HRRR 18 UTC).'
- 's13: v^2/r with the ring-mean v_t; ''mostly the pressure force'' (the Coriolis force also acts; it is ~20x smaller at 25 km: f v = 6.5e-5 x 37 = 2.4e-3 vs 0.055
  m/s^2).'
- 's14: the outflow-aloft sign comes from D2 (ERA5 pressure levels); if D2 is not fetched, S9 says ''in a hurricane'' generically (it already does) and the sign tags
  are drawn from the textbook structure, labelled illustrative in the manifest.'
- 's19: ''once a day'' is the sidereal day for Omega = 7.292e-5 rad/s; speeds are Omega a cos phi on a sphere.'
- 's22: ERA5''s 0.25 deg grid is the delivered latitude-longitude grid (interpolated from its ~31 km model grid); ''many modern models use other kinds of grid'' (e.g.
  ECMWF''s octahedral reduced Gaussian grid, ICON''s icosahedral grid) is said without naming them.'
- 's23: sin 30 = 1/2 is exact on a sphere; the WGS-84 ellipsoid changes it by < 0.3 %.'
- 's24: up-vector angles from sphere.unit_vector on a sphere (geocentric = geodetic here; the difference is < 0.2 deg).'
- 's25: the eastbound plane is a thought experiment; 74 km per degree at Brest; 12.19 deg in 1 h.'
- 's26: metric-term example uses easy numbers (10 m/s, 45 deg); ''about sixty five times smaller than the Coriolis effect'' = f v / (u v tan phi / a) = 1.031e-3 /
  1.570e-5 = 65.7.'
- 's29-s30: great circle and rhumb line on a sphere of radius 6371 km between the airport coordinates (LHR 51.47 N 0.45 W; LAX 33.94 N 118.41 W); real flights also
  follow winds and airways, so ''pass over Greenland and northern Canada'' is said for the route geometry, not a specific flight.'
- 's33: Greenland vs Africa areas from Natural Earth admin-0 polygons with sphere.polygon_area (planning: ~2.17 and ~30.4 million km2, ratio ~14); the builder asserts
  the ratio.'
- 's34: Equal Earth angular distortion at 60 N reaches 31.4 deg at 30 deg from the central meridian and more further out (''thirty degrees or more'').'
- 's35-s36: 10 hPa heights from NCEP/NCAR R1 daily means (2.5 deg); ''about thirty kilometres up'' for 10 hPa (28-31 km on that day). The vortex is said to form ''because
  the polar stratosphere cools in the long winter night'' (radiative cooling, standard); ''cold air can spill south'' is said for weakening/splitting events in general
  and pointed to the stratosphere movie. The re-centring claim (S8) is asserted by CHECK DC37 or reworded.'
- 's39-s40: along/across components of the HRRR 10-m wind (20 UTC 28 Sep 2022) with fluidpy.geo.vectors.components_in_axes; the coast bearings (329 deg SW Florida,
  355 deg Pinellas) are great-circle bearings between two coastline points (planning) and are re-measured from the NE 10 m coastline by the builder. The 10-15 ft
  surge above ground at Fort Myers Beach is the NHC Tropical Cyclone Report (Bucci et al. 2023, AL092022) value, to be confirmed by the research-scout; the Tampa
  Bay drop is asserted with NOAA CO-OPS gauges (D3) or S7 is reworded. ''Mostly by that push, and a little by the low pressure'' (inverse-barometer ~0.3 m for ~30
  hPa, vs metres of wind set-up).'
- 's42: the ball and train are a thought experiment; (K 3.9) is shown, not derived beyond ''dU/dt = 0''.'
- 's43-s44: Ciaran''s centre is tracked by continuity from its 12 UTC 2 Nov position (52.5 N, 1.75 E) backwards and forwards (HOUSE_STYLE §7 storm-tracker rule; no
  box minimum); hourly steps 24-109 km; motion 14.6 m/s toward 71 deg (00-06 UTC 2 Nov). Ring 200 km at 03 UTC: earth-relative sector means S 18.8 / N 8.4 m/s; ring
  means v_t 14.1 vs 13.8, v_r -6.0 vs -5.9 (earth vs storm-relative); 10-m ERA5 winds. The narration does not interpret the storm-relative sector asymmetry (land/sea
  friction mixes in).'
- 's44: ''a gust of eighty four knots'' = the 911 group of the 03 UTC 2 Nov 2023 Brest SYNOP (ISD, on disk).'
- 's45: dp/dt by centred hourly differences of ERA5 msl at Plymouth (50.25 N, 4.25 W), 00 UTC 2 Nov; the sliding term -U.grad p with sphere.gradient and the tracked
