  beat: 'building block: rotating the axes'
  visual: 'Picture: the east wind arrow (teal, 10 m/s) at the origin with the old axes (orange, faint) and new axes x′, y′ (orange) turned by α (gold arc, ''anticlockwise
    seen from above''). S4-S5: x̂′ = (cos α, sin α), ŷ′ = (−sin α, cos α) at the tips. S6-S7: the two lines (84 px). S8-S10: α = 30°: shadows of the wind on x′ (orange
    band) and y′ (rose band, ''−''); CalcStack ''10 × 0.87 ≈ 8.7'', ''−10 × 0.5 = −5'', ''√(8.66² + 5²) = 10''.'
  voiceover: 'Now let''s change coordinates without moving the origin: we''ll just turn the axes. The arrow stays the same; only the rulers we measure it with turn.
    Say the new x axis is turned by an angle alpha, anticlockwise as seen from above. Its unit vector, x hat prime, is cosine alpha, sine alpha. The new y axis, y
    hat prime, is minus sine alpha, cosine alpha. The new components are just dot products with the new arrows. So x prime is x cosine alpha plus y sine alpha, and
    y prime is minus x sine alpha plus y cosine alpha. Let''s try it on our east wind of ten metres per second, with the axes turned by thirty degrees. The new x
    prime is ten times zero point eight seven, about eight point seven. [beat] And y prime is minus ten times zero point five, which is minus five. [beat] And the
    length is still ten, because the arrow itself didn''t change.'
  on_screen_eq: &id011
    latex: x'=x\cos\alpha+y\sin\alpha,\qquad y'=-x\sin\alpha+y\cos\alpha
