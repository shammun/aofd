  visual: 'Two rings side by side (earth-relative left, storm-relative right) at 03 UTC with their arrows; under each the ring-mean tangential ''≈ 14 m/s''
    and ring-mean radial ''≈ −6 m/s'' (rose) appear on S2 and S3, gold ''same'' links between the pairs. S5: a uniform arrow field (orange) on a circle:
