  beat: 'building block: the Galilean transformation'
  visual: 'Picture: a code-drawn train on a straight track across the screen at a steady 20 m/s (slate), a walker glyph on it at 1.5 m/s (teal
    arrow, ''u′''), an observer beside the track (station icon). Train arrow ''U = 20'' (orange). S3: CalcStack ''20 + 1.5 = 21.5 m/s''. S5: ''u
    = U + u′''. S6: two rulers, one on the ground (x) and one riding on the train (x′), sliding apart as ''U t''; both clocks tick the same. S7:
    keyword ''Galilean transformation''. Sound: a soft rail rhythm, -30 LUFS, under S1-S2 only.'
  voiceover: 'Our last change of coordinates lets the origin move. Imagine you''re on a train gliding along a straight track at a steady twenty
    metres per second. You walk towards the front at one and a half metres per second. Someone standing beside the track sees you moving at twenty
    plus one and a half: twenty one and a half metres per second. [beat] So velocities add. The velocity seen from the ground is the train''s
    velocity, capital U, plus the velocity seen on the train, u prime. And positions shift as time goes on: x equals x prime plus capital U times
    small t, while both clocks show the same time. Switching between two frames like this, moving at a steady velocity without turning, is called
    a Galilean transformation, after Galileo Galilei.'
