    over BMNG, one box highlighted ''27.8 km'' tall, ''18.5 km'' wide; right Svalbard (Longyearbyen billboard) with the same grid, one box ''27.8
    km'' by ''5.7 km''. S5-S6: a too-wide ghost box (rose, dashed) showing ''forgot the cos φ'' at Svalbard (x4.9). S7: a small globe insert with
    the lat-lon grid crowding at the pole and a keyword ''other grids'' with a faint icosahedral mesh.'
  voiceover: This matters every time we use weather data. ERA5, the reanalysis we've used in this series, gives values on a grid every quarter
    of a degree in latitude and longitude. Near Brest, one grid box is about twenty eight kilometres from south to north, but only about eighteen
    and a half kilometres from west to east. [beat] At Svalbard, it's still twenty eight kilometres tall, but under six kilometres wide. [beat]
    So the boxes get thinner and thinner towards the poles. Forget the cosine, and every east-west distance near the poles comes out several times
    too big, and every east-west slope several times too small. A weather model on such a grid also has to take very short time steps near the
    poles, which is one reason many modern models use other kinds of grid.
