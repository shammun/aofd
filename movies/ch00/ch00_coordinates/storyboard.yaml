    no accident. A steady, uniform wind blows as much round one side of a circle as it blows back round the other, so it adds nothing to the average
    spin, or to the average inflow. The spin belongs to the storm, and the motion belongs to the whole pattern. For a house on the coast, though,
    the ground-relative wind is what counts, and that's why the strongest winds came on the storm's southern side. That night, the weather station
    at Brest measured a gust of eighty four knots, about a hundred and fifty six kilometres per hour.
