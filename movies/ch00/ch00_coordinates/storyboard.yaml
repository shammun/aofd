    eye. On a ring twenty five kilometres from the centre, the tangential wind averages about thirty seven metres per second. [beat] That''s about
    a hundred and thirty kilometres per hour, anticlockwise as seen from above, as in every northern hemisphere hurricane. The radial wind averages
    about minus twelve and a half metres per second. [beat] The minus sign means the air is flowing in, towards the eye. The real storm was even
