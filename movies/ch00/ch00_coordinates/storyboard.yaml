    centre. Maths: ''δx = a cos φ δλ'' with a gold underbrace under ''a cos φ'': ''radius of the parallel''. S5-S8: four one-degree east steps on four parallels
    (equator, Brest, Longyearbyen, near the pole), each a gold band with its length on its sentence: ''111 km'', ''74 km'', ''23 km'', ''0''; and the cos
