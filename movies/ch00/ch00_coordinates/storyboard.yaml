  beat: 'why: three good reasons'
  visual: 'Three beats, one per reason, each a mini picture that fills the full width in turn (no headings): (1) shape: the Ian ring ''r = const'' and the
    globe ''r = a''; (2) measurement: a radar''s rings, a station''s ENU arrows, the ERA5 lat-lon grid; (3) meaning: the hurricane''s spin and inflow arrows,
    and a coast with along/across arrows (preview of s39). S8: the three mini pictures shrink into a row as the bridge sentence is spoken.'
  voiceover: 'So why are there so many coordinate systems? There are three good reasons. The first is shape. When the coordinates match the shape of the
    problem, the numbers become simple: a ring round the eye is just r equals a constant, and the Earth''s surface is just r equals its radius. The second
    is measurement. Use the coordinates your instruments use: a radar sees distance and direction, a station feels east, north and up, and the data come
    on a latitude and longitude grid. The third is meaning. The right coordinates split a vector into the parts that physics cares about: spin and inflow
    round a storm, or along and across a coastline, as we''ll see soon. Now let''s put these ideas to work on maps, on a storm surge, and on a moving storm.'
