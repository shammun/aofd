    tapering to the poles.'
  voiceover: 'Going east is different. Walking east, you follow a parallel, and a parallel is a circle round the Earth''s axis, not round its centre. Its
    radius is the one we just found: the Earth''s radius times cosine phi. So the distance east is the radius, times cosine phi, times the change in longitude.
    That cosine phi is there because the circle you walk on shrinks as you get closer to the pole. Let''s compare one degree of longitude at four places.
    At the equator, cosine phi is one, so it''s a hundred and eleven kilometres, the same as a degree north. [beat] At Brest, cosine phi is zero point six
    six, so it''s about seventy four kilometres. [beat] At Longyearbyen, cosine phi is zero point two, so one degree east is only about twenty three kilometres.
    [beat] And at the pole, where all the meridians meet, it''s zero. Like the segments of an orange, the meridians are widest apart at the equator, and
    they come together at the poles.'
