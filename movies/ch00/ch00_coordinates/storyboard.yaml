  voiceover: 'The moving frame also explains what a fixed barometer sees. Picture the pressure pattern as a frozen map, sliding east-north-east at fifteen
    metres per second. A barometer that never moves sees the pressure fall as the low approaches, even if the storm itself isn''t deepening at all. Changing
    to the moving frame splits the rate of change at a fixed place into two parts: the change seen by someone riding with the pattern, minus the pattern''s
    velocity times the slope of the pressure. At Plymouth, on England''s south coast, at midnight, the pressure was falling by about three point eight hectopascals
    per hour. [beat] The sliding pattern alone accounts for about three point two of them. [beat] The remaining zero point six is the storm itself changing
    as it moved. So most of what the barometer saw was the storm just arriving. This is the same idea as advection in the dot product movie, and we''ll
    build it fully in the material derivative movie.'
