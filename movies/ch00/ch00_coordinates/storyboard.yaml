  voiceover: This matters every time we use weather data. ERA5, the reanalysis we've used in this series, gives values on a grid every quarter of a degree in latitude
    and longitude. Near Brest, one grid box is about twenty eight kilometres from south to north, but only about eighteen and a half kilometres from west to east.
    [beat] At Svalbard, it's still twenty eight kilometres tall, but under six kilometres wide. [beat] So the boxes get thinner and thinner towards the poles. Forget
    the cosine, and every east-west distance near the poles comes out several times too big, and every east-west slope several times too small. A weather model on
    such a grid also has to take very short time steps near the poles, which is one reason many modern models use other kinds of grid.
