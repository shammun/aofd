  visual: 'Continuation of the morph into Mercator (y stretched by the same 1/cos φ; Tissot ellipses become circles of growing size). S3-S4: keyword ''conformal'';
    a small angle at Brest identical on globe and map. S5: the London-Los Angeles rhumb line straight on the map, the great circle curved. S6-S8: Layered TeX: ''dy
    = a dφ / cos φ'' → ''y = a ln tan(π/4 + φ/2)''; underbrace ''slope = a / cos φ'' with a derivatives-movie thumbnail. S9: the map''s top runs off as the latitude
    approaches 90 (y axis tick ''85° → 3.1 a'').'
  voiceover: 'In fifteen sixty nine, Gerardus Mercator fixed the shapes. His idea: if east-west is stretched by one over cosine phi, stretch north-south by the same
    amount. Then a small circle stays a circle, and a small angle on the map is the true angle on the Earth. Maps like this are called conformal. That''s exactly
    what a navigator wants: a line of constant bearing, the rhumb line, is a straight line on a Mercator map. To build it, each small step north, the radius times
    d phi, is drawn one over cosine phi times longer. Adding up all those steps gives the height on the map: the Earth''s radius, times the natural log of the tangent
    of forty five degrees plus half the latitude. You can check it with the derivatives movie: its slope with respect to phi is the radius over cosine phi. [beat]
    Near the poles, that height runs off to infinity, so a Mercator map can never show the poles.'
  on_screen_eq:
    latex: y=a\,\ln\tan\!\left(\frac{\pi}{4}+\frac{\varphi}{2}\right),\qquad \frac{dy}{d\varphi}=\frac{a}{\cos\varphi}
