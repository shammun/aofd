  beat: 'building block: origin, axes, coordinates'
  visual: 'Picture zone x 80-1000: a flat, real map patch round Trappes (BMNG + NE 10 m admin lines, 30 x 30 km window) as the ''flat map''; a
    slate station icon (PoleThermometer) at the origin on AT(4,''weather station''). S5: an east axis (orange) and a north axis (orange) draw
    through it; keyword ''axes'' on AT(6,''axes''). S7: a balloon glyph drifts 3 km east and 4 km north (dashed teal path, km ticks 52 px). S8:
    ''(3, 4)'' appears at the balloon tip (68 px) with gold links to the two dashed legs. S9: keyword ''coordinates''; S10: ''Cartesian'' (54
    px). Maths zone x 1060-1840: the pair ''(x, y) = (3, 4)'' builds with the legs'' colours.'
  voiceover: Let's start with a flat map. To say where something is, we need a starting point, and some directions to count from. The starting
    point is called the origin. Let's put it at a weather station. Now draw one line through it pointing east, and one pointing north. These lines
    are called the axes. A weather balloon drifts three kilometres east and four kilometres north of the station. So we can write its position
    as the pair of numbers three and four. [beat] These two numbers are called its coordinates, and together they pin down one place on the map.
    Measuring along straight axes at right angles, like this, is called Cartesian coordinates, after the French thinker René Descartes.
  on_screen_eq: null
  physics_source:
    fn: builder-only geometry (km offsets on a local tangent plane)
    params: {east_km: 3, north_km: 4}
    test: CHECK DC02
