    ''5 × 0.2 = 1 km'', ''50 × 0.2 = 10 km''. S9: brace ''same angle'' across both wedges.'
  voiceover: 'Before polar coordinates can do their real work, we need one more building block: measuring angles in radians. Take a circle of radius r,
    and walk along its edge. The angle in radians is the distance you walked, divided by the radius. So the distance along the edge, called the arc length,
    is the radius times the angle. A full circle is two pi radians, because its edge is two pi times the radius. So one radian is about fifty seven degrees.
    Let''s try easy numbers. On a ring five kilometres from the station, turning by zero point two radians walks you five times zero point two, which is
    one kilometre. [beat] On a ring fifty kilometres out, the same turn walks you ten kilometres. [beat] The same angle gives ten times the distance. Keep
    this rule in mind, because it explains a lot about maps of the Earth.'
