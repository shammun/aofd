  beat: 'why: accelerations are the same in both frames (K 3.9)'
  visual: 'Maths: Layered TeX ''d u/dt = d U/dt + d u′/dt'', the dU/dt struck (Strike) with ''= 0, U steady''; result ''a = a′'' (gold). Picture: a ball dropped on
    the train falls straight down for the rider and along a parabola for the ground observer; at three moments both views show the same downward acceleration arrow
    ''9.8 m/s²'' (brown, gravity). S6-S7: (K 3.9) appears with underbraces ''local change'' (slate) and ''advection'' (teal) on each side, and a sum brace ''same''.
    S8-S9: a spinning turntable thumbnail with a rose ''extra terms'' tag (back-pointer to #3, the cross product movie on our spinning Earth; plan v5).'
  voiceover: 'Here''s the beautiful part. What happens to accelerations? Let''s take the rate of change of u, which is capital U plus u prime. The rate of change
    of capital U is zero, because the train''s velocity never changes. So the rate of change of u equals the rate of change of u prime: the acceleration is the same
    in both frames. [beat] Drop a ball on the smooth train, and it falls straight down, speeding up by nine point eight metres per second every second, exactly as
    it does for the person beside the track. And since Newton''s law says force equals mass times acceleration, the same forces explain the motion in both frames.
    For a fluid, the acceleration of an air parcel is the local change of the wind plus the advection term. Each piece can differ between the two frames, but their
    sum is the same. That''s only true for a frame moving steadily in a straight line. A frame that turns, like the spinning Earth, adds new terms, the Coriolis and
    centrifugal effects, which we met in the cross product movie on our spinning Earth.'
  on_screen_eq:
    latex: \frac{\partial\mathbf u}{\partial t}+(\mathbf u\cdot\nabla)\mathbf u=\frac{\partial\mathbf u'}{\partial t'}+(\mathbf u'\cdot\nabla')\mathbf u'
    vallis_eq: none in Vallis; Kundu (3.9)
    page_png: ../Fluid Dynamics/chapters/pages/ch03/p101.png
  physics_source:
    fn: fluidpy.core.kinematics.acceleration + galilean_transform
