  voiceover: 'Now let''s measure distances on the sphere. Going north along a meridian, you walk on a circle whose radius is the full radius of the Earth, because
    every meridian is half of a circle round the centre. So by the arc length rule, the distance north is the Earth''s radius times the change in latitude, in radians.
    Let''s find the length of one degree. One degree is pi over one hundred and eighty, which is zero point zero one seven four five radians. Times six thousand three
    hundred and seventy one kilometres, that''s about one hundred and eleven point two kilometres. [beat] And it''s the same at every latitude: a degree north is
    always about a hundred and eleven kilometres. One minute of latitude, a sixtieth of a degree, is about one point eight five kilometres, which is the nautical
    mile from the weather basics movie.'
