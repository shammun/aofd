  visual: 'Two views side by side, both three.js. Left (side view, cut through Brest''s meridian): the radius (teal) at angle φ; the vertical drop to the
    equator plane (orange, ''a sin φ'') and the horizontal leg to the axis (orange, ''a cos φ''), right-angle tick. Right (top view from above the pole):
    the ''a cos φ'' leg in the equator plane at angle λ splits into ''a cos φ cos λ'' and ''a cos φ sin λ'' legs; keyword ''polar coordinates again''. S9:
    the three-line equation (96 px) in the maths zone. S10-S11: CalcStack ''6371 × 0.748 ≈ 4760 km'', ''6371 × 0.664 ≈ 4230 km'' with gold links to the
    two legs.'
  voiceover: 'Where exactly is Brest in space? Let''s find its position vector, the arrow from the Earth''s centre to Brest. We''ll do it in two steps,
    using a right triangle each time. First, look at the Earth from the side. The line to Brest makes the angle phi with the equator plane. So Brest''s
    height above the equator plane is the Earth''s radius times sine phi. And its distance from the Earth''s axis is the radius times cosine phi. Second,
    look down from above the North Pole. In the equator plane, that distance from the axis points at the angle lambda. That''s polar coordinates in a flat
    plane again, so it splits into a cosine lambda part and a sine lambda part. Putting it together: x is the radius times cosine phi times cosine lambda,
    y is the radius times cosine phi times sine lambda, and z is the radius times sine phi. For Brest, the height above the equator plane is six thousand
    three hundred and seventy one kilometres times zero point seven four eight, which is about four thousand seven hundred and sixty kilometres. [beat]
    And its distance from the axis is six thousand three hundred and seventy one times zero point six six four: about four thousand two hundred and thirty
    kilometres. [beat]'
  on_screen_eq: {latex: 'x=a\cos\varphi\cos\lambda,\qquad y=a\cos\varphi\sin\lambda,\qquad z=a\sin\varphi', vallis_eq: 'Vallis §2.2.2 coordinates (lambda,
