    Colour = u_r on one diverging scale centred on 0 (rose with hatching + ''−'' glyph for inflow, orange for outflow, near-page at 0), shared colour bar
    ''m/s'' (−10 ... +10, 52-px ticks) in the text column beside the stack, visible throughout. On each layer: the 200-km ring (teal, thin) and short tangential-wind
    arrows (teal, moving dashes, anticlockwise seen from above); a ''z'' axis (orange) on the stack''s left edge with km ticks. Camera: S1-S3 hover from
