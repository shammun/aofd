  beat: 'building block: polar coordinates (r, theta)'
  visual: 'Picture: the balloon at (3, 4) on the map; a teal line from the station to it labelled ''r'' at its midpoint on AT(2,''called r'').
    S3: the Pythagoras calc in the maths zone: CalcStack ''r = √(3² + 4²) = √25 = 5 km'' with the two legs highlighted and gold-linked to 3² and
    4². S5: an arc from the east axis to the line, slate, labelled ''θ'' on AT(5,''called theta''); a small curved arrow shows ''anticlockwise
    (seen from above)''. S7: ''tan θ = 4/3 → θ ≈ 53°''. S8: ''(r, θ) = (5 km, 53°)'' at the tip (68 px). S10 on AT(10,''weather radar''): range
    rings every 1 km and spokes every 30 degrees fade in round the station (radar look).'
  voiceover: 'Instead of going east and north, we can give two other numbers: how far away the balloon is, and in which direction. The distance
    from the origin is called r. By Pythagoras, r is the square root of three squared plus four squared, which is the square root of twenty five:
    five kilometres. [beat] The direction is an angle, called theta. Mathematicians measure it from the east axis, turning anticlockwise as seen
    from above. Its tangent is four over three, so theta is about fifty three degrees. [beat] So the same balloon is at r equals five kilometres,
    and theta equals fifty three degrees. These two numbers are called polar coordinates. A weather radar measures exactly this pair: how far
    away the raindrops are, and in which direction.'
