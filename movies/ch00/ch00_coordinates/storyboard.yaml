  voiceover: 'Latitude says how far north or south a place is. Draw a line from the Earth''s centre to the place. Latitude is the angle between that line
    and the plane of the equator. We write it phi. At the equator, phi is zero. At the North Pole, it''s ninety degrees north. At the South Pole, it''s
    ninety degrees south, which we write as minus ninety. Brest, a port at the western tip of France, is at about forty eight point four degrees north.
    All the places with the same latitude form a circle round the Earth, called a parallel. One caution: many maths and physics books measure the angle
    down from the North Pole instead. That angle is called the colatitude, and it''s ninety degrees minus the latitude. So sine and cosine swap places between
    the two conventions.'
