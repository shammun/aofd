  voiceover: Can we go back the other way? Yes. Think of the right triangle with the balloon at its tip. Its long side is r, and its angle at
    the station is theta. The side going east is r times cosine theta, and the side going north is r times sine theta. Let's check. Five times
    the cosine of fifty three degrees is five times zero point six, which is three. And five times zero point eight is four. [beat] So x equals
    r cosine theta, and y equals r sine theta. These two lines are all we need to switch between the two systems.
