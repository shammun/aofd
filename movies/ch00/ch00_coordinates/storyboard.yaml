  visual: 'Two rings side by side (earth-relative left, storm-relative right) at 03 UTC with their arrows; under each the ring-mean tangential ''≈ 14 m/s'' and ring-mean
    radial ''≈ −6 m/s'' (rose) appear on S2 and S3, gold ''same'' links between the pairs. S5: a uniform arrow field (orange) on a circle: its tangential parts plus
    on one side, minus on the other (teal / rose bands) summing to zero. S7-S8: back to the earth-relative map with a house icon on the Brittany coast; S8 ''gust
    84 kt ≈ 156 km/h'' at Brest (slate).'
  voiceover: So what changes, and what doesn't? The wind at each point changes by fifteen metres per second. But the average spin round the ring is about fourteen
    metres per second in both frames. [beat] And the average inflow is about six metres per second in both frames. [beat] That's no accident. A steady, uniform wind
    blows as much round one side of a circle as it blows back round the other, so it adds nothing to the average spin, or to the average inflow. The spin belongs
    to the storm, and the motion belongs to the whole pattern. For a house on the coast, though, the ground-relative wind is what counts, and that's why the strongest
    winds came on the storm's southern side. That night, the weather station at Brest measured a gust of eighty four knots, about a hundred and fifty six kilometres
    per hour.
