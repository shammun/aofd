  beat: 'building block: Cartesian unit vectors are the same everywhere'
  visual: 'Same map. S1: unit arrows x hat and y hat (orange, 10 px, 40-px heads) grow at the origin; TipLabels ''x hat'' rendered as x̂, ŷ. S3: ''3 x̂
    + 4 ŷ'' (68 px) beside the balloon with the 3 and the 4 linked to the legs. S5-S6: the balloon jumps to four other places; at each, a copy of x̂, ŷ
    appears identical (same angle, same length), with a gold ''same'' tick between two copies. S8-S9: a cross-fade to two small inserts: Ian''s eye (spiral)
    and a radar''s range rings, both with the square grid overlaid and visibly not matching.'
  voiceover: 'Each axis comes with a unit vector: an arrow of length one that points along it. We write x hat for the arrow pointing east, and y hat for
    the arrow pointing north. The balloon''s position is three times x hat, plus four times y hat. We met arrows like these in the vectors movie of this
    series. Here''s their key property: x hat points the same way everywhere on the map. Move the balloon anywhere you like, and the two arrows don''t change.
    That''s what makes Cartesian coordinates so easy to work with. But many things in the weather aren''t laid out in squares. A hurricane spins round its
    eye, and a weather radar looks out in rings. For those, there''s a better way to say where something is.'
