    keywords ''directions, not speeds'' and ''r, θ, z'' in the text column. No title on the stack.'
  voiceover: 'Let''s check that with Ian''s real winds. Here are five layers of air round Ian''s eye, at that same hour, from the reanalysis called ERA5.
    They run from about three hundred metres above the sea to about fifteen kilometres up. The colour on each layer is the radial wind: rose, with a minus
    sign, where the air flows in, and orange where it flows out. On the lowest layer, the air flows in almost everywhere. On a ring two hundred kilometres
    from the eye, it averages about minus six metres per second. [beat] At about one and a half kilometres, the inflow has almost died away. At about six
    kilometres, in the middle, the air hardly flows in or out at all; near the eye, it rises instead. Near the top, at about twelve and a half and fifteen
    kilometres, the sign flips. On the same ring, the air flows out at about four metres per second. [beat] Let''s take a short, closer look, from just
    above the sea, up the side of the stack. In at the bottom, up through the middle, and out at the top. This reanalysis smooths the strongest winds, so
    we use it for the directions, not the speeds. And every layer is described by the same three coordinates: r, theta and z.'
