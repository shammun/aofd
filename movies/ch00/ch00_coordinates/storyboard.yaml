  visual: 'Three beats, one per reason, each a mini picture that fills the full width in turn (no headings): (1) shape: the Ian ring ''r = const''
    and the globe ''r = a''; (2) measurement: a radar''s rings, a station''s ENU arrows, the ERA5 lat-lon grid; (3) meaning: the hurricane''s
