  beat: 'intuition: a cos phi is a cylindrical radius; speed of the spinning ground'
  visual: 'three.js globe spinning slowly (one turn in 20 s, said implicitly by the narration ''once a day''), with the Earth''s axis (slate) and three parallels
    drawn as rings (equator, Brest, Longyearbyen) plus a faint cylinder through Brest''s ring (the ''cylindrical coordinate''). Each ring carries a teal speed arrow
    whose length is proportional to Ω a cos φ; numbers at the tips on their sentences: ''465 m/s'' (S5), ''309 m/s'' (S6), ''95 m/s'' (S7), ''0'' at the pole (S8).
    Maths: ''Ω = 7.29 × 10⁻⁵ rad/s'', ''U = Ω a cos φ'', CalcStack ''7.29 × 10⁻⁵ × 6.371 × 10⁶ ≈ 465 m/s''. Billboards ''Brest'', ''Longyearbyen (Svalbard)''.'
  voiceover: 'That distance from the axis, the radius times cosine phi, deserves a second look, because it''s a cylindrical coordinate. The Earth spins once a day
    round its axis, so every place travels round a circle with that radius. The spin rate, called capital Omega, is seven point two nine times ten to the minus five
    radians per second. The ground''s speed is the spin rate times the radius of its circle. At the equator, the circle has the full radius, so the ground moves at
    seven point two nine times ten to the minus five, times six point three seven one million metres: about four hundred and sixty five metres per second. [beat]
    At Brest, the circle is two thirds as big, so the ground moves at about three hundred and nine metres per second. [beat] At Longyearbyen, on the Arctic islands
    of Svalbard, seventy eight degrees north, it''s only about ninety five. [beat] And at the poles, it''s zero. This shrinking circle is part of the reason the Earth''s
    spin affects winds differently at different latitudes, as we saw in the cross product movie on our spinning Earth.'
  on_screen_eq:
    latex: U=\Omega\,a\cos\varphi
    vallis_eq: (2.36) Omega = Omega (j cos theta + k sin theta) and |Omega x r| on the surface (our step; the cross-product movie's Omega x r)
