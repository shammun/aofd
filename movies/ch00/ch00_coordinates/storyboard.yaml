    (teal) on each side, and a sum brace ''same''. S8-S9: a spinning turntable thumbnail with a rose ''extra terms'' tag (Coriolis movie).'
  voiceover: 'Here''s the beautiful part. What happens to accelerations? Let''s take the rate of change of u, which is capital U plus u prime.
    The rate of change of capital U is zero, because the train''s velocity never changes. So the rate of change of u equals the rate of change
    of u prime: the acceleration is the same in both frames. [beat] Drop a ball on the smooth train, and it falls straight down, speeding up by
    nine point eight metres per second every second, exactly as it does for the person beside the track. And since Newton''s law says force equals
    mass times acceleration, the same forces explain the motion in both frames. For a fluid, the acceleration of an air parcel is the local change
    of the wind plus the advection term. Each piece can differ between the two frames, but their sum is the same. That''s only true for a frame
    moving steadily in a straight line. A frame that turns, like the spinning Earth, adds new terms, the Coriolis and centrifugal effects, which
    is the story of the Coriolis movie.'
  on_screen_eq: {latex: '\frac{\partial\mathbf u}{\partial t}+(\mathbf u\cdot\nabla)\mathbf u=\frac{\partial\mathbf u''}{\partial t''}+(\mathbf
