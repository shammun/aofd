  beat: 'generalise: curvilinear coordinates and scale factors'
  visual: 'Three small panels across the top (polar rings, cylinder, globe graticule), each lighting up the three features as S3-S5 name them (curving lines, turning
    unit vectors, a ''scale factor'' ruler). Maths zone: a table without boxes: ''polar: 1, r''; ''sphere: a, a cos φ'' (scale factors) with the s07 arc rule recalled.
    S9-S10: the gradient on the sphere (2.31, horizontal) with ''1/(a cos φ)'' underbraced ''scale factor of λ''; a gradient-movie thumbnail. S11: a vertical cross-section
    with pressure surfaces bending over a mountain (ETOPO Alps profile, ERA5 standard levels) as the curvilinear vertical coordinate.'
  voiceover: 'Polar, cylindrical and spherical coordinates are all examples of curvilinear coordinates: coordinates whose lines can curve. They share three features.
    First, the coordinate lines are curves, like circles and meridians. Second, the unit vectors change from place to place. Third, a change in a coordinate isn''t
    a distance by itself, so it needs a scale factor. In polar coordinates, a change of theta walks you r times d theta, so theta''s scale factor is r. On the Earth,
    latitude''s scale factor is the Earth''s radius, and longitude''s is the radius times cosine phi. These scale factors show up whenever we take slopes. For example,
    the eastward slope of the temperature on the sphere is one over the radius times cosine phi, times its rate of change with longitude. That''s part of the gradient,
    which gets its own movie, next in this series. Weather models even use a curvilinear vertical coordinate: pressure instead of height, which has its own movie
    too.'
  on_screen_eq:
    latex: \nabla T=\mathbf i\,\frac{1}{a\cos\varphi}\frac{\partial T}{\partial\lambda}+\mathbf j\,\frac{1}{a}\frac{\partial T}{\partial\varphi}
