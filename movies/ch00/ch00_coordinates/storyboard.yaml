    with its own turned axes.'
  voiceover: 'We can write those two lines as a table of numbers, called a rotation matrix. Each entry is a direction cosine: the cosine of the angle between
    an old axis and a new one. In the index notation of the vectors movie, new component number j is the sum over i of the old components times C i j. And
    here''s a nice link: polar components are just a rotation. At each place, r hat and theta hat are the east and north arrows turned by the angle theta.
    So the wind''s six outward and minus eight round were just the east wind''s components in axes turned by fifty three degrees. [beat] The only difference
    is that in polar coordinates, the turning angle changes from place to place.'
