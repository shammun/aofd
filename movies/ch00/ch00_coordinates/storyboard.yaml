  voiceover: 'Now a real moving storm. Storm Ciarán crossed the English Channel in the night from the first to the second of November, twenty twenty-three.
    Following its lowest pressure hour by hour, the centre moved towards the east-north-east, at about fifteen metres per second. [beat] Let''s look at
    the winds on a ring two hundred kilometres from the centre, at three in the morning, universal time. Seen from the ground, the winds on the south side
    averaged about nineteen metres per second, but on the north side, only about eight. [beat] Why so lopsided? On the south side, the storm''s anticlockwise
    spin blows towards the east, the same way the storm moves, so the two add up. On the north side, the spin blows towards the west, against the motion,
    so they partly cancel. Now let''s subtract the storm''s own velocity from every wind. These are the storm-relative winds: what you''d feel riding along
