    a small patch, ''≈ 14×''.'
  voiceover: 'But conformal has a price: areas. Stretched by one over cosine phi in both directions, an area is stretched by one over cosine squared. At sixty degrees,
    that''s four times. [beat] At Svalbard, it''s about twenty four times. [beat] So on a Mercator map, Greenland looks about as big as Africa. In truth, Africa is
    about fourteen times bigger. [beat] The Mercator map is great for directions and shapes, and terrible for comparing sizes.'
