  beat: 'application: equal-area maps (Equal Earth), pick the map for the job'
  visual: 'Equal Earth world map (BMNG) with Greenland and Africa outlined at true relative size; Tissot ellipses equal in area but sheared towards the
    poles; a 60-degree angle mark showing the distortion ''≥ 30°''. S1-S2: a real climate example: the latest complete month''s 2 m temperature anomaly
