    same twelve degrees, exactly like theta hat swinging round a circle. Going north tips the arrows too: after a hundred and eleven kilometres
    north, the up arrow has tilted one degree towards the north. Written out, the rates of change of i hat, j hat and k hat for a moving air parcel
    each have a speed divided by a radius, the same pattern we found round the hurricane. Speed over radius is how fast the arrows turn.'
