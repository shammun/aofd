  beat: recap ('To sum up')
  visual: 'One beat per sentence, mini pictures reused (no headings): grid + origin; fixed x̂ŷ vs turning r̂θ̂; the arc rule; Ian''s ring with ''37'' and ''12.5'';
    inward v²/r arrow; meridian step ''111 km'' and parallel steps ''74 / 23 km''; the globe band 30 S-30 N ''½''; great circle vs rhumb; Mercator vs Equal Earth
    Greenland; turned axes on the coast; train + storm ring ''same spin''. Each number spoken is on screen at its words.'
  voiceover: 'To sum up, coordinates are numbers that pin down a place, measured from an origin along chosen directions. Cartesian unit vectors are the same everywhere,
    while polar, cylindrical and spherical ones turn as you move. The arc length is the radius times the angle, in radians. Round Hurricane Ian''s eye, polar coordinates
    split the wind into about thirty seven metres per second of spin and twelve and a half of inflow. And because theta hat turns, a steady spin still accelerates
    towards the eye. On the Earth, a degree of latitude is always about a hundred and eleven kilometres, but a degree of longitude is the radius times cosine phi
    times the angle: seventy four kilometres at Brest, and twenty three at Svalbard, because the parallels shrink towards the poles. Areas go with cosine phi too,
    so half of the Earth lies between thirty south and thirty north. The shortest route is a great circle. The Mercator map keeps shapes and bearings, and equal-area
    maps keep sizes. Turning the axes gives new components of the same arrow, like along and across a coast. And a Galilean change to a steadily moving frame changes
    velocities, but leaves accelerations, and a storm''s spin, unchanged.'
