    energy bar; S11 three minis in a row (window in sunlight, ocean tiles + / −, the pattern gauge at 0.89); S12 a faint parallelogram with ''across'' (the
    cross product). Final hold: v6''s five mini icons plus the four new ones, one keyword each (54 px).'
  voiceover: To sum up, the dot product multiplies matching components and adds, giving a number, not an arrow. That works because each axis only multiplies
    its own parts. In pictures, it's the shadow of one arrow on the other, times the other's length. When the arrows point the same way, it's positive.
    At right angles, it's zero. In opposite directions, it's negative. With a unit vector, it picks out one part of an arrow. A pilot uses this to find
    the wind along a runway. And in physics, it gives the work a force does, and how fast the wind changes the temperature at a fixed place. A push across
    the motion does no work at all. The dot product also measures how much sunlight passes through the ground, whether the wind feeds an ocean current or
    drains it, and how alike two weather patterns are. The cross product, in the next video, uses the part across instead.
