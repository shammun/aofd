    S8 (''It isn''t a partial derivative…''): a small line at y 600: ''D/Dt = ∂/∂t + advection'' in words-and-symbols (68 px), the partial derivative plus
    the advection term.


    S9 (''For temperature…''): line ''DT/Dt = ∂T/∂t + v·∇T'' (68 px) at y 720; the dot in v·∇T grows gold once with keyword ''dot product'' (no box, no
    ring panel).'
  voiceover: 'Here is the equation the balloon''s thermometer obeys. It tells us how anything the air carries, called phi, like temperature or moisture,
    changes as we follow an air parcel. On the left is the change following the parcel. On the right is the change at one fixed place, plus a term with
    v, the wind, and grad, which we''ll meet soon. Advection means being carried along by the flow. So the advection term is the change that comes from
    being carried into warmer or colder air, or moister or drier air, depending on what phi stands for. The left side is called the material derivative.
    It isn''t a partial derivative, because the place moves with the parcel: it''s the partial derivative plus the advection term. For temperature, that
    term is v dot grad T, and its dot is our dot product.'
