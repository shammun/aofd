    ''through: 100 %… 50 %… 0 %'') as the frame tilts 0° -> 60° -> 90°; ŝ (gold). Then cut to a globe (BMNG) at the March equinox, noon at the equator:
    a beam patch on the equator vs the same beam spread over twice the ground at 60°N (two outlined patches); maths zone ŝ · n̂ = cos 60° = 0.5.'
  voiceover: Second, how much passes through a surface. Hold a window frame in a steady stream of sunlight. When it faces the sun square on, it catches
    the most light. Tilt it, and less light gets through, and edge on, none at all. The amount is the sunlight's strength times s hat dot n hat, where s
    hat points towards the sun and n hat points straight out of the window. The ground works the same way. At noon on the March equinox, the sun is straight
    overhead at the equator, but at sixty degrees north it's sixty degrees away from overhead, so s hat dot n hat is cos sixty, one half. [beat] The same
    sunlight is spread over twice as much ground, which is a big part of why places near the poles are colder. The same dot product measures heat or water
    flowing through any surface. The climate machine video builds on exactly this.
  on_screen_eq:
