  voiceover: 'In the first case, imagine the map stays frozen, because the sun keeps every place at exactly its temperature. Then the fixed thermometer
    always reads thirteen degrees, so its local rate, partial T by partial t, is zero. The balloon, though, reads the map wherever the wind takes it: thirteen
    point one eight after one hour, thirteen point three six after two, and thirteen point five four after three. Its reading climbs by point one eight
    degrees every hour, because the wind keeps carrying it into warmer places. In our equation, capital D T by D t is zero plus v dot grad T: plus point
    one eight kelvin per hour. [beat] On the graph, the fixed thermometer''s line stays flat, while the balloon''s line climbs. So when the map is frozen,
    the parcel warms by exactly the advection term.'
