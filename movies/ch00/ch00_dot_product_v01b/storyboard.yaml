  voiceover: 'So how do we find the dot product? We multiply the matching components, and then add. Arrows in three-dimensional space have three components,
    along x, y and z, so we''d add three products. Ours lie flat, in two dimensions, so the third term drops out. The first components give five times one,
    which is five, and the second give one times three, which is three. Adding them, a dot b equals eight: a single number, not an arrow. A number like
    this is called a scalar, so the dot product is also called the scalar product.'
