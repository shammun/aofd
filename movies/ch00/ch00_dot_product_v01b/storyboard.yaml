  status: new
  changes:
  - V-D4 key 'why' scene (research §1b/§1c, user priority) + D3 expand the brackets
  related:
  - '#1a vectors and index notation'
  visual: 'Picture zone: a = (5, 1) splits into two arrows end to end, the x piece (teal, 5 along x) and the y piece (teal lighter, 1 along y); b = (1,
    3) splits likewise into its x part (orange, 1) and y part (orange lighter, 3). S5: the x piece and b''s x part glow together, ''5 × 1''; S6: the y pieces
    glow, ''1 × 3''. S7: the mixed pairs (x piece with b''s y part, y piece with b''s x part) are drawn with right-angle ticks and struck in the maths zone
    with ''x̂ · ŷ = 0''. Maths zone, built with Layered: (5x̂ + ŷ)·(x̂ + 3ŷ) = 5·1 (x̂·x̂) + 5·3 (x̂·ŷ) + 1·1 (ŷ·x̂) + 1·3 (ŷ·ŷ); the two middle terms struck;
    x̂·x̂ = ŷ·ŷ = 1 from equation one (cos 0 = 1); result 5 + 3 = 8. Gold link from each glowing pair to its term.'
  voiceover: 'But why does multiplying matching components give the same answer as the lengths and the cosine? Let''s split vector a into two arrows laid
    end to end: five steps along x, and one step along y. To write them, let x hat and y hat be arrows one unit long, pointing along x and along y. Now
    take the dot product of each piece with b, which we can split the same way. The x piece of vector a points along x, so it only sees the x part of b:
    five times one. The y piece only sees the y part of b: one times three. A piece along x and a part along y are at right angles, and arrows at right
    angles give zero, so these mixed terms drop out. And a unit arrow dotted with itself is one times one times cos zero, which is one. What''s left is
    five times one plus one times three, eight: exactly the component recipe. [beat] So each axis does its own multiplication, and we add up the results.'
  on_screen_eq:
    latex: (5\hat{\mathbf x}+\hat{\mathbf y})\cdot(\hat{\mathbf x}+3\hat{\mathbf y})=5\cdot1+1\cdot3=8
