  visual: 'Picture zone: a small map with four station dots, each with today''s pressure departure (teal numbers +3, +1, −2, −2 hPa) and, beside it, the
    same map for a past day (orange +2, +2, −1, −3). They become two columns of four numbers (arrows in four dimensions: ''can''t draw it, same recipe'').
    Maths zone CalcStack: A · B = 6 + 2 + 2 + 6 = 16; |A| = |B| = √18; cos = 16 / 18 ≈ 0.89. A gauge from −1 (opposite) through 0 to +1 (alike) with the
    needle at 0.89. S8: grid of small picture icons (faces/words) lights faintly on ''pictures and words''.'
  voiceover: 'Fourth, comparing patterns. Write today''s pressure at four weather stations, as departures from their usual values, as one list of four numbers:
    an arrow in four dimensions. We can''t draw it, but the recipe works just the same. Today reads three, one, minus two and minus two hectopascals, and
    a day in the past reads two, two, minus one and minus three. Their dot product is six plus two plus two plus six, which is sixteen. Both lengths are
    the square root of eighteen, so the cosine of the angle between them is sixteen over eighteen, about point eight nine. [beat] Near one, two days look
    alike; near zero, they have nothing in common; and near minus one, they''re opposites. Forecasters have used this to find past days that looked like
    today, and computers use the same idea to compare pictures and words.'
