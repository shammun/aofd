    S4 (''But the dot product doubles…''): line ''v·∇T = 5.00 × 2.00 × 10⁻⁵ = 1.00 × 10⁻⁴ K/s'' and ''× 3600 s = 0.36 K per hour'' bold, keyword ''× 2'';
