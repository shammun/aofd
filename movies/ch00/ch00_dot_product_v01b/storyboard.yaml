  visual: 'Picture zone: two ocean tiles from above — left: wind stress τ (orange) and current u (teal) the same way, ''+'' and a gold energy bar filling;
    right: τ against u, rose hatched ''−'' and the bar draining. Maths zone CalcStack: τ · u = 0.1 × 0.1; = 0.01 W/m² (unit cancel N/m² × m/s = W/m²). S8:
    cut to a globe looking down on Antarctica with the westerlies (orange streaks, NCEP LTM from the v4 data) over the circumpolar current (teal band, schematic
    position), keyword ''≈ 1 TW'' only after it is spoken (cited).'
  voiceover: Third, the wind's work on the ocean. Wind blowing over the sea drags on the water. The drag on each square metre is an arrow called the wind
    stress, tau. The power it gives the water is tau dot u, where u is the water's velocity. Where the wind blows along with a current, the dot product
    is positive, and the wind feeds the current with energy. Where it blows against the current, the dot product is negative, and the wind takes energy
    away. Say the wind stress is point one newtons per square metre, and the current flows the same way at point one metres per second. Then the wind gives
    the current point zero one watts on every square metre. [beat] Added up over the world ocean, this comes to about a million million watts, most of it
    over the Southern Ocean, where strong westerly winds blow along with the current that circles Antarctica.
  on_screen_eq:
    latex: \boldsymbol\tau\cdot\mathbf u
    vallis_eq: 'provenance only: wind work (power per unit area)'
    page_png: null
