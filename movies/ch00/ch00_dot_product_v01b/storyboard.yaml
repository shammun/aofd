  voiceover: Now let's look at how the angle between the two arrows plays a role. The dot product can also be written as the two lengths times the cosine
    of theta, the angle between them. The cosine is one when two arrows point the same way, zero at a right angle, and minus one when they point in opposite
    directions. Here's another way to see the cosine. Draw an arrow one unit long, at an angle theta to a flat line, and drop a line from its tip straight
    down onto that line. The piece it marks off along the line is the cosine of theta. So the piece is the whole arrow when it lies along the line, nothing
    when it stands at a right angle, and a whole unit backwards when it points the other way. Here theta is about sixty degrees, with a cosine of about
    point five. Multiplied out, that's eight again, and we'll call this equation one. [beat]
