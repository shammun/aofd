    bars (0 and −0.18) glow with keyword ''local rate differs''.'
  voiceover: 'So why does the balloon stay at thirteen? In one hour it moves eighteen kilometres across the isotherms, to where the map read thirteen point
    one eight an hour ago. Crossing the isotherms like that is worth plus point one eight: that''s the advection term. In the first case, the map stood
    still, so the local rate was zero, and the parcel warmed by point one eight. In our second case, every place has cooled by point one eight degrees in
    that hour, and that fall, minus point one eight, is the local rate. They cancel, so the balloon still reads thirteen. So the advection term is the same
    in both cases; only the local rate is different.'
