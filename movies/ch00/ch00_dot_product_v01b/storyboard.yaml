  voiceover: 'Now let''s change only the map: the temperature rises one degree every fifty kilometres, instead of every hundred. The isotherms are twice
    as close, so grad T doubles, to two times ten to the minus five kelvin per metre. Its length, by Pythagoras again, is that same number, because the
    northward part is still zero. The wind''s shadow is still five metres per second. But the dot product doubles, to point three six kelvin per hour, so
    the fixed thermometer cools twice as fast. Just as with the sled, the shadow stayed the same, so on its own it would miss this change. Multiplying by
    the length of grad T catches it.'
