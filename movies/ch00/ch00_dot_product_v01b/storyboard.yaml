  voiceover: 'The third reason is that physics often needs both sizes. Pull a sled with a force vector, F, of twenty newtons, tilted sixty degrees up, while
    it moves along a displacement vector, d. The upward part of the pull does no work; the part along the ground, the shadow of F on d, is ten newtons.
    Work, in joules, is that force times the distance: fifty joules if d is five metres. If d doubles to ten metres, the work doubles to one hundred joules,
    but the shadow is still ten newtons. So the shadow alone can''t give the work: we must multiply by the length of d, and the dot product does exactly
    that.'
