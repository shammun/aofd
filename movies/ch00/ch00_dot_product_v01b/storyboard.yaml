    numbers 84 px, teal for +, slate for 0, rose with a "−" glyph for −). Columns, headed by 54-px keywords with small icons: ''map frozen'' (SunGlyph)
    and ''our story'' (sliding isotherm lines). Rows, in this order, each with its observer icon: v·∇T ''advection term'' (wind arrow) = +0.18 | +0.18;
    ∂T/∂t ''local rate'' (pole) = 0 | −0.18; DT/Dt ''material derivative'' (balloon) = +0.18 | 0. Unit ''K per hour'' once, top right (44 px).


    S1 (''Let''s put the three rates side by side…''): the grid frame (labels only) fades in; values hidden.


    S2 (''The advection term…tells us how fast…''): row 1 label pulses with the wind icon; a tiny wind arrow crosses three isotherm ticks beside it.


    S3 (''Here it''s plus point one eight…in both cases''): both row-1 values appear on the spoken number; keyword ''same'' between them.


    S4 (''The local rate…what the thermometer on the pole sees…''): row 2 values appear on ''zero'' and on ''minus point one eight''; the pole icon glows.


    S5 (''The material derivative…what the balloon''s thermometer sees…''): row 3 values appear on the spoken numbers; a thin ''+'' brace shows row 3 =
    row 2 + row 1 in each column (the sum lines up under its column).


    S6 (''So whenever you meet v dot grad T…''): the other rows dim; row 1 stays bright with keyword ''degrees per hour from crossing isotherms'' (54 px).'
  voiceover: 'Let''s put the three rates side by side, and say what each one means. The advection term, v dot grad T, tells us how fast the wind carries
    an air parcel into warmer or colder places. Here it''s plus point one eight kelvin per hour in both cases, because the wind and the spacing of the isotherms
    are the same. The local rate, partial T by partial t, is what the fixed thermometer sees, at one place that never moves: zero when the map is frozen,
    and minus point one eight in our story, as colder air arrives. The material derivative, capital D T by D t, is what the balloon''s thermometer sees,
    and it''s the local rate plus the advection term: plus point one eight when the map is frozen, and zero in our story. So whenever you meet v dot grad
    T, think of how fast the wind carries air across the isotherms, measured in degrees per hour.'
