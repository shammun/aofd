    rose hatched rectangle behind the start; keyword ''negative''; keyword ''opposite'' under the arrows.


    S8 (''When two vectors point in opposite directions, their dot product is negative.''): no new text; ''opposite'' pulses on ''opposite directions''
    and ''negative'' on ''is negative'' (54 -> 68 px), mirroring the right-angle rule of S6.


    S9 (''So the dot product measures…''): the three results 6, 0, −6 pulse in turn; no sentence on screen.


    CHANGES FOR THIS MOVIE: after the three panels: one large dial, p fixed, q sweeps 360° (4 s) with the half in front of p tinted teal 15 % (''+''), the
    half behind rose 15 % hatched (''−''), the across line slate (''0''); live ''p·q'' with its sign glyph; each half lights on its words.'
  voiceover: 'Let''s keep one arrow fixed in all three pictures, and change only the other one. The fixed arrow, p, has components three and zero. First,
    the other vector, q, points in the same direction as p and has components two and zero. Three times two plus zero times zero is six, a positive number.
    In the next case, vector q is at a right angle to p, with components zero and two, and the dot product is zero. In general, whenever two vectors are
    at right angles, their dot product is zero. Last, q has components minus two and zero, pointing in the opposite direction: three times minus two is
    minus six, a negative number. When two vectors point in opposite directions, their dot product is negative. In fact, q doesn''t have to point exactly
    along p. Let''s sweep it all the way round. Anywhere in the half in front of p, the dot product is positive. On the line straight across, it''s zero.
    And anywhere in the half behind, it''s negative. So the dot product measures how much two arrows point the same way.'
