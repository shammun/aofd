      FOOTNOTE strip: K2.2 (the only label used so far).
    voiceover: "K two point two is equation two point two of Kundu, Cohen and Dowling's Fluid Mechanics, fifth edition. Labels with 0A, the digit zero, are ours: Chapter Zero, Part A of this course. Vallis labels point to the main book, and the footnote gives each page."
    on_screen_eq:
