  - id: s05_example
    t: [61.800, 69.800]
    visual: >-
      Plane with a, b and their component chips (left); right panel: under (K 2.2) the live line with matching parts
      paired by colour boxes: "5·1 + 1·3 + 0·0 = 8" (third pair greyed, note "flat picture: the z-parts are 0").
      Sentence 3: the result 8 drops onto the number-line gauge (marker +8.000), gauge label "a·b = 8: a number, not an
      arrow"; a crossed-out ghost arrow icon beside it (small, muted) to make "not an arrow" visible. FOOTNOTE: K2.2.
    voiceover: "Try it: five times one, plus one times three, is eight. Eight is a number, not an arrow."
    on_screen_eq:
      latex: "\\mathbf a\\cdot\\mathbf b = a_1b_1 + a_2b_2 + a_3b_3 \\equiv a_ib_i"
      vallis_eq: "(K 2.2) — Kundu §2.1, p. 41"
      page_png: "../Fluid Dynamics/chapters/pages/ch02/p068.png"
      label_on_screen: "K 2.2"
    footnote: [K2.2]
    physics_source:
