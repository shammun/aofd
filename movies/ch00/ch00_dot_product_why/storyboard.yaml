      (v3 M1 rule): the next scene shows the pattern sliding.
    voiceover: "Careful: one degree per hundred kilometres is the map's slope, a rate in space. Point one eight kelvin per hour is a rate in time. Each hour, the air gains eighteen kilometres towards warmth, reaching spots that were point one eight degrees warmer when it set off."
    on_screen_eq:
      latex: '5.00\ \mathrm{m\,s^{-1}}\times3600\ \mathrm s = 18.0\ \mathrm{km},\qquad 18.0\ \mathrm{km}\times\frac{1\ ^\circ\mathrm C}{100\ \mathrm{km}} = 0.180\ ^\circ\mathrm C'
