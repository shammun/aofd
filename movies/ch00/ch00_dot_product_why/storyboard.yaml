    title: {kicker: "PART 3 · THE WEATHER", text: "∇T: the temperature gradient"}
    visual: >-
      U-M2.12 part 2. Map with isotherms as s14.
      Reveal 1 (sentence 1): the two slopes from s14 fly into a bracket: '∇T = (∂T/∂x, ∂T/∂y)'; the orange arrow ∇T
      grows at the pin pointing east (with a dark halo).
      Reveal 2 (sentence 2): the ∇ symbol enlarges for a moment with the chip "∇ = 'grad', short for gradient".
      Reveal 3 (sentence 3): numbers line '= (1 °C per 100 km, 0) = (1.00 × 10⁻⁵ K/m, 0)' and a small chip "1 K step =
      1 °C step; 100 km = 10⁵ m".
      Reveal 4 (sentence 4): label on the arrow "points uphill, towards warmer air, straight across the isotherms";
      length bracket "|∇T| = 1.00 × 10⁻⁵ K/m = how steep the map is".
    voiceover: "These two slopes are the components of one arrow: grad T. The upside-down triangle is read grad. Here it's ten to the minus five kelvin per metre, and zero. Grad T points uphill, towards warmer air; its length is how steep the map is."
    on_screen_eq:
      latex: '\nabla T = \left(\frac{\partial T}{\partial x},\ \frac{\partial T}{\partial y}\right) = (1.00\times10^{-5}\ \mathrm{K\,m^{-1}},\ 0)'
      vallis_eq: "provenance only: the gradient ∇φ = Σ e_i ∂φ/∂x_i (Kundu p079 image), 2-D, our numbers"
      page_png: "../Fluid Dynamics/chapters/pages/ch02/p079.png"
    physics_source:
      fn: fluidpy.core.operators.gradient
      params: {T: "10 °C + 1e-5 K/m · x on a 5-km grid", h_m: 5000.0, note: "gradient(T, h)[0] is ∂T/∂x for an (ny, nx) array"}
      outputs: {dTdx_K_m: 1.00e-5, dTdy_K_m: 0.0, norm_gradT_K_m: 1.00e-5}
      also: [fluidpy.geo.vectors.norm]
      data: "data/weather.json → gradT, norm_gradT"
      test: "../Fluid Dynamics/tests/test_ch02.py::test_gradient_V1_perpendicular_to_level_sets_and_directional_derivative, ::test_gradient_V7_rotational_invariance"
    exaggeration: ["∇T arrow length drawn on its own scale (K/m), not the map's km — the bracket gives its value; badge: none"]

  - id: s16_advection_number
    as_built: "the wind label reads 'the wind (as the balloon’s): |v| = 10 m/s, 60° from ∇T' (same wind as s12, not a new one)"
    t: [348.325, 377.150]
    title: {kicker: "PART 3 · THE WEATHER", text: "Advection: v·∇T = shadow × steepness"}
    visual: >-
      U-M2.13: more narration and every number on screen. Map with isotherms and ∇T at the pin; T-form small at the top
      right: 'DT/Dt = ∂T/∂t + v·∇T' with v·∇T teal.
      Reveal 1 (sentence 1): a new teal wind arrow v grows at the pin, 60° from ∇T (towards the north-east), label
      "a new wind: |v| = 10 m/s, 60° from ∇T"; angle arc "60°".
      Reveal 2 (sentence 2): dashed drop-line from v's tip onto ∇T's line; teal shadow band, label "shadow of v on ∇T =
      10 × cos 60° = 5.00 m/s"; under it "= speed straight towards warmer air".
      Reveal 3 (sentence 3): the other leg of v (8.66 m/s, north) drawn dashed along the 13 °C isotherm, label "8.66
      m/s along the isotherm: no temperature change".
      Reveal 4 (sentence 4): right panel, revealed term by term: 'v·∇T = (|v| cos θ) × |∇T|' / '= 5.00 m/s × 1.00 ×
      10⁻⁵ K/m' / units strip "(m/s) × (K/m) = K/s" with the two m's struck through / '= 5.00 × 10⁻⁵ K/s' / '× 3600 s
      per hour = 0.180 K per hour'; product rectangle on ∇T's line, label "area = v·∇T"; small check chip "components:
      5.00 × 1.00 × 10⁻⁵ + 8.66 × 0 = 5.00 × 10⁻⁵ ✓".
    voiceover: "Now a wind of ten metres per second blows sixty degrees from grad T. Its shadow on grad T, ten times cos sixty, is five metres per second: the speed straight towards warmer air. The rest of the wind runs along the isotherms. Times the length of grad T, the metres cancel: five times ten to the minus five kelvin per second, or point one eight kelvin per hour."
    on_screen_eq:
      latex: '\mathbf v\cdot\nabla T = (|\mathbf v|\cos\theta)\,|\nabla T|'
      vallis_eq: "provenance only: (1) applied to v and ∇T (ours)"
      page_png: null
      highlight: [{term: '\mathbf v\cdot\nabla T', colour: teal}]
    on_screen_eq_extra:
      - latex: '\frac{\mathrm{D}T}{\mathrm{D}t} = \frac{\partial T}{\partial t} + \mathbf v\cdot\nabla T'
        vallis_eq: "provenance only: as s13"
        page_png: chapters/pages/ch01/p025.png
      - latex: '= 5.00\ \mathrm{m\,s^{-1}}\times1.00\times10^{-5}\ \mathrm{K\,m^{-1}} = 5.00\times10^{-5}\ \mathrm{K\,s^{-1}} = 0.180\ \mathrm{K\ per\ hour}'
        vallis_eq: "provenance only: our numbers"
        page_png: null
    physics_source:
      fn: fluidpy.geo.vectors.dot
      params: {v_m_s: "10 × (cos 60°, sin 60°) = (5.000, 8.660)", gradT_K_m: [1.0e-5, 0.0]}
      outputs: {shadow_m_s: 5.000, along_isotherm_m_s: 8.660, v_dot_gradT_K_s: 5.000e-5, v_dot_gradT_K_h: 0.180}
      also: [fluidpy.geo.vectors.scalar_projection, fluidpy.geo.vectors.norm, fluidpy.geo.vectors.angle_between]
      data: "data/weather.json → v, shadow_m_s, v_dot_gradT, K_per_h, angle_deg"
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_dot_V2_dimensions_pint_advection_unit (m/s × K/m = K/s), ::test_dot_V1_component_sum_on_field, ::test_scalar_projection_V1_and_V7"
    exaggeration: ["wind and gradient arrows drawn on their own scales (m/s, K/m), not the map's km; badge: none"]

  - id: s17_space_time
    t: [377.150, 396.550]
    title: {kicker: "PART 3 · THE WEATHER", text: "A rate in space, and a rate in time"}
    visual: >-
      U-M2.14. Two-column card on the right, each column revealed with the sentence that names it:
      Reveal 1 (sentence 1): column "rate in SPACE · the map's slope · 1 °C per 100 km · the same everywhere on the
      map" with a mini ruler icon; on the map, a bracket "1 °C per 100 km" between two isotherms.
      Reveal 2 (sentence 2): column "rate in TIME · what the moving air parcel meets · 0.180 K per hour" with a mini
      clock icon.
      Reveal 3 (sentence 3): a balloon (air parcel) leaves the pin with the wind; clock chip "1 h in 4 s"; after 1 h it
      has gone 36.0 km along v (teal path) and its progress along ∇T is bracketed "18.0 km towards warmer air = 5.00 m/s
