    t: [173.000, 187.200]
    title: {kicker: "PART 2 · WHY TIMES THE OTHER LENGTH?", text: "Reason 1 · the order doesn't matter"}
    visual: >-
      U-M2.8. The existing two-plane layout, each plane with a calculation panel under it (y 560-800), written out in
      full even where the narration is short (the user: "narration need not spell it all out").
      Reveal 1 (sentence 2, first half): left plane, a casts its teal shadow on b's line; panel: 'shadow of a on b =
      a·b / |b| = (5, 1)·(1, 3) / √10 = 8 / 3.162 = 2.530'.
      Reveal 2 (sentence 2, second half): right plane, b casts its orange shadow on a's line; panel: 'shadow of b on a =
      b·a / |a| = (1, 3)·(5, 1) / √26 = 8 / 5.099 = 1.569'; between them the chip "two different shadows".
      Reveal 3 (sentence 3): each product rectangle grows (2.530 × 3.162 on b's line; 1.569 × 5.099 on a's line); panel
      lines '2.530 × |b| = 2.530 × 3.162 = 8.000' and '1.569 × |a| = 1.569 × 5.099 = 8.000'; the rectangles slide into a
      centre tray "area 8.000 both ways"; line 'a·b = b·a' and the chip "with the length in, the order doesn't matter".
      Slot "1" in the reasons list fills: "same number both ways".
    voiceover: "Reason one: order. The shadow of arrow a on b is two point five three; of b on arrow a, one point five seven. But times the other arrow's length, both give eight."
    on_screen_eq:
      latex: '\mathbf a\cdot\mathbf b = \mathbf b\cdot\mathbf a'
      vallis_eq: "provenance only: symmetry of the dot product, stated unnumbered in Kundu §2.8 (p078 image)"
      page_png: "../Fluid Dynamics/chapters/pages/ch02/p078.png"
    on_screen_eq_extra:
      - latex: '\text{shadow of } \mathbf a \text{ on } \mathbf b = \frac{\mathbf a\cdot\mathbf b}{|\mathbf b|} = \frac{(5,1)\cdot(1,3)}{\sqrt{10}} = \frac{8}{3.162} = 2.530'
        vallis_eq: "provenance only: ours, our numbers"
        page_png: null
