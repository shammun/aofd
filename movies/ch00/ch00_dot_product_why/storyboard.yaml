    exaggeration: ["time compressed (1 h in 4 s, clock chip)", "idealised field, not data; badge: none"]

  - id: s18_label_zero
    as_built: "the summary line ∂T/∂t = −v·∇T when DT/Dt = 0 appears with sentence 4"
    t: [396.550, 421.250]
    title: {kicker: "PART 3 · THE WEATHER", text: "If each air parcel keeps its temperature"}
    visual: >-
      U-M2.15. Left: the map with tagged air parcels (existing tag data, 5 per row so no tag touches a neighbour, each
      tag ABOVE its dot), each tag its own temperature ("13.0", "12.4", …), unchanging while the parcels drift (clock
      "1 h in 4 s").
      Reveal 1 (sentence 1): chip "suppose: each parcel keeps its temperature (no sunshine, no mixing)"; legend "tag = the
      parcel's own temperature: it never changes".
      Reveal 2 (sentence 2): balloon readout "balloon: 13.00 °C, never changes" and chip 'DT/Dt = 0'; as the isotherms
      start to slide east with the parcels, chip (orange) "the air carries its temperature, so the pattern slides with
      the wind".
      Right: DerivationStrip, one move per row, rows 1-2 with sentence 2, rows 3-4 with sentences 3-4:
      row 1 'DT/Dt = ∂T/∂t + v·∇T' (why "the equation, for temperature");
      row 2 '0 = ∂T/∂t + v·∇T' (why "each parcel keeps its temperature: DT/Dt = 0");
      row 3 '0 − v·∇T = ∂T/∂t + v·∇T − v·∇T' (why "subtract v·∇T from both sides"; the +v·∇T − v·∇T pair struck through
      in teal);
      row 4 '∂T/∂t = −v·∇T' (why "what's left: the change at a fixed place is minus the advection"), boxed, minus in rose.
    voiceover: "Now suppose each air parcel keeps its temperature, with no sunshine or mixing. Then the balloon's reading never changes: capital D T by D t is zero, and the pattern slides with the wind. Put zero in, then subtract v dot grad T from both sides. Partial T by partial t equals minus v dot grad T."
    on_screen_eq:
      latex: '\frac{\partial T}{\partial t} = -\,\mathbf v\cdot\nabla T \quad\text{when } \frac{\mathrm{D}T}{\mathrm{D}t} = 0'
      vallis_eq: "provenance only: follows from the material-derivative equation (p025) with φ = T and DT/Dt = 0; derived on screen"
      page_png: chapters/pages/ch01/p025.png
      highlight: [{term: '-\,\mathbf v\cdot\nabla T', colour: teal}]
    derivation_strip:
      rows:
        - {line: '\frac{\mathrm{D}T}{\mathrm{D}t} = \frac{\partial T}{\partial t} + \mathbf v\cdot\nabla T', why: "the equation, for temperature", sentence: 2}
        - {line: '0 = \frac{\partial T}{\partial t} + \mathbf v\cdot\nabla T', why: "each parcel keeps its temperature: DT/Dt = 0", sentence: 2}
        - {line: '0 - \mathbf v\cdot\nabla T = \frac{\partial T}{\partial t} + \mathbf v\cdot\nabla T - \mathbf v\cdot\nabla T', why: "subtract v·∇T from both sides", sentence: 3}
        - {line: '\frac{\partial T}{\partial t} = -\,\mathbf v\cdot\nabla T', why: "what's left: change at a fixed place = minus the advection", sentence: 4}
    physics_source:
      fn: fluidpy.core.kinematics.material_derivative_terms
      params: {T: "T(x, t) = T_west + G (x − v_x t), G = 1e-5 K/m (each parcel keeps its T)", v_m_s: [5.000, 8.660], x_m: [300000, 180000], t: 0.0, h: 10.0, ht: 10.0}
      outputs: {local_K_s: -5.00e-5, advective_K_s: 5.00e-5, total_K_s: 0.0, parcel_tags: "constant per parcel"}
      data: "data/weather.json → material_derivative.G1, tags_x_km, tags_y_km, tags_T, shift_km"
      test: "../Fluid Dynamics/tests/test_ch03.py::test_material_derivative_V1_equals_rate_along_pathline, ::test_material_derivative_V7_local_and_advective_vanish"
    exaggeration: ["idealised: parcels keep their temperature exactly (no heating, radiation or mixing), said in the narration", "time compressed (clock chip); badge: none"]

  - id: s19_pole_cools
    as_built: "the clock follows sentence 4: 0 h on 'thirteen', 1 h on 'twelve point eight two', 2 h on 'twelve point six four' (1 h ≈ 1.6 s), then on at the same pace to 3 h (12.46 °C, the third upwind dot) and holds — running to 6 h would race past the spoken 12.64; the balloon is shown from the start beside the pole and stays inside the map (fade + 'off the map' tag kept for safety at the top edge)"
    t: [421.250, 444.000]
    title: {kicker: "PART 3 · THE WEATHER", text: "Why the pole cools: the air comes from upwind"}
    visual: >-
      U-M2.16. DECISION: the v3 shaded wedge ("upwind cone") is DROPPED — it was a drawn wedge, not a computed
      quantity, and it did not show how the cooling follows from ∂T/∂t = −v·∇T. REPLACED by the upwind track:
      Reveal 1 (sentence 1): pole thermometer at the pin, readout "pole: 13.00 °C"; right panel '∂T/∂t = −v·∇T = −0.180
      K per hour' (minus in rose); the balloon (label "balloon: 13.00 °C, keeps its temperature") sits at the pin.
      Reveal 2 (sentence 2): a dashed teal line runs from the pole BACK against the wind (direction −v), label
      "upwind = where the wind comes from"; a small teal wind arrow at its far end shows the wind blowing towards the
      pole.
      Reveal 3 (sentence 3): three dots appear on the upwind line at the air's positions now that will reach the pole in
      1 h, 2 h, 3 h — (282.0, 148.8), (264.0, 117.6), (246.0, 86.5) km — each tagged "arrives in 1 h · 12.82 °C",
      "arrives in 2 h · 12.64 °C", "arrives in 3 h · 12.46 °C" (tags above the dots, colour of the map underneath);
      a chip "each dot's temperature now = 13.00 + ∇T·(−v t): 0.180 °C colder per hour of travel".
      Reveal 4 (sentence 4): the clock runs (6 h in 6 s); the dots and the whole pattern slide towards the pole; as each
      dot reaches the pin the pole readout steps to its tag: 13.00 → 12.82 → 12.64 → 12.46 °C … → 11.92 °C at 6 h; the
      balloon (drifting away with the air, not to be confused with the pole) keeps "13.00 °C". When the balloon leaves
      the map its tag reads "balloon (off the map): 13.00 °C".
    voiceover: "So the pole's thermometer falls, point one eight degrees an hour. Look upwind, where the wind comes from. The air reaching the pole in one hour is there now, point one eight degrees colder; in two hours, point three six. So the pole reads thirteen, then twelve point eight two, then twelve point six four."
    on_screen_eq:
      latex: '\frac{\partial T}{\partial t} = -\,\mathbf v\cdot\nabla T = -0.180\ \mathrm{K\ per\ hour}'
      vallis_eq: "provenance only: s18's result with our numbers"
      page_png: chapters/pages/ch01/p025.png
      highlight: [{term: '-\,\mathbf v\cdot\nabla T', colour: teal}]
    on_screen_eq_extra:
      - latex: 'T_{\text{upwind}} = 13.00 + \nabla T\cdot(-\mathbf v\,t)'
        vallis_eq: "provenance only: ours (temperature now at the point the air comes from)"
        page_png: null
    physics_source:
      fn: fluidpy.geo.vectors.dot
      params: {gradT_K_m: [1.0e-5, 0.0], v_m_s: [5.000, 8.660], t_h: [1, 2, 3], T_pin_C: 13.0}
      outputs: {upwind_km: [[282.0, 148.82], [264.0, 117.65], [246.0, 86.47]], upwind_T_C: [12.82, 12.64, 12.46],
                dTdt_K_h: -0.180, T_pole_C: {t_1h: 12.82, t_2h: 12.64, t_3h: 12.46, t_6h: 11.92}, T_balloon_C: 13.00}
      also: [fluidpy.core.kinematics.material_derivative_terms]
      data: "data/weather.json → NEW upwind block (see new_builder_data); T_pole, t_h, dTdt_K_h, parcels_*"
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_dot_V1_component_sum_on_field, ::test_dot_V2_dimensions_pint_advection_unit; ../Fluid Dynamics/tests/test_ch03.py::test_material_derivative_V1_equals_rate_along_pathline"
    exaggeration: ["time compressed (6 h in 6 s, clock chip)", "idealised: parcels keep their temperature; uniform steady wind and gradient; badge: none"]

  - id: s20_twice_steep
    t: [444.000, 462.500]
    title: {kicker: "PART 3 · THE WEATHER", text: "Twice as steep: the shadow can't see it"}
    visual: >-
