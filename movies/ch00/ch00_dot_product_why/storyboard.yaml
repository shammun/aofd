honesty_notes:
  - "A scalar is never drawn as an arrow: a·b, W and u·∇T appear as numbers, a number-line gauge or the product rectangle (shadow × other length) lying on the other arrow's line; negative products are rose and hatched."
  - "The shadow is SIGNED: past 90° it lies on b's line extended behind the origin, and for anti-parallel arrows it is the whole of a pointing backwards (−|a|), so a·b = −|a||b| — the anti-parallel case does have a shadow."
  - "Example numbers are ours (a = (5, 1), b = (1, 3), θ = 60.3°), chosen so the two shadows differ clearly (2.530 vs 1.569) and θ is not 45° (where cos = sin) nor 0° or 90°."
  - "Sign of advection: the local tendency is ∂T/∂t = −u·∇T (from Vallis (1.7) with DT/Dt = 0). Wind with a component towards warm air (u·∇T > 0) brings colder upwind air to a fixed point, so the temperature there falls. Stated in s7 with the 'you stand still' frame; the s6 shadow is described as the air's speed towards warmth (a moving-air statement), so the two frames are never mixed."
  - "∇T is defined in words (an arrow pointing uphill towards warmer air; its length is how fast T rises per metre) and the full gradient is only primed here; Chapter 0A teaches it (Kundu C09 link on the end card)."
  - "The weather map is an idealised, uniform field (illustrative, not data); real temperature changes also involve heating, radiation and mixing — the movie says it assumes DT/Dt = 0."
  - "Work W = F·d is shown without a number because it is not a Vallis or Kundu App. B equation; (0A.1) and (0A.3) are our Chapter-0 labels, and the cosine form appears unnumbered in Kundu §2.8 (p. 52)."
  - "θ here is the angle between two arrows. In Vallis θ is potential temperature; the movie never uses θ for anything else. Likewise b is just our second arrow, not Vallis's buoyancy b."
  - "The (K 2.2) number: analysis/ch00_poc_design.md §0 says the component definition is unnumbered (§2.8), but the rendered Kundu page p. 41 shows it numbered (2.2) in §2.1; the explainer and fluidpy.geo.vectors.dot already cite (K 2.2), so the movie does too."
  - "Spoken numbers are rounded to three figures (two point five three, one point five seven, minus sixteen point one); on-screen numbers carry three decimals or three significant figures and match the frame's state."
quiz_hook: "If you double b, what happens to the shadow of a on b, and what happens to a·b? (Shadow: unchanged, 2.530. a·b: doubles, 8 -> 16.)"
