      also: [fluidpy.geo.vectors.projection, fluidpy.geo.vectors.norm, fluidpy.geo.vectors.k_cross, fluidpy.geo.vectors.dot]
      data: "data/pair.json → shadow_a_on_b, shadow_b_on_a, proj_*, rect_on_*, area_on_*"
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_scalar_projection_V1_and_V7, ::test_dot_V7_rotation_invariance_symmetry_and_padding, ::test_k_cross_V7_quarter_turn_properties"
