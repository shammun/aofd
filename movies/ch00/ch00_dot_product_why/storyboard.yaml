    air arrives. The material derivative, capital D T by D t, is what the balloon''s thermometer sees, and it''s the local
    rate plus the advection term: plus point one eight when the map is frozen, and zero in our story. So whenever you meet
    v dot grad T, think of how fast the wind carries air across the isotherms, measured in degrees per hour.'
