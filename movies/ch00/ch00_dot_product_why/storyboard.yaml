# "0A" and "Part A" are read correctly as the letter name (checked, see lexicon_additions); "zero A" spelled out is NOT.
id: ch00_dot_product_why
title: "What the dot product measures, and why it multiplies by the other length"
concepts: [C0A-PoC1]          # dot product (PoC A/G id); provisional until Chapter-0 curation exists
target_duration_s: 371.9   # measured narration 369.4 s + 2.5 s silent end-card hold (fix loop 1, v3: s14 material derivative + air parcel, s17 M1; user cap 372 s)
fps: 30
size: [1920, 1080]
style: house-dark-v1
audio:
  voice: af_bella
  speed: 1.0
  loudness_lufs: -16          # speech-led mix, integrated; true peak <= -1 dBTP
  music:
    source: "tools/music.py (procedural, our own, CC0)"
    level: "music bed about -28 LUFS, ducked a further 5 dB under speech (user-confirmed 2026-10-22)"
    mood: "slow ambient pad"
    notes: "calm and steady throughout; fades in over the first 2 s of s01 and out over the last 2 s of the end-card hold; one gentle lift on s21 only; no beats, no melody competing with speech, no sudden swells"
measured_narration_s: 369.4
measured_frames: 11157   # narration 11082 frames + 75 hold
words: 861                    # 861 words / 369.4 s = 139.8 words per minute (limit 150)
captions_measured: {"cues": 88, "max_lines": 2, "max_chars_per_line": 42, "max_cps": 15.6, "cue_seconds": [1.65, 6.30], "one_word_second_lines": 0}
dry_run: {tool: "tools/tts.py", run: "G:/Geophysical Fluid Dynamics/aofd-data/scratch/movies/ch00_dot_product_why/dryrun/v3", sentences: 73, self_check_diff_ms: -0.0, loudness_out_lufs: -16.46, true_peak_out_dbtp: -1.50, lexicon: "movies/lexicon.yaml + respell Vallis->Valiss, Kundu->Koondoo applied by hand to the audio copy", earlier_runs: "v1 968 words 417.45 s; v2 861 words 377.83 s (both too long)"}
lexicon_additions:
  # Checked 2026-10-22 with KPipeline(lang_code="a", model=False) phonemes, after movies/lexicon.yaml was applied.
  respell:
    Vallis: "Valiss"        # without it: vˈæliz (a z at the end); with it: vˈælɪs
    Kundu: "Koondoo"        # without it: kˈʌndu ("cun-doo"); with it: kˈundu ("koon-doo")
  checked_ok_without_entries:
    - "0A -> zˈɪɹO ˈA (letter name; the spelled-out 'zero A' gives the article ɐ, so the script writes 0A)"
    - "Part A -> pˈɑɹt ˈA"
    - "K two point two -> kˈA tˈu pˈYnt tˈu"
    - "Phi -> fˈI"
    - "theta -> θˈATə; cos theta -> kˈɑs θˈATə"
    - "v / bold v -> vˈi"
    - "v dot grad T -> vˈi dˈɑt ɡɹˈæd tˈi"
    - "partial T by partial t -> pˈɑɹʃᵊl tˈi bI pˈɑɹʃᵊl tˈi"
    - "D T by D t -> dˈi tˈi bI dˈi tˈi"
    - "b hat, x hat -> bˈi hˈæt, ˈɛks hˈæt"
    - "i (the index) -> ˈI"
    - "advection -> ædvˈɛkʃən; Pythagoras -> pəθˈæɡəɹəs; Dowling -> dˈWlɪŋ; kelvin -> kˈɛlvᵊn"
  not_used: "nabla (nˈæblə reads fine, but the narration says 'grad T' only)"

footnotes:
  K2.2: "(K 2.2) = Kundu, Cohen & Dowling, Fluid Mechanics, 5th ed. (2012), §2.1, eq. (2.2), p. 41"
  0A.1: "(0A.1) = our label (Chapter 0, Part A); Kundu states u·v = uv cos θ unnumbered, §2.8, p. 52"
  0A.3: "(0A.3) = our label (Chapter 0, Part A); derived on screen from (0A.1); no book number"
  sym: "a·b = b·a: Kundu §2.8, p. 51 (unnumbered)"
  work: "W = F·d: the school definition of work; no book number"
  V1.7: "(Vallis 1.7) = Vallis, Atmospheric and Oceanic Fluid Dynamics, 2nd ed. (2017), §1.1.2, eq. (1.7), p. 5"
  grad: "∇T = (∂T/∂x, ∂T/∂y): the gradient, Kundu §2.9, p. 52 (unnumbered, after (K 2.22)); 2-D map, so no z-part"
  dTdt: "∂T/∂t = −v·∇T: derived on screen from (Vallis 1.7) with φ = T and DT/Dt = 0; not a numbered equation"

equations:   # every on-screen TeX string, verified against the page image named (read 2026-10-22)
  K2.2:
    latex: "\\mathbf a\\cdot\\mathbf b = a_1b_1 + a_2b_2 + a_3b_3 \\equiv a_ib_i"
    page_png: "../Fluid Dynamics/chapters/pages/ch02/p068.png"   # Kundu printed p. 41, §2.1 (Scalars, vectors, tensors, notation)
    page_text: "a·b = a1b1 + a2b2 + a3b3 = Σ_{i=1}^{3} a_i b_i ≡ a_i b_i  (2.2); we show the first, second and last forms and spell out the Σ form in an annotation"
  0A.1:
    latex: "\\mathbf a\\cdot\\mathbf b = |\\mathbf a|\\,|\\mathbf b|\\cos\\theta = (|\\mathbf a|\\cos\\theta)\\,|\\mathbf b|"
    page_png: "../Fluid Dynamics/chapters/pages/ch02/p079.png"   # Kundu printed p. 52, §2.8, first line: u·v = uv cos θ (unnumbered)
  0A.3:
    latex: "|\\mathbf a|\\cos\\theta = \\mathbf a\\cdot\\hat{\\mathbf b} = \\frac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|},\\qquad \\hat{\\mathbf b} = \\frac{\\mathbf b}{|\\mathbf b|}"
    page_png: null                                                # ours; tex copied from viz/ch00/vector_products_lab.html ref '(0A.3)'
  V1.7:
    latex: "\\frac{D\\varphi}{Dt} = \\frac{\\partial\\varphi}{\\partial t} + (\\mathbf v\\cdot\\nabla)\\varphi"
    page_png: chapters/pages/ch01/p025.png                       # Vallis printed p. 5 (PDF 25), §1.1.2 (heading on p. 4, PDF 24)
    page_text: "Dφ/Dt = ∂φ/∂t + (v·∇)φ (1.7): upright D, bold italic v (we use \\mathbf as the explainer does); (1.6) is the same with dφ/dt and v·∇φ"

scenes:
  # ======================================================================= PART 1 · What is the dot product?
  - id: s01_hook
    t: [0.000, 7.625]
    visual: >-
      Frame 0: dark plane with a faint square grid (1 unit per square, x right, y up), origin O, left 55 % of the frame
      (the existing PairBase plane, P12). Teal arrow a = (5, 1) and orange arrow b = (1, 3) grow from O over 1.0 s,
      labelled "a" and "b". At 1.5 s a funnel graphic on the right: the two arrows' chips "a = (5, 1)" and "b = (1, 3)"
      slide into a small box labelled "a·b", and a single number "8" drops out onto the number-line gauge (range
      -16.1..+16.1, ticks every 4, label "a·b: one number, not an arrow"), marker at +8. TitleCard text top-left from
      frame 0: "The dot product" / small subtitle "what it measures, and why it multiplies by the other length". With
      sentence 2 a two-item agenda chip fades in under the title: "1 · what it is   2 · why it's built this way".
      Nothing flashes; fades only.
    voiceover: "Two arrows in, one number out: the dot product. First what it is, then why."
    on_screen_eq: null
    physics_source:
      fn: fluidpy.geo.vectors.dot
      params: {a: [5, 1], b: [1, 3]}
      outputs: {a_dot_b: 8.000}
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_dot_V1_component_sum_on_field"
    exaggeration: []
    music: "pad fades in over the first 2 s; calm, steady"

  - id: s02_arrows
    t: [7.625, 25.975]
    visual: >-
      Same plane. Sentence 1: a and b stay; the label chip "vector = length + direction" appears top-left. Sentence 2:
      dotted component legs for a (5 along x, then 1 along y), labelled "5" and "1" in teal; chip "a = (5, 1)". Sentence
      3, first half: legs for b (1 along x, 3 along y), labelled in orange; chip "b = (1, 3)"; second half ("the numbers
      are components"): small caption "the numbers are the components (parts): a₁ = 5, a₂ = 1 · b₁ = 1, b₂ = 3".
      Sentence 4: the legs and each arrow form a right triangle (right-angle ticks at (5, 0) for a and at (1, 0) for b);
      length brackets with Pythagoras
      written out: "|a| = √(5² + 1²) = √26 = 5.099" (teal) and "|b| = √(1² + 3²) = √10 = 3.162" (orange). Grid note
      "1 grid square = 1 unit (equal axes)" moved up to y ≈ 975 (above the footnote area; no footnote in this scene).
    voiceover: "A vector, an arrow, has a length and a direction. Arrow a goes five right and one up: five, one. Arrow b is one, three; the numbers are components. Pythagoras gives the lengths: about five point one and three point one six."
    on_screen_eq: null
    physics_source:
      fn: fluidpy.geo.vectors.norm
      params: {a: [5, 1], b: [1, 3]}
      outputs: {norm_a: 5.099, norm_b: 3.162, norm_a_squared: 26, norm_b_squared: 10}
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_norm_V1_and_V7_scaling"
    exaggeration: []

  - id: s03_def_components
    t: [25.975, 41.950]
    visual: >-
      Right panel (x >= 1010). Sentence 1: chip "Definition 1 · multiply matching parts, then add"; EqLine (K 2.2) with
      the label "(K 2.2)" at the right, a₁b₁ teal-highlighted, a₂b₂ teal, a₃b₃ greyed. Sentence 2: callouts with thin
      leaders to the subscripts: "small number = which part: 1 → x, 2 → y, 3 → z"; the matching pairs are boxed (a₁ with
      b₁, a₂ with b₂, a₃ with b₃). Sentence 3: the last form "≡ aᵢbᵢ" is boxed; annotation below it, written out:
      "i appears twice → add over i = 1, 2, 3:  aᵢbᵢ means Σᵢ₌₁³ aᵢbᵢ = a₁b₁ + a₂b₂ + a₃b₃" and "≡ : 'is defined as' (a
      shorthand, not a new fact)". Plane on the left keeps a, b and the component chips. FOOTNOTE strip: K2.2.
    voiceover: "Definition one: multiply matching parts, then add. The small number under each letter says which part. The last form writes i twice: a repeated index means add over i equals one, two and three."
    on_screen_eq:
      latex: "\\mathbf a\\cdot\\mathbf b = a_1b_1 + a_2b_2 + a_3b_3 \\equiv a_ib_i"
      vallis_eq: "(K 2.2) — Kundu §2.1, p. 41; Vallis gives no number (background maths)"
      page_png: "../Fluid Dynamics/chapters/pages/ch02/p068.png"
