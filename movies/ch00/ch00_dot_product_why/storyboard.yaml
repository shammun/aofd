      outputs: {theta_deg: 60.255, cos_theta: 0.4961, product: 8.000, cos_reminder: {"0": 1.0, "90": 0.0, "180": -1.0}}
      also: [fluidpy.geo.vectors.norm, fluidpy.geo.vectors.dot]
      test: >-
        ../Fluid Dynamics/tests/geo/test_vectors.py::test_angle_between_V1_known_angles_and_field,
        ::test_dot_V1_cosine_form_on_field_of_angles, ::test_dot_V2_symbolic_cosine_law
    exaggeration: []

  - id: s07_same_way
    t: [86.725, 99.150]
    visual: >-
      The plane fades; three small panels side by side (same scale, 1 square = 1 unit), each with teal p = (3, 0) and
      an orange second arrow q, a component line and a mini gauge (−8..+8):
      sentence 1: heading chip "a·b measures how much two arrows point the same way";
      sentence 2, panel 1: q = (2, 0), angle 0°: "3·2 + 0·0 = +6", product rectangle (ink, solid) 3 × 2 on q's line,
      caption "same way: positive";
      sentence 3, first half ("At a right angle, zero"), panel 2: q = (0, 2), angle 90°: "3·0 + 0·2 = 0", no rectangle, caption "across: zero";
      sentence 3, second half ("backwards, minus six"), panel 3: q = (−2, 0), angle 180°: "3·(−2) + 0·0 = −6", rose hatched rectangle behind the start,
      caption "opposite: negative". Letters p and q (not a and b) because these are different arrows. No labelled
      equation, so no footnote strip.
    voiceover: "So the dot product measures how much two arrows point the same way. Three, zero with two, zero: six. At a right angle, zero; backwards, minus six."
    on_screen_eq: null
    physics_source:
      fn: fluidpy.geo.vectors.dot
      params: {p: [3, 0], q: [[2, 0], [0, 2], [-2, 0]]}
      outputs: {p_dot_q: [6.0, 0.0, -6.0], angle_deg: [0.0, 90.0, 180.0], shadow_p_on_q: [3.0, 0.0, -3.0]}
      also: [fluidpy.geo.vectors.angle_between, fluidpy.geo.vectors.scalar_projection]
      test: >-
        ../Fluid Dynamics/tests/geo/test_vectors.py::test_dot_V1_component_sum_on_field,
        ::test_angle_between_V1_known_angles_and_field, ::test_scalar_projection_V1_and_V7 (sign flips with b)
    exaggeration: []

  - id: s08_shadow
    t: [99.150, 141.850]
    visual: >-
      Back to the a, b plane (left) with a DerivationStrip on the right, one line per narrated move.
      Sentence 1: dashed drop-line from a's tip to b's line, right-angle tick at the foot (0.8, 2.4).
      Sentence 2: the teal shadow band O → (0.8, 2.4) on b's line, label "shadow of a on b".
      Sentence 3: the right triangle O–foot–tip is tinted; its sides labelled "long side = |a| = 5.099" and "side next to
      θ = shadow"; strip line 1: "cos θ = (side next to θ) ÷ (long side) = shadow ÷ |a|".
      Sentence 4: strip line 2: "shadow = |a| cos θ" (multiply both sides by |a|).
      Sentence 5, first clause ("Divide definition two by the length of b"): strip line 3 (why: "divide both sides of (0A.1) by |b|"): "a·b ÷ |b| = |a| |b| cos θ ÷ |b|".
      Sentence 5, rest ("it cancels on the right …"): strip line 4: the |b| on the right struck through: "a·b ÷ |b| = |a| cos θ = shadow".
      Sentence 6: strip line 5 with numbers: "8 ÷ 3.162 = 2.530"; the shadow label becomes "shadow = 2.530".
      Sentence 7: an orange unit arrow b̂ appears along b, length 1 (label "b̂ = b ÷ |b| = (0.316, 0.949), length 1 ·
      'b hat'"); strip line 6: "a·b ÷ |b| = a·(b ÷ |b|) = a·b̂ (dividing one arrow by a number divides the dot product
      by it)".
      Sentence 8: strip line 7, component check: "a·b̂ = 5 × 0.316 + 1 × 0.949 = 1.581 + 0.949 = 2.530 ✓"; then EqLine
      (0A.3) assembles below the strip with its label "(0A.3)". FOOTNOTE: 0A.1 · 0A.3.
    voiceover: "Drop a line from the tip of arrow a onto b's line, at a right angle. The stretch it marks off is the shadow of arrow a on b. In this right-angled triangle, arrow a is the long side. The shadow is the side next to theta, so it's the length of arrow a times cos theta. Divide definition two by the length of b: it cancels on the right, leaving the shadow, a dot b over the length of b. Eight over three point one six two: two point five three. And b over its own length, b hat, is b shrunk to length one. So the shadow is also a dot b hat."
    on_screen_eq:
      latex: "|\\mathbf a|\\cos\\theta = \\mathbf a\\cdot\\hat{\\mathbf b} = \\frac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|},\\qquad \\hat{\\mathbf b} = \\frac{\\mathbf b}{|\\mathbf b|}"
      vallis_eq: "(0A.3) — ours (shadow = scalar projection), derived on screen from (0A.1); no book number"
      page_png: null
