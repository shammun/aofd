  voiceover: 'What does point one eight kelvin per hour mean? Let''s follow the balloon''s air parcel, which is at the fixed thermometer right now. The wind carries it straight across the isotherms at five metres per second, the wind''s shadow. Distance is
    speed times time, so in one hour, three thousand six hundred seconds, it moves eighteen kilometres across them. On the
    map as it is right now, each hundred kilometres east is one degree warmer, so eighteen kilometres is worth point one eight
    degrees. So in one hour, the wind carries the parcel to a place where the map reads thirteen point one eight. One degree
    per hundred kilometres is a rate in space: how the temperature changes with distance. Multiply it by a speed in kilometres
    per hour, and you get degrees per hour: a rate in time. So point one eight kelvin per hour is how fast the wind carries
    the parcel into warmer places. That''s v dot grad T, the advection term. It''s positive because the wind blows partly
    towards warmer air, and it''s the same for every air parcel here, because the wind and the map are the same everywhere.
    But does the parcel itself get warmer? That depends on what the map does, so let''s look at two cases.'
