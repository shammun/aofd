honesty_notes:
- 'A scalar is never drawn as an arrow: a·b, W and v·∇T are numbers or product rectangles (shadow x other length); negatives
  are rose, hatched and carry a minus sign.'
- 'The shadow is SIGNED: at 180° it lies behind the start (s05: shadow −3, product −6). The 180° case is called ''pointing
  in the opposite direction'' (user decision).'
- 'Rounded factors are never followed by ''= 8.000'' or ''= 2.530'': s04 shows 5.099 x 3.162 x 0.496 ≈ 8 and s07 shows 5 x
  0.316 + 1 x 0.949 ≈ 2.53 (R1, R2).'
- No references are drawn or spoken, including the ending (user correction 2026-10-24). Provenance stays in this file only.
- 'TWO cases for the weather story, told in this order (v6): Case 1 (s17b), a thought experiment, the map is frozen because
  ''the sun keeps every place at exactly its temperature'', so ∂T/∂t = 0 and DT/Dt = v·∇T = +0.18 K per hour: the balloon''s
  reading climbs 13.00 → 13.18 → 13.36 → 13.54 °C. Holding the map still needs heating that matches the advection everywhere;
  we say ''the sun'' and call it imagined. Case 2 (s18 on), the one we follow: each air parcel keeps its temperature (DT/Dt
  = 0), stated as an assumption about the balloon''s parcel first (''no sunshine and no mixing''); with a uniform wind and
  straight isotherms the whole pattern slides, 18 km per hour east.'
- 's17 is FORWARD only: +0.18 K per hour is how fast the wind carries an air parcel into warmer places (5 m/s × 3600 s = 18
  km across the isotherms; 18 km × 1 °C/100 km = 0.18 °C), shown on a snapshot of the map marked with camera corners. It never
  says ''colder'' and never says the parcel warms; it ends on the question ''does the parcel itself get warmer?'' and answers
  it with the two cases.'
- 'Sign of ''advection'': the movie calls v·∇T ''the advection term''. It is +0.18 K per hour in BOTH cases (the wind has
  a part towards warmer air). Case 1: the balloon warms by it. Case 2: the fixed pole FALLS, ∂T/∂t = −v·∇T = −0.18 K per hour
  (s19a, s19b: ''as colder air is carried in''), and the balloon stays at 13.00 °C. Positive means warmer ahead (downwind),
  so behind (upwind), where the pole''s new air comes from, it is colder (s19a S2).'
- The pole readings 13.00, 12.82, 12.64, 12.46 °C (s19a) come from the sliding field evaluated at the pole and equal the temperatures
  of the queued parcels that arrive at 1, 2, 3 h; each number is attached to its parcel, labelled by arrival time, and moves
  into the pole readout and onto the graph when that parcel arrives. No separate row of numbers is shown (U-M6.12).
- The balance in s19c (+0.18 advection term in both cases; local rate 0 when frozen, −0.18 when the pattern slides) is bookkeeping
  of one cause, not two separate processes; the pole does not cool 'in order to' keep the balloon at 13 °C.
- The weather map is an idealised uniform field (not data), said once on screen ('idealised map'); 1 °C per 100 km and a few
  K per day are realistic mid-latitude sizes.
- Example numbers are ours (a = (5, 1), b = (1, 3); p = (3, 0), q = (2, 0), (0, 2), (−2, 0); wind (6, 8) in s10; wind 10 m/s
  at 60° to ∇T in s16-s20, the same wind that carries the balloon from s12; 1 °C per 100 km).
- The s00 title animation uses the movie's own numbers (p = (3, 0), |q| = 2, the s12 map and its pole series); it is time
  compressed and has no full-screen flash.
- 'Music (user request since round 1): our own procedural pad, about 14 dB under the speech and ducked; no beats, no flashes;
  no full-screen flashes anywhere (the s17 snapshot corners fade, they do not flash).'
quiz_hook: 'In the frozen-map case, what would the balloon read after five hours? And in the sliding-map case? (Frozen: 13
  + 5 × 0.18 = 13.90 °C; sliding: still 13.00 °C, while the pole falls to 12.10 °C.)'
