  - id: s11_work
    as_built: "the sled stays still; d is labelled 'd = 5 m (distance pulled)' under the rectangle, then 10 m; '10 N forward' sits above the sled nose; the 60° arc fades with the 17.3-N leg"
    t: [210.000, 244.250]
    title: {kicker: "PART 2 · WHY TIMES THE OTHER LENGTH?", text: "Reason 3 · physics needs both sizes: work"}
    visual: >-
      U-M2.10, slower. Ground line across the stage at y 640, sled icon (illustrative) at the left, rope from the sled.
      Reveal 1 (sentence 1): slot "3" fills: "physics needs both sizes".
      Reveal 2 (sentence 2): teal force arrow F along the rope, label "pull F = 20 N, 60° above the ground"; small note
      "N = newton, the unit of force".
      Reveal 3 (sentence 3): F splits into its two parts (dashed teal legs): the upward leg "17.3 N up: across the
      motion, does no work" (muted, then dimmed to 40 %).
      Reveal 4 (sentence 4): the ground leg turns solid teal and is labelled as a shadow: "along the ground = the shadow
      of F on the motion = 20 × cos 60° = 10.0 N".
      Reveal 5 (sentence 5): a teal 10 N force arrow now drawn on its own at the sled's nose, label "this shadow is a
      force: 10 N pulling forward — the only part that does work".
      Reveal 6 (sentence 6): orange path arrow d = 5 m along the ground; product rectangle (base 10 N, length 5 m) and
      the line 'W = (shadow) × |d| = 10 N × 5 m = 50 J', note "J = joule, the unit of work (energy)"; work gauge at
      y 960-1040, marker 50 J. Then (second half of sentence 6) the sled slides on: d grows to 10 m, the rectangle
      doubles, 'W = 10 N × 10 m = 100 J', the shadow label stays "10.0 N".
      Reveal 7 (sentence 7): chip "twice the distance → twice the work: the shadow alone can't tell you the work".
      Arrow lengths: force in N and path in m drawn on separate rulers (labelled "N" and "m"); no badge.
    voiceover: "Reason three: physics needs both sizes. Pull a sled with twenty newtons, tilted sixty degrees up. The upward part, across the motion, does no work. The part along the ground is the shadow: twenty times cos sixty, ten newtons. That shadow is itself a force, and only it does work. Work, in joules, is that force times the distance: fifty joules over five metres, one hundred over ten. Twice the distance, twice the work."
    on_screen_eq:
      latex: 'W = \mathbf F\cdot\mathbf d = (|\mathbf F|\cos\theta)\,|\mathbf d|'
      vallis_eq: "provenance only: the school definition of work (no book number); not drawn"
      page_png: null
    on_screen_eq_extra:
      - latex: 'W = (20\cos 60^\circ)\ \mathrm N\times5\ \mathrm m = 10\ \mathrm N\times5\ \mathrm m = 50\ \mathrm J'
        vallis_eq: "provenance only: our numbers"
        page_png: null
      - latex: 'W = 10\ \mathrm N\times10\ \mathrm m = 100\ \mathrm J'
        vallis_eq: "provenance only: our numbers"
        page_png: null
    physics_source:
      fn: fluidpy.geo.vectors.dot
      params: {F: "20 N × (cos 60°, sin 60°) = (10.000, 17.321) N", d: [5, 0], d_series: "(5 → 10 m, 0), 51 samples"}
      outputs: {shadow_N: 10.000, up_part_N: 17.321, W_J: 50.000, W_doubled_J: 100.000}
      also: [fluidpy.geo.vectors.scalar_projection]
      data: "data/work.json → F (F[1] = 17.321 N is the upward part), shadow_N, W_J, d_m"
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_dot_V1_component_sum_on_field, ::test_dot_V1_cosine_form_on_field_of_angles, ::test_scalar_projection_V1_and_V7 (shadow independent of |d|)"
    exaggeration: ["sled icon illustrative (no friction, no mass); force and path drawn on separate labelled rulers; badge: none"]

  # ======================================================================= PART 3 · The weather
  - id: s12_parcel
    t: [244.250, 276.800]
    title: {kicker: "PART 3 · THE WEATHER", text: "Two thermometers: a fixed place, or moving air", partChange: true}
    visual: >-
      U-M2.11: the material derivative is taught FIRST, before any equation. PartCard "Part 3 · The weather" / "the same
      dot product, inside how temperature changes" for 2.0 s under "Now the weather."
      Stage: the idealised temperature map (existing TMap/MapFrame/ColourBar, 600 × 360 km, 10 → 16 °C eastward,
      cmocean thermal, colour bar "T (°C)"), drawn WITHOUT isotherm lines (they are introduced in s14), left 58 %. A small muted tag under the map: "an idealised map (not data)".
      Reveal 1 (sentence 2): a thermometer on a POLE at the pin (300 km, 180 km), label "thermometer on a pole: one
      fixed place"; right column, slate: '∂T/∂t' with "local rate: change at one fixed place".
      Reveal 2 (sentence 3): beside ∂T/∂t a primer card: "∂ ('partial'): only one thing changes — here the time; the
      place stays fixed".
      Reveal 3 (sentence 4): a BALLOON with a thermometer starts at the pin and drifts with a teal wind arrow (10 m/s at
      60° from east), clock chip "1 h of drift in 3 s".
      Reveal 4 (sentence 5): a dashed outline follows a small blob of air around the balloon, label "air parcel = a small
      volume of air that moves with the flow"; the balloon stays inside it.
      Reveal 5 (sentence 6): right column, ink: 'DT/Dt' with "material derivative: rate of change following an air
      parcel (the balloon)"; the two definition rows stay to the end of the scene, each with its icon. No numbers on the
      thermometers yet.
    voiceover: "Now the weather. One thermometer is fixed on a pole: its rate is partial T by partial t, the local rate. Partial means only time changes; the place stays fixed. A second one rides a balloon drifting with the wind. It always measures the same air parcel: a small volume of air that moves with the flow. Its rate, capital D T by D t, is the material derivative: the rate following an air parcel."
    on_screen_eq:
      latex: '\frac{\partial T}{\partial t}\ \ \text{(pole: a fixed place)}\qquad \frac{\mathrm{D}T}{\mathrm{D}t}\ \ \text{(balloon: follows an air parcel)}'
      vallis_eq: "provenance only: the two terms of the material-derivative equation (p025 image), named before the equation is shown"
      page_png: chapters/pages/ch01/p025.png
      highlight: [{term: '\frac{\partial T}{\partial t}', colour: slate}]
    physics_source:
      fn: fluidpy.core.kinematics.material_derivative_terms
      params: {T: "T(x) = 10 °C + 1e-5 K/m · x (idealised, uniform)", v_m_s: [5.000, 8.660], x_pin_km: [300, 180], balloon_path: "x(t) = x_pin + v t, t = 0..1 h"}
      outputs: {terms: "local ∂T/∂t and total DT/Dt named here; numbers from s16 on", balloon_km_after_1h: [318.0, 211.18]}
      also: [fluidpy.geo.vectors.dot]
      data: "data/weather.json → balloon_t_s, balloon_x_km, balloon_y_km, lut_thermal, map_km, pin_km"
      test: "../Fluid Dynamics/tests/test_ch03.py::test_material_derivative_V1_equals_rate_along_pathline, ::test_material_derivative_V7_local_and_advective_vanish"
    exaggeration: ["time compressed (1 h of drift in 3 s, shown by the clock chip)", "idealised field, not data: uniform eastward gradient and uniform steady wind (stated in the scene once as 'an idealised map')", "pole and balloon icons illustrative; badge: none"]

  - id: s13_equation
    as_built: "∇ glossed at first use: '∇φ (“grad φ”): how φ changes across the map'; upright D in D/Dt"
    t: [276.800, 303.300]
    title: {kicker: "PART 3 · THE WEATHER", text: "The material-derivative equation"}
    visual: >-
      Map dims to 40 % on the left; the equation is the scene. No label.
      Reveal 1 (sentence 1): 'Dφ/Dt = ∂φ/∂t + v·∇φ' LARGE (64 px) at the top centre, y 190 — written bracket-free
      (U-M2.11); D/Dt ink, ∂φ/∂t slate, v·∇φ teal. A thin brace under each term: "following an air parcel (balloon)" ·
      "at a fixed place (pole)" · "from being carried across the map".
      Reveal 2 (sentence 2): φ circled in all three places, leader to "φ = any quantity the air carries: temperature T,
      moisture, …" with two small icons (thermometer, droplet); v circled, leader to "v = the wind (the velocity of the
      air)" and a teal wind arrow icon; ∇ gets a small muted chip "∇ = 'grad': explained in two scenes".
      Reveal 3 (sentence 3): the teal brace becomes "v·∇φ = advection of φ: change from being carried by the wind".
      Reveal 4 (sentence 4): second line under it, φ replaced by T: 'DT/Dt = ∂T/∂t + v·∇T' with "v·∇T = advection of
      temperature"; and a muted third line "moisture q: v·∇q = advection of moisture". The dot in v·∇T gets a teal ring
      with the chip "this dot = our dot product".
    voiceover: "The equation: capital D phi by D t equals partial phi by partial t, plus v dot grad phi. Phi is anything the air carries, like temperature or moisture; v is the wind. The last term is the change from being carried across the map: the advection of phi. For temperature, phi is T, and v dot grad T is the advection of temperature."
    on_screen_eq:
      latex: '\frac{\mathrm{D}\varphi}{\mathrm{D}t} = \frac{\partial\varphi}{\partial t} + \mathbf v\cdot\nabla\varphi'
      vallis_eq: "provenance only, not drawn: Vallis (1.7) with (v·∇)φ written v·∇φ, as in (1.6) on the same page (identical for a scalar φ)"
      page_png: chapters/pages/ch01/p025.png
      highlight: [{term: '\frac{\partial\varphi}{\partial t}', colour: slate}, {term: '\mathbf v\cdot\nabla\varphi', colour: teal}]
    on_screen_eq_extra:
      - latex: '\frac{\mathrm{D}T}{\mathrm{D}t} = \frac{\partial T}{\partial t} + \mathbf v\cdot\nabla T'
        vallis_eq: "provenance only: the same with φ = T"
        page_png: chapters/pages/ch01/p025.png
      - latex: '\mathbf v\cdot\nabla q'
        vallis_eq: "provenance only: the same with φ = q (moisture), muted aside"
        page_png: chapters/pages/ch01/p025.png
    physics_source: null   # the equation card; its terms are computed from s16 on (material_derivative_terms in s18)
    exaggeration: ["equation card: no physics drawn (the dimmed map repeats s12); badge: none"]

  - id: s14_isotherms
    t: [303.300, 329.050]
    title: {kicker: "PART 3 · THE WEATHER", text: "Isotherms, and partial derivatives in space"}
    visual: >-
      U-M2.12 part 1. The map returns to full opacity (left 58 %, km axes 0-600 east, 0-360 north, labelled).
      Reveal 1 (sentence 1): isotherm lines draw in one by one (left to right) at x = 100, 200, 300, 400, 500 km,
      labelled 11, 12, 13, 14, 15 °C at the top; chip "isotherm = a line of equal temperature".
      Reveal 2 (sentence 2): brackets "100 km" between neighbouring isotherms; note "north–south lines, one every 100 km".
      Reveal 3 (sentence 3): a walker dot moves east from the pin (300 km) to 400 km and 500 km; at each crossing a tag
      "+1 °C" (13 → 14 → 15 °C).
      Reveal 4 (sentence 4): right panel '∂T/∂x = 1 °C per 100 km' with the words "change going east only (north
      position held fixed)" and a reminder "∂ = only one thing changes".
      Reveal 5 (sentence 5): the walker goes back to the pin and walks north along the 13 °C isotherm; its readout
      stays "13 °C"; right panel '∂T/∂y = 0' with "change going north only: none".
    voiceover: "The thin lines are isotherms: lines of equal temperature. Here they run north to south, one every hundred kilometres. Walk east, and each one you cross is one degree warmer. That's partial T by partial x: the change going east only. Walk north, and you stay on one isotherm: partial T by partial y is zero."
    on_screen_eq:
      latex: '\frac{\partial T}{\partial x} = \frac{1\ ^\circ\mathrm C}{100\ \mathrm{km}},\qquad \frac{\partial T}{\partial y} = 0'
      vallis_eq: "provenance only: the two components of the gradient (Kundu p079 image), our numbers"
      page_png: "../Fluid Dynamics/chapters/pages/ch02/p079.png"
    physics_source:
      fn: fluidpy.core.operators.gradient
      params: {T: "10 °C + 1e-5 K/m · x on a 5-km grid, 600 × 360 km", h_m: 5000.0}
      outputs: {dTdx_K_m: 1.00e-5, dTdy_K_m: 0.0, isotherms_km: [100, 200, 300, 400, 500], isotherm_T_C: [11, 12, 13, 14, 15]}
      data: "data/weather.json → dTdx_K_m, dTdy_K_m; NEW isotherms_km, isotherm_T_C (see new_builder_data)"
      test: "../Fluid Dynamics/tests/test_ch02.py::test_gradient_V1_perpendicular_to_level_sets_and_directional_derivative"
    exaggeration: ["idealised field, not data (T rises uniformly eastward); badge: none"]

  - id: s15_grad_t
