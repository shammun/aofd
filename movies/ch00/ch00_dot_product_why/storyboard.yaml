honesty_notes:
  - "A scalar is never drawn as an arrow: a·b, W and v·∇T appear as numbers, a number-line gauge or the product rectangle (shadow × other length) on the other arrow's line; negative products are rose and hatched."
  - "The shadow is SIGNED: past 90° it lies behind the start (s07 panel 3: shadow −3, product −6), so a·b < 0; the recap states the sign rule in one line."
  - "Labels are explained on screen and in the narration (s04): K = Kundu, Cohen & Dowling (5th ed., 2012); 0A = zero-A, our Chapter-0 Part-A label, not a book number; Vallis = Vallis (2nd ed., 2017). Every frame with a labelled equation carries a footnote strip with section, equation number and printed page (or 'our label')."
  - "(0A.3) is derived on screen one move per step from (0A.1) (s08): right triangle → shadow = |a| cos θ; divide (0A.1) by |b|; b-hat = b/|b|; check 5 × 0.316 + 1 × 0.949 = 2.530."
  - "Wind letter: Vallis calls the wind (the velocity of the air) bold v; the movie uses v for every wind (s11 and s13–s20). Its eastward component, which Vallis writes u, is only mentioned in a small chip in s11. θ is the angle between two arrows (in Vallis θ is potential temperature); b is our second arrow, not Vallis's buoyancy."
  - "Sign of advection: the local tendency is ∂T/∂t = −v·∇T (from Vallis (1.7) with DT/Dt = 0, derived on screen in s18). Wind with a component towards warm air (v·∇T > 0) brings colder upwind air to a fixed point, so the pole's thermometer falls; the balloon's stays at 13.00 °C."
  - "0.180 K per hour is a rate in TIME met by the moving air (5.00 m/s = 18.0 km per hour towards warmer air × 1 K per 100 km); the map's slope, 1 K per 100 km, is a rate in SPACE and does not change (s17 answers the user's question on screen)."
  - "The weather map is an idealised, uniform field (illustrative, not data), stamped on every weather scene; real temperature changes also involve heating, radiation and mixing — the movie says DT/Dt = 0 is an assumption (no sunshine, no mixing)."
  - "Work W = F·d is shown without a number because it is not a Vallis or Kundu equation; its footnote says so."
  - "Example numbers are ours (a = (5, 1), b = (1, 3), θ = 60.3°; p = (3, 0) with q = (2, 0), (0, 2), (−2, 0); wind 10 m/s at 60°; 1 K per 100 km)."
  - "Spoken numbers are rounded to three figures; on-screen numbers carry three decimals or three significant figures and match the frame's state."
  - "Music (user request): our own procedural pad (tools/music.py, CC0) about 14 dB under the speech and ducked; no beats, no flashes; the captions and the transcript are unchanged by it."
quiz_hook: "If the map were twice as steep AND the wind turned to 90° from ∇T, how fast would the pole's thermometer change? (Zero: the shadow of v on ∇T is 0, so v·∇T = 0 however steep the map is.)"
