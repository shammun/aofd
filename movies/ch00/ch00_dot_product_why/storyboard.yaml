honesty_notes:
  - "A scalar is never drawn as an arrow: a·b, W and v·∇T are numbers or product rectangles (shadow x other length); negatives are rose, hatched and carry a minus sign."
  - "The shadow is SIGNED: at 180° it lies behind the start (s05: shadow −3, product −6). The 180° case is called 'pointing in the opposite direction' (user decision)."
  - "Rounded factors are never followed by '= 8.000' or '= 2.530': s04 shows 5.099 x 3.162 x 0.496 ≈ 8 and s07 shows 5 x 0.316 + 1 x 0.949 ≈ 2.53 (R1, R2)."
  - "No references are drawn or spoken, including the ending (user correction 2026-10-24). Provenance stays in this file only."
  - "ONE assumption for the weather story: each air parcel keeps its temperature (DT/Dt = 0), stated as a supposition ('no sunshine and no mixing') in s18. With a uniform wind and straight isotherms the whole pattern slides, 18 km per hour east (s18 says the wind is the same everywhere)."
  - "s17 freezes the map on purpose and MARKS it as a snapshot (camera corners). It is told from the pole's point of view (the air that reaches it in an hour is now 18 km upwind across the isotherms, 0.18 °C colder); the balloon is not shown there and is never said to warm."
  - "Sign of 'advection': the movie calls v·∇T 'the advection term'. Here it is +0.18 K per hour because the wind has a part towards warmer air, and the fixed point therefore FALLS: ∂T/∂t = −v·∇T = −0.18 K per hour (s19b: 'as colder air is carried in'). Nothing anywhere warms at 0.18 K per hour."
  - "The pole readings 13.00, 12.82, 12.64, 12.46 °C (s19a) come from the sliding field evaluated at the pole and equal the present temperatures of the upwind dots; the balloon reads 13.00 °C on the same clock."
  - "The balance in s19c (+0.18 moved to a spot that read 13.18 an hour ago, −0.18 because every place cooled) is bookkeeping of one cause, the moving pattern; the pole does not cool 'in order to' keep the balloon at 13 °C."
  - "The weather map is an idealised uniform field (not data), said once on screen ('idealised map'); 1 °C per 100 km and a few K per day are realistic mid-latitude sizes."
  - "Example numbers are ours (a = (5, 1), b = (1, 3); p = (3, 0), q = (2, 0), (0, 2), (−2, 0); wind (6, 8) in s10; wind 10 m/s at 60° to ∇T in s16-s20, the same wind that carries the balloon from s12; 1 °C per 100 km)."
  - "Music (user request since round 1): our own procedural pad, about 14 dB under the speech and ducked; no beats, no flashes; no full-screen flashes anywhere (the s17 snapshot corners fade, they do not flash)."
quiz_hook: "If the map were twice as steep AND the wind blew along the isotherms (90° from ∇T), how fast would the pole's thermometer change? (Not at all: the shadow of v on ∇T is 0, so v·∇T = 0 however steep the map is.)"

