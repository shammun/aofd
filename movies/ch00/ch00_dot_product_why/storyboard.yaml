    fields: {upwind_t_h: [1, 2, 3], upwind_x_km: [282.0, 264.0, 246.0], upwind_y_km: [148.823, 117.646, 86.469], upwind_dT_K: [-0.18, -0.36, -0.54], upwind_T_C: [12.82, 12.64, 12.46]}
    check_rows: ["upwind_T_C equals T_pole at t = 1, 2, 3 h (indices 20, 40, 60 of t_h), tol 1e-9", "upwind positions = balloon path run backwards (pin − v t), tol 1e-9", "upwind dots inside the map"]
