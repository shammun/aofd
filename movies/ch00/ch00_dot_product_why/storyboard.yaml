      outputs: {shadow_steep_m_s: 5.000, v_dot_gradT_steep_K_s: 1.0e-4, dTdt_steep_K_h: -0.360, T_pole_steep_C: {t_0: 13.00, t_1h: 12.64, t_6h: 10.84}}
      also: [fluidpy.geo.vectors.scalar_projection, fluidpy.core.kinematics.material_derivative_terms]
