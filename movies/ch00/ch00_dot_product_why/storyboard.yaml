    exaggeration: []

  - id: s06_def_cosine
    t: [69.800, 86.725]
    visual: >-
      Sentence 1: chip "Definition 2 · lengths and the angle"; angle arc θ between a and b, readout "θ = 60.3°";
      length brackets "|a| = 5.099" (teal) and "|b| = 3.162" (orange); EqLine (0A.1) appears under (K 2.2) with label
      "(0A.1)"; its second form "= (|a| cos θ)|b|" is drawn at 40 % opacity until s09 (it is the question's form).
      Sentence 2: a small inset "what cos does" with three mini arrow pairs (same direction, right angle, opposite):
      "cos 0° = 1", "cos 90° = 0", "cos 180° = −1", each pair drawn with a tiny angle arc. Sentence 3: live numbers
      under (0A.1): "= 5.099 × 3.162 × cos 60.3° = 5.099 × 3.162 × 0.496 = 8.000"; the gauge marker does not move
      (same 8); caption "two recipes, one number". FOOTNOTE: K2.2 · 0A.1.
    voiceover: "Definition two: both lengths times the cosine of theta, the angle between them. Cosine is one for the same direction, zero at a right angle, minus one for opposite. Here it's point four nine six: eight again."
    on_screen_eq:
      latex: "\\mathbf a\\cdot\\mathbf b = |\\mathbf a|\\,|\\mathbf b|\\cos\\theta = (|\\mathbf a|\\cos\\theta)\\,|\\mathbf b|"
      vallis_eq: "(0A.1) — our Chapter-0 label; Kundu §2.8 states u·v = uv cos θ unnumbered (p. 52)"
      page_png: "../Fluid Dynamics/chapters/pages/ch02/p079.png"
      label_on_screen: "0A.1"
    footnote: [K2.2, 0A.1]
    physics_source:
