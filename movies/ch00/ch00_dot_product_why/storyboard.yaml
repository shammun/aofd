    exaggeration: ["time compressed (clock chip)", "idealised field, not data; badge: none"]

  # ======================================================================= RECAP and end card
  - id: s21_recap
    t: [462.500, 484.900]
    title: {kicker: "RECAP", text: "What the dot product measures", partChange: true}
    visual: >-
      U-M2.17. No PartCard (the band's kicker changes to RECAP with the part-change accent). Four rows, each with a mini
      icon on the left, revealed with sentences 2-5 (sentence 1 shows the heading line only, 48 px, centred: "So what
      does the dot product measure?"):
      row 1 (sentence 2) icon: a and b with the shadow and the product rectangle — "how much two arrows point the same
      way, times both their lengths:  a·b = (shadow of a on b) × |b| = |a| |b| cos θ";
      row 2 (sentence 3) icon: the three p, q mini panels — "its sign:  + same way · 0 at a right angle · − opposite
      directions";
      row 3 (sentence 4) icon: v and x̂ — "with a unit vector it gives a component:  v·x̂ = 6 m/s, the eastward wind";
      row 4 (sentence 5) icon: sled and the map arrow — "in physics it joins a direction with a size:  work W = F·d =
      50 J · advection v·∇T = 0.180 K per hour".
      Rows 44 px text, equations 44 px KaTeX, left-aligned at x 300, y 230-780. No references.
    voiceover: "So what does the dot product measure? How much two arrows point the same way, times both their lengths. Its sign says same way, across, or opposite. With a unit vector, it's a component. In physics, it joins a direction with a size: work, and the wind's warming or cooling."
    on_screen_eq:
      latex: '\mathbf a\cdot\mathbf b = (|\mathbf a|\cos\theta)\,|\mathbf b| = |\mathbf a|\,|\mathbf b|\cos\theta'
      vallis_eq: "provenance only: (1) regrouped (shown without a number here)"
      page_png: "../Fluid Dynamics/chapters/pages/ch02/p079.png"
    on_screen_eq_extra:
      - latex: '\mathbf v\cdot\hat{\mathbf x} = 6\ \mathrm{m\,s^{-1}}'
        vallis_eq: "provenance only: s10"
        page_png: null
      - latex: 'W = \mathbf F\cdot\mathbf d = 50\ \mathrm J,\qquad \mathbf v\cdot\nabla T = 0.180\ \mathrm{K\ per\ hour}'
        vallis_eq: "provenance only: s11, s16"
        page_png: null
    physics_source: null   # recap card: numbers repeated from s03-s16 data, no new computation
    exaggeration: ["recap card: text and icons only, illustrative; badge: none"]
    music: "AS BUILT: no lift (the bed is unchanged from v3, user decision)"

