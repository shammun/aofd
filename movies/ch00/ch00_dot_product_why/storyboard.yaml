      another way", rows tagged "shadow:" as in s06 where they compute the shadow.
      Reveal 1 (sentence 1): b shrinks smoothly to length 1 along its own line (1.5 s), an orange unit arrow "b̂" left
      behind; label "b̂ ('b hat') = b ÷ |b|".
      Reveal 2 (sentence 2): definition card beside it: "unit vector b̂: length 1, same direction as b" with a 1-unit
      bracket on b̂ reading "|b̂| = 1".
      Reveal 3 (sentence 3): row 'b̂ = b / |b| = (1 / 3.162, 3 / 3.162) = (0.316, 0.949)' — the 1 and 3 coloured like
      b's legs, each "/ 3.162" in orange; b̂'s own legs drawn (0.316 along x, 0.949 along y).
      Reveal 4 (sentence 4): row 'a·b / |b| = a·(b / |b|) = a·b̂' (why "dividing b by a number divides the dot product
      by it too").
      Reveal 5 (sentence 5): merged row (old lines 6+7), tag "shadow:": 'shadow = a·b̂ = 5 × 0.316 + 1 × 0.949 = 1.581 +
      0.949 = 2.530', boxed, with a tick "same shadow as before: 2.530"; then the summary line assembles under the strip
      (no label): '|a| cos θ = a·b̂ = a·b / |b|'.
    voiceover: "A second way to the same shadow: divide b by its own length. That's b hat, the unit vector along b: length one, same direction. Its components are one and three, each over three point one six two. Dividing b by a number divides the dot product by it too, so the shadow is a dot b hat. Five times point three one six, plus one times point nine four nine: two point five three again."
    on_screen_eq:
