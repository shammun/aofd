scenes:
  # ======================================================================= PART 1 · What the dot product is
  - id: s01_hook
    t: [0.000, 8.475]
    title: {kicker: "PART 1 · WHAT THE DOT PRODUCT IS", text: "Two arrows in, one number out", partChange: true}
    visual: >-
      SceneTitle band from frame 0 (no separate PartCard here: the hook must land in the first 3 s; the band kicker
      names the part). Stage: the existing PairBase plane (faint square grid, 1 unit per square, x right, y up, origin O)
      in the left 55 %, y 160-800. Teal arrow a = (5, 1) and orange arrow b = (1, 3) grow from O over 1.0 s, labelled
      "a" and "b". From 1.5 s (sentence 1) a funnel on the right: chips "a = (5, 1)" and "b = (1, 3)" slide into a box
      "a·b" and the number "8" drops onto the number-line gauge (range −16..+16, ticks every 4; gauge at y 960-1040,
      below the caption band), label "one number, not an arrow". Sentence 2: a two-item agenda chip at (1010, 600):
      "1 · what it is     2 · why it's built this way". Fades only.
    voiceover: "Two arrows in, one number out: the dot product. First what it is, then why it's built this way."
    on_screen_eq: null
    physics_source:
      fn: fluidpy.geo.vectors.dot
      params: {a: [5, 1], b: [1, 3]}
      outputs: {a_dot_b: 8.000}
      data: "data/pair.json → a_dot_b"
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_dot_V1_component_sum_on_field"
    exaggeration: []

  - id: s02_arrows
    t: [8.475, 33.150]
    title: {kicker: "PART 1 · WHAT THE DOT PRODUCT IS", text: "Vectors and their components"}
    visual: >-
      Same plane. Reveal 1 (sentence 1): chip "vector = an arrow: a length and a direction" at (60, 170).
      Reveal 2 (sentence 2): dotted component legs for a (5 along x, then 1 along y), labelled "5" and "1" in teal;
      then legs for b (1 along x, 3 along y), labelled "1" and "3" in orange.
      Reveal 3 (sentence 3, U-M2.1): two chips on the right panel, written as the narration says it:
      "5 and 1 are the components of vector a:  a = (5, 1)" (teal) and "1 and 3 are the components of vector b:
      b = (1, 3)" (orange); under them a small muted line "component = how far the arrow reaches along one axis".
      Reveal 4 (sentence 4): right-angle ticks at (5, 0) and (1, 0); length brackets with Pythagoras written out:
      "|a| = √(5² + 1²) = √26 = 5.099" (teal) and "|b| = √(1² + 3²) = √10 = 3.162" (orange), plus a chip
      "|a| (two straight bars) = the length of a". Grid note "1 grid square = 1 unit" bottom left at y 975.
    voiceover: "A vector is an arrow, with a length and a direction. Vector a goes five right and one up; vector b goes one right and three up. Five and one are the components of vector a and one and three are the components of vector b. Pythagoras gives the lengths, written with straight bars: about five point one and three point one six."
    on_screen_eq: null
    physics_source:
      fn: fluidpy.geo.vectors.norm
      params: {a: [5, 1], b: [1, 3]}
      outputs: {norm_a: 5.099, norm_b: 3.162, norm_a_squared: 26, norm_b_squared: 10}
      data: "data/pair.json → norm_a, norm_b, norm_a_sq, norm_b_sq"
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_norm_V1_and_V7_scaling"
    exaggeration: []

  - id: s03_definition
    t: [33.150, 54.775]
    title: {kicker: "PART 1 · WHAT THE DOT PRODUCT IS", text: "Definition 1: multiply matching components, then add"}
    visual: >-
      Old s03 and old s05 merged (U-M2.2, U-M2.3); no label, no index annotation, no "small number = which part" line.
      Plane with a, b and their component legs stays on the left. Right panel (x >= 1010):
      Reveal 1 (sentence 1): chip "multiply matching components, then add".
      Reveal 2 (sentence 2): EqLine 'a·b = a₁b₁ + a₂b₂ + a₃b₃' (52 px) with the caption "arrows in space: 3 components";
      then the a₃b₃ term fades to 30 % and is struck through in muted ink, caption "our flat arrows: 2 components", and
      the second line builds under it: 'a·b = a₁b₁ + a₂b₂'.
      Reveal 3 (sentence 3): value tags drop under each symbol of the second line, coloured by vector:
      "a₁ = 5" and "b₁ = 1" under a₁b₁ (boxed together, "first components"), "a₂ = 1" and "b₂ = 3" under a₂b₂ (boxed
      together, "second components"); matching leg labels on the plane pulse once (opacity 0.7 → 1 → 0.85, no flash).
      Reveal 4 (sentence 4): the worked line '= 5 × 1 + 1 × 3 = 5 + 3 = 8'; the 8 drops onto the gauge (y 960-1040,
      marker +8), gauge label "a·b = 8: one number, not an arrow", with the small crossed-out ghost-arrow icon.
    voiceover: "Definition one: multiply matching components, then add. In space that's three products; our flat arrows have two components, so two. The first components are five and one; the second, one and three. Five times one, plus one times three: eight, one number, not an arrow."
    on_screen_eq:
      latex: '\mathbf a\cdot\mathbf b = a_1b_1 + a_2b_2 + a_3b_3'
      vallis_eq: "provenance only, not drawn: Kundu (2.2), first two members (page image checked)"
      page_png: "../Fluid Dynamics/chapters/pages/ch02/p068.png"
      number_on_screen: null
    on_screen_eq_extra:
      - latex: '\mathbf a\cdot\mathbf b = a_1b_1 + a_2b_2 = 5\times1 + 1\times3 = 8'
        vallis_eq: "provenance only: the same definition with two components and our numbers"
        page_png: "../Fluid Dynamics/chapters/pages/ch02/p068.png"
    physics_source:
      fn: fluidpy.geo.vectors.dot
      params: {a: [5, 1], b: [1, 3]}
      outputs: {a_dot_b: 8.000, terms: [5, 3, 0]}
      data: "data/pair.json → terms, a_dot_b"
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_dot_V1_component_sum_on_field, ::test_dot_V7_rotation_invariance_symmetry_and_padding"
    exaggeration: []

  - id: s04_cosine
    t: [54.775, 74.350]
    title: {kicker: "PART 1 · WHAT THE DOT PRODUCT IS", text: "Definition 2: two lengths and the angle"}
    visual: >-
      Reveal 1 (sentence 1): angle arc θ between a and b on the plane, readout "θ = 60.3°, the angle between the
      arrows"; the length brackets |a| = 5.099, |b| = 3.162 brighten; right panel EqLine 'a·b = |a| |b| cos θ' (52 px)
      with a plain "(1)" at its right (36 px, muted) — the only equation number in the movie (G1, U-M2.5).
      Reveal 2 (sentence 2): small inset "cos θ depends only on the angle" with a dial from −1 to +1 and three ticks
      "cos 0° = 1", "cos 90° = 0", "cos 180° = −1".
      Reveal 3 (sentence 3): live line under (1): '= 5.099 × 3.162 × cos 60.3° = 5.099 × 3.162 × 0.496 = 8.000'; the
      gauge marker stays at 8; caption "two recipes, one number".
      Reveal 4 (sentence 4): a soft accent ring around "(1)" with the note "equation (1): we use it in a moment".
    voiceover: "Definition two multiplies the two lengths and the cosine of theta, the angle between the arrows. Cosine depends only on the angle, from minus one to one. Here it's point four nine six, and the product is eight again. Call this equation one."
    on_screen_eq:
      latex: '\mathbf a\cdot\mathbf b = |\mathbf a|\,|\mathbf b|\cos\theta'
      vallis_eq: "provenance only, not drawn: Kundu §2.8 states u·v = uv cos θ unnumbered (page image checked); on screen it is numbered plainly (1)"
      page_png: "../Fluid Dynamics/chapters/pages/ch02/p079.png"
      number_on_screen: "(1)"
    on_screen_eq_extra:
      - latex: '= 5.099\times3.162\times\cos 60.3^\circ = 5.099\times3.162\times0.496 = 8.000'
        vallis_eq: "provenance only: (1) with our numbers"
        page_png: null
    physics_source:
      fn: fluidpy.geo.vectors.angle_between
      params: {a: [5, 1], b: [1, 3], degrees: true, cos_reminder_pairs: {"0": [[3, 0], [2, 0]], "90": [[3, 0], [0, 2]], "180": [[3, 0], [-2, 0]]}}
      outputs: {theta_deg: 60.255, cos_theta: 0.4961, product: 8.000, cos_reminder: {"0": 1.0, "90": 0.0, "180": -1.0}}
      also: [fluidpy.geo.vectors.norm, fluidpy.geo.vectors.dot]
      data: "data/pair.json → theta_deg, cos_theta, cos_reminder"
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_angle_between_V1_known_angles_and_field, ::test_dot_V1_cosine_form_on_field_of_angles, ::test_dot_V2_symbolic_cosine_law"
    exaggeration: []

  - id: s05_angle_cases
    as_built: "a large reference p = (3, 0) stays at the top left for the whole scene (review 4 S7); copies fly into the panels"
    t: [74.350, 100.875]
    title: {kicker: "PART 1 · WHAT THE DOT PRODUCT IS", text: "The angle sets the sign"}
    visual: >-
      U-M2.4. The a, b plane fades out. Reveal 1 (sentence 1): the fixed arrow p = (3, 0) appears LARGE and alone at the
      top centre (y 200-300, 1 unit = 90 px, teal, 10-px shaft, label "p" 48 px, chip "p stays the same in all three
      pictures"). Then three copies of p fly down into three panels side by side (x 120-660, 690-1230, 1260-1800,
      y 360-760, each 1 unit = 70 px, p drawn identically and pinned, with a small padlock-free "same p" tag); the
      second arrow q (orange) appears in each panel only when its sentence comes; chip "only q turns".
      Reveal 2 (sentence 2), panel 1: q = (2, 0), arc "0°", line "p·q = 3 × 2 + 0 × 0 = +6", ink product rectangle
      3 × 2 on q's line, caption "same direction: positive".
      Reveal 3 (sentence 3), panel 2: q = (0, 2), right-angle tick "90°", line "p·q = 3 × 0 + 0 × 2 = 0", no
      rectangle, caption "right angle: zero".
      Reveal 4 (sentence 4), panel 3: q = (−2, 0), arc "180°", line "p·q = 3 × (−2) + 0 × 0 = −6", rose hatched
      rectangle behind the start, caption "opposite directions: negative".
      Reveal 5 (sentence 5): band across the panels "a·b measures how much two arrows point the same way".
      Mini gauges (−8..+8) under each panel at y 960-1040.
    voiceover: "Now keep one arrow, p, fixed in all three pictures; only q turns. Same direction, zero degrees: three times two, six, positive. At a right angle, ninety degrees: zero. At one hundred and eighty degrees, pointing in opposite directions: minus six, negative. So the dot product measures how much two arrows point the same way."
    on_screen_eq: null
    physics_source:
      fn: fluidpy.geo.vectors.dot
      params: {p: [3, 0], q: [[2, 0], [0, 2], [-2, 0]]}
      outputs: {p_dot_q: [6.0, 0.0, -6.0], angle_deg: [0.0, 90.0, 180.0], shadow_p_on_q: [3.0, 0.0, -3.0]}
      also: [fluidpy.geo.vectors.angle_between, fluidpy.geo.vectors.scalar_projection]
      data: "data/same_way.json"
      test: "../Fluid Dynamics/tests/geo/test_vectors.py::test_dot_V1_component_sum_on_field, ::test_angle_between_V1_known_angles_and_field, ::test_scalar_projection_V1_and_V7"
    exaggeration: []

  - id: s06_shadow
    t: [100.875, 133.025]
    title: {kicker: "PART 1 · WHAT THE DOT PRODUCT IS", text: "The shadow of a on b, step by step"}
    visual: >-
      Back to the a, b plane (left). Right: a DerivationStrip headed "Computing the shadow of a on b" (U-M2.7), its
      first row the starting line '(1)  a·b = |a| |b| cos θ' in muted ink. Every following row has a left tag
      "shadow:" (28 px, teal) so each line reads as a step of the shadow computation; each row's 'why' sits under it in
      26 px muted.
      Reveal 1 (sentence 1): dashed drop-line from a's tip to b's line, right-angle tick at the foot (0.8, 2.4).
      Reveal 2 (sentence 2): the teal shadow band O → (0.8, 2.4) on b's line, label "shadow of a on b".
      Reveal 3 (sentence 3): the right triangle O–foot–tip tinted; sides labelled "long side = |a| = 5.099" and "side
      next to θ = shadow"; strip row 1 'cos θ = shadow / |a|' (why "in a right triangle, cos θ = side next to θ ÷ long
      side") and row 2 'shadow = |a| cos θ' (why "multiply both sides by |a|").
      Reveal 4 (sentence 4): row 3 'a·b / |b| = |a| |b| cos θ / |b|' (why "divide both sides of (1) by |b|"); "(1)" in
      the why-text and in the starting row light up together.
      Reveal 5 (sentence 5): the |b| top and bottom on the right struck through; row 4, the merged line (old lines 4+5):
      'shadow = |a| cos θ = a·b / |b| = 8 / 3.162 = 2.530' (why "|b| cancels; then our numbers"), boxed; the shadow
      label on the plane becomes "shadow = 2.530".
    voiceover: "Drop a line from the tip of arrow a onto b's line, at a right angle. The stretch it marks off is the shadow of arrow a on b. Arrow a is the long side of a right triangle, so the shadow, next to theta, is its length times cos theta. Divide both sides of equation one by the length of b. It cancels on the right, leaving the shadow: a dot b over the length of b: eight over three point one six two, or two point five three."
    on_screen_eq:
      latex: '\text{shadow} = |\mathbf a|\cos\theta = \frac{\mathbf a\cdot\mathbf b}{|\mathbf b|} = \frac{8}{3.162} = 2.530'
      vallis_eq: "provenance only: ours (scalar projection), derived on screen from (1); no book number"
      page_png: null
      number_on_screen: null
    on_screen_eq_extra:
      - latex: '\mathbf a\cdot\mathbf b = |\mathbf a|\,|\mathbf b|\cos\theta'
        vallis_eq: "provenance only: the starting row, shown as (1)"
        page_png: "../Fluid Dynamics/chapters/pages/ch02/p079.png"
        number_on_screen: "(1)"
    derivation_strip:
      header: "Computing the shadow of a on b"
      start: {line: '\mathbf a\cdot\mathbf b = |\mathbf a|\,|\mathbf b|\cos\theta', number: "(1)"}
      rows:
        - {tag: "shadow:", line: '\cos\theta = \dfrac{\text{shadow}}{|\mathbf a|}', why: "in a right triangle, cos θ = side next to θ ÷ long side", sentence: 3}
        - {tag: "shadow:", line: '\text{shadow} = |\mathbf a|\cos\theta', why: "multiply both sides by |a|", sentence: 3}
        - {tag: "shadow:", line: '\dfrac{\mathbf a\cdot\mathbf b}{|\mathbf b|} = \dfrac{|\mathbf a|\,|\mathbf b|\cos\theta}{|\mathbf b|}', why: "divide both sides of (1) by |b|", sentence: 4}
