    derivation_strip:
      - {line: "\\cos\\theta = \\dfrac{\\text{side next to }\\theta}{\\text{long side}} = \\dfrac{\\text{shadow}}{|\\mathbf a|}", why: "right triangle: cosine = adjacent ÷ hypotenuse"}
      - {line: "\\text{shadow} = |\\mathbf a|\\cos\\theta", why: "multiply both sides by |a|"}
      - {line: "\\dfrac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|} = \\dfrac{|\\mathbf a|\\,|\\mathbf b|\\cos\\theta}{|\\mathbf b|}", why: "divide both sides of (0A.1) by |b|"}
      - {line: "\\dfrac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|} = |\\mathbf a|\\cos\\theta = \\text{shadow}", why: "|b| cancels on the right"}
      - {line: "8 \\div 3.162 = 2.530", why: "our numbers"}
      - {line: "\\dfrac{\\mathbf a\\cdot\\mathbf b}{|\\mathbf b|} = \\mathbf a\\cdot\\dfrac{\\mathbf b}{|\\mathbf b|} = \\mathbf a\\cdot\\hat{\\mathbf b}", why: "dividing one arrow by a number divides the dot product by it; b-hat = b shrunk to length 1"}
      - {line: "\\mathbf a\\cdot\\hat{\\mathbf b} = 5(0.316) + 1(0.949) = 2.530", why: "check with definition 1"}
    physics_source:
      fn: fluidpy.geo.vectors.scalar_projection
