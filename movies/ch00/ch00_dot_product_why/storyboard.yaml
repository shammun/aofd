honesty_notes:
  - "A scalar is never drawn as an arrow: a·b, W and v·∇T appear as numbers, a gauge or the product rectangle (shadow × other length); negative products are rose and hatched."
  - "The shadow is SIGNED: at 180° it lies behind the start (s05 panel 3: shadow −3, product −6). The 180° case is called 'opposite directions' (antiparallel), not 'parallel' (the user's word; flagged to the user)."
  - "No references are drawn or spoken (user rule G1). Provenance of every TeX string stays in this file (vallis_eq, page_png) for QA and review; the only number on screen is a plain (1) used inside the derivation."
  - "No 'not to scale' badges (user rule G2). Where arrows of different units share a picture, the picture says so in its own labels (rulers in N and m in s11; the wind map's axis in m/s in s10; brackets give the true values of ∇T and the shadows). Time-lapse clocks say how many hours pass."
  - "Material derivative taught before its equation (s12), with the air parcel defined as a small volume of air that moves with the flow; DT/Dt = rate following an air parcel, ∂T/∂t = local rate at a fixed place."
  - "The equation is shown as Dφ/Dt = ∂φ/∂t + v·∇φ: the boxed form on the page writes (v·∇)φ, the line above it writes v·∇φ; for a scalar quantity the two are identical."
  - "Sign of advection: ∂T/∂t = −v·∇T when DT/Dt = 0 (derived on screen in s18). A wind with a part towards warm air (v·∇T > 0) brings colder upwind air to a fixed point: s19 shows the upwind positions and their present temperatures (12.82, 12.64, 12.46 °C), which are exactly the pole's later readings; the balloon stays at 13.00 °C."
  - "0.180 K per hour is a rate in time met by the moving air (18.0 km per hour towards warmer air × 1 °C per 100 km); 1 °C per 100 km is a rate in space. s17 does not claim the map is frozen; s18 shows the pattern sliding."
  - "The weather map is an idealised uniform field (not data); s12 says 'an idealised map' on screen once; DT/Dt = 0 is stated as a supposition ('no sunshine or mixing')."
  - "Example numbers are ours (a = (5, 1), b = (1, 3); p = (3, 0), q = (2, 0), (0, 2), (−2, 0); wind (6, 8) in s10; wind 10 m/s at 60° in s16-s20; 1 °C per 100 km)."
  - "Music (user request): our own procedural pad, about 14 dB under the speech and ducked; no beats, no flashes."
quiz_hook: "If the map were twice as steep AND the wind blew along the isotherms (90° from ∇T), how fast would the pole's thermometer change? (Not at all: the shadow of v on ∇T is 0, so v·∇T = 0 however steep the map is.)"
