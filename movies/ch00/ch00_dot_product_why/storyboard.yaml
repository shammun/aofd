  voiceover: 'Here is the equation the balloon''s thermometer obeys. It tells us how anything the air carries, called phi,
    like temperature or moisture, changes as we follow an air parcel. On the left is the change following the parcel. On the
    right is the change at one fixed place, plus a term with v, the wind, and grad, which we''ll meet soon. Advection means
    being carried along by the flow. So the advection term is the change that comes from being carried into warmer or colder
    air, or moister or drier air, depending on what phi stands for. The left side is called the material derivative. It isn''t
