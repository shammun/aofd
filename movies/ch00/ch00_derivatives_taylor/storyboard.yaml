  voiceover: 'How much does e s grow for each extra degree? Let''s divide both sides by e s. The fractional growth per kelvin is L over
    R v T squared. At zero degrees Celsius, that''s two and a half million, divided by four hundred and sixty two times two hundred
    and seventy three squared: zero point zero seven three, or about seven percent per degree. [beat] At fifteen degrees, it''s six
    point four percent, and at thirty degrees, five point seven. [beat] That''s the famous seven percent rule: for each degree of warming,
    the saturation vapour pressure rises by about seven percent. How good is the line? For one degree, it gives seven point three percent,
    and the exact curve gives seven point five. For four degrees, the line gives twenty nine percent, and the exact curve gives thirty
    three. [beat] The gap grows with the step, just as the Taylor series told us, because the bend term is missing.'
