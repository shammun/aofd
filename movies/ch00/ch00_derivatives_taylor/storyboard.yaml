  beat: 'finite differences: forward difference error from Taylor'
  visual: 'Picture zone: a smooth curve with grid points h apart (ink dots), the forward secant (teal) vs the tangent (gold), the gap
    bracketed ''error''. Maths zone derivation, one move per line (CalcStack, aligned at ''=''): ''f(x+h) = f + h f′ + h²/2 f″ + …'';
    ''− f''; ''÷ h''; ''(f(x+h) − f)/h = f′ + (h/2) f″ + …'' with BraceNote ''error ≈ (h/2) f″''. S8: the step halves on the picture
    and the error bracket halves. Keyword ''first-order accurate''.'
  voiceover: 'Last, how does a weather model take a derivative? It knows the temperature only at grid points, a distance h apart. The
    simplest estimate of the slope is the forward difference: the value one step ahead, minus the value here, divided by h. How wrong
    is it? The Taylor series tells us. The value one step ahead is f, plus h times the slope, plus h squared over two times the second
    derivative, and so on. Let''s subtract f, and divide by h. We get the slope, plus h over two times the second derivative, plus smaller
    terms. So the forward difference is off by about h over two times the bend. Halve the step, and you halve the error. [beat] That''s
    called first-order accurate.'
  on_screen_eq:
    latex: \frac{f(x+h)-f(x)}{h}=f'(x)+\frac{h}{2}f''(x)+\cdots
    vallis_eq: 'provenance only: Kundu (10.4) and (10.6) forward difference O(Δx) (page image checked)'
    page_png: ../Fluid Dynamics/chapters/pages/ch10/p451.png
  physics_source:
