    = RT/g'' with BraceNote ''scale height''. S7: CalcStack ''287 × 293 ÷ 9.81 ≈ 8570 m'' with the units line struck (J/(kg K) × K ÷
    m/s² = m).'
  voiceover: 'Pressure also changes with height. In the weather basics movie, we met hydrostatic balance: at every height, the pressure
    holds up the weight of the air above. As a differential, d p equals minus rho g d z, where g is gravity, nine point eight one metres
    per second squared. Going up a small step d z, the pressure drops by the weight of that thin layer. Now divide by p, and use the
    gas law: rho over p is one over R T. We get d p over p equals minus d z over capital H, where capital H, which is R T over g, is
    called the scale height. [beat] At the ground at Trappes, at nineteen point eight degrees Celsius, capital H is two hundred and
    eighty seven, times two hundred and ninety three, divided by nine point eight one. That''s about eight thousand five hundred and
    seventy metres. [beat]'
  on_screen_eq:
