  visual: 'One screen beat per sentence, each a mini picture from its scene (no cards, no headings): tangent (s03); slice wall (s05)
    with ''−3.2 per 100 km'' and the fixed thermometer ''+2.9 °C/h''; step legs (s11) -> chain rule row; the plane ''−8.6 °C/h''; the
    balloon ''−1.6 °C/min''; the four-corner rectangle (s10) -> ''∂M/∂y = ∂N/∂x''; p ✓, heat ✗, heat/T ✓ (three glyphs); the Taylor
    ladder (s33); ''7 %/°C'' tangent and ''3.8 W/m² per °C'' tangent; the centred secant (s45).'
  voiceover: 'To sum up, a derivative is the slope of the tangent, the rate at one instant. A partial derivative changes one variable
    and holds the others fixed. Over Brest, the air got colder by three point two degrees per hundred kilometres towards the east, while
    a fixed thermometer warmed by two point nine degrees per hour. The total differential adds slope times step for each variable, and
    dividing by time gives the chain rule, the rate a traveller feels. The plane flying east cooled at eight point six degrees per hour,
    while every place it passed was warming. The Trappes balloon cooled by one point six degrees every minute, almost all of it from
    rising. Mixed partials don''t depend on the order, and that gives the test for a perfect differential. Pressure passes it, heat
    fails it, and heat divided by temperature passes again. A Taylor series builds a curve from its value, slope, bend and more. Keeping
    the first two terms is linearisation: about seven percent more saturation vapour pressure, and three point eight more watts per
    square metre sent to space, for each degree. And the same Taylor series tells us how accurate a weather model''s derivatives are.'
