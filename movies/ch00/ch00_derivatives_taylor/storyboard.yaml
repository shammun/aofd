    going east. So to find the slope at Brest, we take the grid point one step east and the point one step west, and divide their difference
    by the distance between them. That''s called a centred difference, and we''ll see later why it''s a good choice. East of Brest it
    was colder, so partial capital T by partial x is negative: minus three point two degrees per hundred kilometres. [beat] Cutting
    north instead gives partial capital T by partial y: minus two point five degrees per hundred kilometres. [beat] So at that moment,
    the air got colder towards the east, and towards the north. Together, these two partial derivatives make the gradient, which has
    its own movie in this series.'
