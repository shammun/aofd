  beat: the ideal gas law as a perfect differential
  visual: 'Picture zone: a cube of air (three.js, 1 m), molecules as faint dots; readouts p, ρ, T beside it. Maths zone: ''p = ρRT''
    (96 px) with BraceNotes ''pressure'', ''density: kg per m³'', ''temperature (K)'', ''R = 287 J kg⁻¹ K⁻¹''. S5: ''dp = RT dρ + ρR
    dT''. S6-S7: ''∂(RT)/∂T = R = ∂(ρR)/∂ρ'' (check glyph). S8: divide by ρRT (Strike on the cancelled factors). S9: ''dp/p = dρ/ρ +
    dT/T'' (84 px). S10: keywords ''fractional changes add''.'
  voiceover: 'Now real air. Its pressure, density and temperature are tied together by the ideal gas law: p equals rho R T. Here p is
    the pressure, rho the density, which is the mass of air in each cubic metre, and T the temperature in kelvin. R is a constant for
    dry air: two hundred and eighty seven joules per kilogram per kelvin. So pressure is a function of density and temperature, and
    its total differential is d p equals R T d rho, plus rho R d T. Let''s test it. Partial of R T by partial T is R, and partial of
    rho R by partial rho is also R. They match, so pressure passes the test, as a state function must. [beat] Now divide both sides
    by p, which is rho R T. We get d p over p equals d rho over rho, plus d T over T. In words, the fractional change in pressure is
    the fractional change in density, plus the fractional change in temperature.'
  on_screen_eq:
    latex: p=\rho RT,\qquad dp=RT\,d\rho+\rho R\,dT,\qquad \frac{dp}{p}=\frac{d\rho}{\rho}+\frac{dT}{T}
    vallis_eq: 'provenance only: Vallis (1.53) p = ρRT (page image checked); the differential is ours'
    page_png: chapters/pages/ch01/p033.png
  physics_source:
    fn: fluidpy.core.thermo.perfect_gas_pressure + sympy differential
    params:
      R: 287.0
