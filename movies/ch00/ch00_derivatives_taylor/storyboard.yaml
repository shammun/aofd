  beat: why each Taylor term has its factorial
  visual: 'Picture zone: a parabola c h² beside its slope 2ch (line) and second derivative 2c (flat), stacked (house Grid). Maths zone:
    ''h²/2 · d²f/dx²'' with BraceNote ''the bend''; CalcStack ''d/dh (c h²) = 2ch'', ''d²/dh² (c h²) = 2c'', ''c = f″/2''. S5: ''h³/3!
    · f‴'', ''3! = 3 × 2 × 1 = 6''. S7: the full series (96 px): f(x₀+h) = f + h f′ + h²/2! f″ + h³/3! f‴ + …, each term in its own
    colour, building left to right. No primes are spoken: the screen pairs ′, ″ with the words ''slope'', ''second derivative''.'
  voiceover: 'To do better, we add a term for the bend. The bend is measured by the second derivative: how fast the slope itself changes.
    We add h squared, times the second derivative, divided by two. Why divided by two? Take the simplest bend, c times h squared. Its
    slope is two c h, and its second derivative is two c. So to make the bend''s second derivative come out right, c must be half of
    it. [beat] The same idea gives the next term: h cubed, times the third derivative, divided by three times two times one, which is
    written three factorial. Each term makes one more derivative come out right at the starting point. Added up for ever, this is the
    Taylor series. f at x nought plus h equals f, plus h times the slope, plus h squared over two factorial times the second derivative,
    plus h cubed over three factorial times the third derivative, and so on.'
  on_screen_eq:
    latex: f(x_0+h)=f(x_0)+h\,f'(x_0)+\frac{h^2}{2!}f''(x_0)+\frac{h^3}{3!}f'''(x_0)+\cdots
