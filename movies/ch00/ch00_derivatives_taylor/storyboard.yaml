  beat: 'Clausius-Clapeyron: the saturation curve'
  visual: 'Picture zone: a water surface (code-drawn, illustrative) with vapour dots leaving it and some returning (S2), the two counts
    balancing on S4 (keyword ''saturated''); then the saturation curve e_s(T) from −10 to 35 °C (teal, hPa 0-60, 52 px ticks) drawing
    itself. S5: keyword ''set by T alone''. S6: equation in the maths zone ''de_s/dT = L e_s/(R_v T²)'' (96 px) with BraceNotes ''latent
    heat ≈ 2.5 × 10⁶ J/kg at 0 °C'', ''R_v = 462 J kg⁻¹ K⁻¹'', ''T in K'' (S7-S9). S10: dots on the curve ''0 °C: 6 hPa'', ''15 °C:
    17 hPa'', ''30 °C: 42 hPa'' with CurvedLinks.'
  voiceover: 'First, water vapour. Over a lake or the sea, water molecules keep escaping into the air as vapour, a gas, while others
    return to the water. The vapour''s share of the air pressure is called the vapour pressure. When escaping and returning balance,
    we say the air is saturated, and the vapour pressure takes its saturation value, written e s. That value depends only on the temperature,
    not on the air, and the Clausius–Clapeyron equation tells us how. d e s by d T equals L times e s, divided by R v times T squared.
    Here L is the latent heat, the energy needed to turn one kilogram of liquid water into vapour: about two and a half million joules
    at zero degrees, a little less for warmer water. R v is the gas constant for water vapour, four hundred and sixty two joules per
    kilogram per kelvin. And T is the temperature in kelvin. The curve climbs faster and faster: at zero degrees Celsius, e s is about
    six hectopascals, at fifteen degrees it''s seventeen, and at thirty degrees it''s forty two. Water in the air has its own movie
    in this series.'
  on_screen_eq:
    latex: \frac{de_s}{dT}=\frac{L\,e_s}{R_v\,T^2}
    vallis_eq: 'provenance only: Vallis (18.27) (page image checked; written R^v in the book)'
    page_png: chapters/pages/ch18/p699.png
  physics_source:
