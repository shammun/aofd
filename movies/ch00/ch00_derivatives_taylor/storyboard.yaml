  beat: 'perfect differentials: state functions (Like/Unlike)'
  visual: 'Full width 3-D: a real hill (ETOPO 2022 relief of the Monts d''Arrée near Brest, x5 vertical, BMNG texture) with a car park
    (gold dot) and the summit (gold dot); two trails, straight (teal) and winding (orange). S2-S3: a height readout rises to the same
    ''+200 m'' on both trails (from ETOPO); S4: distance readouts differ (''2.1 km'' vs ''4.8 km'', from the drawn trails). S5: keyword
    ''state function''. S6: keywords ''perfect differential'', ''exact differential''. S7: three small icons T, p, ρ. S8: the distance
    readouts pulse.'
  voiceover: 'Now a question that matters a lot in the physics of air. When is a small change, d of something, really the change of
    a quantity? Think of climbing a hill. The height you gain from the car park to the summit is the same whichever trail you take:
    it depends only on where you start and where you end. The distance you walk is different, because a winding trail is longer than
    a straight one. A quantity like the height, which depends only on where you are, is called a state function. Its small change is
    called a perfect differential, or an exact differential. The temperature, pressure and density of air are all state functions. But
    the distance walked is not: its small steps add up to a total that depends on the route.'
  on_screen_eq: null
  physics_source:
