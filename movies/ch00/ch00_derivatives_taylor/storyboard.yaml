  voiceover: Now the real map at Brest. With the data points eighteen kilometres apart going east, the forward difference gives minus
    three point three two degrees per hundred kilometres, the backward difference minus three point zero nine, and the centred one minus
    three point two zero, in between. [beat] Now let's pretend the grid is coarser. With points thirty seven kilometres apart, the centred
    difference gives minus three point one seven, and seventy four kilometres apart, minus three point one four. [beat] But at one hundred
    and forty seven kilometres, it drops to minus two point two four, and at two hundred and twenty one kilometres, to minus zero point
    nine eight. [beat] The coarse grid steps right over the warm front, so it sees a temperature change three times too gentle. That's
    why weather models use fine grids. The first computer weather forecast, in nineteen fifty, had grid points seven hundred and thirty
    six kilometres apart. Early climate models had points a few hundred kilometres apart. The leading global forecast models today have
    grid points about nine kilometres apart. Solving whole equations on grids has its own movie in this series.
