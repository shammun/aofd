  visual: 'Picture zone: a house Balance with two bars: ''CO₂ doubling: +3.9 W/m² of heating'' (gold, forcing) and ''Planck: −3.8 W/m²
    per °C'' (teal); a thermometer glyph rises until the bars balance at ''≈ 1 °C''. S3-S4: second row ''AR6 Planck 3.2 -> ≈ 1.2 °C''
    (no citation on screen; ''3.2'' only). S5: keyword ''feedbacks'' with a water-vapour droplet icon (house droplet). S6-S7: σT⁴ curve
    with its tangent at 255 K; markers ''+1 °C: 3.79 vs 3.76'', ''+10 °C: 39.9 vs 37.6''.'
  voiceover: 'This is called the Planck response, and it''s the planet''s thermostat: warm up, and you lose heat faster, which pulls
    you back. Doubling the carbon dioxide in the air adds about three point nine watts per square metre of heating. To shed that, a
    planet with only the Planck response would warm by about three point nine divided by three point eight: about one degree. [beat]
    The Intergovernmental Panel''s careful estimate of the real Planck response is a little lower, about three point two, which gives
    about one point two degrees. The full warming is larger, because of feedbacks: for example, a warmer world has more water vapour
    in its air, and water vapour traps heat too. Is the linear Planck rule good enough? For one degree, the exact curve gives three
    point seven nine, against the line''s three point seven six. For ten degrees, it''s forty against thirty eight. [beat] For the changes
    that climate scientists worry about, the line does very well.'
  on_screen_eq:
    latex: \Delta T\approx\frac{3.9}{3.8}\approx1\ ^{\circ}\mathrm C
    vallis_eq: 'provenance only: our numbers with IPCC AR6 values (manifest)'
