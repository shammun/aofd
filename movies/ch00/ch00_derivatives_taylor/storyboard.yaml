  beat: the exactness test, easy examples
  visual: 'Maths zone: ''M dx + N dy'' (84 px); S2 ''M = ∂f/∂x, N = ∂f/∂y''; S3 the s10 ''='' of mixed partials returns (thumbnail);
    S4 ''∂M/∂y = ∂N/∂x'' (96 px, gold). S5-S6: ''y dx + x dy'': ''1 = 1'' (check glyph) ''= d(xy)''. S7-S8: ''y dx − x dy'': ''1 ≠ −1''
    (rose cross with ''≠''). Picture zone: a unit square in the x-y plane; S9 a gold dot walks round it anticlockwise, side by side
    the running sum readout 0 → −0.5 … → −2 (CHECK); S10 for ''y dx + x dy'' the same walk returns to 0.'
  voiceover: 'How can we tell, just from the formula? Take a small change of the form M times d x, plus N times d y. If it''s the change
    of some function f, then M is partial f by partial x, and N is partial f by partial y. And we just saw that mixed partial derivatives
    come out the same in either order. So the test is: partial M by partial y must equal partial N by partial x. Let''s try y d x plus
    x d y. Partial y by partial y is one, and partial x by partial x is one. They match, so it''s exact: it''s the change of x times
    y. [beat] Now try y d x minus x d y. We get one against minus one. They don''t match, so it''s not the change of anything. [beat]
    Add it up going once round a square of side one, anticlockwise, and you come back to the start with minus two, not zero. [beat]
    For a perfect differential, every round trip adds up to exactly zero.'
  on_screen_eq:
    latex: \frac{\partial M}{\partial y}=\frac{\partial N}{\partial x};\qquad \oint (y\,dx-x\,dy)=-2
    vallis_eq: 'provenance only: exactness test from equal mixed partials (Vallis (1.69) uses it; page image checked); our examples'
