    ∂T/∂x_j'' (68 px) under the moving terms with a gold brace ''j summed''.'
  voiceover: 'So far we chose the steps ourselves. Now let''s ride along with something that moves, like a plane or a balloon. Its position
    changes with time, so its x, y and z are themselves functions of time: capital X of t, capital Y of t, and capital Z of t. In a
    short time d t, it moves east by d X, which is d X by d t, its eastward speed, times d t. The same goes for north and up. Let''s
    put these steps into the total differential, and divide everything by d t. That gives the rate the traveller''s own thermometer
    reads. d T by d t equals partial capital T by partial small t, plus d X by d t times partial capital T by partial x, plus d Y by
    d t times partial capital T by partial y, plus d Z by d t times partial capital T by partial z. This is the chain rule. In the index
    notation of the vectors movie, the three moving terms are d X sub j by d t times partial capital T by partial x sub j, with j summed.'
  on_screen_eq:
    latex: \frac{dT}{dt}=\frac{\partial T}{\partial t}+\frac{dX}{dt}\frac{\partial T}{\partial x}+\frac{dY}{dt}\frac{\partial T}{\partial
      y}+\frac{dZ}{dt}\frac{\partial T}{\partial z}
    vallis_eq: 'provenance only: Kundu App. B p. 858, the unnumbered display before (B.1.1) (page image checked), written with T and
      (x, y, z)'
