  beat: 'where Taylor fails: kinks (tropopause, fronts)'
  visual: 'Picture zone: the profile 8-20 km; the tropopause kink at 13.07 km (−66.3 °C) marked (gold), keyword ''tropopause''; the
    line and the quadratic fitted just below it run on into ever colder air above (rose dashed), the real curve turns warmer. S5: inset
    MAP850 cross-section along 48.5° N through the warm front (T against x), the sharp step highlighted. S6: keyword ''step ≪ bending
    distance''.'
  voiceover: 'Taylor series need a smooth curve. At about thirteen kilometres, the balloon''s temperature profile has a kink: the cooling
    stops, and above it the air gets a little warmer. That''s the tropopause, the lid on the weather layer. A line or a series built
    just below the kink predicts ever colder air above it, and gets it wrong. The same happens across a weather front, where the temperature
    changes sharply over a short distance. So the rule is: use a Taylor series only for steps that are small compared with the distance
    over which the curve bends.'
