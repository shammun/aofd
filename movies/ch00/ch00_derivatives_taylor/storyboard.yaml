  voiceover: 'If the temperature were the same all the way up, capital H would be a constant. Then d p over p equals minus d z over
    capital H says that the pressure falls by the same fraction for every metre we climb. That makes an exponential: p equals the ground
    pressure, times e to the minus z over capital H. Here e is the number two point seven one eight. This is the solution of a differential
    equation, and the ordinary differential equations movie solves many like it. Now let''s compare with the balloon. The real pressure
    follows the exponential closely near the ground, then falls below it higher up. That''s because the real air gets colder, and colder
    air is denser, so the pressure falls faster. We''ll use this curve in a minute to see how Taylor series work.'
