concepts:
- derivative as a limit and as the tangent's slope (standard)
- partial derivatives; mixed partials commute (Kundu App. B §B.1, p. 857; Vallis (1.69))
- total differential and the chain rule along a path (Kundu p. 858 display before (B.1.1); (B.1.4) named only)
- changing variables by the chain rule, z -> p (Kundu (B.2.1), one-variable case)
- 'perfect (exact) vs inexact differentials: p = rho R T, heat and work, entropy (Vallis (1.53), (1.61)-(1.63), (1.65), (1.69))'
