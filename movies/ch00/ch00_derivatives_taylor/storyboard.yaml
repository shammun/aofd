    also says one point one zero five one seven, so just three terms already give four correct figures. [beat] For h equals one, we
    need more terms: one, two, two point five, two point six six seven, two point seven zero eight, and on towards two point seven one
    eight. [beat] So a small step needs few terms, and a big step needs many.'
