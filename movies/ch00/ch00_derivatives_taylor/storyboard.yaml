  voiceover: 'Working out a partial derivative is easy: treat every other variable as a constant, and take the ordinary derivative.
    Let''s try an easy, made-up temperature field: T equals ten, minus zero point zero three x, plus three small t, with x in kilometres
    and small t in hours. For partial capital T by partial x, small t is a constant, so the three small t term has no slope in x. What''s
    left is minus zero point zero three degrees per kilometre. [beat] For partial capital T by partial small t, x is the constant, and
    we get plus three degrees per hour. [beat] Now a field with a product, T equals x times small t. Holding small t fixed, partial
    capital T by partial x is small t. Holding x fixed, partial capital T by partial small t is x.'
  on_screen_eq:
    latex: T=10-0.03\,x+3\,t:\quad \frac{\partial T}{\partial x}=-0.03,\quad \frac{\partial T}{\partial t}=3
