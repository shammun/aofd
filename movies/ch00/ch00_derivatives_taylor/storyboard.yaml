  voiceover: 'Here''s the test at work. For each kilogram of air, the heat added in a small, slow step is c v d T, plus p d alpha. Here
    c v is the heat needed to warm one kilogram by one kelvin at a fixed volume. Alpha, which is one over rho, is the volume of one
    kilogram, called the specific volume. With the gas law, p is R T over alpha. Let''s test it. Partial of c v by partial alpha is
    zero, but partial of R T over alpha by partial T is R over alpha, which is not zero. They don''t match, so heat is not a perfect
    differential. [beat] Now divide the heat by the temperature. We get c v d T over T, plus R d alpha over alpha. Test again: zero,
    and zero. They match! [beat] So heat divided by temperature is a perfect differential, the small change of a state function called
    entropy. On all three of our routes, the entropy rose by the same amount: one hundred and sixteen joules per kilogram per kelvin.
    [beat] Its close cousin, the potential temperature, follows air parcels through the whole atmosphere, and it has its own movie in
