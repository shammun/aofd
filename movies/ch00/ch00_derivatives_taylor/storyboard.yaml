  beat: 'why the tools are built this way: three good reasons'
  visual: 'Three beats, one picture each (no cards): S2-S3 the s05 slice wall returning on the landscape (''one at a time''); S4-S5
    the s11 step legs adding on a flattened patch (''slope × step''); S6-S7 the s31 line with its error bracket growing, then a tiny
    model grid laid on the Brest map (''how small a step'').'
  voiceover: So why are these tools built the way they are? There are three good reasons. The first is that the weather depends on many
    things at once, the place and the time, and partial derivatives let us ask about one of them at a time, by holding the rest fixed.
    The second is that, when we zoom in close enough, every smooth field looks flat, so small changes simply add up, slope times step,
    one direction at a time. That's the total differential, and the chain rule. The third reason is practical. The Taylor series tells
    us how big our error is when we stop at the straight line, and so how small a step must be, whether it's a degree of warming or
    the spacing of a weather model's grid.
