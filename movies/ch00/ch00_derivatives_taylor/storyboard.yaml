    = 2x = 6 at x = 3''. S7: keyword ''tangent'' at the gold line. S8: keyword ''slope = rate''. Zoom out at the end so the whole parabola
    shows again.'
  voiceover: 'To get the rate at one instant, we shrink the time step. Let''s see how, on an easy curve: f of x equals x squared, at
    x equals three. A step from three to four raises f from nine to sixteen, so the rate is seven over one, which is seven. [beat] A
    step of one tenth gives six point one, and a step of one hundredth gives six point zero one. [beat] As the step shrinks, the rate
    settles on six. That limit is the derivative, written d f by d x. For x squared it''s two x, which is six at x equals three. In
    the picture, the line through two points of the curve turns into the tangent, the line that just touches the curve. So the derivative
    is the slope of the tangent: how much f changes for each unit of x.'
  on_screen_eq:
    latex: \frac{df}{dx}=\lim_{h\to 0}\frac{f(x+h)-f(x)}{h},\qquad \frac{d}{dx}x^2=2x
