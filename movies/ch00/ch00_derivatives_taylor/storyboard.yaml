- Taylor series and linearisation (Kundu (10.4)-(10.5))
- 'Clausius-Clapeyron linearised: the 7 % rule (Vallis (18.27))'
- 'Stefan-Boltzmann linearised: the Planck response (Vallis (14.1) form)'
- finite differences and truncation error (Kundu (10.6))
