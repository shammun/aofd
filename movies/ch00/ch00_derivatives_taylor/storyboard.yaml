  voiceover: 'Now the most important small changes that are not perfect: heat and work. Take an air parcel at two hundred and eighty
    kelvin, and let it expand to one and a half times its volume, ending at the same temperature. Route one: first cool it at a fixed
    volume, then heat it as it expands at a fixed pressure. Route two: expand it slowly at a fixed temperature. Route three: heat it
    as it expands at a fixed pressure, then cool it at a fixed volume. The heat we must add is twenty seven, thirty three and forty
    kilojoules for each kilogram of air. [beat] Three routes, three different amounts of heat, between the same two states. So heat
    is not a state function: there''s no amount of heat stored in the air, only heat flowing in or out. The same is true of work. But
    the internal energy, the energy of the molecules'' motion, changes by exactly zero on all three routes, because the parcel ends
    at the temperature it started with.'
