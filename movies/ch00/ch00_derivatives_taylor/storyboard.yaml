    up leg (faint), and a clock tick; each leg''s rise drawn as a vertical bar on the surface. S5: maths zone dT = ∂T/∂x dx + ∂T/∂y
    dy + ∂T/∂z dz + ∂T/∂t dt (84 px, ∂T/∂t term slate) built term by term in sync with the legs. S6: keyword ''total differential''.
    S7: a hillside icon with two legs (Like). S8: the landscape gently morphs (time) on AT(8, ''also changes'') (Unlike).'
  voiceover: 'Now let''s change everything at once, but only by a little. Suppose we take a small step east, d x, a small step north,
    d y, a small step up, d z, and wait a short time, d t. How much does the temperature change? Each partial derivative says how much
    T changes for each unit of step in its own direction. So we multiply each one by its own step, and add them up. The small change,
    d T, equals partial capital T by partial x times d x, plus partial capital T by partial y times d y, plus partial capital T by partial
    z times d z, plus partial capital T by partial small t times d t. This is called the total differential. It''s like walking on a
    hillside: your rise is the slope going east times your step east, plus the slope going north times your step north. Unlike a real
    hillside, our landscape also changes while we walk, so the time gets a term too.'
  on_screen_eq:
    latex: dT=\frac{\partial T}{\partial x}dx+\frac{\partial T}{\partial y}dy+\frac{\partial T}{\partial z}dz+\frac{\partial T}{\partial
      t}dt
