  beat: Stefan-Boltzmann and the Planck response
  visual: 'Full width: a three.js globe glowing in infrared: the latest-month CERES EBAF (or NOAA interpolated) outgoing longwave map
    draped on the globe (inferno-like perceptual LUT, W/m² colour bar 52 px), rotating slowly; global mean readout ''≈ 240 W/m²''. Maths
    zone: ''F = σT⁴'' (96 px), BraceNote ''σ = 5.67 × 10⁻⁸ W m⁻² K⁻⁴''; CalcStack ''T = (240/σ)^(1/4) ≈ 255 K ≈ −18 °C''. S7-S10: ''dF/dT
    = 4σT³ = 4F/T ≈ 4 × 240/255 ≈ 3.8 W m⁻² K⁻¹'' with a tangent on a small σT⁴ curve.'
  voiceover: 'Second, the heat that Earth sends to space. Every warm body glows in infrared light, and a perfect emitter, called a black
    body, gives off sigma T to the fourth watts per square metre. Here sigma is the Stefan–Boltzmann constant, five point six seven
    times ten to the minus eight. Satellites measure Earth giving off about two hundred and forty watts per square metre, on average.
    Solving sigma T to the fourth equals two hundred and forty gives T equals two hundred and fifty five kelvin, about minus eighteen
    degrees Celsius. That''s Earth''s emission temperature. [beat] Now let''s linearise: how much more does Earth give off for each
    degree warmer? The derivative of sigma T to the fourth is four sigma T cubed. And sigma T cubed is just sigma T to the fourth, divided
    by T. So the slope is four times two hundred and forty, divided by two hundred and fifty five: about three point eight watts per
    square metre for each degree. [beat]'
  on_screen_eq:
    latex: F=\sigma T^4,\qquad \frac{dF}{dT}=4\sigma T^3=\frac{4F}{T}\approx\frac{4\times240}{255}\approx3.8\ \mathrm{W\,m^{-2}\,K^{-1}}
    vallis_eq: 'provenance only: Stefan''s law as in Vallis (14.1) σT⁴ (page image checked); derivative ours'
