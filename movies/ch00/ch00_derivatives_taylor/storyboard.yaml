honesty_notes:
- The flights (s16, s17) are thought experiments on a real field and are said as such; the car (s15) is on a made-up frozen map, said.
- 's18-s19: the balloon''s rate is measured (IGRA2 elapsed time); the lapse rate of s09 comes from the same balloon, so s19 does not
  claim an independent check: it sizes the other two kinds of term (fixed-place change from the 00 and 12 UTC soundings; sideways from
  D2) and says the rising term makes about 99 %.'
- s19's sideways number (about 1e-4 K/s) is a planning estimate until D2 is fetched; the sentence is reworded to the data and re-measured
  by the builder (CHECK DT26).
- 's20: DT/Dt is named and computed but not derived; it is handed to the material-derivative movie (#10). The leftover -0.8 K/h is not
  attributed to any cause on screen or in the voice.'
- 'Lapse-rate convention: s09 says both signs; the computed quantity is dT/dz (negative), the meteorological lapse rate is its negative
  (knowledge/notation.md).'
- 's22: the hill and trails are a real ETOPO place; trail lengths are of our drawn trails (illustrative), the height gain is real.'
- 's28: a 50 % expansion is used so the three routes separate clearly; it is a thought experiment on an ideal-gas parcel (dry air, reversible
  routes).'
- 's35: the remaining 17 hPa is attributed to the isothermal model (assumption said), and checked with the layer-mean temperature (498.7
  hPa).'
- 's42-s43: 240 W/m2 is the CERES EBAF global mean (D4; the builder asserts 235-245 W/m2); the doubling forcing 3.93 W/m2 and the Planck
  feedback -3.22 W/m2/K are IPCC AR6 WG1 Ch. 7 (§7.3.2.1; Table 7.10), in the manifest, never on screen as citations.'
- Exaggerations (temperature as relief in s05/s11/s13; relief x5 in s22; column x20 in s26; zooms) and time compression (s04, s08, s09,
  s16-s18) are recorded here and in the manifest, not badged (HOUSE_STYLE §5).
- Every spoken number is a planning value from the tested library on the files on disk (2026-10-28) and is re-asserted by CHECK rows
  (data_needs.md §D); s19, s41 and s42 wait for D2-D4.
- 's39-s40: saturation is said in plain words (molecules escaping and returning balance) and e_s depends only on the temperature, ''not
  on the air'' (no ''air holds water vapour''; source check #3). The drawn curve uses fluidpy.geo.moist defaults (L 2.44e6 J/kg, R_v
  462, e0 6.12 hPa at 273 K: 6.19/16.92/41.91 hPa, standard tables 6.11/17.04/42.4, spoken 6/17/42). The rates use L(T) = 2.501e6 -
  2370 T[degC] (2.5e6 at 0 degC, said ''a little less for warmer water''): 7.26 %/K at 0 degC (spoken 0.073, ''about seven percent''),
  6.43 at 15, 5.72 at 30. Line vs exact at 0 degC: the exact curve is constant-L(0 degC) Clausius-Clapeyron from 6.112 hPa (Bolton 1980
  agrees within 0.1 %): +1 K 7.50 vs 7.26 %, +4 K 33.1 vs 29.0 %.'
- 's41: warming ''about one and a quarter degrees'' = 1.26 [1.13-1.36] degC for 2016-2025 vs 1850-1900 (Forster et al. 2026, ESSD 18,
  3889); 1.26 x 7.26 % = 9.1 % (compounded 9.2 %), said as the saturation vapour pressure, not as observed vapour. Sentence 4 says the
  measured near-surface vapour rose less, about 4-5 % per degC of global warming (Allan et al. 2022), so the narration never equates
  the observed rise with the 7 % rule. The TCWV rise is our ERA5 computation (D3) from 1979 and from 1993 (ERA5 low-level tropical caveat,
  Allan et al. 2022; DT53). Heavy rain is a projection (AR6 WG1 SPM B.2.4, ''projected to intensify by about 7% for each 1 degC''),
  said ''is expected to become''.'
- 's46: ''the data points eighteen kilometres apart going east'': ERA5''s 0.25 deg product is interpolated from its ~31 km model grid
  (Hersbach et al. 2020); 18.4 km is the east-west spacing at 48.5 N (27.8 km north-south). ''9 km'' = ECMWF IFS TCo1279, unchanged
  by Cy50r1 (12 May 2026), said as ''the leading global forecast models today'' (not ''best''); ''a few hundred kilometres'' = FAR-era
  models (~500 km, IPCC AR4 WG1 Fig. 1.4); 736 km = the 1950 ENIAC forecast grid interval (Charney, Fjortoft & von Neumann 1950; Lynch,
  Forecasts by PHONIAC).'
- 's07: ''the ERA5 data come on a grid every quarter of a degree'' (the delivered grid, not ERA5''s model grid; source check #12).'
- 's09: ''once or twice a day, at about eight hundred stations'' (00/12 UTC; ~800 IGRA stations report in near real time; source check
  #14).'
- 's21: balloons ''have long reported pressure'' and ''many of the equations become simpler'': many GPS sondes (e.g. Meteomodem M10)
  compute pressure from GNSS height rather than measure it (source check #13).'
- 's34: ''pilots use this rule of thumb ... about thirty feet for each hectopascal'' (8.6 m = 28 ft; pilots'' 27-30 ft/hPa); altimeters
  use the full standard-atmosphere formula, so they are not named (source check #15).'
- 's43: ''adds about three point nine watts per square metre of heating'' (AR6 ERF 3.93 +- 0.47 W/m2); the feedback example says ''a
  warmer world has more water vapour in its air'', without claiming the 7 % rule for it.'
- 's36: ''the air gets a little warmer'' above the 13.07 km tropopause is asserted by DT46 (else ''the cooling stops'').'
quiz_hook: A balloon rises at 5 m/s through air that cools by 6.5 degrees per kilometre, while the air at every height warms by 1 degree
  per hour. Which term of the chain rule dominates its thermometer, and what does it read per minute?
