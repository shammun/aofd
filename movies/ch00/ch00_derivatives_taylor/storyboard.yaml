  voiceover: The chain rule also lets us swap one variable for another. Meteorologists often use pressure instead of height to say how
    high something is. Weather balloons have long reported pressure, and many of the equations become simpler that way. So how do we
    turn a rate per kilometre into a rate per hectopascal? Along the balloon's climb, height is a function of pressure, so partial capital
    T by partial p equals partial capital T by partial z, times partial z by partial p. Between our two levels, the height rose four
    thousand two hundred and sixty two metres, while the pressure fell three hundred and fifty hectopascals. So partial z by partial
    p is minus twelve point two metres per hectopascal. [beat] Times minus five point seven degrees per kilometre, that gives plus zero
    point zero six nine degrees per hectopascal. [beat] So the air gets warmer as the pressure rises, going down. Pressure as a vertical
    coordinate has its own movie in this series.
