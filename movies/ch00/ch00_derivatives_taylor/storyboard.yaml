    h. Let''s write both with the Taylor series. Ahead is f, plus h times the slope, plus h squared over two times the bend, plus h
    cubed over six times the third derivative. Behind is the same, but every odd power of h flips its sign. Subtract, and the f terms
    cancel, and so do the bend terms. Divide by two h, and we''re left with the slope, plus h squared over six times the third derivative.
    [beat] Halve the step, and the error drops to a quarter. That''s second-order accurate. [beat] Let''s check on the sine curve at
    x equals one, with a step of zero point one. The forward difference is off by minus zero point zero four three, the centred one
    by only minus zero point zero zero zero nine. [beat]'
