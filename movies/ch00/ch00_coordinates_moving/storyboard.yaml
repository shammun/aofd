    second, and is getting stronger towards the east by zero point one one one metres per second for every kilometre. [beat] First, ride with the pattern,
    at capital U, ten metres per second. To you, the pattern is frozen, so the local change is zero. Relative to you, the air at that place moves east at
    thirteen point five four minus ten: three point five four metres per second, or twelve point seven kilometres per hour. It''s carried into stronger wind,
    so the advection is twelve point seven kilometres per hour, times zero point one one one metres per second per kilometre. That''s plus one point four
    metres per second, every hour. [beat] Now stand on the ground, beside an anemometer, a wind meter that never moves. The pattern slides past at thirty
    six kilometres per hour, bringing the weaker wind from the west. So the anemometer sees a local change of minus thirty six times zero point one one one:
