  voiceover: 'Let''s start with the simplest moving frame. Imagine you''re on a train gliding along a straight track at a steady twenty metres per second.
    You walk towards the front at one and a half metres per second. Someone standing beside the track sees your speed and the train''s speed added together:
    twenty one and a half metres per second. [beat] Why do the speeds add? Let''s measure positions along the track. The person beside the track uses x, measured
    from the station. You use x prime, measured from the back of the train. The back of the train passed the station at time zero, and it moves at capital
    U, twenty metres per second. So after a time t, the back of the train is capital U times t from the station. [beat] Your distance from the station is
    that, plus your distance from the back of the train: x equals x prime plus capital U t. And both clocks show the same time: t prime equals t.'
