quiz_hook: 'A barometer reads -2 hPa/h while a storm moving at 36 km/h has a pressure slope of 0.05 hPa/km along its path at that place: is the storm deepening? (dp/dtau
  = -2 + 1.8 = -0.2 hPa/h: slightly.) And a storm moves east at 10 m/s; the ground wind on its south side is 25 m/s east: what does a rider feel? (15 m/s east.)'
