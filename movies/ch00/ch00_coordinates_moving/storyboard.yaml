    ruler x from the station (slate) and the train ruler x′ from the back of the train (orange) sliding apart; a gold bracket ''U t'' from the station to the back
    of the train, a teal bracket ''x′'' from there to the walker, a long warm-white bracket ''x'' above both; the house clock glyph on both rulers reading the same
    time. Sound: soft rail rhythm, −30 LUFS, under S2-S3 only.'
  voiceover: 'Let''s start with the simplest moving frame. Imagine you''re on a train gliding along a straight track at a steady twenty metres per second. You walk
    towards the front at one and a half metres per second. Someone standing beside the track sees you moving at twenty plus one and a half: twenty one and a half
    metres per second. [beat] Why do the speeds add? Let''s measure positions along the track. The person beside the track uses x, measured from the station. You
    use x prime, measured from the back of the train. The back of the train passed the station at time zero, and it moves at capital U, twenty metres per second.
    So after a time t, the back of the train is capital U times t from the station. [beat] Your distance from the station is that, plus your distance from the back
    of the train: x equals x prime plus capital U t. And both clocks show the same time: t prime equals t.'
