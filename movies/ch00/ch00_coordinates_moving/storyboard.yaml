  voiceover: 'To sum up, a frame moving steadily in a straight line shifts positions by capital U times t, and velocities by capital U: u equals u prime plus capital
    U. But it leaves accelerations unchanged, so the same forces explain the motion in both frames. For an air parcel, the acceleration is the local change plus advection.
    Each piece depends on who measures it, but their sum doesn''t. Storm Ciarán moved east-north-east at about fifteen metres per second. Taking that motion away
    from every wind gives the storm-relative wind: what a rider moving with the storm feels. It changed the wind at every point, but left the storm''s average spin
    of about fourteen metres per second. A fixed barometer''s rate is the storm changing, minus the pattern sliding past. At Plymouth, the fall of three point eight
    hectopascals per hour was mostly the storm arriving. In Part 6, we''ll find the shortest way round the Earth: great circles, and rhumb lines.'
