    \ symbol: u = 1.5 + 20 = 21.5 m/s."
  voiceover: 'Next come two short derivations: why speeds add, and why accelerations don''t change. They''re for those who like every step. If not, skip ahead
    to the time on screen: you don''t need them for the intuition of weather, climate or maps. Now let''s get the speeds from the positions. In a short time,
    delta t, your place on the train changes by delta x prime, and the back of the train moves on by capital U delta t. So the change seen from the station
    is the sum of the two: delta x equals delta x prime, plus capital U delta t. [beat] Next, we divide by delta t. Delta x over delta t is the speed seen
    from the ground, small u. Delta x prime over delta t is the speed seen on the train, u prime. So u equals u prime plus capital U. [beat] With our numbers,
    your walking speed plus the train''s speed gives twenty one and a half metres per second again. [beat] Switching between two frames like this, moving
    at a steady velocity without turning, is called a Galilean transformation, after Galileo Galilei. In three dimensions, the same holds for each part: bold
