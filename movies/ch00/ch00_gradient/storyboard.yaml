  beat: recap ('To sum up', one beat per sentence)
  visual: 'Full width, mini pictures one per sentence (HOUSE_STYLE §2 recap): (1) three tiny fields; (2) ''∇f = (∂f/∂x, ∂f/∂y, ∂f/∂z)''; (3) the hill arrow
    ''|∇f| = fastest rate''; (4) right-angle tick on a contour + crowded lines; (5) ''∂f/∂s = ∇f · n̂''; (6) ''1/(a cos φ)''; (7) ''−(1/ρ)∇p'' with H ->
    L and Ciarán''s crowded isobars; (8) a front band, the sea-breeze coast and the jet core. Keywords only.'
  voiceover: To sum up, a scalar field has a value at every place, like height, temperature or pressure. Its gradient, grad f, is the arrow built from its
    partial derivatives, going east, north and up. It points the way the field increases fastest, and its length is that fastest rate. It's at right angles
    to contour lines, isotherms and isobars, and it's big where they crowd together. The rate in any direction is grad f dot n hat, the directional derivative.
    On the round Earth, the slope going east carries one over the radius times cosine phi. The pressure gradient force, minus one over rho times grad p,
    pushes air from high to low pressure, which is why crowded isobars mean strong winds. Sharp temperature gradients mark fronts and sea breezes, and the
    jet stream blows above the strongest of them.
  on_screen_eq: null
