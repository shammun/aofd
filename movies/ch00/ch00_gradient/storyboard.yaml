id: ch00_gradient
title: The gradient (and how it finds the steepest way up a mountain, the push on the air in a storm, and the sharpest temperature changes in fronts, sea
  breezes and jets)
version: 1
concepts:
- 'scalar field; partial derivatives as slopes east and north (recap of #4)'
- 'the gradient grad f = x-hat df/dx + y-hat df/dy (+ z-hat df/dz): the del operator, (grad f)_i = df/dx_i (Kundu §2.9 p. 53; App. B §B.3)'
- the directional derivative df/ds = grad f . n-hat, derived from the total differential (Kundu p. 53, unnumbered)
- why grad f points the way f increases fastest, why |grad f| is that rate, why grad f is perpendicular to contour lines (level sets)
- 'contour spacing and gradient size; the gradient depends on the scale of the data (pointers to #6A, #6B)'
- 'the gradient in 3-D: vertical temperature gradient and lapse rate (both sign conventions); the thin atmosphere'
- 'the gradient on the sphere (Vallis (2.31)): the 1/(a cos phi) factor'
- 'the pressure gradient force -(1/rho) grad p (Vallis (1.45)-(1.48)); high to low; crowded isobars and strong winds; Coriolis balance named (pointer #29)'
- the vertical pressure gradient and hydrostatic balance (Vallis (1.51))
- 'temperature gradients at fronts, advection v.grad T = |v| dT/ds, sea breezes, the jet above the strongest temperature gradient (pointer #32), the Gulf
  Stream SST front'
