honesty_notes:
- 's03-s06, s10-s14, s19-s20: the hillside and hills are idealised easy-number examples (said as ''let''s say''); slopes drawn x10 on the 3-D hillside.'
- 's09, s23, s33, s34: ERA5 850 hPa at the grid point 48.5 N 4.5 W (''at Brest''); gradients by centred differences on the 0.25 deg grid with the cos phi
  factor (fluidpy.geo.sphere.gradient); a reanalysis, said in s09.'
- 's15: the summit (4806 m) and Chamonix (1035 m) heights are cited (research-scout confirms); the drape uses ETOPO, which smooths the summit (60-arc-second
  cell 4169 m); ''about sixty percent'' is the steepest gradient on the map product used (DG13), not a field survey; heights x2 said in S3.'
- 's16: the droplet paths are steepest-descent lines of the smoothed terrain (''roughly''), not a hydrological model; the 5 % Himalayan slope is for 20-arc-minute
  block means (scale stated).'
- 's17-s18, s32: one radiosonde (Trappes 12 UTC 30 Sep 2026); the surface-to-tropopause lapse rate is a layer average; the ratio 165 compares it with the
  850 hPa horizontal gradient at Brest on another day (both typical; said as ''compare'').'
- 's27-s28: ''if nothing else acted'' is a thought experiment; the real wind is set by the balance with the Coriolis effect and friction (s30).'
- 's28: Ciaran''s centre from fluidpy.diag.cyclone.track_by_continuity seeded on its known 12 UTC 2 Nov position (HOUSE_STYLE §7 storm-tracker rule); never
  a box minimum.'
- 's29: bin means over 9290 sea points (NE 50 m land mask) in 40-60 N, 30 W-5 E at 03 UTC; correlation 0.63 (manifest only); the Brest gust is the 911 group
  of the 03 UTC SYNOP (ISD, on disk); Pointe du Raz 207 km/h and > 1 million homes without power are cited (to confirm; S6 dropped otherwise).'
- 's30: the balance sketch is illustrative; no geostrophic speed is spoken (the ERA5 geostrophic speed at Brest, 94 m/s, far exceeds the 23 m/s 10-m wind
  because of friction and the tight curvature; this is left to #29/#30 so the movie does not mislead).'
- 's31: GFS msl is NCEP''s sea-level reduction, unreliable over high ground: gradients are taken only where orography < 50 m.'
- 's33: the high-gradient band is called ''a front'' only; which front (cold, warm or bent-back) is not claimed unless fluidpy.diag.fronts.front_lines attaches
  it to the tracked low.'
- 's34: ''a fixed thermometer at Brest would warm by about three point seven degrees per hour from this alone'' is the advection part only; #4 showed the
  actual local change (+2.9 K/h) and the parcel''s own cooling.'
- 's35: 2-m temperatures from ERA5 (0.25 deg): the coast lies between the two probe points; the breeze mechanism is standard physics; the onshore wind is
  drawn from D5 data or, without it, as an illustrative cartoon (listed).'
- 's36: the November 2023 jet speed is the geostrophic zonal wind from the zonal-mean monthly geopotential height (an estimate; D6 replaces it with the
  real zonal-mean u of the newest month); ''right above'' = jet latitude within 3 deg of the steepest-gradient latitude (DG35).'
- 's37: numbers are added only after D7 is measured; the dry-run wording is qualitative and true for the OISST north wall in every season (DG36 checks it).'
- Exaggerations (title hill; hillside slope x10; terrain x2; profile x20; atmosphere slice x50 after a true-scale frame; grid cells x10 on the globe; arrow
  lengths for legibility; streaklines and balloon ascent time-compressed) are recorded here and in the manifest, not badged (HOUSE_STYLE §5).
- Every spoken number is a planning value from tested fluidpy functions on files on disk (2026-10-28) or a cited value marked 'to confirm', and is re-asserted
  by CHECK rows DG01-DG37 (data_needs.md §D).
quiz_hook: On a hillside the ground rises 6 m per 100 m going east and 8 m per 100 m going north. How steep is the steepest way up, which way does it point,
  and how fast do you climb walking north-east? And if isobars 4 hPa apart are 40 km apart, which way does the pressure gradient force point, and roughly
  how big is it per kilogram?
