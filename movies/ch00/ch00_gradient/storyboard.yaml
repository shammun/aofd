    real profile (time-compressed) while a T(z) graph (teal line, 52-px ticks, z up to 35 km) draws itself in the maths zone. S4-S5: dots and labels ''27.7
    °C at 33 m'', ''−81.3 °C at 16.2 km''; keyword ''tropopause'' (54 px) with a slate line; S7: a faint slate tick on the graph at ''≈ 10-13 km'' with
    keyword ''Europe''. S8: CalcStack ''−109.0 °C / 16.13 km ≈ −6.8 °C/km''. S10: ''∂T/∂z ≈ −6.8'' and ''lapse rate Γ = −∂T/∂z ≈ +6.8 °C/km'' (both conventions).
    S11: the stratosphere part of the graph glows (temperature rising).'
  voiceover: 'The gradient works in three dimensions too, and in the air, the upward part is often the biggest. Here is a real weather balloon, a radiosonde,
    launched from Singapore, an island city at the southern tip of the Malay Peninsula, close to the equator. It went up at half past seven in the morning,
    local time, on the first of November, twenty twenty-three. At the ground, thirty three metres above sea level, it measured twenty seven point seven
    degrees. At sixteen point two kilometres, where the cooling stopped, it measured minus eighty one point three. That level is the tropopause, the top
    of the lowest layer of the atmosphere. Over the tropics it sits much higher than over Europe, where it''s usually somewhere between about ten and thirteen
    kilometres up. So partial capital T by partial z, averaged over that layer, is minus a hundred and nine degrees over sixteen point one kilometres. That''s
    about minus six point eight degrees per kilometre. [beat] Meteorologists flip the sign, and call plus six point eight the lapse rate: how fast the temperature
    drops as you go up. Above the tropopause, the temperature starts rising again.'
  on_screen_eq: null
