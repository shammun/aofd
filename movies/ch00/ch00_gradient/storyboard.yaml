  visual: 'Same map: teal wind arrows (thinned) nearly along the isobars; gold anticlockwise arc round the L ''anticlockwise, seen from above'' (54 px).
    S3: small spinning-Earth thumbnail; S4: at one point, the light-orange hollow-head pressure-gradient-force arrow (towards L) and a violet Coriolis arrow
    (away from L) of equal length, the teal wind between them along the isobar (''balance''). S5: both arrows grow with a tighter isobar spacing, the wind
    arrow grows. S7: near-ground arrows tilt slightly inward (keyword ''friction''). S9: a small #3 thumbnail (spinning Earth, back-pointer) beside the
    keyword ''Coriolis''; S10: ''gradient wind ≠ gradient'' (54 px). (Pointer fix, plan v5.)'
  voiceover: 'But look at the wind arrows. They don''t blow straight from high to low. They blow almost along the isobars, anticlockwise round the low,
    as seen from above. That''s because the Earth turns, and the Coriolis effect pushes moving air to the right in the northern hemisphere. Away from the
    ground, the Coriolis push grows until it balances the pressure gradient force, and then the wind blows along the isobars. The bigger the pressure gradient,
    the faster the wind must blow for the two pushes to balance. That''s the deeper reason crowded isobars mean strong winds. Near the ground, friction
    slows the wind, and lets it cross the isobars a little, towards the low. We built all of this in the cross product movie on our spinning Earth, and
    a later Coriolis movie takes it further. One warning: meteorologists also say gradient wind for a different idea, a balance round curved isobars, which has its own movie too.'
  on_screen_eq: null
  physics_source:
    fn: data (ERA5 u10, v10); balance sketch illustrative
    params: {time: 2023-11-02T03}
    test: CHECK DG29 (mean cross-isobar angle of the 10-m wind over the sea in the box is positive towards the low and < 45 deg)
