  voiceover: 'Before we use the gradient on weather maps, there''s one twist: the Earth is round. Weather data come on a grid of latitude and longitude,
    as we saw in the coordinates movie. A step north by a small angle, d phi, covers the Earth''s radius times d phi. But a step east by a small angle,
