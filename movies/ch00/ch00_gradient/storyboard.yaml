    east face ''p(x + δx) δA'' pushing west; S3: equal arrows cancel (gold ''= 0''); S4: the east face arrow grows; S5 Taylor tag ''p + ∂p/∂x δx''. Maths
    zone CalcStack one move per line: net push = −[p(x+δx) − p(x)] δA -> −(∂p/∂x) δx δA -> −(∂p/∂x) δV; gold underbrace ''volume'' on δx δA.'
  voiceover: Picture a small box of air, d x long from west to east. The air on its west side pushes it east, with the pressure there times the area of
    that face. The air on its east side pushes it west, with the pressure there times the same area. If the two pressures are equal, the pushes cancel,
    and nothing happens, however high the pressure is. Now suppose the pressure rises towards the east. By the Taylor series, from the derivatives movie,
    the pressure on the east face is bigger by partial p by partial x, times d x. So the net push is minus partial p by partial x, times d x, times the
    area of the face. And d x times that area is the volume of the box.
  on_screen_eq: {latex: '-\Big[p\big(x+\delta x\big)-p(x)\Big]\,\delta A=-\frac{\partial p}{\partial x}\,\delta x\,\delta A=-\frac{\partial p}{\partial
