  visual: 'Picture zone: three.js globe (BMNG, on disk) with the graticule; at Brest a small grid cell with sides ''a dφ'' (north, orange) and ''a cos φ
    dλ'' (east, orange) drawn on AT(3) and AT(4); a second cell near Svalbard visibly narrower. Maths zone: the sphere gradient (84 px) built with gold
    underbraces ''going east'', ''going north'', ''going up''; ''1/(a cos φ)'' pulsed on AT(5). Keyword ''a = Earth''s radius''.'
  voiceover: 'Before we use the gradient on weather maps, there''s one twist: the Earth is round. Weather data come on a grid of latitude and longitude,
    as we saw in the coordinates movie. A step north by a small angle, d phi, covers the Earth''s radius times d phi. But a step east by a small angle,
    d lambda, covers only the radius times cosine phi times d lambda, because the circles of latitude shrink towards the poles. So the slope going east
    is one over the radius times cosine phi, times partial by partial lambda. And the slope going north is one over the radius, times partial by partial
    phi. Together with the change going up, these make the gradient on the sphere.'
  on_screen_eq: {latex: '\nabla F=\mathbf i\,\frac{1}{a\cos\varphi}\frac{\partial F}{\partial\lambda}+\mathbf j\,\frac{1}{a}\frac{\partial F}{\partial\varphi}+\mathbf
