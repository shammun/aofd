  visual: 'Full width: three.js globe turning to the US east coast; SST (cmocean ''thermal'') from D7 for the newest day, the Gulf Stream''s north wall
    highlighted by |grad SST| contours (gold); S3: a gold bracket across the north wall with the measured drop and distance (numbers added by the builder
    from D7, spoken in the revised S3). S5: a small storm-track thumbnail (keyword ''storms deepen near it''). Sound: none.'
  voiceover: The ocean has temperature gradients too. Off the east coast of the United States, the Gulf Stream carries warm water from the tropics towards
    the north-east, right next to colder water from the north. Along its northern edge, the sea-surface temperature can drop by several degrees within a
    few tens of kilometres. That's one of the sharpest temperature gradients in the open ocean. Winter storms often deepen fastest near it, so forecasters
    watch it closely. The great ocean currents have their own movies later in this series.
