    term per project term colours); gold underbrace ''pressure gradient force''. Picture zone: the box with its net arrow; S5: keywords ''Coriolis'', ''gravity'',
    ''friction'' (54 px) appear round the box as small arrows.'
  voiceover: To turn a force into an acceleration, we divide by the mass, which is the density, rho, times the volume. The volume cancels, and the push
    per kilogram, going east, is minus one over rho, times partial p by partial x. The same happens going north, and going up. Together, the force per kilogram
    is minus one over rho, times grad p. It's called the pressure gradient force. It appears in the equation that tells the air how to move, next to the
    Coriolis effect, gravity and friction. Only differences in pressure push, which is why its name carries the word gradient.
