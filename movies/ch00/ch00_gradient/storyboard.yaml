    grad-h arrow and a teal n̂ needle turning; its shadow band (20 px orange) on grad h; a live value ''50 cos θ'' (68 px) and a small cosine curve with
    its peak at θ = 0 marked gold. S7: needle reversed, value ''−50''.'
  voiceover: 'Why does the gradient point the steepest way? The dot product has a second form: the length of grad h, times the length of n hat, times the
    cosine of the angle between them. Let''s call that angle theta. N hat has length one, so the rate of climb is the length of grad h times cosine theta.
    A cosine is never bigger than one, and it equals one only when theta is zero. So the climb is largest when you walk along grad h itself, and then it
    equals the length of grad h. That''s why the gradient points the way the field increases fastest, and why its length is that fastest rate. Walk the
    opposite way, where theta is a hundred and eighty degrees, and the cosine is minus one: you go down at the steepest rate.'
  on_screen_eq: {latex: '\nabla h\cdot\hat{\mathbf n}=|\nabla h|\,|\hat{\mathbf n}|\cos\theta=|\nabla h|\cos\theta', vallis_eq: 'dot-product cosine form
