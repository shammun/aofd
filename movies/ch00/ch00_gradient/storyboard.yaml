  voiceover: 'Pressure has a gradient going up too, and it''s enormous. The Singapore balloon found the pressure falling by about zero point one one hectopascals
    for every metre it rose near the ground: one hectopascal in about nine metres. [beat] Ciarán''s crowded isobars needed thirty one kilometres for four
    hectopascals, which is about eight kilometres per hectopascal. So the upward pressure gradient was about eight hundred and fifty times stronger than
    Ciarán''s sideways one. On an ordinary day, it''s about ten thousand times stronger. [beat] So why doesn''t it blast the air into space? Because gravity
    pulls down just as hard. This is hydrostatic balance, from the weather basics movie: partial p by partial z equals minus rho g. Near the ground in Singapore,
    rho is about one point one seven kilograms per cubic metre, and g is nine point eight one, so that''s about eleven and a half pascals per metre, close
    to the balloon''s ten point nine. [beat] So the upward push is almost exactly cancelled, and the weather is driven by the tiny sideways part. Because
    pressure falls so steadily with height, meteorologists often use pressure itself as a vertical coordinate, which has its own movie.'
