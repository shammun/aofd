  beat: 'intuition: the directional derivative (derivation)'
  visual: 'Picture zone: the hillside from above; a short step d s along n̂ (teal) at angle alpha (gold arc) with its legs ''d s cos α'' (east) and ''d
    s sin α'' (north) dashed. Maths zone: CalcStack, one line per move: ''dh = ∂h/∂x · dx + ∂h/∂y · dy'' -> ''dx = ds cos α, dy = ds sin α'' -> divide by
    ds -> the result; gold underbrace ''∇h · n̂'' and keyword ''directional derivative''. S11-S13: check line ''30 × 0 + 40 × 1 = 40'' with the needle pointing
    north.'
  voiceover: Now let's see why the arrow works, starting from a general rule. Suppose we walk a short distance, d s, in some direction. Let's describe that
    direction by a unit vector, n hat, at an angle alpha from east. Its east part is cosine alpha, and its north part is sine alpha. So the step east is
    d s times cosine alpha, and the step north is d s times sine alpha. The change in height is partial h by partial x times the step east, plus partial
    h by partial y times the step north. Now divide both sides by d s. The rate of climb along n hat is partial h by partial x times cosine alpha, plus
    partial h by partial y times sine alpha. That is exactly the dot product of grad h with n hat, from the dot product movie. So the rate of change in
    any direction is grad h dot n hat, and it's called the directional derivative. Let's check it going north. Alpha is ninety degrees, so we get thirty
    times zero, plus forty times one, which is forty. [beat]
  on_screen_eq:
    latex: \frac{\partial h}{\partial s}=\frac{\partial h}{\partial x}\cos\alpha+\frac{\partial h}{\partial y}\sin\alpha=\nabla h\cdot\hat{\mathbf n}
    vallis_eq: 'Kundu printed p. 53, unnumbered: d phi/dn = grad phi . n (Fig. 2.7 context); derivation from the total differential (Kundu App. B §B.1)'
    page_png: ../Fluid Dynamics/chapters/pages/ch02/p080.png
