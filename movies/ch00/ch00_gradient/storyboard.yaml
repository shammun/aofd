    the shadow of grad T on the wind direction (orange band, negative side hatched rose with ''−''). Maths zone CalcStack: ''4.1 × cos 138° ≈ −3.0 °C per
    100 km'' -> ''× 34 m/s'' -> ''≈ −3.7 °C per hour'' (unit cancellation shown: m struck, × 3600 s); equation ''v · ∇T = |v| ∂T/∂s''; S8: a slate fixed
    thermometer (PoleThermometer) at Brest with ''+3.7 °C per hour''.'
  voiceover: The gradient also tells us how the wind changes the temperature at a fixed place. Over Brest at that hour, the wind at that height blew at
    thirty four metres per second, from just west of south, at a hundred and thirty eight degrees to grad capital T. So along the wind, the temperature
    changes at grad capital T dot the wind's direction. That's four point one times the cosine of a hundred and thirty eight degrees, which is about minus
    three degrees per hundred kilometres. [beat] It's negative because the wind blows towards colder air. Times the wind speed, that's minus three point
    seven degrees per hour. [beat] This is v dot grad capital T, the advection term from the dot product movie. Because the air keeps arriving from the
    warmer side, a fixed thermometer at Brest would warm by about three point seven degrees per hour from this alone. The material derivative movie takes
    this apart fully.
