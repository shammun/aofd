  beat: recap ('To sum up'); last sentence the teaser to Part 2
  visual: 'One beat per sentence, mini pictures reused (no headings): grid + origin; fixed x-hat, y-hat; r and theta with x = r cos
    theta, y = r sin theta; the arc rule; r-hat and theta-hat with the +90 deg arc and (-sin theta, cos theta); the wind''s two shadow
    bands; turned axes with the 2 x 2 matrix; the balloon with alpha = theta; Ian''s ring with ''37'', ''12.5'' and the 19-deg wedge
    (small source line under it); a parcel circling with a question mark (Part 2 teaser). Each spoken number on screen at its words.'
  voiceover: 'To sum up, coordinates are numbers that pin down a place, measured from an origin along chosen directions. Cartesian coordinates
    use x and y, and their unit vectors, x hat and y hat, are the same everywhere. Polar coordinates use the distance r and the angle
    theta, with x equals r cosine theta, and y equals r sine theta. The arc length is the radius times the angle, in radians. R hat
    points the way r grows. Theta hat points the way theta grows: it''s r hat turned by ninety degrees, minus sine theta, cosine theta.
    The parts of a wind along these two arrows are dot products: the radial and the tangential wind. Turning the axes by an angle alpha
    gives new coordinates for the same arrow, and the four direction cosines make the rotation matrix. Polar parts are just turned axes,
    with an angle that changes from place to place. Round Hurricane Ian''s eye, they split the wind into about thirty seven metres per
    second of spin and twelve and a half of inflow, so the air spirals in at about nineteen degrees. In Part 2, we''ll ask whether air
    going round at a steady speed is accelerating, and look at a hurricane in three dimensions.'
