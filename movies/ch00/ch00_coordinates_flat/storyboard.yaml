quiz_hook: 'At a point 5 km due east of a northern-hemisphere hurricane''s eye, the wind blows towards the north-west at u = -10, v
  = 10 m/s. What are u_r and u_theta, is the air flowing in, and which way does it go round, seen from above? (u_r = -10, in; u_theta
  = +10, anticlockwise: cyclonic.)'
