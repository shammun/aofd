  voiceover: 'So what do these two numbers mean, and how are they different? Thirty seven is how fast the air goes round the eye. Twelve
    and a half is how fast it moves towards the eye. They''re two parts of the same wind, at right angles to each other. By Pythagoras,
    together they make an arrow of the square root of thirty seven squared plus twelve and a half squared, about thirty nine metres
    per second. [beat] It points mostly round, and a little in. Twelve and a half metres per second, times three point six, is about
    forty five kilometres per hour, towards the centre. [beat] Now imagine, just for a moment, that nothing changed. An air parcel,
    a small volume of air that moves with the flow, starts on this ring, twenty five kilometres out. Moving in at twelve and a half
    metres per second, it would cover the twenty five thousand metres to the centre in two thousand seconds, about thirty three minutes.
    [beat] Going round at thirty seven metres per second, one lap of this ring, two pi times twenty five kilometres, about a hundred
    and fifty seven kilometres, takes about seventy one minutes. [beat] So the air is moving round and moving in at the same time. Thirty
    seven divided by twelve and a half is about three, so for every metre it moves in, it moves about three metres round. [beat] The
    air doesn''t fall straight into the eye: it spirals in. In the real storm, the inflow slows down near the ring of strongest winds,
    and the air rises there instead, in towering clouds. We''ll look at that rising air in Part 2, and the whole story of how hurricanes
    work has its own movie later in this series: How tropical cyclones form.'
