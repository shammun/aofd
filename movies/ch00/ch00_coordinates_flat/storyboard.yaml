  voiceover: 'Next, we work out three ring points by hand, for anyone who wants to see every number. You don''t need these steps for the intuition
    of weather, climate science or maps, so if that feels like too much, skip ahead to the time on screen. Where do those averages come from?
    Let''s work out three of the seventy two points by hand. Remember, the data give us u and v, the eastward and northward parts. First, the
    point due east of the eye, at theta equals zero. There, u is minus eight point seven, and v is thirty eight: the wind blows north, and a little
    west. [beat] Our rule has cosine of zero, which is one, and sine of zero, which is zero. So u sub r equals u, which is minus eight point seven:
    a little in. And u sub theta equals v, which is thirty eight: round. Here, the wind blows mostly round. [beat] Next, the point due north of
    the eye, at ninety degrees. There, u is minus sixteen point nine, and v is minus thirty seven point four: the wind blows mostly towards the
    south, and a little west. [beat] Now the cosine is zero and the sine is one. So u sub r equals v, which is minus thirty seven point four:
    in. And u sub theta is minus u times one, plus v times zero, which leaves minus u: plus sixteen point nine, round. [beat] Last, the point
    to the northwest, at a hundred and thirty five degrees. There, u is minus ten point one, and v is minus forty four point five. [beat] A hundred
    and thirty five degrees is forty five degrees short of due west, so its cosine is minus the cosine of forty five degrees, about minus zero
    point seven zero seven, and its sine is plus zero point seven zero seven. So u sub r is u times the cosine, plus v times the sine. That gives
    about minus twenty four point three: in. [beat] And u sub theta is minus u times the sine, plus v times the cosine. That gives about thirty
    eight point six: round. [beat] The other points work the same way, so here are five more, without the arithmetic. With all eight points, every
    forty five degrees round the ring, the in or out arrows point inward at seven of them, and outward only at two hundred and twenty five degrees,
    on the southwest side. The computer does exactly this at all seventy two points, and then takes the averages. And our first point, minus eight
    point seven at theta equals zero, is the very first term of the radial sum. If you skipped, here''s what to keep: at every point round the
    ring, the wind''s east and north parts turn into an in or out part and a round part, and then we average them.'
