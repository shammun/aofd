    and we get five kilometres. [beat] The direction is an angle, called theta. Mathematicians measure it from the east axis, turning anticlockwise
    as seen from above. In a right triangle, the tangent of an angle is the side opposite it divided by the side next to it: here the north side
    over the east side, four over three, about one point three three. The angle with that tangent is about fifty three point one degrees, so theta
    is about fifty three degrees. [beat] So the same balloon is at r equals five kilometres, and theta equals fifty three degrees. These two numbers
    are called polar coordinates. A weather radar measures exactly this pair: how far away the raindrops are, and in which direction.'
