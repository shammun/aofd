  voiceover: Polar coordinates come with their own unit vectors, so let's build them one at a time. The first is called r hat. It's an arrow of
    length one that points away from the station, towards the balloon. Here's how to get it. The arrow from the station to the balloon is three,
    four, and its length is r, five kilometres. Dividing an arrow by its own length keeps its direction, and makes its length one. So r hat is
    three fifths, four fifths, which is zero point six, zero point eight. We draw r hat at the balloon, because it tells us the direction there.
    [beat] For r hat, we square its two components, add them, and take the square root, and we get exactly one. The same works for any point.
    The arrow to it is r cosine theta, r sine theta, as we just saw. Dividing by r, the r cancels, so r hat is cosine theta, sine theta. [beat]
    Why is it called r hat? Hold theta fixed and let r grow, and the balloon slides straight outward, along this arrow. So r hat points the way
