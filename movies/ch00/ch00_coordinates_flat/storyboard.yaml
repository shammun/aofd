  voiceover: 'Where do those averages come from? Let''s work out three of the seventy two points by hand. Remember, the data give us
    u and v, the eastward and northward parts. First, the point due east of the eye, at theta equals zero. There, u is about zero, and
    v is about thirty eight: the wind blows north. [beat] Our rule has cosine of zero, which is one, and sine of zero, which is zero.
    So u sub r is about zero, and u sub theta is about thirty eight. Here, the wind blows almost purely round. [beat] Next, the point
    due north of the eye, at ninety degrees. There, u is minus twenty seven point three, and v is minus twenty point four: the wind
    blows towards the west, and a little south. [beat] Now the cosine is zero and the sine is one. So u sub r equals v, which is minus
    twenty point four: in. And u sub theta equals minus u, which is plus twenty seven point three: round. [beat] Last, the point to
    the northwest, at a hundred and thirty five degrees. There, u is minus nine point eight, and v is minus forty eight point seven.
    [beat] The cosine of a hundred and thirty five degrees is minus zero point seven zero seven, and the sine is plus zero point seven
    zero seven. So u sub r is minus nine point eight times minus zero point seven zero seven, plus minus forty eight point seven times
    zero point seven zero seven. That''s six point nine minus thirty four point four, about minus twenty seven and a half: in. [beat]
    And u sub theta is plus nine point eight times zero point seven zero seven, plus minus forty eight point seven times minus zero
    point seven zero seven. That''s six point nine plus thirty four point four, about forty one point four: round. [beat] The computer
    does exactly this at all seventy two points, and then takes the averages.'
