    the new ones become e prime sub one and e prime sub two. Next, each direction cosine gets two labels. C sub i j is the dot product of old
    arrow number i with new arrow number j. Let''s work out all four. C one one is x hat dot x hat prime, which is cosine alpha. [beat] C one
    two is x hat dot y hat prime, which is minus sine alpha. [beat] C two one is y hat dot x hat prime, which is sine alpha. [beat] And C two
