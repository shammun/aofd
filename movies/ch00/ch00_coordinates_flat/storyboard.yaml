    The minus sign means that, on average, the air is flowing in, towards the eye. The real storm was even stronger. The official estimate
    of its strongest wind at that hour, averaged over a minute, is about a hundred and thirty five knots. One knot is one point eight
    five kilometres per hour, so that''s about two hundred and fifty kilometres per hour. [beat] The model analysis smooths out the
