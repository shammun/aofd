  voiceover: 'Here''s a nice link between the two ideas. Go back to the balloon, at fifty three degrees, and turn the axes by alpha equals theta,
    fifty three degrees. Then x hat prime is cosine theta, sine theta, which is r hat. And y hat prime is minus sine theta, cosine theta, which
    is theta hat. [beat] So r hat and theta hat are just the east and north arrows, turned by the angle theta. That means the polar parts of any
    arrow are its coordinates in turned axes. Let''s check with the east wind, ten, zero, and the cosine and sine of theta, zero point six and
    zero point eight. X prime is the wind''s dot product with r hat, which is six. [beat] Y prime is its dot product with theta hat, which is
    minus eight. [beat] Those are exactly u sub r and u sub theta from before. Now the balloon''s own position arrow, three, four. X prime is
    its dot product with r hat: three times r hat''s east part, plus four times its north part. That gives five. [beat] Y prime is its dot product
    with theta hat, in the same way. That gives zero. [beat] So the balloon is at five, zero in these axes: five kilometres along r hat, and nothing
    along theta hat, because r hat points straight at the balloon. There''s one difference, though. With turned axes, we choose one angle for
    the whole map. With polar coordinates, the angle is theta, so it changes from place to place. If you skipped, here''s what to keep: turning
    the axes by an angle alpha changes the numbers that describe an arrow, but not the arrow itself, and polar parts are just axes turned by theta.'
