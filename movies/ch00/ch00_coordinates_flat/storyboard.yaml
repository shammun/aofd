    out to s21''s start view (1 s) and settles into the left picture zone (ring view, x 80-1000) with a gold marker that goes round
    the ring as the curves draw. Right (x 1060-1840): a chart against theta (0-360 deg, ticks every 90 deg, 52 px; y from -50 to +50
    m/s, ticks every 25, 52 px); a legend in the column above the chart with swatches and names: ''eastward u'' (orange solid), ''northward
    v'' (orange dashed), later ''round: u_theta'' (teal) and ''in or out: u_r'' (rose). S3 on AT(3,''solid orange line'') / AT(3,''dashed
    orange line''): u and v draw with END LABELS at their right ends (U-CO-012). S4: the three points from s24 appear as gold dots on
    both curves and on the ring. S7: at the east point and the north point of the ring, the wind arrows pulse (''north'', ''west'').
    S8-S9: u_theta (teal) and u_r (rose) draw with end labels ''round: u_theta'' and ''in or out: u_r'' (U-CO-014); u and v dim to 40
    %. S10: a dashed teal line at the mean 37 (label ''37''); band 25-50 shaded faintly. S11: dashed rose line at -12.5 (label ''-12.5'');
    S12-S13: keyword ''negative, or nearly zero, all the way round'' (Should 3). S14: keywords ''spin'' and ''inflow'' at the two dashed
    lines.'
  voiceover: 'Why bother with polar coordinates here? Let''s go all the way round the ring, and plot the winds against the angle theta.
    First, the eastward wind u, the solid orange line, and the northward wind v, the dashed orange line. Our three points sit on these
    lines. Both lines swing up and down, from plus to minus, by tens of metres per second. They swing because the wind keeps turning
    as we go round the eye. On the east side it blows north, and on the north side it blows west, and so on, all the way round. Now
    let''s plot the two polar parts round the same ring. The tangential wind, u sub theta, is the teal line, and the radial wind, u
    sub r, is the rose line. The tangential wind stays close to its average of thirty seven, between about twenty five and fifty. The
    radial wind wobbles more, between about zero and minus thirty five, because the storm isn''t perfectly round. But it''s negative,
    or nearly zero, all the way round. So the air flows in on every side. Instead of two lines that swing from plus to minus, we get
    two numbers that mean something: how fast the storm spins, and how fast the air flows in. That''s why hurricane scientists use polar
    coordinates.'
