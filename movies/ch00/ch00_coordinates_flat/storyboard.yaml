  voiceover: 'Each axis comes with a unit vector: an arrow of length one that points along it. We write x hat for the arrow pointing
    east, and y hat for the arrow pointing north. The balloon''s position is three times x hat, plus four times y hat. We met arrows
    like these in the vectors movie of this series. Here''s their key property: x hat points the same way everywhere on the map. Move
    the balloon anywhere you like, and the two arrows don''t change. That''s what makes Cartesian coordinates so easy to work with.
    But many things in the weather aren''t laid out in squares. A hurricane spins round its eye, and a weather radar looks out in rings.
