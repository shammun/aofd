  visual: 'PENDING DATA REPORT (reports/data/ch00_coordinates_research.md, not written on 2026-11-05). On frame 0 the map zooms back out to s21''s
    start view (1 s) and settles into the left picture zone (ring view, x 80-1000) with a gold marker that goes round the ring as the curves draw.
    Right (x 1060-1840): a chart against theta (0-360 deg, ticks every 90 deg, 52 px; y from -50 to +50 m/s, ticks every 25, 52 px); a legend
    in the column above the chart with swatches and names: ''eastward u'' (orange solid), ''northward v'' (orange dashed), later ''round: u_theta''
    (teal) and ''in or out: u_r'' (rose). S3 on AT(3,''solid orange line'') / AT(3,''dashed orange line''): u and v draw with END LABELS at their
    right ends (U-CO-012). S4: the three points from s24 appear as gold dots on both curves and on the ring. S7: at the east point and the north
    point of the ring, the wind arrows pulse (''north'', ''west''). S8-S9: u_theta (teal) and u_r (rose) draw with end labels ''round: u_theta''
    and ''in or out: u_r'' (U-CO-014); u and v dim to 40 %. S10: a dashed teal line at the mean 34.8 (label ''mean 35''); band 17-47 shaded faintly.
    S11: dashed rose line at -13.3 (label ''mean -13''); S12-S13: keyword ''negative, or nearly zero, all the way round'' (Should 3). S14: keywords
    ''spin'' and ''inflow'' at the two dashed lines.'
  voiceover: 'Why bother with polar coordinates here? Let''s go all the way round the ring, and plot the winds against the angle theta. First,
    the eastward wind u, the solid orange line, and the northward wind v, the dashed orange line. Our three points sit on these lines. Both lines
    swing up and down, from plus to minus, by tens of metres per second. They swing because the wind keeps turning as we go round the eye. On
    the east side it blows north, on the west side it blows south, and on the south side it blows east, all the way round. Now let''s plot the
    two polar parts round the same ring. The tangential wind, u sub theta, is the teal line, and the radial wind, u sub r, is the rose line. The
    tangential wind stays positive all the way round, between about seventeen and forty seven, with an average of thirty five. The radial wind
    wobbles more, between about minus forty and plus fourteen, because the storm isn''t perfectly round. It''s negative at fifty eight of the
    seventy two points, and only on the southwest side does it blow outward, by up to about fourteen metres per second. So, on average, the air
    flows in. Instead of two lines that swing from plus to minus, we get two numbers that mean something: how fast the storm spins, and how fast
    the air flows in. That''s why hurricane scientists use polar coordinates. The same idea works on a coast, where we turn the axes to split
    the wind into a part along the shore and a part across it. Wind blowing across the shore, towards the land, pushes sea water onto the coast.
    In Part 2, we''ll use these same equations on real storms. We''ll measure how much of the wind blew onto the land, see on tide gauges how
    high the water rose, and then look at the flooded land in satellite pictures taken before and after the storm.'
