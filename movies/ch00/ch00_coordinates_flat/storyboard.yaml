  voiceover: 'Let''s start with the two easiest arrows. Turn x hat, which points east, by ninety degrees anticlockwise, and it points north. So
    it becomes zero, one. [beat] Turn y hat, which points north, and it points west. So it becomes minus one, zero. [beat] Now take any arrow,
    with an east part p and a north part q. It''s p steps along x hat, followed by q steps along y hat. If we turn the whole drawing by ninety
    degrees, both pieces turn together, and they stay joined, tip to tail. So the p steps east become p steps north, and the q steps north become
    q steps west. Steps to the west count as minus in the east part. p times zero, one is zero, p, and q times minus one, zero is minus q, zero.
    Adding the east parts gives minus q, and adding the north parts gives p. So the turned arrow is minus q, p. [beat] In words: swap the two
    numbers, and put a minus sign on the first one. Let''s try it on the balloon''s arrow, three, four. Swap them, and put a minus on the first:
    minus four, three. [beat] Is that really a quarter turn? For the turned arrow, minus four, three, we square each component, add them, and
    take the square root, and we get five, the same as the balloon''s arrow. And its dot product with three, four, multiplying the matching parts
    and adding, comes to zero. [beat] A zero dot product means a right angle, as we saw in the dot product movie.'
