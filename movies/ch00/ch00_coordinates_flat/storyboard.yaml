  rotation of axes: alpha anticlockwise as seen from above; C_ij = e_i . e'_j (rotation_matrix_2d); the s18 table is C^T
  turn rule letters: 'p, q (never a lone ''a'': Kokoro reads it as the article)'
  hemisphere: 'Ian (or Amphan) is northern hemisphere: cyclonic = anticlockwise seen from above'
