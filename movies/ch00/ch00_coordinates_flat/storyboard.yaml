    ring round the eye drawn from the data (ring, centre dot, the zoomed map at 30 % underneath, colour bar removed while the map is faded; source
    line kept below). S2-S6: at one ring point the ring-mean wind arrow (teal outline, ''about 37 m/s'') split into ''35 round'' (teal, along
    theta-hat) and ''13 in'' (rose, along -r-hat) with a RightTick; maths row Pythagoras (S5). S7: ''13 x 3.6 = about 47 km/h''. S8: keyword ''imagine:
    nothing changes'' (slate, thought experiment). S9: an air parcel (teal dot) on the ring; a dashed rose line from it to the centre labelled
    ''25 km''. S10: time row; a clock glyph holds 0 min and sweeps to ''32 min'' on its words (fix 1107). S11: the ring highlighted as one lap:
    rows; the clock to ''75 min'' on its words. S12-S13: the ratio row; at the parcel a small ''3 round, 1 in'' arrow pair. S14: a short spiral
    segment (quarter turn) drawn from the parcel inward at the ring''s inflow angle, keyword ''spirals in''. S15: the spiral stops short of the
    eye; a small upward arrow glyph at the ring of strongest winds with keyword ''rises (Part 2)''. S16: keyword ''more: How tropical cyclones
    form''.'
  voiceover: 'So what do these two numbers mean, and how are they different? Thirty five is how fast the air goes round the eye. Thirteen is how
    fast it moves towards the eye. They''re two parts of the same wind, at right angles to each other. By Pythagoras, we square the two parts,
    thirty five and thirteen, add them, and take the square root, and we get an arrow of about thirty seven metres per second. [beat] It points
    mostly round, and a little in. Converted with the same factor of three point six, the inflow is about forty seven kilometres per hour, towards
    the centre. [beat] Now imagine, just for a moment, that nothing changed. An air parcel, a small volume of air that moves with the flow, starts
    on this ring, twenty five kilometres out. Moving in at thirteen metres per second, it would have to cover twenty five kilometres. Time is
    distance divided by speed, so that takes about nineteen hundred and twenty three seconds, or about thirty two minutes. [beat] Going round
    at thirty five metres per second, one lap of this ring, two pi times twenty five kilometres, is about a hundred and fifty seven kilometres.
    That takes about four thousand four hundred and ninety seconds, which is about seventy five minutes. [beat] So the air is moving round and
    moving in at the same time. In any stretch of time, it goes thirty five metres round for every thirteen in, so it goes about two point seven
    times as far round as in. So for every metre it moves in, it moves almost three metres round. [beat] The air doesn''t fall straight into the
    eye: it spirals in. In the real storm, the inflow slows down near the ring of strongest winds, and the air rises there instead, in towering
    clouds. We''ll look at that rising air in Part 2, and the whole story of how hurricanes work has its own movie later in this series: How tropical
    cyclones form.'
