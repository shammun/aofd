    along r-hat from the balloon as a teal band 6/10 of the wind''s length, tip label ''u_r = 6'' at that moment (U-CO-009); gold link
    band -> ''6''. S18-S19: u_theta rows; on AT(19,''minus eight'') the tangential part grows along MINUS theta-hat as a rose hatched
    band with a ''-'' glyph, tip label ''u_theta = -8'' (U-CO-009); gold link. S20: keywords ''6 m/s away'', ''8 m/s round''. S21: a
    small clockwise arc arrow round the station (rose) and ''clockwise (seen from above)''.'
  voiceover: 'Now let''s describe a wind in polar coordinates. Suppose that at the balloon, the wind blows due east at ten metres per
    second. We''ll call the wind arrow bold u. Its eastward part is called u, and its northward part v. Here, u is ten and v is zero.
    [beat] How much of this wind blows away from the station, and how much blows round it? The part along r hat is called the radial
    wind, u sub r. The part along theta hat is called the tangential wind, u sub theta. To find each one, we take the dot product of
    the wind with that unit vector, as in the dot product movie. It gives the length of the wind''s shadow along that arrow. Here are
    the inputs. The wind is ten, zero. The angle theta is fifty three degrees. R hat is zero point six, zero point eight, and theta
    hat is minus zero point eight, zero point six. First, the radial wind. Multiply the matching parts, and add: ten times zero point
    six, plus zero times zero point eight. That''s six plus zero, so u sub r is six metres per second. [beat] Next, the tangential wind:
    ten times minus zero point eight, plus zero times zero point six. That''s minus eight plus zero, so u sub theta is minus eight metres
    per second. [beat] So six metres per second blow away from the station, and eight blow round it. The minus sign means the wind goes
    round against theta hat: clockwise, as seen from above.'
