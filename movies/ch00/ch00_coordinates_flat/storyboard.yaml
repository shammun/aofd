  voiceover: 'These two lines have the same shape, so let''s line them up. Write x prime above y prime, with the x terms in one column and the
    y terms in the other. Now look at just the four numbers in front of x and y. The top row is cosine alpha and sine alpha, and the bottom row
    is minus sine alpha and cosine alpha. That square of four numbers is called a rotation matrix, because it turns old coordinates into new ones.
    To use it, go along one row. Multiply its first number by x, and its second number by y, then add. The top row gives x prime, and the bottom
    row gives y prime. With our numbers, the top row gives four point six again, and the bottom row gives one point nine six, our y prime again.
    [beat] Each of the four numbers has a meaning, too. The dot product of two arrows of length one is the cosine of the angle between them. As
    in the dot product movie: length times length times the cosine of the angle, and both lengths are one. So each number is the cosine of the
    angle between one new axis and one old axis. That''s why they''re called direction cosines. For example, the angle between x hat prime and
    x hat is alpha, so their dot product is cosine alpha: the top left number. The angle between x hat prime and y hat is ninety degrees minus
    alpha, and its cosine is sine alpha. The angle between y hat prime and x hat is ninety degrees plus alpha, and its cosine is minus sine alpha.'
