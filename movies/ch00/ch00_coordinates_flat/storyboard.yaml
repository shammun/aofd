  voiceover: Let's start with a flat map. To say where something is, we need a starting point, and some directions to count from. The
    starting point is called the origin. Let's put it at a weather station. Now draw one line through it pointing east, and one pointing
    north. These lines are called the axes. A weather balloon drifts three kilometres east and four kilometres north of the station.
    So we can write its position as the pair of numbers three and four. [beat] These two numbers are called its coordinates, and together
    they pin down one place on the map. Measuring along straight axes at right angles, like this, is called Cartesian coordinates, after
    the French thinker René Descartes.
