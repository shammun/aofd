    between (3, 4) and (-4, 3) at the origin on AT(18,''right angle''); keyword ''dot product 0 -> right angle''.'
  voiceover: 'Let''s start with the two easiest arrows. Turn x hat, which points east, by ninety degrees anticlockwise, and it points
    north. So it becomes zero, one. [beat] Turn y hat, which points north, and it points west. So it becomes minus one, zero. [beat]
    Now take any arrow, with an east part p and a north part q. It''s p steps along x hat, followed by q steps along y hat. If we turn
    the whole drawing by ninety degrees, both pieces turn together, and they stay joined, tip to tail. So the p steps east become p
    steps north, and the q steps north become q steps west. Steps to the west count as minus in the east part. So the turned arrow is
    minus q, p. [beat] In words: swap the two numbers, and put a minus sign on the first one. Let''s try it on the balloon''s arrow,
    three, four. Swap them, and put a minus on the first: minus four, three. [beat] Is that really a quarter turn? Its length is the
    square root of sixteen plus nine, which is five, the same as before. And its dot product with three, four is three times minus four,
    plus four times three, which is zero. [beat] A zero dot product means a right angle, as we saw in the dot product movie.'
