    goal: a rule that turns any arrow by 90 deg anticlockwise
    steps:
    - - turn x-hat
      - (1,0)\to(0,1)
      - east turned a quarter turn anticlockwise is north
      - the first building block
    - - turn y-hat
      - (0,1)\to(-1,0)
      - north turned anticlockwise is west; west is minus in the east part
      - the second building block
    - - split any arrow
      - (p,q)=p\,\hat{\mathbf x}+q\,\hat{\mathbf y}
      - 'components (vectors movie): p steps east then q steps north'
      - an arrow is two joined pieces
    - - turn both pieces
      - p\,(0,1)+q\,(-1,0)
      - a rigid turn turns every piece by the same angle and keeps them joined tip to tail
      - east steps become north steps, north steps become west steps
    - - add up
      - (-q,\ p)
      - add the east parts and the north parts separately
      - swap the numbers, minus on the first
    - - check on (3, 4)
      - (-4,3):\ \text{length }5,\ \text{dot }0
      - a turn keeps length; zero dot product = right angle (dot product movie)
