  voiceover: 'There''s one more angle that hurricane scientists use. The wind crosses each ring at a slant, a little inward. The angle
    between the wind and the ring''s own direction, theta hat, is called the inflow angle. Its tangent is the inward part over the round
    part: twelve and a half over thirty seven, which is about zero point three four. So the inflow angle is about nineteen degrees.
    [beat] We''ve now met four different angles, so let''s put them side by side. Theta says where a point is, measured from east, anticlockwise
    as seen from above. The compass bearing says which way something points, measured from north, clockwise as seen from above. Alpha
    says how far we turned our axes. And the inflow angle says how far the wind leans inward from the ring. They answer four different
    questions, so it''s always worth checking which angle you''re looking at. The storm''s spin also has its own measure, called vorticity,
    which has its own movie later in this series: Vorticity in plain words.'
