    and makes its length one. So r hat is three fifths, four fifths, which is zero point six, zero point eight. [beat] Its length is
    one, because zero point three six plus zero point six four is one. The same works for any point. The arrow to it is r cosine theta,
    r sine theta, as we just saw. Dividing by r, the r cancels, so r hat is cosine theta, sine theta. [beat] Why is it called r hat?
    Hold theta fixed and let r grow, and the balloon slides straight outward, along this arrow. So r hat points the way r grows.
