  voiceover: 'Before polar coordinates can do their real work, we need one more building block: measuring angles in radians. Take a circle of
    radius r, and walk along its edge. The angle in radians is the distance you walked, divided by the radius. So the distance along the edge,
    called the arc length, is the radius times the angle. A full circle is two pi radians, because its edge is two pi times the radius. So one
    radian is three hundred and sixty degrees divided by two pi: about fifty seven degrees. Let''s try easy numbers. On a ring five kilometres
    from the station, turn by zero point two radians: that''s about eleven and a half degrees. It walks you the radius times the angle: one kilometre.
    [beat] On a ring fifty kilometres out, the same turn walks you ten kilometres. [beat] The same angle gives ten times the distance. Keep this
    rule in mind, because it explains a lot about maps of the Earth.'
