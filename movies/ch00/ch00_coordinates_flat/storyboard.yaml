    = 'from'
  wind: 'bold u = (u, v): u eastward, v northward (said ''bold u'', ''u'', ''v'')'
  rotation of axes: alpha anticlockwise as seen from above; C_ij = e_i . e'_j (rotation_matrix_2d); the s18 table is C^T
  turn rule letters: 'p, q (never a lone ''a'': Kokoro reads it as the article)'
  hemisphere: 'Ian (or Amphan) is northern hemisphere: cyclonic = anticlockwise seen from above'
colour_contract: 'unit vectors and axes orange (x-hat, y-hat, r-hat, theta-hat, x-hat'', y-hat''); the arrow being measured (position,
  wind) teal with moving dashes when it is a wind; a component band takes the measured arrow''s teal when positive and rose with a hatch
  and a ''-'' glyph when negative; in the storm: tangential teal, radial rose (inflow); theta arc slate, bearing gold, alpha orange
  arc, inflow angle rose wedge; gold for pointers, links, the +90 deg arc and ''same'' ticks. u and v curves orange solid / orange dashed
  with end labels.'
