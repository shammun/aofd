id: ch00_coordinates_flat
title: 'Coordinates, Part 1 — Arrows on a flat map: polar coordinates and turned axes'
version: 1
concepts:
- origin, axes, Cartesian coordinates and constant unit vectors x-hat, y-hat
- 'plane polar coordinates (r, theta): x = r cos theta, y = r sin theta, r = sqrt(x^2 + y^2); maths angle vs compass bearing vs wind ''from'''
- radians and arc length s = r theta
- r-hat = (cos theta, sin theta) as the arrow divided by its length, the way r grows (Kundu App. B §B.5)
- theta-hat as the way theta grows; the 90-deg turn rule (p, q) -> (-q, p); theta-hat = (-sin theta, cos theta) (Kundu App. B §B.5)
- polar unit vectors depend on place
- 'radial and tangential components as dot products: u_r = u cos theta + v sin theta, u_theta = -u sin theta + v cos theta'
- 'rotation of axes: x-hat'' = (cos alpha, sin alpha), y-hat'' = (-sin alpha, cos alpha); x'' = x cos alpha + y sin alpha, y'' = -x sin alpha
  + y cos alpha'
- the rotation matrix and direction cosines; index form x'_j = x_i C_ij, C_ij = e_i . e'_j (Kundu (2.4)-(2.5))
- polar components = axes turned by the local angle theta
- 'application: a hurricane''s ring-mean tangential and radial winds, their meaning, three ring points by hand, the inflow angle (pending data
  report)'
