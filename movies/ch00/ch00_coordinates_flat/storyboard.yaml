  voiceover: 'In the vectors movie, we met index notation, a short way to write all of this. Let''s rewrite it one step at a time. First,
    the names. The old coordinates x and y become x sub one and x sub two. The old unit vectors x hat and y hat become e sub one and
    e sub two, and the new ones become e prime sub one and e prime sub two. Next, each direction cosine gets two labels. C sub i j is
    the dot product of old arrow number i with new arrow number j. Let''s work out all four. C one one is x hat dot x hat prime, which
    is cosine alpha. [beat] C one two is x hat dot y hat prime, which is minus sine alpha. [beat] C two one is y hat dot x hat prime,
    which is sine alpha. [beat] And C two two is y hat dot y hat prime, which is cosine alpha. [beat] Now the rule: new coordinate number
    j is x sub i times C sub i j. The index i appears twice, so, as in the vectors movie, we add up the terms for i equals one and i
    equals two. For j equals one, that''s x sub one times C one one, plus x sub two times C two one. That''s x cosine alpha plus y sine
    alpha: our x prime. [beat] For j equals two, it''s x sub one times C one two, plus x sub two times C two two. That''s minus x sine
    alpha plus y cosine alpha: our y prime. [beat] So the short line says exactly what our two long lines say. If we set the four C''s
    in a square, with i for the row and j for the column, we get our rotation matrix flipped over its diagonal. That''s only because
    this form reads down the columns instead of along the rows, and the four numbers are the same. The same rule works in three dimensions,
    and for things called tensors, which have their own movie later in this series: Tensors made easy.'
