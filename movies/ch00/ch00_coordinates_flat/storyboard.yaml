  visual: 'PENDING DATA REPORT (reports/data/ch00_coordinates_research.md, not written on 2026-11-05) (numbers). Picture: one ring point enlarged:
    the ring''s tangent direction theta-hat (orange) and the ring-mean wind arrow (teal), a rose wedge between them labelled ''inflow angle''
    (S3); S4-S5: rows; ''19 deg'' at the wedge on its words. S7-S10: four small drawings side by side across the full width (no boxes), each built
    on its sentence: theta (slate arc from east, anticlockwise, ''where a point is''), the compass bearing (gold arc from north, clockwise, ''which
    way it points''), alpha (orange arc between x and x'', ''how far the axes turned''), the inflow angle (rose wedge between theta-hat and the
    wind, ''how far the wind leans in''); each with ''(seen from above)'' where it has a sense. S11: keyword ''four questions''. S12: keyword
    ''more: Vorticity in plain words''.'
  voiceover: 'There''s one more angle that hurricane scientists use. The wind crosses each ring at a slant, a little inward. The angle between
    the wind and the ring''s own direction, theta hat, is called the inflow angle. Its tangent is the side opposite the angle over the side next
    to it: the inward part over the round part, thirteen point three over thirty four point eight, about zero point three eight. So the inflow
    angle, the angle with that tangent, is about twenty one degrees. [beat] We''ve now met four different angles, so let''s put them side by side.
    Theta says where a point is, measured from east, anticlockwise as seen from above. The compass bearing says which way something points, measured
    from north, clockwise as seen from above. Alpha says how far we turned our axes. And the inflow angle says how far the wind leans inward from
    the ring. They answer four different questions, so it''s always worth checking which angle you''re looking at. The storm''s spin also has
    its own measure, called vorticity, which has its own movie later in this series: Vorticity in plain words.'
