    ones on the diagonal (gold), zeros faint. S4: delta_ij u_j = u_i (84 px); S5 a gold arrow carrying j -> i and the delta
    fading out. S6: delta_ii = 1 + 1 + 1 = 3. S7: keywords drift to the corner as the s05 globe fades in.'
  voiceover: 'Finally, the first special symbol, the Kronecker delta, written delta i j. It''s the dot product of two unit
    vectors, e sub i dot e sub j. So it''s one when i equals j, and zero when they differ. Its trick is substitution: delta
    i j times u sub j equals u sub i. The delta swaps the summed index for its other index, and then it disappears. And delta
    i i, summed, is one plus one plus one, which is three. That''s everything we need, so let''s begin.'
  on_screen_eq:
    latex: \delta_{ij} = \mathbf e_i\cdot\mathbf e_j,\quad \delta_{ij}u_j = u_i,\quad \delta_{ii} = 3
