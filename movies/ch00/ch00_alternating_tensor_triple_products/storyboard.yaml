  voiceover: 'In the first part, delta i l turns q sub l into q sub i, and delta j m turns s sub m into s sub j. That leaves
    q sub i times p sub j s sub j, which is q times p dot s. In the second part, delta i m turns s sub m into s sub i, and
    delta j l turns q sub l into q sub j. That leaves s sub i times p dot q. So p cross, q cross s, equals q times p dot s,
    minus s times p dot q. Let''s check with easy numbers: p is one, zero, zero, q is zero, one, zero, and s is one, one,
    zero. Straight from the cross products, the answer is zero, one, zero. From our rule, it''s q times one, minus s times
    zero, which is zero, one, zero as well. Identities like this one, with grad, div and curl inside them, fill the two movies
    on vector identities.'
  on_screen_eq:
