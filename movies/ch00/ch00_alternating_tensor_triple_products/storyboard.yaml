  beat: 'why: three good reasons (epsilon)'
  visual: 'Maths full width, the s10 p and q kept small in the picture zone. S1-S2 keyword ''three good reasons'' (54 px).
    S3-S4 keyword ''order'': epsilon_ijk = -epsilon_jik (84 px) and beside it q x p = -p x q, a gold CurvedLink from the minus
    of one to the minus of the other; the mini picture flips the violet p x q arrow to point down (rose dashed with a ''−''
    glyph). S5 keyword ''itself'': p x p = 0 (84 px). S6-S7: epsilon_ijk p_j p_k for i = 1 written as the pair epsilon_123
    p_2 p_3 + epsilon_132 p_3 p_2, the second struck as ''−'' of the first, both fading to 0 (Strike). S8 mini picture: two
    teal copies of p from one tail, the parallelogram collapsing to a line, area ''0''. S9-S10 keyword ''counting'': epsilon
    epsilon -> delta delta glyph (grey, ''soon'').'
  voiceover: 'So why is epsilon built this way? There are three good reasons. The first is order. Swapping two indices flips
    epsilon''s sign, and that''s exactly why q cross p is minus p cross q. The second is that an arrow crossed with itself
    gives zero. In epsilon i j k times p sub j times p sub k, the terms come in pairs, like j equal to two with k equal to
    three, and j equal to three with k equal to two. Swapping j and k flips epsilon''s sign but leaves the p''s the same,
    so each pair cancels. That matches the picture: an arrow and itself make a flat parallelogram, with no area. The third
    reason is that two epsilons can be turned into Kronecker deltas, as we''ll see soon. That turns rules about cross products
    into counting with indices, instead of drawing pictures.'
  on_screen_eq:
    latex: \varepsilon_{ijk}\,p_j\,p_k = 0
    vallis_eq: 'provenance only: consequence of the antisymmetry of Kundu (2.18) (page image checked)'
    page_png: ../Fluid Dynamics/chapters/pages/ch02/p078.png
  physics_source:
    fn: fluidpy.core.tensors.cross_einsum + fluidpy.core.tensors.levi_civita
