  beat: 'epsilon-delta: why it is true'
  visual: 'Maths with the epsilon cube small at left. S2: i ≠ j highlighted, ''k = the third number'' (e.g. i = 1, j = 2 ->
    k = 3 cell lights). S3: ''{l, m} = {i, j}''. S4: same order -> (+1)(+1) = +1; S5: swapped -> (+1)(-1) = -1. S6: the deltas''
    two terms light under each case.'
  voiceover: But why must it always be true? For the left side not to be zero, i and j must be different, and k must be the
    third number. Then epsilon k l m isn't zero only if l and m are the same two numbers as i and j. If they come in the same
    order, the two epsilons are equal, so their product is plus one. If they come in the swapped order, the two epsilons have
    opposite signs, so their product is minus one. And that's exactly what the deltas on the right side say.
  on_screen_eq: null
