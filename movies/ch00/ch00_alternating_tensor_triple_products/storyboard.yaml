  voiceover: 'We also wrote vectors with indices. u sub i means the three components u one, u two and u three, with one for
    east, two for north and three for up. An index that appears once in a term is a free index, so an equation with one is
    really three equations. An index that appears twice in a term is summed over one, two and three, even though no sum sign
    is written. That''s the Einstein summation convention, and the repeated index is called a dummy index, because its letter
    doesn''t matter. An index may appear at most twice in a term. For example, p sub i q sub i is p one q one, plus p two
    q two, plus p three q three: the dot product of p and q, a single number. It measures how much two arrows point the same
    way. And u sub i u sub i is the wind''s length squared.'
