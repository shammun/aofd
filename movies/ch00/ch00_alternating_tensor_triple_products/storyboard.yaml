  beat: 'cross product: definition (stand-alone)'
  visual: 'Picture zone: three.js floor with p (teal) and q (orange) from one point, the parallelogram (ink 18 % fill) and
    the violet p x q rising. S2: ''|p||q| sin θ'' with the angle arc. S3: ''area'' with the parallelogram pulsing. S4: a right-hand
    glyph (code-drawn, as in the cross-product movie) curls from p to q; thumb along p x q. S5: e1 x e2 = e3, ''east x north
    = up'' on the Brest axes. S6-S7: (p x q)_1 = p2q3 - p3q2 (84 px), then the other two rows faded in as a cycle 1 -> 2 ->
    3 -> 1 glyph.'
  voiceover: 'The cross product of two vectors, p and q, is another vector, at right angles to both. Its length is the length
    of p, times the length of q, times the sine of the angle between them. That''s the area of the parallelogram the two arrows
    make. Its direction comes from the right-hand rule: point your fingers along p, curl them towards q, and your thumb points
    along p cross q. For our unit vectors, e one cross e two is e three: east cross north is up. In components, the first
    component of p cross q is p two q three, minus p three q two. The other two follow the same pattern, cycling through one,
    two and three. We take the cross product apart fully, and see its uses across physics, in the two cross product movies.'
