    for each i''. S3: i = 1: a 3 x 3 grid (j rows, k columns) of epsilon_1jk p_j q_k. S4: every cell with j = 1 or k = 1 or
    j = k strikes out (7 cells, rose dash). S5: epsilon_123 p2 q3 -> + p2q3 (teal). S6: epsilon_132 p3 q2 -> - p3q2 (rose
    with ''-''). S7: = p2q3 - p3q2 with a gold link to the s06 component row.'
  voiceover: 'Now the cross product fits in one line: the i component of p cross q is epsilon i j k times p sub j times q
    sub k, with j and k both summed. That''s nine terms for each i. Let''s write them out for i equal to one. Every term with
    j or k equal to one is zero, because then epsilon repeats an index. That leaves two terms. Epsilon one two three times
    p two q three is plus p two q three. And epsilon one three two times p three q two is minus p three q two. That''s exactly
    the first component of the cross product.'
  on_screen_eq:
