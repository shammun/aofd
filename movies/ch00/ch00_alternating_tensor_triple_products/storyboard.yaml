  beat: 'vector triple product: steps 1-3'
  visual: 'DerivationStrip: S1 [p x (...)]_i = epsilon_ijk p_j (...)_k ; S2 (q x s)_k = epsilon_klm q_l s_m ; S3 = epsilon_ijk
    epsilon_klm p_j q_l s_m ; S4-S5 = (delta_il delta_jm - delta_im delta_jl) p_j q_l s_m, the shared k linked gold.'
  voiceover: First, the i component of p cross anything is epsilon i j k times p sub j, times that thing's k component. Second,
    take the k component of q cross s. It's epsilon k l m times q sub l times s sub m. Putting them together gives epsilon
    i j k times epsilon k l m, times p sub j, q sub l and s sub m. The two epsilons share the summed index k, sitting next
    to each other. So the epsilon delta relation applies, and we replace them with delta i l delta j m, minus delta i m delta
    j l.
  on_screen_eq:
    latex: '[\mathbf p\times(\mathbf q\times\mathbf s)]_i = \varepsilon_{ijk}\varepsilon_{klm}\,p_jq_ls_m = (\delta_{il}\delta_{jm}
      - \delta_{im}\delta_{jl})\,p_jq_ls_m'
    vallis_eq: 'provenance only: our derivation with Kundu (2.21) twice and (2.19) (page images checked)'
