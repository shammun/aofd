    rose cells; S2 the cyclic arrow 1 -> 2 -> 3 and a swap glyph with ''−''; S3 (p x q)_i = epsilon_ijk p_j q_k with the (5,1,0)
    x (1,3,0) = (0,0,14) mini picture; S4 the s16 globe thumbnail, violet pushes right in the north, left in the south; S5
    the epsilon-delta line; S6 parallelepiped + curtain thumbnail ''6 x 10⁹ m³/s''; S7 p x (q x s) = q(p·s) - s(p·q) with
    the two quarter turns and the centrifugal slice thumbnails.'
  voiceover: 'To sum up, epsilon i j k is plus one when i, j, k come in the order one, two, three or that order shifted round,
    minus one when the order is reversed, and zero when an index repeats. Shifting the indices round keeps its value, and
    swapping two of them flips its sign. With it, we can write the cross product. The i component of p cross q is epsilon
    i j k times p sub j times q sub k. Earth''s spin crossed with the wind gives the Coriolis push, at right angles to the
    right of the wind in the north, and to the left in the south. The epsilon delta relation turns two epsilons into deltas,
    and two cross products into dot products. The scalar triple product is a volume, or the air crossing a surface each second.
    And the vector triple product, p cross, q cross s, is q times p dot s, minus s times p dot q: it turns the wind twice,
    and it gives the centrifugal pull.'
