    Ω cos φ, Ω sin φ) (84 px). S7: = (0, 4.84, 5.46) x 10⁻⁵ s⁻¹.'
  voiceover: 'Now Earth''s spin. Omega is an arrow along Earth''s axis, pointing out of the North Pole. Its length is seven
    point two nine times ten to the minus five radians per second, one turn in just under a day. Radians measure angle, and
    a full turn is two pi radians. At Brest, at forty eight point four five degrees north, the axis isn''t straight up: it
    leans towards the north. So in our east, north, up basis, Omega has components zero, Omega times the cosine of phi, and
    Omega times the sine of phi, where phi is the latitude. At Brest, that''s zero, four point eight four, and five point
    four six, times ten to the minus five.'
