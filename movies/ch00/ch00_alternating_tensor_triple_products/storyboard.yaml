  voiceover: 'Now let''s meet the second special symbol, which builds the cross product. Why does weather need it? Earth spins,
    and on a spinning planet, moving air feels a push to one side. This is called the Coriolis effect, and it''s why large
    storms spin. Where it comes from is derived step by step in the Coriolis movie, later in this series. Here we''ll use
    one fact: for each kilogram of air, the push is minus two Omega cross u. Omega is Earth''s spin, and u is the wind. To
    find which way this push points, we need the cross product.'
