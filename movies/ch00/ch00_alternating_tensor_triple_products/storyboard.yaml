    = (0, 0, 14). S6-S8: q x p: the violet arrow flips down (slow 1-s ease), (0, 0, -14), ''q x p = -p x q''.'
  voiceover: Let's try easy numbers. Take p with components five, one and zero, and q with components one, three and zero.
    What's the third component of p cross q? For i equal to three, epsilon three one two gives plus five times three, and
    epsilon three two one gives minus one times one. So the third component is fifteen minus one, which is fourteen. The first
    two components are zero, so p cross q points straight up, fourteen units long. And the order matters. In q cross p, the
    same two terms appear with their signs flipped, so q cross p is minus p cross q. Turning the order round reverses the
    arrow.
