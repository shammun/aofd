  voiceover: 'Now three vectors at once. The scalar triple product is p dot, open bracket, q cross s. In index notation it''s
    epsilon i j k times p sub i, q sub j and s sub k, and it''s a single number. Here''s its picture. q cross s is an arrow
    at right angles to q and s, as long as the area of their parallelogram. Its dot product with p multiplies that area by
    p''s height above the parallelogram. A base area times a height is a volume. So the scalar triple product is the volume
    of the slanted box whose edges are p, q and s, called a parallelepiped. Its sign tells us whether the three edges are
    arranged like east, north and up: plus for that order, and minus for its mirror image.'
