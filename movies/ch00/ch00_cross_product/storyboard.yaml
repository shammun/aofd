  voiceover: 'Why would anyone want the part across? Because only that part can turn things, as the door already told us.
    Imagine turning a bolt with a spanner. Draw an arrow, r, from the bolt to your hand, zero point three metres long, and
    an arrow, F, for your push of fifty newtons. The part of the push along the spanner just pulls on the bolt, and only
    the part across turns it. This turning effect is called torque, written tau, and tau equals r cross F. Push at a right
    angle, and all fifty newtons are across: zero point three times fifty is fifteen newton metres. Push at thirty degrees,
    and the part along is about forty three newtons, while the part across is fifty times sine thirty, twenty five newtons.
    The torque drops to seven point five newton metres. Push along the spanner, and nothing is across, so the bolt doesn''t
    turn.'
