    x, along y and along z: its three components. For the x component, we leave out the x parts and use only the y and z
    parts. We take the y part of vector a times the z part of b, and subtract the z part of vector a times the y part of
    b. The y component leaves out the y parts and uses z and x. The z component leaves out the z parts and uses x and y.
