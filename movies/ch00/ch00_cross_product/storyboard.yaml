  visual: '''To sum up'' (house §2 row 6): one mini picture per sentence across the full width — the violet arrow on the floor, the parallelogram with its
    across bar and the spanner, the right hand with ''anticlockwise from the tip'', the three walls x ← (y, z), y ← (z, x), z ← (x, y) with + / − arcs,
    the zero / largest pair and the flip, the along / across triangle, the torque / L / qv × B tiles with the flat energy bar, and on the last sentence
    a faint globe with one wind arrow curving right.'
  voiceover: 'To sum up, the cross product of two arrows is another arrow, at right angles to both. Its length is the first arrow''s length times the part
    of the second arrow across it: the area of their parallelogram, and the size of a torque. Its direction is the axis of the turn, and seen from its tip,
    the turn is anticlockwise. Each component is the turning about its own axis, made by the two parts across that axis, with a minus sign because those
    two parts turn opposite ways. It''s zero when the two arrows lie along one line, largest at right angles, and swapping the order flips it. The dot product
    uses the part along, and the cross product the part across. Physics uses it for torque, angular momentum and the push on a moving charge, and a push
    always at a right angle turns a motion without speeding it up. The next video puts the cross product to work on our spinning Earth, to explain why the
    wind turns and why storms spin.'
  on_screen_eq: null
