- id: s55_triangle_fan
  t:
  - 1791.85
  - 1871.4
  status: new
  changes: []
  related:
  - '#8 curl and Stokes'
  visual: 'Equal-area map (LAEA centred on the low, F2); 110 points on the 968 loop; arrows from the centre to each point
    appear in a sweep; each thin triangle fills violet (+, anticlockwise) or rose hatched (−, where the loop bends back);
    running total ''≈ 270 000 km²'' counts up; the UK outline (same scale) slides beside it. S9: the order reverses and
    the total reads ''−270 000 km²''. Shoelace sum in the maths zone.'
  voiceover: Here's the trick. Put points all the way round the isobar, and draw an arrow from the centre of the low to
    each one. Two neighbouring arrows make a thin triangle. A triangle is half of the parallelogram the two arrows make,
    so its area is half the length of their cross product. Going round the loop anticlockwise, each cross product points
    up, so we can simply add up their z components. Where the loop bends back on itself, a cross product points down, and
    it takes away the area we counted twice. We do this on a map that keeps areas true, with distances in kilometres. Adding
    up a hundred and ten triangles gives about two hundred and seventy thousand square kilometres. That's a little more
    than the whole area of the United Kingdom, inside just one isobar. Going round clockwise instead flips every cross product,
    and the sum comes out negative, with the same size. This sum is called the shoelace formula, and computers use it to
    measure the area of any shape on a map. A sum like this, taken all the way round a loop, comes back in the curl video,
    where it measures how strongly the wind circulates.
  on_screen_eq:
    latex: A=\tfrac12\sum_k(\mathbf r_k\times\mathbf r_{k+1})_z
    vallis_eq: 'provenance only: shoelace formula'
    page_png: null
  physics_source:
