- id: I1
  fn: fluidpy.diag.trajectories.advect_on_sphere(u, v, lat, lon, seeds_lat, seeds_lon, dt, nsteps, a=EARTH_RADIUS)
  why: streaklines on the globe from P1/P2/P3 winds (every moving thing must trace to a tested function)
  spec: 'RK4 on the sphere (dλ/dt = u/(a cos ϑ), dϑ/dt = v/a, Vallis (2.28) kinematics), bilinear interpolation, periodic in longitude, pole guard; returns
    [N, nsteps+1, 2]. Tests: V1 solid-body rotation field gives closed circles of the right period; V3 RK4 order 4; V7 zero field -> fixed points.'
- id: I2
  fn: fluidpy.diag.cyclone.storm_centre(msl, lat, lon, box) and storm_relative_wind(u, v, lat, lon, centre, radii_km, n_az)
  why: s35-s38 centre, tangential/radial wind and the cross-product spin sign on rings
  spec: 'centre = MSLP minimum with a quadratic sub-grid refinement; rings on the local tangent plane; tangential = k·(r̂ × u) via fluidpy.geo.vectors.cross,
    radial = r̂·u via dot; inflow angle = atan2(−radial, tangential). Tests: V1 Rankine vortex (tangential exact, radial 0), V7 hemisphere mirror flips
    the sign, V1 Gaussian low centre recovered to < 0.1 grid.'
  fallback: builder-local code calling fluidpy.geo.vectors.cross/dot (tested) with CHECK rows
- id: I3
  fn: fluidpy.geo.atmos.geostrophic_wind_from_pressure(p, lat, lon, rho0=1.2, Omega=OMEGA, a=EARTH_RADIUS, lat_min=5.0)
  why: 'optional now: s45 uses the 850 hPa heights with the existing geostrophic_wind_from_height; I3 serves only the 10 m friction angle in s46 (Vallis
    (2.198) spherical form)'
  spec: 'thin wrapper: geostrophic_wind_from_height(p / (rho0 g0), lat, lon, g0=g0, ...). Tests: V1 equals the height route; V7 anticlockwise round a NH
    low, clockwise SH.'
  fallback: call geostrophic_wind_from_height with Z = msl / (ρ₀ g₀) directly (recorded, CHECK row)
- id: I4
  fn: fluidpy.geo.frames.rotating_frame_path(t, x0, y0, u0, v0, Omega, centrifugal=True)
  why: 's27a: the rider''s equation (Vallis (2.12)) integrated on its own, to be compared with the closed-form turntable_puck (two independent routes)'
  spec: 'integrate du/dt = −2Ω × u − Ω × (Ω × r) (flat table, Ω = Ω ẑ) with scipy solve_ivp DOP853 rtol 1e-11; returns dict(t, x, y, u, v). Docstring: Vallis
    §2.1, Eq. (2.12); Kundu §4.7. Tests: V1 equals turntable_puck(launch=''rotating'') to 1e-8 m; V4 Jacobi integral conserved; V7 Ω → 0 straight line;
    centrifugal=False gives the f-plane inertial circle of inertial_oscillation with f = 2Ω.'
  fallback: builder-local solve_ivp with the same CHECK row (the comparison already exists as tests/geo/test_frames.py::test_turntable_puck_V1_matches_rotating_frame_ode)
honesty_notes:
- A cross product is drawn as a violet arrow at right angles to both inputs; the right hand is always a RIGHT hand; every direction is checked by data/rhr.json.
- 'Display scales: a × b, p × q at 0.25 of their length; Ω, k, τ, L, pushes on their own scales; every value that matters is written with its components
  (UV2-08) or spoken.'
- 'The ''why'' section (s09a, s18a-s22e) is exact: the z recipe equals the signed area (box proof, valid as drawn for a₁ > b₁, b₂ > a₂, the letters identity
  checked symbolically); |a × b| = |a| × the part of b perpendicular to a; sliding b along a leaves a × b unchanged; the arrow is the normal to the plane
  (a label, not a location of the area).'
- v = Ω × r is derived (speed Ω |r| sin θ = Ω × distance from the axis; direction east, right-hand rule) and checked with the recipe at 45°N (0, 329, 0)
  m/s; equator 465 m/s; pole 0.
- '−2Ω × u is derived on a merry-go-round: velocity seen from outside = u + Ω × r; the arrow u carried round gives Ω × u; the floor velocity under the moving
  ball changes by Ω × u; Newton''s law in the outside frame; the minus from moving the terms to the rider''s side; the centrifugal term Ω × (Ω × r) is said
  to be absorbed into gravity on Earth (Vallis §2.1). A computer check compares the closed-form path with the integrated rider''s equation (gap ≈ 3e-11
  m).'
- On Earth Ω = (0, Ω cos φ, Ω sin φ) in (east, north, up); for a flat wind the horizontal part of −2Ω × u is −2Ω sin φ k × u = −f k × u; the vertical part
  2Ω cos φ u (≈ 1e-3 m/s² for 10 m/s at 45°) is dropped against g (said), which is the traditional approximation for flat winds.
- f = 2Ω sin φ, φ latitude (Vallis writes ϑ; provenance only); f < 0 in the SH; f = 0 at the equator; f(45°) = 1.03e-4 s⁻¹.
- 'Ω uses the sidereal day (23 h 56 min): 7.29e-5 rad/s.'
- The 17-hour circle and the globe loops are thought experiments ('with nothing else pushing them'); the loops start over land (SW France, Patagonia) so
  the viewer sees geography; over land friction would damp such motion (storyboard note, not narrated).
- 'Trade winds: NH air heading south turned right → towards the west (north-easterlies); SH heading north turned left → west (south-easterlies); the data
  CHECK both u < 0 and the equatorward v at 15°N/S over the Atlantic and Pacific. Westerlies: poleward air turned east in both hemispheres; the narration
  calls it a simple picture shaped also by pressure patterns and friction.'
- Hurricane strengths only from IBTrACS (observed best tracks); no parametric vortex; satellite images draped as data.
- No references, book or author names, equation numbers, URLs or badges on screen; credits in this file and manifest.json only.
- 'Part 1 of the v5 split: every content scene identical to cross product v5; only s00/s01 wording (no weather promise) and the new s50_recap / s51_end
  differ.'
quiz_hook: 'An arm r = (0, 0.3, 0) m and a push F = (0, 0, 20) N. Which component of the torque is not zero, and which way does it point? ((r × F)_x = r_y
  F_z − r_z F_y = 0.3 × 20 − 0 = 6 N m along +x: anticlockwise seen from the tip of x hat.)'
