  visual: 'Picture zone: the s18b split of b kept; it becomes a right triangle: along leg teal (labelled ''along · dot'',
    ''|b| cos θ''), across leg orange (''across · cross'', ''|b| sin θ''), hypotenuse b (''|b|''). Both legs scale by |a|
    into two bars: teal ''a · b = 8'', violet ''|a × b| = 14''. A sin² + cos² bar under the triangle stays full while θ
    sweeps (S4). Maths zone CalcStack: (a · b)² + |a × b|² = |a|² |b|²; 8² + 14² = 64 + 196 = 260; 26 × 10 = 260.'
  voiceover: 'The two products share b between them. The part along is the length of b times cos theta, and the part across
    is the length of b times sine theta. They are the two short sides of a right triangle, whose long side is b itself.
    Multiply both sides by the length of vector a too. Then Pythagoras gives a neat rule: a dot b squared, plus the length
    of a cross b squared, equals the two lengths squared, multiplied. With our numbers, eight squared is sixty four, and
    fourteen squared is one hundred and ninety six, which add up to two hundred and sixty. That''s twenty six times ten,
    the two lengths squared. So the dot product uses the part along, the cross product uses the part across, and together
    they use all of b.'
  on_screen_eq:
