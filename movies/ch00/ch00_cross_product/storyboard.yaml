    S6: keywords 'largest at right angles' and 'an arrow along an axis' (54 px) on their words.
    S7: 'a × b' (T.hero 128 px) replaces them, the × violet.

    CHANGES FOR THIS MOVIE: sign dial: the push arrow sweeps 360° round the wind (3 s, on 'sweep … all the way round'); the background half-planes are tinted (front teal 15 %, behind rose 15 % with hatch, the across line slate 'zero'); live 'u·F' readout with its sign glyph; the left and right halves of the dial get mirror 'L' / 'R' tags that light together on 'exactly the same'.
  voiceover: 'There''s a second problem. Suppose the wind blows north, and something pushes it sideways, to the east or
    to the west. Both pushes are at right angles to the wind, so both dot products are zero. Let''s sweep the push all the
    way round the wind. The dot product is positive in the whole front half, zero on the line straight across, and negative
    behind, but it''s exactly the same on the left as on the right. The dot product can''t tell a push to the right from
    a push to the left. A turning also has an axis: the door swings around the line of its hinge. So we need a new product,
    one that''s largest at right angles, and that gives an arrow along an axis. That''s the cross product.'
  on_screen_eq: null
  physics_source:
    fn: fluidpy.geo.vectors.dot
    params:
      u:
      - 0
      - 3
      push_east:
      - 1
      - 0
      push_west:
      - -1
