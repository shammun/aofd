  voiceover: 'Why does a push at right angles change only the direction? Let''s try it with numbers. An air parcel moves east at ten metres per second.
    One sideways kick adds one metre per second towards the north. By Pythagoras, its new speed is the square root of ten squared plus one squared, about
    ten point zero five. [beat] It has turned by almost six degrees, and sped up a little. Now split that kick into ten kicks, each a tenth as big, and
    each at a right angle to the new direction. It turns by almost the same angle, but its speed only grows to about ten point zero zero five. [beat] With
    a hundred kicks, it''s ten point zero zero zero five. [beat] So a push that acts all the time, always at a right angle, doesn''t change the speed at
    all: it just bends the path into a circle. The push dot the velocity is zero, so the push does no work.'
