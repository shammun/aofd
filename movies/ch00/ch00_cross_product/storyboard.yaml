  voiceover: Why is the right side usually hit hardest? In the Northern Hemisphere, a hurricane's winds circle its centre
    anticlockwise, seen from above. On the right of the track, those winds blow the same way the storm is moving, so the
    two speeds add up. On the left, they blow against the storm's motion, and partly cancel. For Ian, the right side also
    had winds blowing from the sea onto the land, piling the water up against the coast. At Fort Myers Beach, the sea rose
    about three to four and a half metres above the ground. On the left side, the winds blew from the land out to sea, and
    they pushed water out of Tampa Bay, so its level dropped far below normal. The left side still gets strong winds and
    heavy rain, so it's only safer, never safe. We'll see why storms spin this way in the next video, and much more about
    storms like Ian in the video on tropical cyclones.
