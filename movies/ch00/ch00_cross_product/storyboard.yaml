  voiceover: Now let's keep one arrow fixed and change only the other. The fixed arrow, p, has components three, zero and zero. First, q points the same
    way, with components two, zero and zero. The parallelogram is squashed flat, so p cross q is zero. [beat] Next, q is at a right angle to p, with components
    zero, two and zero. The parallelogram is a three by two rectangle, and p cross q points straight up, six units long. [beat] Last, q points the opposite
    way, with components minus two, zero and zero. The parallelogram is flat again, so the cross product is zero. [beat] So the cross product is zero when
    two vectors point the same way or in opposite directions, and as long as it can be at right angles. That's the opposite of the dot product, which is
    zero at a right angle, and largest when the arrows point the same way. And if q keeps turning past the opposite direction, the turn from p to q becomes
    clockwise, and the arrow flips to point down.
