    CHANGES FOR THIS MOVIE: NEW S2-S4: the hand slides from the handle (r = 0.9 m) to near the hinge (0.2 m) while a 'push needed' bar (orange, picture zone bottom) grows ×4.5; keywords 'far · easy' / 'near · hard' on their words. R3-S3: the right-angle tick between r and F is a child of the door group (it swings with the door) and fades with the swing; the door swings 50° over 20 frames and eases back over 18 frames (0.6 s) only after S7 starts — no snap. R3-S1 (01:09-01:14.5): the maths zone shows 'r', 'F' keywords from S3 so the right half is never empty.
  voiceover: But a number can't describe everything. Imagine pushing a door open. Push near the handle, far from the hinge,
    and it swings open easily. Push close to the hinge, and you need a much bigger push to turn it just as fast. So turning
    depends on how far from the hinge you push, and on which way you push. Draw one arrow from the hinge to your hand, along
    the door. Then draw a second arrow for your push. When you push at a right angle to the door, the dot product of these
    two arrows is zero. Yet the door turns the most. When you push along the door, straight towards the hinge, the dot product
    is as large as it can be. Yet the door doesn't turn at all. So for turning, the dot product gets things backwards.
