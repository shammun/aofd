    S6: '|b| = √(1² + 3²) = √10 ≈ 3.162' (orange), bracket on b, link.
    S7: 'cos θ = 8 / (5.099 × 3.162) ≈ 0.496' (the 8 slate, keyword 'a·b' under it).
    S8: 'θ ≈ 60.3°,  sin θ ≈ 0.868'; the θ arc pulses.
