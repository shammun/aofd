    S3: F splits into F_y (orange, 30 N, up) and F_x (orange dashed, 10 N, right) at the hand; r splits into its x part (0.2 m, along the floor axis) and
    y part (0.1 m). S4: F_y alone with the x arm bracketed -> curved violet arrow anticlockwise + ''+0.2 × 30 = +6''. S5: F_x alone with the y arm bracketed
    -> curved rose (hatched) arrow clockwise + ''−0.1 × 10 = −1''. S6: the two curved arrows meet, the smaller cancels part of the larger. Maths zone CalcStack:
    τ_z = r_x F_y − r_y F_x; = 0.2 × 30 − 0.1 × 10; = 6 − 1 = 5 N m. Gold links from each bracketed arm to its term. Every number spoken as it appears.'
  voiceover: 'Torque also explains the minus sign in the recipe. Let''s lay a spanner flat on the floor, with the bolt at the centre. Its arm, r, reaches
    point two metres along x and point one along y, and the push, F, has ten newtons along x and thirty along y. Split the push into its two parts. The
    thirty newtons along y push across the x part of the arm, point two metres. On their own, they turn the spanner anticlockwise, seen from above, with
    a torque of point two times thirty, which is six newton metres. [beat] The ten newtons along x push across the y part of the arm, point one metres.
    On their own, they turn the spanner the other way, clockwise, with a torque of point one times ten, which is one. [beat] The two little torques fight
    each other, so we subtract: six minus one is five newton metres. [beat] That''s the z recipe: the x part of r times the y part of F, minus the y part
    of r times the x part of F. The minus sign is there because the two parts turn the spanner in opposite directions.'
