    in the maths zone (S3). S6 (review-2 S6 kept): p label above-left of the ball, L clear of ''kg''.'
  voiceover: 'Nature uses this arrow in many places. First, a ball whirled round on a string. Let r be the arrow from the centre to the ball, half a metre
    long. The second arrow is the ball''s momentum, p: its mass times its velocity. A two kilogram ball moving at three metres per second has a momentum
    of six. [beat] Then r cross p is called the angular momentum: how much spin the ball carries, and about which axis. Here it''s zero point five times
    six, which is three, pointing straight up, because the ball goes round anticlockwise, seen from above. [beat] The string pulls along r, so it has no
    part across r, and it can''t change the spin.'
