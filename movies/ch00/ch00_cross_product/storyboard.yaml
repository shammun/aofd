  voiceover: 'To sum up, the cross product of two arrows is another arrow, at right angles to both. Each component leaves
    out its own direction and uses the other two, following the cycle x, y, z, with a minus sign because the two parts turn
    opposite ways. Its length is the first arrow''s length times the part of the second arrow across it: the area of their
    parallelogram, and the size of a torque. The dot product uses the part along, and the cross product uses the part across.
    Its direction is the axis of the turn, and seen from its tip, the turn is anticlockwise. It''s zero when the two arrows
    lie along one line, and largest at right angles. Swapping the order flips the arrow. On weather maps, its sign tells
    which side of a storm''s track a town is on. Adding up its triangles measures the area inside an isobar. And the normal
    of a hillside, dotted with the sun''s direction, tells how much sunshine it gets. The next video shows how physics uses
    the cross product, from a spinning wheel to the push that makes storms spin.'
