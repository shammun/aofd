    scene: s07
    what: component terms of a × b
    fields:
      component_terms:
      - - 0
        - 0
      - - 0
        - 0
      - - 15
        - 1
      a_cross_b:
      - 0
      - 0
      - 14
    check: equals cross(a, b) and np.cross
  - id: N2
    scene: s08
    what: display product with rounded factors
    fields:
      display_sin_factors:
      - 5.099
      - 3.162
      - 0.868
