  voiceover: 'Now let''s look at how the angle between the two arrows plays a role. The dot product used the two lengths times the cosine of theta. The
    length of the cross product uses the sine instead: the length of vector a times the length of b, times sine theta. Let''s check it. By Pythagoras, the
    length of vector a is the square root of five squared plus one squared, the square root of twenty six, about five point one. [beat] The length of b
