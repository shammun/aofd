    check: Ω = 2π / 86164.1 s; |Ω × r| = 464.58 / 328.51 / 0 m/s; f(45°) = 1.0313e-4; Ω·k = Ω sin φ at 45°, 0°, −45°; |−f k × u| = 1.0313e-3; inertial period
