- id: s47_recap
  t: [1906.45, 1980.4]
  sentence_times: [[1906.45, 1912.6], [1912.95, 1918.625], [1918.975, 1921.45], [1921.8, 1927.3], [1927.65, 1932.6], [1932.95, 1937.875], [1938.225, 1941.575], [1941.925, 1944.35], [1944.7, 1949.0], [1949.35, 1957.05], [1957.4, 1959.525], [1959.875, 1967.35], [1967.7, 1974.55], [1974.9, 1979.6]]
  visual: |
    Full width, no panels, no heading, no 'RECAP' band; one beat per sentence, each replaces the previous (mini picture
    left x 120-760, keywords/maths right at 68/54 px):
    S1: mini 3-D a, b, violet a × b + right-angle ticks; 'a × b ⟂ a, b'.
    S2-S3: the component table with gold diagonals; 'a × b = (a₂b₃ − a₃b₂, a₃b₁ − a₁b₃, a₁b₂ − a₂b₁)'.
    S4: the violet parallelogram; '|a × b| = |a| |b| sin θ = area'.
    S5: the right hand (curl grip) + 'a × b = −b × a'.
    S6-S7: three mini p, q pictures with '0' / 'longest' / '0'.
    S8: spanner mini 'τ = r × F'.
    S9: map mini, 'k × u' quarter-turn arc left.
    S10-S11: Ian | Idai thumbnails with '−f k × u', 'north: right' 'south: left'.
    S12: the storm map mini with violet arrows, 'u = (1/(fρ)) k × ∇p'.
    S13-S14: three faint thumbnails in a row (spinning globe, weather map with H/L, ∇ glyphs) - the later videos, no text
    beyond 'later videos' (54 px).
  voiceover: "To sum up, the cross product of two arrows is another arrow, at right angles to both. Each component leaves out its own direction, and cross multiplies the other two. There's a minus sign between them. Its length is the two lengths times sine theta: the area of their parallelogram. The right-hand rule gives its direction, and swapping the order flips it. When the arrows point the same way or in opposite directions, it's zero. At right angles, it's as long as it can be. In physics, it gives torque. In weather, k cross turns the wind a quarter turn to the left. The Coriolis effect, minus f k cross u, turns moving air to the right in the north and to the left in the south. That's why storms spin. And the geostrophic wind, one over f rho times k cross grad p, blows along the isobars. Later videos in this series show where the Coriolis effect comes from, and how to read weather maps. They also show how grad, div and curl are built from these products."
  on_screen_eq:
    latex: '|\mathbf a\times\mathbf b| = |\mathbf a|\,|\mathbf b|\sin\theta'
    vallis_eq: 'provenance only: as s08'
    page_png: ../Fluid Dynamics/chapters/pages/ch02/p079.png
  on_screen_eq_extra:
