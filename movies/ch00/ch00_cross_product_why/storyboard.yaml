composition_changes:
  new_file: movies/src/ch00/CrossProductWhy.tsx (scene scaffolding copied from DotProductWhy.tsx - Scene, SS/SE/AT, fin/fout, FPH clock, InlineTeX, SCENES + Sequence + XF, one Audio of narration_music.wav)
  palette:
  - 'ADD C.rot = #a58be0 (violet) to house/kit/type.ts: the result of a cross product and rotation (a × b, p × q, τ, Ω, k, geostrophic arrows). Check contrast >= 4.5:1 on #171f33 and deuteranopia separation from C.first teal in the QA contact sheet; colour never alone (tip labels).'
  reuse:
  - 'house/kit: T, SAFE, ZONE, C, floor, Svg, Arrow, Lbl, Grid, Band, Dash, RightTick, Bracket, Arc, Strike, mkP, pulse, TeX, Layered, CalcStack, Keyword, TipLabel, placeLabels, CurvedLink, RiseText, TitleGradient, ClockGlyph, Check, Notebook'
  - 'DotProductWhy.tsx: PairBase (the 2-D pair plane), the GM map code (mini isotherm map in s02; strip map style in s39-s44), MapCamera, the s05 three-panel layout, the end card'
  - 'house/Globe.tsx (lonlatToXYZ, graticule) as the base of Globe3D'
  add:
  - name: Scene3D
    spec: 'a ThreeCanvas wrapper for vector scenes: Z-up world, camera from CamPath3D, ambient 0.55 + one directional key light (az 135°, el 50°, 0.9), no shadows, antialias, transparent background over C.bg; exposes project(v3) -> screen px for overlays (same camera maths, deterministic).'
  - name: CamPath3D
    spec: 'keyframes [{f | at: S<k> | AT(k, j, words), az, el, dist, target, fov=35, up?, projection?: perspective|orthographic, orbit?: +360}] -> camera per frame; easeInOutCubic between keys; azimuth the short way unless orbit is set (then linear); el may be negative (from below) with an explicit up; orthographic keys interpolate via a 20-frame cross-fade, not a projection morph.'
  - name: Arrow3D
    spec: 'cylinder shaft + cone head between two 3-D points; shaft radius and head size chosen per scene so the drawn width is about 10 px (results 14 px) and the head about 40 px at the scene''s camera distance (computed from the camera, so a zoom keeps the house stroke); colour role; dashed variant (segmented shaft) with a rose "−" glyph overlay for negative results; grow(t) 0..1.'
  - name: Axes3D
    spec: 'x, y, z lines (muted 4 px) with tick marks at integers, letter labels and optional words (east/north/up) as Label3D; unit vectors x̂ ŷ ẑ as Arrow3D (ink) with role colouring per beat (first teal, second orange, result violet).'
  - name: Label3D
    spec: 'HTML/SVG overlay text anchored at a 3-D point (project()), >= 44 px (floor() guard), placed with placeLabels against the projected arrow segments; hidden when the anchor is behind the camera.'
  - name: Floor3D
    spec: 'the pair-plane grid (x -1..6, y -1..4) as a plane mesh with grid lines; opacity prop (s17 translucent 25 %); when el = 90° and the camera matches mkP(240, 620, 135) the projected grid equals the SVG PairBase to within 1 px (handover frames in s02, s05, s09, s10).'
  - name: Parallelogram3D
    spec: 'two edge vectors -> a filled quad (C.rot at 18 %) with 3-px edges; corners from data.'
  - name: Hand3D
    spec: 'procedural RIGHT hand (no external model): palm = rounded box; four fingers x 3 capsules (phalanges), thumb x 2 capsules + a metacarpal; skin = warm white C.key (MeshStandardMaterial, roughness 0.7) with a 2-px muted inverted-hull outline. Props: basis {fingers: unit vector, thumb: unit vector} (palm normal = thumb × fingers; the builder checks det = +1 and the component throws on a left-handed basis; NEVER a negative scale), grip: "open" | "curl" | "flat", curl 0..1 (MCP/PIP/DIP angles 0 -> 70/90/60° in the fingers-b plane), per-finger glow colour, scale. Pose changes interpolate the basis by quaternion slerp over the given frames. Used in s11, s12, s14-s16 (mini 120-px silhouettes in s16), s21, s24, s38, s47.'
  - name: BottleCap3D
    spec: 'LatheGeometry bottle (muted, 30 % transparent) + a knurled cap (CylinderGeometry with 48 ridges); props angle(t) [rad, + = anticlockwise seen from above], lift = pitch x angle / 2π (pitch 0.08 display, x4 a real thread), rim marks in C.first / C.second at given directions.'
  - name: Screw3D
    spec: 'shaft cylinder + RIGHT-HANDED helical thread (TubeGeometry along (r cos t, r sin t, p t / 2π)), slotted head; props angle(t), advance = p x angle / 2π along the axis; a muted block it screws into (clipped). The builder checks the helix is right-handed (triple_scalar of r, r'', z > 0).'
  - name: Door3D
    spec: 'a slab hinged on a vertical gold-dashed line, swing angle(t) about the hinge (+ = anticlockwise from above), hand point at 0.9 of the width; floor swing guide.'
  - name: Spanner3D
    spec: 'open-ended spanner (extruded 2-D outline) on a hex bolt + plate; spanner angle(t) about the bolt axis, bolt sink = pitch x angle / 2π (exaggerated x3).'
  - name: Globe3D
    spec: 'extends house/Globe: unit sphere with the P5 Blue Marble texture (MeshBasicMaterial, no lighting terminator), Natural Earth coastlines at r = 1.001 (warm white 40 %), graticule 30° (muted 25 %), equator line, spin angle(t) [rad] about the polar axis, axial tilt prop, optional quarter cut-away (0-90°E wedge, cut faces muted), surface arrows (GlobeArrow3D) and tracks (lat/lon polylines at r = 1.004); camera by GlobeCam keyframes {lat, lon, dist, fov, lookAt: centre | surface point}. Texture loaded with delayRender/continueRender.'
  - name: GlobeArrow3D
    spec: 'a great-circle-curved arrow hugging the sphere (r = 1.006) from (lat, lon) along an initial azimuth for a given arc length, with a bend(t) parameter that rotates the second half by a given angle (the illustrative "turned right/left" arrows in s33, s34, s36, s37); dashed when illustrative.'
  - name: WindTrails3D
    spec: 'streaklines of a real wind field from precomputed Float32 trails [N x L x 2 (lat, lon)] + per-seed phase offsets: at frame n each seed shows samples (n + phase) mod L back 12 samples as a fading line (warm white, alpha 0.35 -> 0.95 by the speed stored per sample); regional mode for P2/P3 (lat/lon box) and global mode for P1; brighten(mask) by latitude band; deterministic (no RNG at render). Rendered with one LineSegments geometry updated per frame from the bin (BufferAttribute.needsUpdate).'
  - name: IsobarLayer
    spec: 'contour polylines of msl every 4 hPa precomputed by the builder (skimage.measure.find_contours on P2/P3/P4) drawn on the globe (r = 1.003) or the flat map panel; no values written.'
  - name: TitleCross3D
    spec: 'the s00 animation: Part A small Scene3D with p, swept q, Parallelogram3D and the live p × q readout from sweep.json; Part B a mini Globe3D with one GlobeArrow3D following paths.json -> nh_track; props {splitFrame, endFrame}.'
  - name: CircleDotCross
    spec: '⊙ and ⊗ glyphs (SVG) at 96 px with an optional arrow-tip / tail-feathers mini animation (scale in/out over 20 frames).'
  equations_gate: 'every latex string of this file (on_screen_eq and on_screen_eq_extra) appears verbatim (whitespace-squashed) in CrossProductWhy.tsx as a String.raw constant; CalcStack rows are assembled from those constants'
