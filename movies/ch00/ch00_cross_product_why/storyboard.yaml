    outline through the axis, gold axis, violet Ω at the top.

    LEFT ''round Earth'' (keyword under it): a circle; at 45°N brown g* to the centre, the slate centrifugal arrow (×100), their sum g. RIGHT ''real Earth''
    (keyword under it): an ellipse with the flattening exaggerated ×50 (axis ratio 0.83), at 45° the sum g exactly at right angles to the surface (gold
    right-angle tick).

    S1: both outlines; keyword ''its direction'' (54 px) in the maths zone.

    S2: left panel: g* and the slate arrow build.

    S3: their sum g leans; its part along the ground appears as a short rose arrow towards the equator, label ''sideways part''.

    S4: on_screen_eq (68 px) with a gold link from the rose arrow.

    S5: on_screen_eq_extra 1 (68 px, violet ''Coriolis''); [beat].

    S6: ''> 10 ×'' (68 px, gold); on the left panel a thin blue water layer slides towards the equator and thickens there (6 s, schematic); keyword ''oceans
    pile up at the equator''.

    S7: the right panel lights; its bulge highlighted gold; keyword ''flattened · bulge''.

    S8: the sea surface on the right drawn as a thin blue rim; the right-angle tick between g and the surface pulses; keyword ''level: g ⟂ sea surface''.

    S9: ''up = against g'' (54 px) with a short warm-white arrow opposite g at the pin; ''no sideways part'' (54 px).

    S10: keyword ''in gravity'' (the v4 s27 keyword, kept) and ''g = g* − Ω × (Ω × r)'' (68 px) with the slate term dimming inside g.'
  voiceover: 'Effective gravity has one more surprise: its direction. On a perfectly round Earth, g star would point to the centre, but the centrifugal
    part points away from the axis. So their sum would lean slightly towards the equator, with a part along the ground. At forty five degrees, that sideways
    part would be about zero point zero one seven metres per second squared. A wind of ten metres per second gets a Coriolis push of at most two Omega times
    ten, about zero point zero zero one five. [beat] So on a round Earth, the sideways pull would be more than ten times stronger than the Coriolis push,
    and the oceans would flow towards the equator and pile up there. In fact, over its long history, Earth''s rock and water have settled into a slightly
    flattened shape, with a bulge at the equator. On that shape, the sea surface is level: effective gravity points straight down into it, with no sideways
    part. So in weather equations, up means straight against g, and g never pushes the wind sideways. On Earth, the slight bulge at the equator balances
    the centrifugal effect, so it''s already part of gravity, and we can leave it out.'
