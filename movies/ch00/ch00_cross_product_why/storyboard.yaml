  voiceover: 'Now the same steps as maths, one at a time. The two pushes add up to zero: minus f k cross u, minus one over rho grad p, equals zero. Move
    the pressure push to the other side: minus f k cross u equals one over rho grad p. To get the wind itself, we apply k cross to both sides. On the left,
    we get k cross k cross u. Turning the wind twice to the left points it backwards, so that''s minus u. The two minus signs cancel, and the left side
    becomes f times u. Dividing by f, we get the geostrophic wind: u equals one over f rho, times k cross grad p.'
