  voiceover: 'There''s a second problem. Suppose the wind blows north, and something pushes it sideways, to the east or to
    the west. Both pushes are at right angles to the wind, so both dot products are zero. The dot product can''t tell a push
    to the right from a push to the left. A turning also has an axis: the door swings around the line of its hinge. So we
    need a new product, one that''s largest at right angles, and that gives an arrow along an axis. That''s the cross product.'
