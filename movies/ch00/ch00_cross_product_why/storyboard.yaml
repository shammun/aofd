    check: 'shoelace areas of the six polygons sum to 10; 24 − 10 = parallelogram_area(a, b) = 14; sympy: (a1+b1)(a2+b2) − a1a2 − b1b2 − 2a2b1 − (a1b2 −
      a2b1) = 0'
  - id: N9
    scene: s18b, s18c
    what: b split along/across a; slide b + s a
    fields:
      along_len: 1.5689
      across_len: 2.7456
      slide_s: 0..2
    check: along² + across² = 10; |a| × across = 14; cross(a, b + s a)_z = 14 for all s (1e-12)
  - id: N10
