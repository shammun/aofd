    '
  voiceover: 'Two Omega sine phi has its own name: the Coriolis parameter, f. So for flat winds, the Coriolis push is minus f times k cross u. Only Earth''s
    spin about the local up direction turns flat winds sideways. At the North Pole, the ground spins about up at the full rate, like our merry-go-round.
    At the equator, there''s no spin about up at all. At forty five degrees north, f is two times seven point two nine times ten to the minus five, times
    sine forty five. That''s about one point zero three times ten to the minus four per second. [beat] South of the equator, the latitude counts as negative,
    so sine phi and f are negative too.'
