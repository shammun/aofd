  visual: 'NEW. WHY A PUSH AT RIGHT ANGLES ONLY TURNS. Picture zone: a flat SVG top view (grid, ''east'', ''north''); the maths

    zone holds the CalcStack.

    S2-S3: a teal air-parcel dot with its velocity arrow east, tip label ''u = (10, 0) m/s''.

    S4: an orange kick arrow north at the tip, label ''kick = (0, 1) m/s''; the new velocity (teal) from the parcel to the

    kick''s tip, label ''u = (10, 1) m/s''.

    S5: CalcStack ''√(10² + 1²) = √101 ≈ 10.05 m/s'' (68 px).

    S6: the angle arc ''≈ 5.7°'' (54 px) between old and new; keyword ''faster'' (small, rose) on "sped up a little".

    S7: replay with 10 kicks of 0.1 m/s, each ⟂ to the current velocity (a polygon of 10 short teal steps fanning

    round), labels ''kick = 0.1 m/s ⟂''.

    S8: ''√(100 + 10 × 0.1²) = √100.1 ≈ 10.005 m/s'', angle ''≈ 5.7°'' again.

    S9: 100 kicks: ''√100.01 ≈ 10.0005 m/s''. A tiny bar chart (3 bars, log-free, 54-px labels ''0.05'', ''0.005'',

    ''0.0005'') of the extra speed shrinks ten times per step.

    S10: the continuous case: the parcel runs round a full circle (inertial_oscillation, f > 0 sense with the push to

    the LEFT here since the kicks pointed north - the circle is anticlockwise from above), speed readout ''10.000 m/s''

    fixed; keyword ''always at a right angle → circle''.

    S11: ''push · u = 0'' (68 px) with a gold right-angle tick at the parcel; keyword ''no work''.


    V5 (from the 1aa590f split plans; review-3 items R3-S1..S4, C1-C6): an energy-of-motion bar (½|u|², teal) beside the parcel: it ticks up visibly for
    one kick, barely for ten, and stays flat for the continuous push while the path curves (from the v4 kicks data). C6: ''≈ 5.7°'' moved outside the angle,
    clear of u.'
  voiceover: 'Why does a push at right angles change only the direction? Let''s try it with numbers. An air parcel moves east at ten metres per second.
    One sideways kick adds one metre per second towards the north. By Pythagoras, its new speed is the square root of ten squared plus one squared, about
    ten point zero five. [beat] It has turned by almost six degrees, and sped up a little. Now split that kick into ten kicks, each a tenth as big, and
    each at a right angle to the new direction. It turns by almost the same angle, but its speed only grows to about ten point zero zero five. [beat] With
    a hundred kicks, it''s ten point zero zero zero five. [beat] So a push that acts all the time, always at a right angle, doesn''t change the speed at
    all: it just bends the path into a circle. The push dot the velocity is zero, so the push does no work.'
