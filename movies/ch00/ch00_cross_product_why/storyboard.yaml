  visual: 'Full width, no heading; one beat per sentence, each replaces the previous (mini picture left x 120-760, keywords

    or maths right at 68/54 px):

    S1: mini 3-D a, b, violet a × b + right-angle ticks; ''a × b ⟂ a, b''.

    S2: the component table with gold diagonals; the recipe line.

    S3: the s18b along/across split and the parallelogram; ''|a × b| = |a| × across = area''.

    S4: the plane with its normal and the hand; ''normal · right-hand rule''.

    S5: three minis in a row (spanner τ = r × F, ball L = r × p, proton F = q v × B) then the kicks polygon → circle;

    ''push ⟂ motion → turns, same speed''.

    S6: the half-Earth with v = Ω × r, then the merry-go-round with ① + ②; ''v = Ω × r'', ''−2Ω × u''.

    S7 (U-CF): the half-Earth with the slate outward arrow Ω² r⊥ at 45°N and the ×50 flattened outline; ''−Ω × (Ω × r) = Ω² r⊥ → inside g''.

    S8: −f k × u with Ian | Idai thumbnails; ''north: right · south: left''.

    S9: the two storms spin (anticlockwise | clockwise).

    S10: the Ciarán satellite map mini with violet arrows; ''u = (1/(fρ)) k × ∇p''.

    S11: three faint thumbnails (weather map with H/L, ∇ glyphs) and ''later videos'' (54 px).

    '
  voiceover: 'To sum up, the cross product of two arrows is another arrow, at right angles to both. Each component leaves out its own direction and cross
    multiplies the other two. Each component is the turning about its own axis, made by the two parts across that axis, with a minus sign because those
    two parts turn opposite ways. Its length is the first arrow''s length times the part of the second arrow across it: the area of their parallelogram.
    Its direction is the normal to their plane, and the right-hand rule says which way round. It points along the axis of the turn, and seen from its tip,
    the turn is anticlockwise. Physics uses it for torque, angular momentum and the push on a moving charge, and a push always at a right angle turns a
    motion without speeding it up. On the spinning Earth, the ground moves at Omega cross r, and moving air feels the Coriolis push, minus two Omega cross
    u. The spin also gives the centrifugal pull, Omega squared times the distance from the axis, and it''s folded into gravity, g. For flat winds, that''s
    minus f k cross u: to the right in the north, and to the left in the south. That''s why storms spin. When this push balances the pressure push, we get
    the geostrophic wind, one over f rho times k cross grad p, along the isobars. Later videos in this series show how to read weather maps, and how grad,
    div and curl are built from these products.'
