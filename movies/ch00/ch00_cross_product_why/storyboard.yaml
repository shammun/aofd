  status: new in v5
  v5: 'new: V-X6/V-X8 the y component (z and x parts, cycle order z before x) and why the determinant''s middle term looks backwards; the cyclic pattern
    for all three'
  related:
  - '#1b alternating tensor and triple products'
  visual: 'S1-S3: the spanner now lies in the z-x wall (camera from +y); arm r = (0.1, 0, 0.2) m, push F = (30, 0, 10) N; the cycle wheel x → y → z → x
    (small, top right of the maths zone) lights ''z → x''. S3: CalcStack ''(r × F)_y = r_z F_x − r_x F_z = 0.2 × 30 − 0.1 × 10 = 5'', gold anticlockwise
    arc (+6) and rose clockwise arc (−1) as in s21b. S4-S5: the picture zone fades to a 3×3 grid (no box lines, just the entries in rows: ''x̂ ŷ ẑ'' / ''r_x
    r_y r_z'' / ''F_x F_y F_z'', 68 px) with vertical bars; keyword ''determinant''. S6: the expansion builds: x̂(r_yF_z − r_zF_y) − ŷ(r_xF_z − r_zF_x)
    + ẑ(r_xF_y − r_yF_x); the middle term in gold. S7: the ''−'' and the bracket swap with an animation into ŷ(r_zF_x − r_xF_z), matching the CalcStack
    line above (gold link). S8: three rows ''x ← (y, z)'', ''y ← (z, x)'', ''z ← (x, y)'' with ''+ with the cycle'' (gold) and ''− against'' (rose).'
  voiceover: 'And the y component, the turning about y, happens in the wall made by z and x. Following the cycle, z comes before x. So the y component is
    the z part of r times the x part of F, minus the x part of r times the z part of F. With an arm of point two metres along z and point one along x, and
    a push of thirty newtons along x and ten along z, that''s point two times thirty, minus point one times ten: six minus one, five again. [beat] You''ll
    often see the recipe written as a determinant: a three by three grid, with x hat, y hat and z hat on the top row, then the parts of r, then the parts
    of F. We don''t need determinants here, only what the grid gives. Its middle term has a minus sign in front of y hat, and the pair inside looks backwards:
    the x part of r times the z part of F, minus the z part of r times the x part of F. But the minus in front swaps the two products, and that''s exactly
    our cycle order, z before x. So all three components follow one pattern: each is the turning about its own axis, made by the two parts that lie across
    that axis, with a plus for the turn that follows the cycle and a minus for the turn against it.'
  on_screen_eq:
    latex: \mathbf r\times\mathbf F=\begin{vmatrix}\hat{\mathbf x}&\hat{\mathbf y}&\hat{\mathbf z}\\ r_x&r_y&r_z\\ F_x&F_y&F_z\end{vmatrix}=\hat{\mathbf
