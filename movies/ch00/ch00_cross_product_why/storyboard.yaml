    empty: the three cycle cells (xyz, yzx, zxy) lit teal ''+1'', the three anti-cycle cells rose ''−1'' with a hatch, a repeated-letter cell flashes nothing
    (slate ''0''). For the z component two cells stay lit: ε_zxy = +1 -> 5 × 3, ε_zyx = −1 -> 1 × 1; CalcStack 15 − 1 = 14. On ''swapping two letters''
    two lit cells trade colour (no flash: 12-frame cross-fade).'
  voiceover: 'Here''s a short way to write the whole recipe, in index notation, which the index-notation video builds step by step. Let the letters i, j
    and k each stand for x, y or z. The i component of a cross b is epsilon i j k, times the j component of vector a times the k component of b, added up
    over every j and every k. Epsilon i j k is a table of signs: plus one when i, j and k follow the cycle x, y, z, minus one when they run the other way
    round, and zero when any two letters are the same. A repeated letter means a direction crossed with itself, which makes no area, so it gives zero. So
    for the z component, only two terms are left. Epsilon z x y is plus one, times five times three, and epsilon z y x is minus one, times one times one.
    [beat] That''s fifteen minus one, fourteen again. [beat] And swapping two letters flips the sign of epsilon, which is exactly why b cross a is minus
    a cross b.'
  on_screen_eq:
    latex: (\mathbf a\times\mathbf b)_i=\varepsilon_{ijk}\,a_j\,b_k
    vallis_eq: 'provenance only: Kundu (K 2.21) form; Vallis notation pages (pdf 19-20) use the same epsilon'
