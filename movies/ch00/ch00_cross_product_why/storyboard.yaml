    V5 (from the 1aa590f split plans; review-3 items R3-S1..S4, C1-C6): C1 as s28b.'
  voiceover: 'Look at the first two components. Both start with Omega sine phi, followed by minus v and small u. That''s exactly k cross u, our quarter
    turn to the left, with components minus v, small u and zero. So the flat part of Omega cross u is Omega sine phi times k cross u, from the up part of
    Omega only. The third component points up or down. For a wind of ten metres per second at forty five degrees, the push it gives is about one thousandth
    of a metre per second squared, ten thousand times weaker than gravity, so we drop it. What''s left is the sideways push: minus two Omega sine phi, times
    k cross u.'
