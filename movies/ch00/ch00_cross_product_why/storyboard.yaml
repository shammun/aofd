  visual: 'NEW. WHY AT RIGHT ANGLES: THE PLANE AND ITS NORMAL. Full-width ThreeCanvas.

    S1: the spanner of s20 returns (r, F labels as s20 at a right angle).

    S2: a translucent warm-white plane (20 %) appears through r and F, edged in gold; the bolt''s axis line (gold

    dashed) stands out of it; on "sticking straight out" a right-angle tick between the axis and the plane.

    S3: the spanner fades; the plane stays; the s18 parallelogram (a, b) drawn in the plane and a sweeping ghost of a

    across b (a copy of a sliding to b''s tip) on "sweep".

    S4: the camera orbits 60° so the plane is seen tilted; a single violet arrow grows straight out of the plane;

    keyword ''normal'' (54 px) with a pointer.

    S5: two keywords, side by side: ''length → how much'' and ''direction → which plane, which way round''.

    S6: a gold bracket along the violet arrow, linked by a CurvedLink to the parallelogram''s area label ''14''

    (the length IS the area, written ''|a × b| = 14 = area'').

    S7: the plane''s turn arc a → b (gold) reads anticlockwise from above; arrow up; then the plane flips (b → a): arc

    clockwise, arrow down (dashed, rose ''−''); keyword ''up = anticlockwise from above''.

    S8: the area is shaded flat in the plane (violet 25 %), the arrow drawn as a thin flagpole standing on the

    patch''s centre with a small flag reading ''14''; keyword ''a label for the patch''. The s18a list ticks the last item.


    V5 (from the 1aa590f split plans; review-3 items R3-S1..S4, C1-C6): C1: ''area 14'' above the a arrow, ''normal'' beside (not on) the violet arrow.'
  voiceover: 'Now, why does the answer point at right angles to both arrows? The spanner turns in one flat plane, the plane of r and F, and the bolt turns
    about an axis sticking straight out of that plane. Any turning, or sweep of one arrow across another, happens in a plane. In three dimensions, the simplest
    way to say which plane is to give the one direction straight out of it: the normal to the plane. So the cross product packs two things into one arrow.
    Its length says how much: the area, or how strongly something turns. Its direction says which plane, and which way round: up means the turn from the
    first arrow to the second is anticlockwise, seen from above. The area lies flat in the plane, and the arrow stands on it like a label, telling us how
    big the patch is and which way it faces.'
