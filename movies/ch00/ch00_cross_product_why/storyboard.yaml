  voiceover: 'We can see the centrifugal effect in three places. First, gravity is weaker at the equator. Carefully measured, it''s about nine point seven
    eight metres per second squared at the equator, and nine point eight three at the poles. The centrifugal pull explains about two thirds of that difference.
    The rest comes from the bulge itself, which puts the equator farther from Earth''s centre. Second, a plumb line, a weight hanging on a string, doesn''t
    point exactly at Earth''s centre. On a round Earth, the spin alone would tilt it by up to about a tenth of a degree, near forty five degrees latitude.
    On the real, flattened Earth, the bulge''s own pull adds about as much again, so the tilt reaches about a fifth of a degree. Third, Earth''s shape:
