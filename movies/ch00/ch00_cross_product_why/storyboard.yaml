    concepts'' (54 px); the voice says ''on the website'' (no address, no URL, no book name, no lab). 2.5-s silent hold

    after the last word while the music fades; nothing autoplays.

    '
  voiceover: "This video is one of a series of related tutorials, so watch out for the others. They're made to help students of meteorology, atmospheric science and climate science, and anyone else who wants to learn not just these ideas, but the maths behind them too. The notebook for the cross product, and the notebooks for the other concepts, are on the website that goes with this video."
