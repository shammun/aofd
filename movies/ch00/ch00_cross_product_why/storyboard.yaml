    S10: ''−k × u'' (violet dashed, rose ''−'') to the RIGHT of u, label ''(5, 0, 0)'' for the north wind, arc ''right''.

    '
  voiceover: 'Now let''s see how weather uses the cross product. Meteorologists usually write a wind that blows flat along
    the ground as u. At any place on a map, let k be the unit vector pointing straight up, out of the ground. Think of k as
    an axle standing at that place: turning on a map happens around it. Take a wind blowing east at five metres per second,
    with components five, zero and zero. With the recipe, k cross u has components zero, five and zero, so it points north:
    an arrow as long as the wind, turned a quarter turn to the left around k. For a wind blowing east, north is exactly the
    direction ninety degrees to its left. For a wind blowing north, k cross u points west, again to its left. So k cross is
    a turning tool: it turns any flat arrow a quarter turn to the left, anticlockwise seen from above. Minus k cross u turns
    it to the right.'
