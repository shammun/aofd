  voiceover: But a number can't describe everything. Imagine pushing a door open. Draw one arrow from the hinge to your hand,
    along the door. Then draw a second arrow for your push. When you push at a right angle to the door, the dot product of
    these two arrows is zero. Yet the door turns the most. When you push along the door, straight towards the hinge, the dot
    product is as large as it can be. Yet the door doesn't turn at all. So for turning, the dot product gets things backwards.
