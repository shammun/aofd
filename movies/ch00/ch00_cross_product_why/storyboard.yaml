  - 1817.025
  status: new in v5
  v5: 'new: V-X10 / orchestrator (c) when to use it and what the two arrows usually stand for'
  related: []
  visual: 'Full width, two columns of small pictures, one row per clause, no boxes: left column ''first arrow'' (teal): a lever arm r on a spanner, r from
    a storm''s centre to a parcel, Earth''s spin arrow Ω; right column ''second arrow'' (orange): a push F, a velocity / wind u, and (for Ω) the position
    r. S5: the result column (violet): ''across part × length'' and ''⊥ both: axis / side''. S6: four tiles light in turn: τ = r × F, L = r × p, F = q v
    × B, then (faint, ''next'') v = Ω × r and −2Ω × u. S7: the swap glyph ''b × a = −a × b'' in rose.'
  voiceover: 'So when do we reach for the cross product? Look at what the two arrows usually stand for. The first is normally a position or a lever arm,
    like r from a hinge, a bolt or the centre of a turn, or a spin arrow, like Earth''s spin, Omega. The second is normally a force or a velocity, like
    a push, F, a momentum, or the wind, u, and when the first is a spin arrow, the second is often a position. Use the cross product whenever you want the
    size of the part of one arrow that lies across the other, together with a direction at right angles to both: the axis of a turn, or the side towards
    which something is pushed. That''s torque, r cross F, angular momentum, r cross p, and the push on a moving charge, and soon the speed of the spinning
    ground, Omega cross r, and the Coriolis push, minus two Omega cross u. And keep the order in mind: swap the two arrows, and the answer flips.'
