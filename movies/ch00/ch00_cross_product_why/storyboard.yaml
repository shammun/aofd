  visual: 'NEW (U-CF2). ON EARTH: r SPLIT ALONG AND ACROSS THE AXIS (3-D). HalfEarth3D as s25a/s28a (face = meridian plane through 45°N, 1°E; camera az
    25°, el 15°), gold axis, violet Ω, teal r to the pin, ''r = (4505, 0, 4505) km'' at r''s tip. data-source line ''Image: NASA Blue Marble Next Generation''
    (SRC_BM) at the bottom of the picture, muted, >= 28 px.

    S1: the angle arc between Ω and r at the centre, ''45°'' (the s25 θ); keyword ''not at right angles''.

    S2: r''s two legs drawn on the face: slate dashed ''along the axis'' from the centre up the axis to the gold axis dot at 4505 km (the s25 ring centre),
    and gold ''r⊥'' from the axis dot to the pin (the s25 ring radius); labels beside the legs (54 px); keyword ''r = along + r⊥''.

    S3: ''Ω (Ω · r) = Ω² r_along'' (64 px), the slate leg pulses.

    S4: on_screen_eq_extra 1 (68 px) with the two ''along'' terms struck in rose.

    S5: the s25 ring of latitude drawn faintly round the axis; ''|r⊥| = a cos φ'' (68 px), gloss ''a: Earth''s radius'' (44 px); gold link from the ring
    radius to a cos φ.

    S6: on_screen_eq (T.eq 84, gold underline) and on_screen_eq_extra 2 (68 px); at the pin a slate arrow pointing straight away from the axis (parallel
    to r⊥), tip label ''centrifugal''.

    S7: the local ''up'' (k) and ''north'' arrows of s28a fade in at the pin (faint); a gold arc between ''up'' and the slate arrow, ''45°''; keyword ''leans
    towards the equator''.'
  voiceover: 'On Earth, r points from the centre to our place, and it isn''t at right angles to Omega. So let''s split r into two parts: one along Earth''s
    axis, and one straight out from the axis, which we call r perp, short for perpendicular. In Omega times Omega dot r, only the part along the axis counts,
    and it gives Omega squared times that part. So it cancels the same part of Omega squared times r, and what''s left is Omega squared times r perp. The
    length of r perp is our distance from the axis: the radius of our circle of latitude, Earth''s radius times cosine phi. So the centrifugal acceleration
    is Omega squared, times Earth''s radius, times cosine phi, pointing away from the axis. Notice its direction: it points away from the axis, not straight
    up, so at forty five degrees it leans towards the equator.'
