    plus up to x 1500 when the maths zone is not needed; coastlines P5).
    Display time 2023-11-02T00 UTC (before 15 UTC on 1 November the deepest low in the box is an older, different low;
    the ERA5 minimum 953.7 hPa comes at 04 UTC near 50.25°N 3.0°W - not written; the Met Office's 953.3 hPa Plymouth
    record is not used in v1). Data: data/real/ciaran_2023_sfc.{bin,json} (msl, u10, v10, 3-hourly) and
    ciaran_2023_upper.{bin,json} (z, u, v at 850 and 500 hPa, 12 UTC 1 Nov to 06 UTC 2 Nov, 6-hourly).
    S2-S3 ('This is Storm Ciarán…'): keyword 'Storm Ciarán · November 2023' (54 px); 'L' (68 px) at the MSLP minimum.
    S4 ('Here it is early on the second of November.'): keyword '2 November' (44 px).
    S5 ('The isobars are drawn every four hectopascals…'): MSLP isobars (warm white 70 %, 3 px) draw outward from the
    low; keyword 'every 4 hPa' (44 px); no isobar values written.
    S6-S7 ('Near the ground, friction disturbs the wind…'): a small side-view glyph at the map's corner: ground, a
    '≈ 1.5 km' level line (the 850 hPa surface, said as a height only), keyword 'almost no friction'.
    S8-S9 ('The violet arrows are the geostrophic wind at that height…'): violet arrows from the 850 hPa heights on a
    thinned grid (every 1.5°), SEA POINTS ONLY (land masked), length ∝ speed, no key arrow; keyword
    'u = (1/(fρ)) k × ∇p' (54 px) beside the map.
    S10-S11 ('They run along the isobars, anticlockwise…'): a gold anticlockwise arc round the low; keyword 'low on the left'.
    S12 ('Where the isobars crowd together…'): two gold brackets where the isobars are closest (sea points) and the
    longest arrows pulse.
  voiceover: "Now let's test it on a real storm. This is Storm Ciarán, a deep low that crossed the North Atlantic. It reached England and France in early November twenty twenty three. Here it is early on the second of November. The isobars are drawn every four hectopascals, and they circle the low. Near the ground, friction disturbs the wind. So let's look about one and a half kilometres up, where the air feels almost no friction. The violet arrows are the geostrophic wind at that height. We worked them out with our formula, from the pressure pattern there. They run along the isobars, anticlockwise round the low. The low is always on their left. Where the isobars crowd together, the arrows are longest."
