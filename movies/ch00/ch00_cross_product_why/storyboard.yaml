  voiceover: 'How fast does our place move? As Earth turns, it goes round its circle of latitude, whose centre is on Earth''s axis. So the circle''s radius
    is the place''s distance from the axis. Call theta the angle between the axis, Omega, and r. Then that distance is the length of r times sine theta.
    Here theta is ninety degrees minus the latitude, forty five degrees, so the radius is about four thousand five hundred and five kilometres. In one turn,
