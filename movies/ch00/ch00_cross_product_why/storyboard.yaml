    S1-S2: u east (''u = (5, 0, 0) m/s''); k × u north, keyword ''a direction: left of the wind''.

    S3: a small proton-in-a-field thumbnail (s22d) top right; an orange push arrow at the wind''s tip at a right angle,

    keyword ''push ⟂ wind''.

    S4: CONTRAST CASE: a second, dashed rose push at 30° off the perpendicular; it splits into two bands: ''across''

    (violet, turns) and ''along'' (rose, labelled ''speeds up'') - the along band grows the wind arrow a little; keyword

    ''30° off → changes speed'' with a rose strike after 1 s.

    S5: the 30° push fades; the ⟂ push stays; keyword ''only turns''.

    S6: ''push = (strength) × k × u'' (68 px), underbraces ''a number'' and ''quarter turn''.

    S7: the wind''s path drawn as a gently bending curve (a quarter of the s30 inertial circle, shown in a compressed

    time window), the push arrows ⟂ along it every few frames; NO 90° snap: a struck-out ghost of the wind arrow

    jumping 90° (rose strike) for 1 s; keyword ''bends a little at a time''.

    S8: a mini isobar sketch (3 straight isobars, ''L'' north, ''H'' south), orange ∇p arrow pointing south and its

    quarter turn left pointing east along the isobars (gold arc); keyword ''weather maps'' - the full story comes in

    s40a.

    '
  voiceover: 'Why would we want an exact quarter turn? Not to change the wind: it names the direction straight to the wind''s
    left, with the wind''s own size. We need it because Earth''s spin gives moving air a push that''s always at a right angle
    to its motion, like the magnet''s push on the proton. A push at any other angle, say thirty degrees off, would have a
    part along the wind, and would speed the air up or slow it down. The spin''s push only turns the air. So we need the wind
    turned by exactly a quarter turn, times a number for its strength. The wind itself doesn''t jump by ninety degrees: the
    push bends its path a little at a time, like our small kicks. And on weather maps, k cross turns the direction in which
    pressure rises into the direction the wind blows.'
