    S3: ''change seen outside = du/dt + Ω × u + Ω × u + Ω × (Ω × r)'' with braces under the pieces: ''rider sees'', ''①'',

    ''②'', ''③''; gloss ''du/dt: how fast u changes'' (44 px) under du/dt.

    S4: ''= real pushes'' appended on the right side; keyword ''Newton''.

    S5: next line ''du/dt = real pushes − 2Ω × u − Ω × (Ω × r)'' with the moved terms flying across the ''='' (their signs

    flip in rose).

    S6: ''−2Ω × u'' boxed by a gold underline (no box) with keyword ''Coriolis push (per kg)''.

    S7: two gold pointers: ''2'' ← ① + ② and ''−'' ← ''moved across''.

    S8: ''−Ω × (Ω × r)'' highlighted slate with keyword ''centrifugal: outwards''; a small outward arrow on the thumbnail.

    S9: a mini Earth outline exaggerated as an ellipse (''bulge''), keyword ''in gravity''; the centrifugal term struck

    (slate strike) leaving ''du/dt = real pushes − 2Ω × u'' (96 px) as the main line.

    '
  voiceover: 'Now let''s add the pieces. A push for each kilogram is just an acceleration: how much the velocity changes every
    second. The change seen from outside is the change of u that the rider sees, plus two Omega cross u, plus the leftover
    piece. Newton''s law says this equals the real pushes on each kilogram, like the pressure push. Move the extra pieces
    to the other side, and the rider sees u change by the real pushes, minus two Omega cross u, minus the leftover piece.
    So minus two Omega cross u is the Coriolis push, for each kilogram. The two comes from the two equal pieces, and the minus
    from moving them to the rider''s side. The leftover piece is the centrifugal effect, pulling outwards from the axis. On
    Earth, the slight bulge at the equator balances it, so it''s already part of gravity, and we can leave it out.'
