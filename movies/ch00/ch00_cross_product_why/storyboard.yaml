implementer_needs:
- id: I1
  fn: fluidpy.diag.trajectories.advect_on_sphere(u, v, lat, lon, seeds_lat, seeds_lon, dt, nsteps, a=EARTH_RADIUS)
  why: streaklines on the globe from P1/P2/P3 winds (every moving thing must trace to a tested function)
  spec: 'RK4 on the sphere (dλ/dt = u/(a cos ϑ), dϑ/dt = v/a, Vallis (2.28) kinematics), bilinear interpolation, periodic in longitude, pole guard; returns [N, nsteps+1, 2]. Tests: V1 solid-body rotation field gives closed circles of the right period; V3 RK4 order 4; V7 zero field -> fixed points.'
- id: I2
  fn: fluidpy.diag.cyclone.storm_centre(msl, lat, lon, box) and storm_relative_wind(u, v, lat, lon, centre, radii_km, n_az)
  why: s35-s38 centre, tangential/radial wind and the cross-product spin sign on rings
  spec: 'centre = MSLP minimum with a quadratic sub-grid refinement; rings on the local tangent plane; tangential = k·(r̂ × u) via fluidpy.geo.vectors.cross, radial = r̂·u via dot; inflow angle = atan2(−radial, tangential). Tests: V1 Rankine vortex (tangential exact, radial 0), V7 hemisphere mirror flips the sign, V1 Gaussian low centre recovered to < 0.1 grid.'
  fallback: 'builder-local code calling fluidpy.geo.vectors.cross/dot (tested) with CHECK rows'
- id: I3
  fn: fluidpy.geo.atmos.geostrophic_wind_from_pressure(p, lat, lon, rho0=1.2, Omega=OMEGA, a=EARTH_RADIUS, lat_min=5.0)
  why: 'optional now: s45 uses the 850 hPa heights with the existing geostrophic_wind_from_height; I3 serves only the 10 m friction angle in s46 (Vallis (2.198) spherical form)'
  spec: 'thin wrapper: geostrophic_wind_from_height(p / (rho0 g0), lat, lon, g0=g0, ...). Tests: V1 equals the height route; V7 anticlockwise round a NH low, clockwise SH.'
  fallback: 'call geostrophic_wind_from_height with Z = msl / (ρ₀ g₀) directly (recorded, CHECK row)'
honesty_notes:
- 'A cross product of two arrows is drawn as an arrow (violet) at right angles to both; the right hand is always a RIGHT hand (Hand3D never mirrored); every result''s direction is checked by data/rhr.json (det = +1, the six axis products, the view signs).'
- 'Display scales: a × b and p × q are drawn at 0.25 of their length, Ω, k, τ, the Coriolis push and the storm columns on their own scales; every value that matters is written or spoken, never read off an arrow''s length.'
- 'Rotation sense is always given with the viewpoint: "anticlockwise, seen from above" (NH storms, a -> b from above), "clockwise, seen from above" (SH storms, tightening a bolt); s17 shows the same turn reads clockwise from below.'
- 'Coriolis: the movie says it is an apparent push seen by observers turning with Earth, gives its maths form −2Ω × u, and says the derivation comes in a later video (U-CP.4). For flat winds only the local-vertical part of Ω is kept (−f k × u; the traditional approximation, which drops the small Ω cos φ terms) - said as "only part of Omega matters". f = 2Ω sin φ with φ the latitude; f < 0 in the Southern Hemisphere; f = 0 at the equator.'
- 'Ω uses the sidereal day: s24 says one turn "measured against the distant stars" takes 23 h 56 min, "a little less than a day", so Ω = 2π / 86 164 s = 7.29e-5 rad/s (never 2π / 24 h, which gives 7.27e-5).'
- 'Earth''s ground speed 465 m/s at the equator is Ω a with a = 6371 km; "faster than the speed of sound" (about 340 m/s at sea level) is true.'
- 'The 17-hour circle (s30, s31) is a thought experiment ("if nothing else pushed the air"): inertial motion with no pressure gradient and no friction, from tested functions; the sphere tracks drift slowly westward as computed.'
- 'Trade winds and westerlies (s33, s34) are explained as air leaving the subtropical highs and being turned by Coriolis; the narration calls it "a simple picture" and names pressure patterns and friction; the turning arrows are dashed and illustrative, the streaklines are reanalysis data.'
- 'Hurricane spin: inflow turned right (NH) builds an anticlockwise spin seen from above, left (SH) clockwise; near the surface friction keeps a spiral inflow (said). The spin sign is measured with r × u on 150-km rings (CHECK rows on P2/P3; if a ring point has the wrong sign, the "all the way round" wording must change - O3).'
- 'Geostrophic adjustment (s41) is frictionless: the parcel loops along a cycloid and only its AVERAGE follows the isobars (said as such); the balanced wind blows with low pressure on its left in the NH.'
- 'Geostrophic worked example: 4 hPa over 400 km at 45°N, ρ = 1.2 kg/m³: 1.00e-3 Pa/m / (1.03e-4 s⁻¹ x 1.2 kg/m³) = 8.08 m/s, shown ≈ 8.1 m/s (the rounded display quotient is 8.06).'
- 'Real storm map (s45, s46): Ciarán at 2023-11-02T00 UTC; violet arrows = geostrophic wind from the ERA5 850 hPa heights (about 1.5 km up), teal = the ERA5 850 hPa wind, sea points only, agreeing within a few per cent and degrees (checked per point); then the 10 m wind, turned 13-21° towards the low by friction. Isobars are mean sea-level pressure.'
- 'Storm strength comes ONLY from IBTrACS observed best tracks and is said as "the forecasters'' best estimate" (Ian at landfall ≈ 67 m/s; Idai ≈ 54-59 m/s, a range because the agencies average over 1 min and 10 min). ERA5 at 0.25° underestimates both storms (Ian 971.9 hPa / 32 m/s; Idai 974 hPa) and HRRR is a model: their strengths are never written or spoken. The storms are first shown as real satellite images (GOES-16, VIIRS) draped on the globe, then with real model winds. No parametric (Holland) vortex is used anywhere (user decision 2026-10-26).'
- 'Sea-level pressure over high ground (Antarctica, Tibet, etc.) is a reduction, not a measurement: masked in every pressure display and in the search for highs (s32).'
- 'Latitude symbol: the movie writes φ (approved brief); Vallis writes ϑ (provenance only, never on screen).'
- 'No references, book or author names, equation numbers, URLs or badges are drawn or spoken; data credits live in manifest.json and this file only.'
quiz_hook: 'At 30°N, f is half its value at the pole. With the same 4 hPa over 400 km, how fast is the geostrophic wind there? (f = 7.29e-5 s⁻¹, so |u| = 1.00e-3 / (7.29e-5 x 1.2) ≈ 11.4 m/s: the weaker turning needs a faster wind to balance the same push.)'
