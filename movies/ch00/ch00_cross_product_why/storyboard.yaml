  split: 2b
  visual: 'NEW. WHY THE BALANCE. The strip map; a second, balanced parcel glides along the gold average line.

    S1: the balanced parcel appears with its teal velocity arrow east.

    S2: keywords ''steady: no speeding up, no slowing, no turning'' → ''pushes add to zero'' (54 px).

    S3: the two push arrows at the parcel, one by one: orange pressure push NORTH, violet Coriolis push SOUTH, equal

    length brackets with ''='' between them.

    S4: keywords ''pressure push → low'', ''Coriolis push → high'' on their clauses.

    S5: the teal wind arrow and a gold quarter-turn arc from it clockwise (seen from above) onto the violet push;

    keyword ''quarter turn right''.

    S6: the arrows ''H'' on the right of the wind and ''L'' on its left get gold ''right''/''left'' tags.

    S7: keywords ''geostrophic balance'', ''geostrophic wind'' (68 px) - UV2-30: both words spoken with the fixed

    lexicon entry.

    '
  voiceover: Why does it end up along the isobars? In steady flow, the air isn't speeding up, slowing down, or turning, so
    the pushes on it add up to zero. Only two pushes act here, so they must be equal in size and opposite in direction. The
    pressure push points towards the low, so the Coriolis push must point towards the high. And the Coriolis push is the wind
    turned a quarter turn to the right. So the wind must blow along the isobars, with the high on its right and the low on
    its left. This is called geostrophic balance, and the wind it gives is the geostrophic wind.
  on_screen_eq: null
  physics_source:
    fn: fluidpy.core.gfd.geostrophic_velocity
    params:
      dpdx: 0
      dpdy: -0.001
