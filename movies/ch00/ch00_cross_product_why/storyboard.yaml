  lines:
  - Contains modified Copernicus Climate Change Service information 2026. Neither the European Commission nor ECMWF is responsible for any use that may
    be made of the Copernicus information or data it contains. ERA5 (Hersbach et al. 2020) via ARCO-ERA5 (Google Research). [Ian, Idai, Ciarán; Hersbach
    et al. 2020 QJRMS 146:1999, doi:10.1002/qj.3803; CDS doi:10.24381/cds.adbb2d47; Carver and Merose 2023]
  - NCEP/NCAR Reanalysis 1 data provided by the NOAA PSL, Boulder, Colorado, USA, from their website at https://psl.noaa.gov (public domain). [long-term
    mean 1991-2020; Kalnay et al. 1996]
  - 'Blue Marble: Next Generation, NASA Earth Observatory (Reto Stöckli, NASA GSFC). [Stöckli et al. 2005]'
  - Made with Natural Earth (public domain).
  - NOAA GOES-16 ABI imagery (public domain), NOAA Open Data Dissemination on AWS. [GOES-R Calibration Working Group and GOES-R Series Program 2017, NOAA
    NCEI, doi:10.7289/V5736P36]
  - Imagery from the NASA Worldview application (https://worldview.earthdata.nasa.gov), part of the NASA Earth Science Data and Information System (ESDIS).
    [VIIRS Corrected Reflectance, NASA LANCE]
  - Derived from NOAA HRRR analyses (public domain), via the University of Utah HRRR-zarr archive on AWS.
  - IBTrACS v04r01 best tracks (Knapp et al. 2010), NOAA NCEI (public domain).
  - Imagery from the NASA Worldview application (https://worldview.earthdata.nasa.gov), part of the NASA Earth Science Data and Information System (ESDIS).
    MODIS Aqua Corrected Reflectance, NASA LANCE (CC0). [Storm Ciarán, 2023-11-02]
  - 'Made with Natural Earth (public domain): 10m coastline, admin-0 and admin-1 boundaries.'
  - 'Blue Marble: Next Generation, NASA Earth Observatory (Reto Stöckli) - s23/s31 patches.'
  - 'WGS 84 constants and normal gravity: National Imagery and Mapping Agency (2000), Department of Defense World Geodetic System 1984, TR8350.2, 3rd ed.
    [values only; s27e-s27g]'
composition_changes:
  new_file: movies/src/ch00/CrossProductWhy.tsx (scene scaffolding copied from DotProductWhy.tsx - Scene, SS/SE/AT, fin/fout, FPH clock, InlineTeX, SCENES
    + Sequence + XF, one Audio of narration_music.wav)
  palette:
  - 'ADD C.rot = #a58be0 (violet) to house/kit/type.ts: the result of a cross product and rotation (a × b, p × q, τ, Ω, k, geostrophic arrows). Check contrast
    >= 4.5:1 on #171f33 and deuteranopia separation from C.first teal in the QA contact sheet; colour never alone (tip labels).'
  reuse:
  - 'house/kit: T, SAFE, ZONE, C, floor, Svg, Arrow, Lbl, Grid, Band, Dash, RightTick, Bracket, Arc, Strike, mkP, pulse, TeX, Layered, CalcStack, Keyword,
    TipLabel, placeLabels, CurvedLink, RiseText, TitleGradient, ClockGlyph, Check, Notebook'
  - 'DotProductWhy.tsx: PairBase (the 2-D pair plane), the GM map code (mini isotherm map in s02; strip map style in s39-s44), MapCamera, the s05 three-panel
    layout, the end card'
  - house/Globe.tsx (lonlatToXYZ, graticule) as the base of Globe3D
  add:
  - name: Scene3D
    spec: 'a ThreeCanvas wrapper for vector scenes: Z-up world, camera from CamPath3D, ambient 0.55 + one directional key light (az 135°, el 50°, 0.9),
      no shadows, antialias, transparent background over C.bg; exposes project(v3) -> screen px for overlays (same camera maths, deterministic).'
  - name: CamPath3D
    spec: 'keyframes [{f | at: S<k> | AT(k, j, words), az, el, dist, target, fov=35, up?, projection?: perspective|orthographic, orbit?: +360}] -> camera
      per frame; easeInOutCubic between keys; azimuth the short way unless orbit is set (then linear); el may be negative (from below) with an explicit
      up; orthographic keys interpolate via a 20-frame cross-fade, not a projection morph.'
  - name: Arrow3D
    spec: cylinder shaft + cone head between two 3-D points; shaft radius and head size chosen per scene so the drawn width is about 10 px (results 14 px)
      and the head about 40 px at the scene's camera distance (computed from the camera, so a zoom keeps the house stroke); colour role; dashed variant
      (segmented shaft) with a rose "−" glyph overlay for negative results; grow(t) 0..1.
  - name: Axes3D
    spec: x, y, z lines (muted 4 px) with tick marks at integers, letter labels and optional words (east/north/up) as Label3D; unit vectors x̂ ŷ ẑ as Arrow3D
      (ink) with role colouring per beat (first teal, second orange, result violet).
  - name: Label3D
    spec: HTML/SVG overlay text anchored at a 3-D point (project()), >= 44 px (floor() guard), placed with placeLabels against the projected arrow segments;
      hidden when the anchor is behind the camera.
  - name: Floor3D
    spec: the pair-plane grid (x -1..6, y -1..4) as a plane mesh with grid lines; opacity prop (s17 translucent 25 %); when el = 90° and the camera matches
      mkP(240, 620, 135) the projected grid equals the SVG PairBase to within 1 px (handover frames in s02, s05, s09, s10).
  - name: Parallelogram3D
    spec: two edge vectors -> a filled quad (C.rot at 18 %) with 3-px edges; corners from data.
  - name: Hand3D
    spec: 'procedural RIGHT hand (no external model): palm = rounded box; four fingers x 3 capsules (phalanges), thumb x 2 capsules + a metacarpal; skin
      = warm white C.key (MeshStandardMaterial, roughness 0.7) with a 2-px muted inverted-hull outline. Props: basis {fingers: unit vector, thumb: unit
      vector} (palm normal = thumb × fingers; the builder checks det = +1 and the component throws on a left-handed basis; NEVER a negative scale), grip:
      "open" | "curl" | "flat", curl 0..1 (MCP/PIP/DIP angles 0 -> 70/90/60° in the fingers-b plane), per-finger glow colour, scale. Pose changes interpolate
      the basis by quaternion slerp over the given frames. Used in s11, s12, s14-s16 (mini 120-px silhouettes in s16), s21, s24, s38, s47.'
  - name: BottleCap3D
    spec: LatheGeometry bottle (muted, 30 % transparent) + a knurled cap (CylinderGeometry with 48 ridges); props angle(t) [rad, + = anticlockwise seen
      from above], lift = pitch x angle / 2π (pitch 0.08 display, x4 a real thread), rim marks in C.first / C.second at given directions.
  - name: Screw3D
    spec: shaft cylinder + RIGHT-HANDED helical thread (TubeGeometry along (r cos t, r sin t, p t / 2π)), slotted head; props angle(t), advance = p x angle
      / 2π along the axis; a muted block it screws into (clipped). The builder checks the helix is right-handed (triple_scalar of r, r', z > 0).
  - name: Door3D
    spec: a slab hinged on a vertical gold-dashed line, swing angle(t) about the hinge (+ = anticlockwise from above), hand point at 0.9 of the width; floor
      swing guide.
  - name: Spanner3D
    spec: open-ended spanner (extruded 2-D outline) on a hex bolt + plate; spanner angle(t) about the bolt axis, bolt sink = pitch x angle / 2π (exaggerated
      x3).
  - name: Globe3D
    spec: 'extends house/Globe: unit sphere with the P5 Blue Marble texture (MeshBasicMaterial, no lighting terminator), Natural Earth coastlines at r =
      1.001 (warm white 40 %), graticule 30° (muted 25 %), equator line, spin angle(t) [rad] about the polar axis, axial tilt prop, optional quarter cut-away
      (0-90°E wedge, cut faces muted), surface arrows (GlobeArrow3D) and tracks (lat/lon polylines at r = 1.004); camera by GlobeCam keyframes {lat, lon,
      dist, fov, lookAt: centre | surface point}. Texture loaded with delayRender/continueRender.'
  - name: GlobeArrow3D
    spec: a great-circle-curved arrow hugging the sphere (r = 1.006) from (lat, lon) along an initial azimuth for a given arc length, with a bend(t) parameter
      that rotates the second half by a given angle (the illustrative "turned right/left" arrows in s33, s34, s36, s37); dashed when illustrative.
  - name: WindTrails3D
    spec: 'streaklines of a real wind field from precomputed Float32 trails [N x L x 2 (lat, lon)] + per-seed phase offsets: at frame n each seed shows
      samples (n + phase) mod L back 12 samples as a fading line (warm white, alpha 0.35 -> 0.95 by the speed stored per sample); regional mode for P2/P3
      (lat/lon box) and global mode for P1; brighten(mask) by latitude band; deterministic (no RNG at render). Rendered with one LineSegments geometry updated
      per frame from the bin (BufferAttribute.needsUpdate).'
  - name: IsobarLayer
    spec: contour polylines of msl every 4 hPa precomputed by the builder (skimage.measure.find_contours on P2/P3/P4) drawn on the globe (r = 1.003) or
      the flat map panel; no values written.
  - name: TitleCross3D
    spec: 'the s00 animation: Part A small Scene3D with p, swept q, Parallelogram3D and the live p × q readout from sweep.json; Part B a mini Globe3D with
      one GlobeArrow3D following paths.json -> nh_track; props {splitFrame, endFrame}.'
  - name: CircleDotCross
    spec: ⊙ and ⊗ glyphs (SVG) at 96 px with an optional arrow-tip / tail-feathers mini animation (scale in/out over 20 frames).
  equations_gate: every latex string of this file (on_screen_eq and on_screen_eq_extra) appears verbatim (whitespace-squashed) in CrossProductWhy.tsx as
    a String.raw constant; CalcStack rows are assembled from those constants
  add_v4:
  - name: HalfEarth3D
    spec: 'a Globe3D variant cut along the meridian plane through a given longitude: the far half (lon0 + 0..180°) is removed; the flat face is a half-disc
      mesh (slate #2b3550 90 %, warm-white rim 3 px) lying IN the plane that contains the axis, so the axis line (gold) and r are drawn ON the face and
      are never occluded by or painted over the outside; optional slide-away animation of the removed half (0.6 units, fade); props lon0, faceTilt (camera-facing
      angle), showAxis, showEquatorTrace. Replaces the v2 quarter cut-away (''heart'', UV2-20).'
  - name: LocalFrame3D
    spec: east / north / up unit arrows at a surface point of Globe3D or HalfEarth3D (east = d r̂/dλ normalised, north = d r̂/dφ, up = r̂), labels 'east',
      'north', 'up'/'k' (≥ 44 px), plus a vector-split helper that draws a vector's legs along two of them with labels (s28a Ω cos φ / Ω sin φ).
  - name: MerryGoRound2D
    spec: 'top-view disc (radius prop, 8 spokes), mode ''outside'' (disc turns, camera fixed) or ''rider'' (camera turns with the disc); ball path from
      data/merry.json (turntable_puck x/y inertial or rotating); floor-velocity arrows Ω × r on rings; carried-arrow ghosts (s26c). Deterministic: angle
      = Ω t from the frame.'
  - name: KickPolygon
    spec: 's22e: draws a velocity arrow receiving N perpendicular kicks (polygon of N steps from data/examples.json -> kicks) and the continuous circle;
      live speed readout from the data.'
  - name: SatMapPanel
    spec: 'MapPanel (d3-geo Lambert conformal) with a georeferenced raster base (P6 true colour, drawn by reprojecting the EPSG:4326 image per pixel in
      the builder into the panel projection and saving a PNG - the TSX only draws the PNG), vector overlays: coastlines, admin-0 and admin-1 borders (P7),
      isobars, arrows; land/sea mask for arrows.'
  - name: Globe3D (fix)
    spec: 'UV2-19: the axis line, Ω arrow and texture share ONE tilted parent; the axis ends are (0, ±1.35, 0) in globe coordinates; depthTest on (the axis
      is hidden inside the sphere); a 3-D selftest row projects the texture''s pole points and the axis-sphere intersections and asserts ≤ 2 px. UV2-14:
      MeshBasicMaterial with the daytime texture, no lighting terminator, no dark veil.'
  - name: Door3D (fix)
    spec: 'UV2-04/UV2-12: labels placed by placeLabels against the projected geometry AND a 40-px canvas margin; frame self-check at every sentence start.'
  u_cf_2026-10-29: 'NEW scenes S26A1, S26E, S26F, S27B-S27G (MerryGoRound2D, HalfEarth3D, Globe3D, LocalFrame3D, CalcStack, Layered, Balance reused; new
    small SVG pieces: two meridian cross-sections (circle | ×50 ellipse), plumb bob, bathroom scale, spring gravity meter, dropped ball icons). S26B: one
    new sentence (S5) and the rule line. S27: the S9 strike + bulge + ''in gravity'' removed (moved to s27f); the main line stays EQ_DUDT3; the ''centrifugal:
    outwards'' brace reads ''centrifugal''; EQ_DUDT (''real pushes − 2Ω × u'') is no longer in this storyboard and may be dropped from the TSX or kept unused.
    S47: one new sentence (S7), later beats shift by one.'
new_builder_data:
  builder_script: movies/data/build_ch00_cross_product_why.py (writes data/*.json, *.bin and manifest.json with function names, parameters, git SHAs, hashes
    and CHECK rows; the TSX only indexes and interpolates)
  items:
  - id: N1
    scene: s07
    what: component terms of a × b
    fields:
      component_terms:
      - - 0
        - 0
      - - 0
        - 0
      - - 15
        - 1
      a_cross_b:
      - 0
      - 0
      - 14
    check: equals cross(a, b) and np.cross
  - id: N2
    scene: s08
    what: display product with rounded factors
    fields:
      display_sin_factors:
      - 5.099
      - 3.162
      - 0.868
      display_sin_product: 13.995
    check: '|p − 14| < 0.01 and p != 14.000 to 3 dp (so ≈)'
  - id: N3
    scene: s09
    what: height and area
    fields:
      height: 4.4272
      display_height_product: 4.426
      display_area_product: 14.008
      corners:
      - - 0
        - 0
      - - 5
        - 1
      - - 6
        - 4
      - - 1
        - 3
    check: height = 14 / |b| (tol 1e-9); 5.099 x 0.868 = 4.426 shown ≈ 4.43
  - id: N4
    scene: s11-s17
    what: 'rhr.json: beats, hand bases, axes pairs, screen map, views'
    check: det(hand basis) = +1 for every beat (triple_scalar); the six axis products; screen_map out/in/right/left/up/down; view signs +14/−14/0
  - id: N5
    scene: s24-s31
    what: earth.json, coriolis.json, paths.json
    check: Ω = 2π / 86164.1 s; |Ω × r| = 464.58 / 328.51 / 0 m/s; f(45°) = 1.0313e-4; Ω·k = Ω sin φ at 45°, 0°, −45°; |−f k × u| = 1.0313e-3; inertial period
      16.92 h; loop diameter 193.9 km (sphere tracks within 5 %)
  - id: N6
    scene: s39-s44
    what: geo.json
    check: ∇p = (0, −1.00e-3) Pa/m; parcel_adjust mean velocity over 2 periods = (8.08, 0) m/s (tol 1 %); loop radius 78.3 km; k × (k × u) = −u; geostrophic_velocity
      = (1/(fρ)) k × ∇p (tol 1e-12); fρ = 1.2375e-4; 1.00e-3 / 1.24e-4 = 8.06 shown ≈ 8.1
  - id: N7
    scene: s32-s38
    s45-s46: null
    what: real-data products from P1-P4 (see data_products)
    check: trade and westerly signs; Ian ring all > 0, Idai ring all < 0; storm geostrophic anticlockwise and along the isobars; 10 m wind slower and crossing
      towards the low (median)
  - id: N8
    scene: s09a
