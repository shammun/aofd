    S5: three minis in a row (spanner τ = r × F, ball L = r × p, proton F = q v × B) then the kicks polygon → circle;

    ''push ⟂ motion → turns, same speed''.

    S6: the half-Earth with v = Ω × r, then the merry-go-round with ① + ②; ''v = Ω × r'', ''−2Ω × u''.

    S7: −f k × u with Ian | Idai thumbnails; ''north: right · south: left''.

    S8: the two storms spin (anticlockwise | clockwise).

    S9: the Ciarán satellite map mini with violet arrows; ''u = (1/(fρ)) k × ∇p''.

    S10: three faint thumbnails (weather map with H/L, ∇ glyphs) and ''later videos'' (54 px).

    '
  voiceover: 'To sum up, the cross product of two arrows is another arrow, at right angles to both. Each component leaves
    out its own direction and cross multiplies the other two. Its length is the first arrow''s length times the part of the
    second arrow across it: the area of their parallelogram. Its direction is the normal to their plane, and the right-hand
    rule says which way round. Physics uses it for torque, angular momentum and the push on a moving charge, and a push always
    at a right angle turns a motion without speeding it up. On the spinning Earth, the ground moves at Omega cross r, and
    moving air feels the Coriolis push, minus two Omega cross u. For flat winds, that''s minus f k cross u: to the right in
    the north, and to the left in the south. That''s why storms spin. When this push balances the pressure push, we get the
    geostrophic wind, one over f rho times k cross grad p, along the isobars. Later videos in this series show how to read
    weather maps, and how grad, div and curl are built from these products.'
  on_screen_eq:
    latex: '|\mathbf a\times\mathbf b| = |\mathbf a|\,|\mathbf b|\sin\theta'
    vallis_eq: 'provenance only: as s08'
    page_png: ../Fluid Dynamics/chapters/pages/ch02/p079.png
