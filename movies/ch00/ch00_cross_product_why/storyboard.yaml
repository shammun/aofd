    check: Ω × r by cross() equals Ω |r| sin θ along +y; equator 464.58; pole 0
  - id: N16
    scene: s26, s31
    what: tracks from the land start points (45°N 1°E; 45°S 70°W)
    check: first-hour Δlat −0.0603 / +0.0603; every track point over land (NE 50m land polygons); screen-space turning sense clockwise (N) / anticlockwise
      (S) through the actual camera
  - id: N17
    scene: s26a-s27a
    what: 'merry.json: turntable paths, two views, carried arrow, new ground, terms, check paths'
    check: rotating path right of the motion; v_outside = turntable U, V; tip velocity = Ω × u; floor change = Ω × u; rotating_frame_path vs turntable_puck
      max gap < 1e-6 m (measured 1.38e-11)
  - id: N18
    scene: s28a-s28c
    what: Ω local, Ω × u components, flat part
    fields:
      Omega_local:
      - 0
      - 5.1563e-05
      - 5.1563e-05
      coriolis_45N_u10:
      - 0
      - -0.0010313
      - 0.0010313
    check: sympy component identity; coriolis_horizontal = flat part of core.rotating.coriolis_acceleration; vertical/g = 9513
  - id: N19
    scene: s33, s34
    what: P1 v-component sector means and arrow headings
    check: '15°N: u<0, v<0 (Atlantic, central Pacific); 15°S: u<0, v>0 (Atlantic, east Pacific, Indian); 45°N/S u>0; bending-arrow final headings in the
      right quadrant; west is screen-left for the north-up keyframes'
  - id: N20
    scene: s39-s44
    what: round low and the balanced parcel
    fields:
      pin_r_km: 1000
      gradp:
      - 0
      - -0.001
    check: isobars at 400/800/1200/1600 km; ∇p at the pin (0, −1e-3) (central differences); k × ∇p along the isobar tangent; Coriolis push = −pressure push
      (1e-12)
  - id: N22
    scene: s22b
    what: shadow areas of a tilted parallelogram (a = (2, 0, 1), b = (0, 2, 1))
    fields:
      cross:
      - -2
      - -2
      - 4
      shadow_areas:
      - 2
      - 2
      - 4
    check: 'parallelogram_area of each coordinate-plane projection = |component| of cross(a, b); ours: walls 0, floor 14'
  - id: N21
    scene: s45-s46
    what: Ciarán at 12 UTC on the P6 image
    check: msl minimum location falls on the image's storm centre within 1° (visual sanity, reported); anticlockwise ring; 850 hPa over sea 300–1500 km
      from the centre at 12 UTC, median direction difference ≤ 10° and ≥ 65 % of points within 10°; median actual/geostrophic speed in 0.80–0.95 (data-scout
      2026-10-27 gave 0.857 at 12 UTC, 0.852 at 13 UTC; subgeostrophic round a tight low, gradient-wind check at 46°N 5°W); u10 crosses towards the low
  - id: N23
    scene: s26a1, s26e, s26f, s27b
    what: merry.json -> rule, rule_twice, centrifugal (U-CF)
    check: painted-arrow tip velocity = Ω × B and growing arrow outside rate = rider rate + Ω × B (rotating_basis, finite differences, tol 1e-6); rider
      rate of (u + Ω × r) = a' + Ω × u' at t = 1.2 s (tol 1e-6); relative + 2Ω × u' + Ω × (Ω × x') = 0 for the straight outside path (frame_acceleration_terms,
      tol 1e-9); carried Ω × r tip velocity = Ω × (Ω × r) towards the hub; centrifugal_acceleration([0,0,0.5],[0,−2.5,0]) = (0, −0.625, 0) = 0.25 r; triple-product
      identity on 200 random vectors < 1e-12; period 2π/0.5 = 12.566 s shown ≈ 12.5 s
  - id: N24
    scene: s27c-s27g
    what: earth.json -> centrifugal, effective_gravity, sideways, three_traces (U-CF)
    fields:
      centrifugal_m_s2:
      - 0.033878
      - 0.023955
      - 0.0
      Omega_sq: 5.3175e-09
      r_perp_45_km: 4504.98
      north_part_45: -0.016939
      coriolis_10ms: 0.0014584
      sideways_over_coriolis: 11.61
      deflection_max_deg: 0.099
      geodetic_minus_geocentric_max_deg: 0.1924
      radius_difference_km: 21.385
      inverse_flattening: 298.257
      g_equator: 9.7803253359
      g_pole: 9.8321849378
      spin_share: 0.654
    check: 'centrifugal_acceleration at 0/45/90° (a = 6371 km) = Ω² a cos φ away from the axis (1e-12); r_along + r⊥ = r; up and north parts ±0.016939 at
      45°N (north < 0: towards the equator); ratio to G0 0.345 % shown ''≈ ⅓ %''; effective_gravity(45°, g_n = GM/a²) deflection 0.0990° and max 0.0990°
      at 44.95° (shown ≈ 0.1°); |coriolis_acceleration(earth_rotation_local(45°), (10,0,0))| = 1.4584e-3 (shown ≈ 0.0015); sideways / Coriolis = 11.6 (said
      ''more than ten times''); earth_oblateness_diameter()/2 = 21.385 km (said ≈ 21 km); a/(a − b) = 298.26 (said ''one part in three hundred''); cited
      γe, γp shown 9.78 / 9.83; Ω² a_WGS84 / (γp − γe) = 0.654 (said ''about two thirds''); geodetic − geocentric latitude from cited e², max 0.1924° at
      45° (said ''about a fifth of a degree''), 0.1924 − 0.0990 = 0.093 (said ''about as much again'')'
implementer_needs:
- id: I1
  fn: fluidpy.diag.trajectories.advect_on_sphere(u, v, lat, lon, seeds_lat, seeds_lon, dt, nsteps, a=EARTH_RADIUS)
  why: streaklines on the globe from P1/P2/P3 winds (every moving thing must trace to a tested function)
  spec: 'RK4 on the sphere (dλ/dt = u/(a cos ϑ), dϑ/dt = v/a, Vallis (2.28) kinematics), bilinear interpolation, periodic in longitude, pole guard; returns
    [N, nsteps+1, 2]. Tests: V1 solid-body rotation field gives closed circles of the right period; V3 RK4 order 4; V7 zero field -> fixed points.'
- id: I2
  fn: fluidpy.diag.cyclone.storm_centre(msl, lat, lon, box) and storm_relative_wind(u, v, lat, lon, centre, radii_km, n_az)
  why: s35-s38 centre, tangential/radial wind and the cross-product spin sign on rings
  spec: 'centre = MSLP minimum with a quadratic sub-grid refinement; rings on the local tangent plane; tangential = k·(r̂ × u) via fluidpy.geo.vectors.cross,
    radial = r̂·u via dot; inflow angle = atan2(−radial, tangential). Tests: V1 Rankine vortex (tangential exact, radial 0), V7 hemisphere mirror flips
    the sign, V1 Gaussian low centre recovered to < 0.1 grid.'
  fallback: builder-local code calling fluidpy.geo.vectors.cross/dot (tested) with CHECK rows
- id: I3
  fn: fluidpy.geo.atmos.geostrophic_wind_from_pressure(p, lat, lon, rho0=1.2, Omega=OMEGA, a=EARTH_RADIUS, lat_min=5.0)
  why: 'optional now: s45 uses the 850 hPa heights with the existing geostrophic_wind_from_height; I3 serves only the 10 m friction angle in s46 (Vallis
    (2.198) spherical form)'
  spec: 'thin wrapper: geostrophic_wind_from_height(p / (rho0 g0), lat, lon, g0=g0, ...). Tests: V1 equals the height route; V7 anticlockwise round a NH
    low, clockwise SH.'
  fallback: call geostrophic_wind_from_height with Z = msl / (ρ₀ g₀) directly (recorded, CHECK row)
- id: I4
