    \ 'turns the wind'   (isotherm map + turned arrow)\nThe dot cell lands first on its clause, then the cross cell; gold\
    \ underline under the cross cell.\n"
  voiceover: Let's put the two products side by side. The dot product gives a number, using the part along and the cosine.
    The cross product gives an arrow, using the part across and the sine. The dot product is a shadow times a length. The
    cross product's length is an area, and its direction is the normal to the plane. The dot product is largest when the arrows
    point the same way, the cross product at right angles, and only the cross product flips when we swap the order. In mechanics,
    they give work and torque. In weather, the dot product gives advection, and the cross product turns the wind.
