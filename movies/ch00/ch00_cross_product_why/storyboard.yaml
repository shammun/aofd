  voiceover: 'Before we write down what each one sees, we need one rule, and the merry-go-round shows it. Paint an arrow on the floor, and call it B. It
    could be any arrow: a position, a velocity, or a direction. The rider sees the painted arrow stay exactly the same. But from outside, it swings round
    with the floor, and its tip moves along a circle. Just as Earth''s ground moves at Omega cross r, the tip moves at Omega cross B. Now suppose the rider
    also sees B change, for example by growing longer. Then the outside watcher sees both changes, added together. We write how fast B changes each second
    as d B by d t, and say who is watching. So here''s the rule: d B by d t seen from outside equals d B by d t seen by the rider, plus Omega cross B. We''ll
