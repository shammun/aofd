decision_changes:
- 'U-CP.4 ''no rotating-frame derivation'' OVERRIDDEN by the user (2026-10-27): v = Ω × r (s25a-s25b), −2Ω × u (s26a-s27a) and −2Ω × u → −f k × u (s28a-s28_f)
  are derived here'
- the why of the cross product expanded into its own section (s09a, s18a-s22e)
- geostrophic section re-sequenced on one round low, one equation per step (s39-s44)
- Storm Ciarán shown on a true-colour satellite image with country and region borders at about 12 UTC 2 Nov 2023 (s45-s46); the analysis time moves from
  00 to 12 UTC
- 'U-CF (user 2026-10-28, planned 2026-10-29): the rotating-frame acceleration is derived with the rule (dB/dt)_outside = (dB/dt)_rider + Ω × B (s26a1),
  used on r (s26b) and again on the velocity (s26e-s26f, the two equal Ω × u and the leftover Ω × (Ω × r)); the leftover is named the centrifugal acceleration
  and shown = Ω² r⊥ with the vector triple product (s27b-s27d); it is folded into effective gravity g (s27e-s27f) with its traces: g 9.78 vs 9.83 m/s²,
  the plumb line, the 21-km bulge (s27g); s27''s strike + bulge move to s27f'
