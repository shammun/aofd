    6 -> 12 and the ball speeds up (angle rate ×4, from data); CalcStack 0.5 × 6 = 0.25 × 12 = 3. S4: skater silhouette
    pulling arms in (illustrative). S5-S6: Ian''s HRRR 10-m wind, azimuthal-mean tangential wind vs radius (teal line) beside
