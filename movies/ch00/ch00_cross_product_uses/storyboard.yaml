    air, it would turn the wind round a full circle, without changing its speed. Because the push never speeds the air up
    or slows it down, the Coriolis effect only steers. Going once round the circle takes two pi over f, about seventeen
    hours. This loop is called an inertial circle, and the Coriolis video finds loops like it in real ocean drifters.'
