      angle), showAxis, showEquatorTrace. Replaces the v2 quarter cut-away (''heart'', UV2-20).'
  - name: LocalFrame3D
    spec: east / north / up unit arrows at a surface point of Globe3D or HalfEarth3D (east = d r̂/dλ normalised, north = d r̂/dφ, up = r̂), labels 'east',
