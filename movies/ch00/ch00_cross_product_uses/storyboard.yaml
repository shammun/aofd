  voiceover: 'This is Hurricane Ian, seen from a weather satellite on the twenty eighth of September, twenty twenty two. Its calm centre, called the eye,
    is just off the south west coast of Florida, and its cloud bands curl around it. That afternoon, Ian reached the coast with winds of about sixty seven
    metres per second, the forecasters'' best estimate from the observations. Now let''s add the winds near the ground, from a weather model with a fine,
    three kilometre grid. In the Northern Hemisphere, each stream of air heading for the centre is turned to the right: air from the south towards the east,
    and air from the east towards the north. All the way round, these turned streams add up to an anticlockwise spin, seen from above. Friction near the
    ground slows the wind, so the air still spirals inwards as it turns.'
  on_screen_eq: null
  physics_source:
