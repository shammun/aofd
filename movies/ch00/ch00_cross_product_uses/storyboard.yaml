    S2: '−f k × u − (1/ρ) ∇p = 0' with underbraces 'Coriolis push' (violet) and 'pressure push' (orange).
    S3: '−f k × u = (1/ρ) ∇p' (the pressure term flies across, its sign flips in rose).
    S4: '−f k × (k × u) = (1/ρ) k × ∇p' - the new 'k ×' on each side in gold.
    S5: 'k × (k × u)' highlighted; a mini top-view picture: u teal → k × u (left) → k × (k × u) pointing BACKWARDS,
    two gold quarter-turn arcs.
    S6: 'k × (k × u) = −u' (68 px).
    S7: 'f u = (1/ρ) k × ∇p' (the two minus signs struck together in rose).
    S8: 'u = (1/(fρ)) k × ∇p' at 96 px with a gold underline; keyword 'geostrophic wind'.

    CHANGES FOR THIS MOVIE: C3: the strip's labels fade out over 8 frames before it shrinks.
  voiceover: 'Now the same steps as maths, one at a time. The two pushes add up to zero: minus f k cross u, minus one over
    rho grad p, equals zero. Move the pressure push to the other side: minus f k cross u equals one over rho grad p. To
    get the wind itself, we apply k cross to both sides. On the left, we get k cross k cross u. Turning the wind twice to
    the left points it backwards, so that''s minus u. The two minus signs cancel, and the left side becomes f times u. The
    video on vector identities shows rules like this one for any three arrows. Dividing by f, we get the geostrophic wind:
    u equals one over f rho, times k cross grad p.'
  on_screen_eq:
    latex: \mathbf u = \frac{1}{f\rho}\,\mathbf k\times\nabla p
    vallis_eq: 'provenance only, not drawn: ours, from Vallis (2.195) f × u ≈ −(1/ρ)∇_z p (f = f k) by applying k ×; its
      components are Vallis (2.197) f u_g = −(1/ρ)∂p/∂y, f v_g = (1/ρ)∂p/∂x (page image checked)'
