    jumping 90° (rose strike) for 1 s; keyword ''bends a little at a time''.

    S8: a mini isobar sketch (3 straight isobars, ''L'' north, ''H'' south), orange ∇p arrow pointing south and its

    quarter turn left pointing east along the isobars (gold arc); keyword ''weather maps'' - the full story comes in

    s40a.


    V5 (from the 1aa590f split plans; review-3 items R3-S1..S4, C1-C6): R3-S1: ''push ⊥ wind'' keyword from S1.'
  voiceover: 'Why would we want an exact quarter turn? Not to change the wind: it names the direction straight to the wind''s left, with the wind''s own
    size. We need it because Earth''s spin gives moving air a push that''s always at a right angle to its motion, like the magnet''s push on the proton.
    A push at any other angle, say thirty degrees off, would have a part along the wind, and would speed the air up or slow it down. The spin''s push only
    turns the air. So we need the wind turned by exactly a quarter turn, times a number for its strength. The wind itself doesn''t jump by ninety degrees:
    the push bends its path a little at a time, like our small kicks. And on weather maps, k cross turns the direction in which pressure rises into the
    direction the wind blows.'
