honesty_notes:
- A cross product is drawn as a violet arrow at right angles to both inputs; the right hand is always a RIGHT hand; every direction is checked by data/rhr.json.
- 'Display scales: a × b, p × q at 0.25 of their length; Ω, k, τ, L, pushes on their own scales; every value that matters is written with its components
  (UV2-08) or spoken.'
- 'The ''why'' section (s09a, s18a-s22e) is exact: the z recipe equals the signed area (box proof, valid as drawn for a₁ > b₁, b₂ > a₂, the letters identity
  checked symbolically); |a × b| = |a| × the part of b perpendicular to a; sliding b along a leaves a × b unchanged; the arrow is the normal to the plane
  (a label, not a location of the area).'
- 'Rotation sense always with the viewpoint: ''anticlockwise, seen from above'' (NH storms, a → b from above), ''clockwise, seen from above'' (SH storms,
  the inertial circle in the NH).'
- v = Ω × r is derived (speed Ω |r| sin θ = Ω × distance from the axis; direction east, right-hand rule) and checked with the recipe at 45°N (0, 329, 0)
  m/s; equator 465 m/s; pole 0.
- '−2Ω × u is derived on a merry-go-round with one rule, (dB/dt)_outside = (dB/dt)_rider + Ω × B (motivated by an arrow painted on the floor): used on r
  it gives the outside velocity u + Ω × r; used again on that velocity it gives du/dt + Ω × u (the floor speed changing, ②) + Ω × u (u carried round, ①)
  + Ω × (Ω × r) (the floor velocity carried round, ③), with constant Ω said; Newton''s law in the outside frame; the minus from moving the terms to the
  rider''s side. A computer check compares the closed-form path with the integrated rider''s equation (gap ≈ 3e-11 m).'
- On Earth Ω = (0, Ω cos φ, Ω sin φ) in (east, north, up); for a flat wind the horizontal part of −2Ω × u is −2Ω sin φ k × u = −f k × u; the vertical part
  2Ω cos φ u (≈ 1e-3 m/s² for 10 m/s at 45°) is dropped against g (said), which is the traditional approximation for flat winds.
- f = 2Ω sin φ, φ latitude (Vallis writes ϑ; provenance only); f < 0 in the SH; f = 0 at the equator; f(45°) = 1.03e-4 s⁻¹.
- 'Ω uses the sidereal day (23 h 56 min): 7.29e-5 rad/s.'
- The 17-hour circle and the globe loops are thought experiments ('with nothing else pushing them'); the loops start over land (SW France, Patagonia) so
  the viewer sees geography; over land friction would damp such motion (storyboard note, not narrated).
- 'Trade winds: NH air heading south turned right → towards the west (north-easterlies); SH heading north turned left → west (south-easterlies); the data
  CHECK both u < 0 and the equatorward v at 15°N/S over the Atlantic and Pacific. Westerlies: poleward air turned east in both hemispheres; the narration
  calls it a simple picture shaped also by pressure patterns and friction.'
- Hurricane strengths only from IBTrACS (observed best tracks); no parametric vortex; satellite images draped as data.
- 'Geostrophic: ∇p points from low to high (towards higher pressure); the pressure push −(1/ρ)∇p points to the low; k × ∇p lies along the isobars; in steady
  unforced flow the two pushes cancel, so the wind has the high on its right and the low on its left (NH); u = (1/(fρ)) k × ∇p derived one move per line;
  the round low uses f = constant (45°N) and its geostrophic wind is not the gradient wind (curvature is ignored, not said).'
- 'Storm Ciarán: daytime true-colour composite of 2 Nov 2023 (swath times within about ±2 h of 12 UTC) with ERA5 isobars and 850 hPa geostrophic arrows
  at 12 UTC; borders from Natural Earth; the spoken comparison has no numbers and is CHECKed.'
- No references, book or author names, equation numbers, URLs or badges on screen; credits in this file and manifest.json only.
- 'Part 2 of the v5 split: every content scene identical to cross product v5 s23-s48; only the new start (s00_title, s01_hook, s01a-s01d) is added. s23a
  still names ''the magnet''s push on the proton'' and ''our small kicks'': both are recapped in s01d.'
- 'Centrifugal (U-CF): −Ω × (Ω × r) = Ω² r⊥ by the vector triple product (#1b), pointing away from the axis, size Ω² a cos φ: 0.034 m/s² at the equator,
  0.024 at 45°, 0 at the poles (≈ 1/3 % of g). It is an apparent force of the rotating frame (said as ''the outward pull a rider feels''). It is folded
  into effective gravity g = g* − Ω × (Ω × r); on a sphere its sideways part (0.017 m/s² at 45°) would exceed the Coriolis push on a 10 m/s wind (≤ 0.0015)
  more than ten times, but the flattened Earth makes the sea surface normal to g, so weather equations carry only g. Traces: g 9.78 vs 9.83 m/s² (WGS-84
  normal gravity, cited; the spin explains ≈ 2/3, the bulge the rest), the plumb line 0.1° (spin alone, sphere) and ≈ 0.19° (real ellipsoid), the 21-km
  bulge (1/298). Flattening and plumb angle are drawn ×50, the centrifugal arrows ×100 against g* (listed in exaggeration).'
quiz_hook: 'At 30°N, f is half its value at the pole. With the same 4 hPa over 400 km, how fast is the geostrophic wind there? (f = 7.29e-5 s⁻¹, so |u|
  = 1.00e-3 / (7.29e-5 x 1.2) ≈ 11.4 m/s: the weaker turning needs a faster wind to balance the same push.)'
