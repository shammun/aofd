    U-CF (2026-10-29): S1 unchanged on screen (the s26f sum is the s27 ''change seen outside'' line). S3 and S5 unchanged on screen (the spoken ''leftover
    piece'' is now said as ''Omega cross, open bracket, Omega cross r''). S8: ''−Ω × (Ω × r)'' highlighted slate with the underbrace ''centrifugal'' (was
    ''centrifugal: outwards'') and the small outward arrow on the thumbnail. S9 (NEW words): NO strike, NO bulge ellipse, NO ''in gravity'' (moved to s27f);
    the three-term line stays as the main line (84 px) with a gold ''?'' beside the slate term, handing over to s27a/s27b.'
  voiceover: 'Now let''s put the sum to work. A push for each kilogram is just an acceleration: how much the velocity changes every second. The change seen
    from outside is the change of u that the rider sees, plus two Omega cross u, plus Omega cross, open bracket, Omega cross r. Newton''s law says this
    equals the real pushes on each kilogram, like the pressure push. Move the extra pieces to the other side, and the rider sees u change by the real pushes,
    minus two Omega cross u, minus Omega cross, open bracket, Omega cross r. So minus two Omega cross u is the Coriolis push, for each kilogram. The two
    comes from the two equal pieces, and the minus from moving them to the rider''s side. The leftover piece, minus Omega cross, open bracket, Omega cross
    r, is called the centrifugal acceleration, and it pulls outwards from the axis. We''ll see why, and where it goes on Earth, right after we check the
    minus sign.'
