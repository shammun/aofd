  voiceover: 'Now pull the string in, so the ball circles closer to the centre. The string pulls along r, so it still can''t
    change the angular momentum: it stays three. If r shrinks to a quarter of a metre, half as long, the momentum must double
    to keep r cross p at three, so the ball whirls twice as fast. That''s how a figure skater spins faster by pulling in
    her arms. Air spiralling into a hurricane does something similar: as it moves closer to the centre, it spins faster,
    which is part of why the strongest winds are near the eye. Friction with the sea takes some of that spin away, so the
    winds don''t grow quite as fast as the string rule says.'
  on_screen_eq:
