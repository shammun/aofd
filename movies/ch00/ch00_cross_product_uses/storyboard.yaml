  - 0.1b dot product
  visual: 'Real map: California coast 32-42°N on OISST v2.1 daily SST (D2, a clear upwelling day in summer, cmocean thermal,
    colour bar 52 px) with NE coasts; a northerly wind arrow (orange) along the coast; the Ekman transport arrow (violet)
    a quarter turn to its right, offshore; then the offshore unit arrow n̂ (slate) and the dot product bar ''M_E · n̂ >
    0 → upwelling'' (teal); cold strip along the shore highlighted with a gold band + CurvedLink to ''cold water rising''.
    Cutaway inset: water rising at the coast (illustrative).'
  voiceover: 'This has a big effect along some coasts. Off California, in spring and summer, the wind often blows from the
    north, along the coast. The Ekman transport is a quarter turn to the right of it, so the top layer of water moves away
    from the coast, out to sea. Colder water rises from below to take its place. This is called coastal upwelling, and sea
    temperature maps from satellites show it as a strip of cold water along the shore. The rising water brings nutrients
    up from the deep, which helps make these waters so rich in fish. To measure it, oceanographers take the dot product
    of the Ekman transport with an arrow pointing offshore: first a cross product, then a dot product.'
  on_screen_eq: null
