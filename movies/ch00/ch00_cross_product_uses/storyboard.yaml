  - '#29 the Coriolis effect, in full detail'
  - '#29B centripetal vs centrifugal vs Coriolis'
  visual: 'NEW (U-CF3). THREE TRACES OF THE SPIN. Picture zone changes per trace; maths zone the numbers (68 px).

    S1: three small code-drawn icons in a row at the top of the picture zone: a weight on a spring (gravity meter), a plumb bob, an Earth outline; each
    lights in turn with its trace.

    S2-S3: Globe3D whole (untilted, camera lat 0°, lon −20°) with gold links from the equator and the North Pole to ''equator: 9.78 m/s²'' and ''poles:
    9.83 m/s²''. Data-source line ''Image: NASA Blue Marble Next Generation · gravity: WGS 84 normal gravity''.

    S4: a bar of the difference split into slate ''spin ≈ ⅔'' and brown ''bulge: the rest'' (54 px; every number shown is spoken).

    S5: the flattened outline (×50) behind the globe; a bracket ''farther from the centre'' at the equator.

    S6: a large meridian cross-section (SVG), a plumb bob hanging at 45°N, its string continued as a dashed line into Earth passing beside the centre (angle
    exaggerated ×50); a gold arc at the bob between the string and the line to the centre.

    S7: ''round Earth, spin alone: ≈ 0.1°'' (68 px).

    S8: the outline flattens (×50) and the dashed line swings further; ''real Earth: ≈ 0.2°'' (68 px) = ''about a fifth of a degree''.

    S9: brackets ''equator radius'' and ''polar radius'' on the ×50 outline; ''+21 km'' at the equator (68 px).

    S10: ''≈ 1 part in 300'' (68 px); the true-scale outline drawn over it in faint warm white (it looks like a circle); keyword ''almost a sphere''; [beat].

    S11: two faint thumbnails: a ball on a string (''circular motion'') and the globe with curving tracks (''Coriolis''); keyword ''later videos'' (54 px).

    S12: the half-Earth of s28a fades in (camera continuity into s28a).'
  voiceover: 'We can see the centrifugal effect in three places. First, gravity is weaker at the equator. Carefully measured, it''s about nine point seven
    eight metres per second squared at the equator, and nine point eight three at the poles. The centrifugal pull explains about two thirds of that difference.
    The rest comes from the bulge itself, which puts the equator farther from Earth''s centre. Second, a plumb line, a weight hanging on a string, doesn''t
    point exactly at Earth''s centre. On a round Earth, the spin alone would tilt it by up to about a tenth of a degree, near forty five degrees latitude.
    On the real, flattened Earth, the bulge''s own pull adds about as much again, so the tilt reaches about a fifth of a degree. Third, Earth''s shape:
    its radius at the equator is about twenty one kilometres larger than at the poles. That''s only about one part in three hundred, so for everything else,
    we can treat Earth as a sphere. [beat] The video on circular motion builds the centrifugal effect from scratch, and the Coriolis video goes through
    this whole derivation in more detail. Now let''s go back to the Coriolis push, and see how it works on the spinning Earth.'
