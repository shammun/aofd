  voiceover: Now let's look at the centrifugal acceleration, minus Omega cross, open bracket, Omega cross r. It depends only on where the ball is, not on
    how it moves. To see which way it points, we use the vector triple product from the triple products video. It says that p cross, open bracket, q cross
    s, equals q times p dot s, minus s times p dot q. Here p and q are both Omega, and s is r. So Omega cross, open bracket, Omega cross r, equals Omega
    times Omega dot r, minus r times Omega dot Omega. Omega dot Omega is the length of Omega, squared, which we write Omega squared. On the merry-go-round,
    r lies flat on the floor and Omega points straight up, so Omega dot r is zero. With the minus sign in front, the centrifugal acceleration is just Omega
    squared times r, pointing straight out from the centre. Our merry-go-round turns at point five radians per second, about once every twelve and a half
    seconds. So at two and a half metres from the centre, the centrifugal acceleration is point two five times two and a half, which is point six two five
    metres per second squared. [beat] That's the outward pull a rider feels, as if something were trying to throw them off the edge.
  on_screen_eq:
    latex: -\boldsymbol\Omega\times(\boldsymbol\Omega\times\mathbf r) = \Omega^2\,\mathbf r
    vallis_eq: 'provenance only, not drawn: Vallis (2.13) F_ce = −Ω × (Ω × r) = Ω² r_⊥, here with r already perpendicular to Ω (flat disc) (page image p077
