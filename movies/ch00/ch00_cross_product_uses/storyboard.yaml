  voiceover: 'The same push steers particles from the Sun around our planet. The Sun blows out a thin stream of charged
    particles, called the solar wind, and Earth''s magnetic field reaches far out into space to meet it. The part of a particle''s
    velocity across the field is bent into a circle, while the part along the field isn''t touched at all, so the particle
    spirals along the field lines. The field lines dip down into the atmosphere near the magnetic poles, so that''s where
    the particles arrive. About a hundred kilometres up, they hit the air and make it glow: the aurora, the northern and
    southern lights. On the night of the tenth of May, twenty twenty four, the strongest solar storm in about twenty years
    pushed the aurora far towards the equator, and satellites saw it glowing over Europe and North America.'
