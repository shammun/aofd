  visual: '''To sum up'' (house §2): one mini picture per sentence — spanner, ball pulled in, aurora helix, flat energy
    bar, wheel ω × r and globe Ω × r, NH/SH turning, Ian/Idai spin, geostrophic arrows along isobars, Ekman arrow and the
    cold coastal strip. No headings.'
  voiceover: 'To sum up, the cross product measures how much one arrow reaches across another, and about which axis. For
    a spanner, r cross F is the torque. For a whirling ball, r cross p is its angular momentum, which a pull along the string
    can''t change, so pulling in makes it spin faster. For a moving charge, the push is its charge times v cross B, which
    steers particles from the Sun into the aurora. A push always at a right angle to the motion does no work: it turns a
    motion without speeding it up. For a spinning wheel, and for the spinning Earth, each point moves at the spin cross
    r. Moving air feels the Coriolis push, minus two Omega cross u, and for flat winds that''s minus f k cross u: to the
    right in the north, and to the left in the south. That''s why storms spin. When this push balances the pressure push,
    we get the geostrophic wind, one over f rho times k cross grad p, along the isobars. And in the ocean, the same quarter
    turn moves the top layer at a right angle to the wind, which brings cold water up along some coasts. Later videos in
    this series take the Coriolis effect, the geostrophic wind and the Ekman layer much further, with more real maps and
    real storms.'
