    S7: keywords ''geostrophic balance'', ''geostrophic wind'' (68 px) - UV2-30: both words spoken with the fixed

    lexicon entry.

    '
  voiceover: Why does it end up along the isobars? In steady flow, the air isn't speeding up, slowing down, or turning, so the pushes on it add up to zero.
    Only two pushes act here, so they must be equal in size and opposite in direction. The pressure push points towards the low, so the Coriolis push must
    point towards the high. And the Coriolis push is the wind turned a quarter turn to the right. So the wind must blow along the isobars, with the high
    on its right and the low on its left. This is called geostrophic balance, and the wind it gives is the geostrophic wind.
  on_screen_eq: null
