- id: s46b_ekman
  t:
  - 2208.7
  - 2259.225
  status: new
  changes:
  - W7 Ekman 90° (research §4, §5b)
  related:
  - '#31 Ekman layers'
  visual: '3-D ocean slab (illustrative block: a stack of thin layers for the top 50 m); wind arrow τ (orange) east over
    the surface; layer arrows (teal) turn to the right with depth (Ekman spiral from fluidpy.core.gfd.ekman_surface, K =
    0.05 m²/s); the depth-sum arrow M_E (violet) points south, exactly 90° right of τ; surface arrow at 45° labelled ''45°
    · surface''; then a SH copy turning left. Maths zone: M_E = −(1/f) k × τ built with underbraces ''turn left a quarter'',
    ''minus → right (NH)''.'
  voiceover: 'The same quarter turn works in the ocean too. When the wind blows over the sea, it drags the top layer of
    water along, and the Coriolis effect turns the moving water. Added up over the whole top layer, a few tens of metres
    deep, the water ends up moving at a right angle to the wind: to the right in the Northern Hemisphere, and to the left
    in the Southern. This flow is called the Ekman transport. The wind''s drag on each square metre of sea is an arrow called
    the wind stress, tau, and the Ekman transport is minus one over f, times k cross tau. The water right at the surface
    turns less, about forty five degrees in the simplest theory; it''s the whole layer, added up, that moves at ninety degrees.'
  on_screen_eq:
    latex: \mathbf M_E=-\frac{1}{f}\,\mathbf k\times\boldsymbol\tau
    vallis_eq: (5.191a) top Ekman layer (on screen without its number)
