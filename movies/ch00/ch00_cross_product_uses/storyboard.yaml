  add_v4:
  - name: HalfEarth3D
    spec: 'a Globe3D variant cut along the meridian plane through a given longitude: the far half (lon0 + 0..180°) is removed; the flat face is a half-disc
      mesh (slate #2b3550 90 %, warm-white rim 3 px) lying IN the plane that contains the axis, so the axis line (gold) and r are drawn ON the face and
