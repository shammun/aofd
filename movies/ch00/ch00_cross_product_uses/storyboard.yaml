    NASA Blue Marble Next Generation'' (SRC_BM) at the bottom of the picture, muted, >= 28 px.

    S1: keyword ''why only g?'' (54 px).

    S2: keyword ''never alone''.

    S3: a brown arrow at the pin pointing to Earth''s centre (display scale, long), gloss ''gravitational attraction'' (44 px).

    S4: tip label ''g*'' (brown).

    S5: keyword ''both depend only on where'' with gold pointers to the brown and the slate arrow.

    S6: head-to-tail sum at the pin (the slate arrow drawn ×100 longer than its true ratio to g*, so the tilt can be seen); the resultant brown ''g'', tip
    label ''g'', gloss ''effective gravity''.

    S7: on_screen_eq (T.eq 84, g brown, the centrifugal term slate).

    S8: three small code-drawn icons in a row at the bottom of the maths zone: a plumb bob, a bathroom scale, a dropped ball, each with a short brown arrow
    along g; keyword ''the g of weather equations'' (54 px).

    S9: on_screen_eq_extra 1 (84 px), underbrace ''pressure push, …'' under ''other pushes''.

    S10: a gold underbrace under g: ''g* − Ω × (Ω × r)'' (54 px, the centrifugal part slate).'
  voiceover: 'So why don''t weather equations have a centrifugal term? Because it never acts alone. One of the real pushes on every kilogram of air is Earth''s
    gravitational attraction, which pulls it almost straight towards Earth''s centre. Let''s write it g star. Like the centrifugal acceleration, it depends
    only on where the air is. So we add the two together, and call the sum effective gravity, g. g equals g star, minus Omega cross, open bracket, Omega
    cross r. This is the gravity that a plumb line, a bathroom scale, or a dropped ball feels, and it''s the g in every weather equation. So the rider''s
    equation becomes: d u by d t equals the other real pushes, like the pressure push, plus g, minus two Omega cross u. The centrifugal acceleration is
    still there, just folded into g.'
  on_screen_eq:
