  visual: 'THE SPEED OF THE GROUND, DERIVED (the half-Earth of s25a stays; ''r = (4505, 0, 4505) km'' at r''s tip).

    S1: keyword ''how fast?'' (54 px).

    S2: the circle of latitude at 45°N draws as a gold ring round the axis (on the outer half and continuing in front of

    the face), its centre marked ON THE AXIS with a small gold dot at height 4505 km (not at Earth''s centre).

    S3: the ring''s radius drawn on the face as a dashed gold line from that axis dot to the pin, label ''radius''.

