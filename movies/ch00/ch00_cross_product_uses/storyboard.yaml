    CHANGES FOR THIS MOVIE: an energy-of-motion bar (½|u|², teal) beside the parcel: it ticks up visibly for one kick, barely for ten, and stays flat for the continuous push while the path curves (from the v4 kicks data). C6: '≈ 5.7°' moved outside the angle, clear of u.
  voiceover: 'Why does a push at right angles change only the direction? Let''s try it with numbers. An air parcel moves
    east at ten metres per second. One sideways kick adds one metre per second towards the north. By Pythagoras, its new
    speed is the square root of ten squared plus one squared, about ten point zero five. It has turned by almost six degrees,
    and sped up a little. Now split that kick into ten kicks, each a tenth as big, and each at a right angle to the new
    direction. It turns by almost the same angle, but its speed only grows to about ten point zero zero five. With a hundred
    kicks, it''s ten point zero zero zero five. So a push that acts all the time, always at a right angle, doesn''t change
    the speed at all: it just bends the path into a circle. The push is at a right angle to the motion, so its dot product
    with the velocity is zero, and it does no work: it adds no energy of motion. That''s the dot product video''s rule,
    a push across the motion does no work, and here it comes from a cross product.'
