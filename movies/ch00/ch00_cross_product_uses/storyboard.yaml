  voiceover: 'Earth''s spin is behind that push, so first let''s see how the cross product describes anything that spins,
    starting with a wheel lying flat, like a potter''s wheel. Its spin is an arrow too, called small omega, along the axle.
    Curl the fingers of your right hand the way the wheel turns, and your thumb points along small omega. Its length is
    how fast the wheel turns, in radians per second, where a full turn is two pi radians. Say the wheel turns anticlockwise,
    seen from above, at two radians per second, so small omega has components zero, zero and two. Take a point on the rim,
    with an arrow r from the axle to it, zero point three metres long, pointing along x. With the recipe, small omega cross
    r has components zero, zero point six and zero. That''s exactly the rim''s velocity: zero point six metres per second,
    along the rim, at a right angle to both the axle and r. Halfway to the axle, the speed is half as big, and at the axle
    itself, the wheel doesn''t move at all. In the curl and vorticity videos, we''ll see that the curl of this velocity
    is twice small omega, which is how meteorologists measure spin.'
