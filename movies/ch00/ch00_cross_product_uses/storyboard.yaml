  voiceover: 'Second, a charged particle, like a proton, moving through a magnetic field. The first arrow is its velocity,
    v, and the second is the magnetic field, B. The push on the particle is its charge times v cross B. If it moves east
    and the field points straight up, v cross B is along x hat cross z hat, which is minus y hat: a push towards the south.
    This push is always at a right angle to the velocity. So it never speeds the particle up or slows it down. It only bends
    its path into a circle. That''s how particle accelerators steer their beams round a ring.'
  on_screen_eq:
    latex: \mathbf F = q\,\mathbf v\times\mathbf B
    vallis_eq: 'provenance only: the magnetic (Lorentz) force, no book number'
