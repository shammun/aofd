honesty_notes:
- Coriolis is an apparent effect of measuring motion against the turning Earth; said in s26.
- 'Hemisphere signs: right in the NH, left in the SH, none at the equator; f''s sign carries it (s28_f, s29).'
- Inertial period 2π/f ≈ 17 h at 45° (CHECK E2 = 16.92 h) and the equator ground speed ≈ 465 m/s (CHECK E1 = 464.6 m/s)
  are computed by fluidpy, not quoted.
- 'Ekman: the depth-integrated transport is 90° from the stress; the 45° surface angle is the ideal constant-viscosity theory,
  said as such (s46b).'
- Aurora helix and dipole field lines are illustrative geometry, magnified; the 10-11 May 2024 storm facts are cited (NOAA
  SWPC).
- 'Geostrophic arrows vs real 10-m winds: the real winds are slower and cross towards the lows (CHECK G3-G4); the movie
  says ''almost everywhere away from the equator''.'
- Torque and work share the unit N m = J but are different quantities (s04_torque_recap).
quiz_hook: 'In the Southern Hemisphere, the wind blows from the south along a west-facing coast. Which way does the Ekman
  transport go, and is there upwelling? (f < 0, so the transport is 90° to the LEFT of a northward stress: towards the west,
  offshore, so yes, upwelling.)'
