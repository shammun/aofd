    S1: the balanced parcel appears with its teal velocity arrow east.

    S2: keywords ''steady: no speeding up, no slowing, no turning'' → ''pushes add to zero'' (54 px).

    S3: the two push arrows at the parcel, one by one: orange pressure push NORTH, violet Coriolis push SOUTH, equal

