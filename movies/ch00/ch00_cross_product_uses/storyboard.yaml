  voiceover: 'Why would we want an exact quarter turn? Not to change the wind: it names the direction straight to the wind''s
    left, with the wind''s own size. We need it because Earth''s spin gives moving air a push that''s always at a right
    angle to its motion, like the magnet''s push on the proton. A push at any other angle, say thirty degrees off, would
    have a part along the wind, and would speed the air up or slow it down. The spin''s push only turns the air. So we need
    the wind turned by exactly a quarter turn, times a number for its strength. The wind itself doesn''t jump by ninety
    degrees: the push bends its path a little at a time, like our small kicks. And on weather maps, k cross turns the direction
    in which pressure rises into the direction the wind blows.'
