conventions:
  latitude and longitude: phi (latitude, north positive), lambda (longitude, east positive; west negative, e.g. London -0.13 deg, Los Angeles -118.24 deg)
  earth radius: a = 6371 km (easy 6400); spoken "the Earth's radius" (Kokoro reads a lone "a" as the article); once "the letter a" (s02, lexicon proposal)
  position arrow: r-hat = (cos phi cos lambda, cos phi sin lambda, sin phi); x to 0 deg on the equator, y to 90 E, z to the North Pole (Part 3)
  bearing: compass bearing from north, clockwise as seen from above (Part 1); true bearings (magnetic variation ignored)
  delta vs d: Delta for a finite step, d for the tiny limit (Part 3, Should 7)
  polar map: 'polar stereographic, lat_0 = 90, lat_ts = 60, lon_0 = 0: 0 deg at the bottom, 90 E right, 180 top, 90 W left; east = anticlockwise as seen
    from above the North Pole'
  map polar components: i = theta-hat, j = -r-hat; u_theta = u, u_r = -v
  vortex ratio: rms(u_r) / mean(u_theta) on a 2000-km ring (said "typically" for the rms)
colour_contract: great circle gold; rhumb line slate; London's r-hat teal, Los Angeles' r-hat orange; sigma arc gold; true lengths teal; map-drawn lengths
  teal with a gold stretch bracket; unit vectors orange (i, j, r-hat, theta-hat); in/out (radial) rose with a '-' glyph for in; round (tangential) teal;
  height field sequential perceptual (cmocean deep reversed), anomaly diverging blue-white-red centred on 0; wind trails warm white; gold for pointers,
  links, 'same' ticks.
