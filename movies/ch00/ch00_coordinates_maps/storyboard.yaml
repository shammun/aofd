  visual: 'GlobeToPolarMorph (new; three.js). Frame 0: the BMNG globe, large (house globe look), turning slowly eastward (anticlockwise seen from above
    the North Pole). AT(4, ''rise up above the North Pole'') the camera rises along a smooth path (<= 60 °/s, eased) from the equator view to straight above
    the pole, the globe staying centred; edges fade (§5b zoom rule). AT(5, ''rings round the pole'') the parallels 30, 45, 60, 75° N light slate; AT(5,
    ''spokes'') the meridians every 30° light slate. AT(6, ''flatten this view'') the globe opens into the flat polar stereographic map (vertex blend from
    the orthographic view to mapproj ''polar_stereographic'', lat_ts 60, x 80-1000, centred y 460) and stops. Ring labels ''75°'', ''60°'', ''45°'', ''30°''
    (52 px) placed on the 225° spoke side, outside the land; spoke labels ''0°'', ''90° E'', ''180°'', ''90° W'' at the rim (52 px), each on its words.
    AT(12, ''anticlockwise'') a gold curved arrow round the 60° ring, eastward. Column: keywords ''rings = latitude'', ''spokes = longitude'', ''polar stereographic'',
    ''true at 60° N''.'
  voiceover: 'There''s one more map that every forecaster knows: the view from above a pole. Let''s get there from the globe. Here''s the Earth, turning.
    Now let''s rise up above the North Pole, and look straight down. From up here, the circles of latitude become rings round the pole, and the meridians
    become spokes, like the spokes of a wheel. Now let''s flatten this view into a map. The North Pole sits in the middle. The rings are the latitudes:
    seventy five, sixty, forty five and thirty degrees north, going outward. The spokes are the longitudes. Zero degrees, the prime meridian through Greenwich,
    points down. Ninety degrees east points right, a hundred and eighty degrees points up, and ninety degrees west points left. [beat] So going east means
    going round anticlockwise, as seen from above the North Pole. This is polar coordinates again: the distance from the middle grows with the distance
    from the pole, and the angle round the middle is the longitude. This kind of map is called polar stereographic, and this one is drawn true to scale
    at sixty degrees north, like many weather charts of the pole.'
