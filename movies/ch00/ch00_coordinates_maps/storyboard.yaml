    rise 0.0698 and run 0.0349 rad bracketed. Column: CalcStack. AT(8, ''exactly two'') ''1/cos 60° = 2'' with a gold ''same'' tick. AT(11, ''At the equator'')
    the curve''s start point (0, 0) pulses. AT(12, ''at the pole'') the curve rises past the top of the plot with an upward arrow; the 85° point labelled
