    and its Mercator copy 200 × 200 km (teal, sides bracketed ''× 2''), with ''10 000 km²'' and ''40 000 km²'' beside them. AT(7, ''k times k'') the Layered
    TeX ''area stretch = k × k = 1/cos²φ''. AT(8, ''Svalbard'') ''4.9 × 4.9 ≈ 24''. AT(9, ''Greenland looks about as big'') a full Mercator map (BMNG +
    NE admin-0 outlines) placed BELOW the column text with >= 40 px clear (U-CO-076): Greenland and Africa outlined. AT(10, ''In truth'') both outlines
    lift off and are re-drawn at true relative area beside the map in the column (''2.17 million km²'', ''30.4 million km²'', ''≈ 14×''); the ''true size''
    labels sit in the column, never on Greenland.'
  voiceover: 'But keeping shapes has a price: sizes. How much is an area stretched? Take a small square on the globe at sixty degrees north, a hundred kilometres
    on each side. Its area is a hundred times a hundred, ten thousand square kilometres. On a Mercator map, its width is stretched by two, and its height
    by two as well. So it''s drawn two hundred by two hundred, which is forty thousand square kilometres: four times too big. [beat] In general, the width
    is stretched by k and the height by k, so the area is stretched by k times k, k squared, which is one over cosine phi, squared. At Svalbard, k is about
    four point nine, so areas are stretched by about four point nine times four point nine, about twenty four. [beat] That''s why, on a Mercator map, Greenland
    looks about as big as Africa. In truth, Greenland covers about two point one seven million square kilometres, and Africa about thirty point four million.
    Thirty point four divided by two point one seven is about fourteen, so Africa is about fourteen times bigger. [beat] The Mercator map is great for directions
    and shapes, and poor for comparing sizes.'
