    Take a small step north on the globe, by delta phi. From Part 3, its true length is the Earth''s radius times delta phi. On the flat square map, it''s
    drawn just that long, while east-west is drawn one over cosine phi times too long. To keep the shapes, Mercator draws the north step one over cosine
    phi times longer too. So on his map, the step is drawn as the Earth''s radius times delta phi, divided by cosine phi. [beat] Let''s put in numbers.
    One degree north is a hundred and eleven point two kilometres on the ground, everywhere. At Brest, Mercator draws it a hundred and eleven point two
    times one point five zero six long, about a hundred and sixty seven point four kilometres. [beat] At sixty degrees north, he draws it twice as long,
    about two hundred and twenty two point four kilometres. [beat] When the step is tiny, we write d instead of delta, as in Part 3. So d y equals the Earth''s
    radius times d phi, divided by cosine phi. This says how fast the map''s height grows as we go north: slowly near the equator, and faster and faster
    towards the pole.'
