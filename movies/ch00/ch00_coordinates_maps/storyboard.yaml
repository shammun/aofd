honesty_notes:
- 's09: the ten-degree midpoint sums are below the exact values by 0.1-1.5 % up to 80 deg; the 80-90 step is infinite in truth ("at least two more", "far
  more").'
- 's09: Edward Wright, Certaine Errors in Navigation (1599), tables of meridional parts by summing secants every minute of latitude; the ln tan form was
  noticed later (not dated on screen).'
- 's11: the slope check is numerical (decision 5); no symbolic derivative of ln or tan is claimed.'
- 's14: the anomaly values are not spoken; the map shows area distortion. Equal Earth angular deformation at 60 N 30 E is 31.4 deg (scale_factors).'
- 's16: polar stereographic true at 60 N (lat_ts = 60, the WMO convention for many polar charts); ring spacing grows outward (1565, 3186, 4924, 6864 km
  for 75-30 N), not said beyond "the distance from the middle grows with the distance from the pole".'
- 's18: daily-mean NCEP R1 at 2.5 deg; trails move through the frozen daily mean (1 s of screen = 3 h); the wind blows "nearly" along the height contours
  (geostrophic to good approximation in the stratosphere, not exactly).'
- 's19: the polar-night cap is drawn from the solar declination on 21 Jan (-20.2 deg): north of 69.8 N; the vortex size bar is an order of magnitude.'
- 's21: "typically" = root-mean-square of the radial wind round the ring; "averages" = ring mean of the tangential wind; NCEP winds, not geostrophic.'
- Exaggerations (title morph, magnified wedges and steps, the morph blends, time-compressed flights and trails) are listed per scene and in the manifest,
  not badged (HOUSE_STYLE §5).
quiz_hook: 'On a Mercator map, a lake at 60 deg N and a lake on the equator are drawn the same size. Which is bigger in truth, and by how much? (The equator
  lake, about 4 times: Mercator draws areas at 60 deg N 1/cos^2 60 deg = 4 times too big.)'
