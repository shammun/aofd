    at Svalbard. Scale factors like this matter for weather data, because most weather data come on exactly this kind of grid. Suppose two grid points near
    Brest are one degree of longitude apart, and the temperature differs by one degree Celsius between them. The slope we want is per kilometre, not per
    degree. So we divide by the true distance, seventy three point eight kilometres, not by a hundred and eleven point two. That''s about one point four
    degrees per hundred kilometres. [beat] In symbols, the eastward slope is one over the Earth''s radius times cosine phi, times the change with longitude.
    Together with the northward slope, it makes the gradient on the sphere. We''ll build it step by step in the next movie in this series: The gradient.
