title: 'Coordinates, Part 5 — Routes and maps: great circles and map projections'
title_card:
  line1: Coordinates · Part 5
  line2: Routes and maps
  subtitle: great circles and map projections
  spoken: short (s00 sentence unchanged)
version: 1
concepts:
- curvilinear coordinates (curved coordinate lines, unit vectors that change with place, scale factors); scale factors r, a, a cos phi (Vallis §2.2.2, text
  before (2.27))
- the gradient on the sphere named (Vallis (2.31) horizontal part), pointer to
- 'great circles: the plane through both places and the centre; sigma = the angle at the centre; d = a sigma; cos sigma = r1-hat . r2-hat'
- 'great-circle route shape: initial bearing, vertex latitude, arrival bearing'
- 'rhumb lines: constant bearing, length, why navigators used them (steering, short trips, straight on Mercator, legs)'
- 'flattening: plate carree x = a lambda, y = a phi (true along the equator and the meridians); east-west stretch k = 1/cos phi'
- 'Mercator: the conformal idea, dy = a dphi / cos phi, y by adding up steps, y = a ln tan(pi/4 + phi/2) with a numerical slope check; the natural log as
  a name'
- rhumb lines straight on Mercator; areal stretch 1/cos^2 phi (Greenland vs Africa); equal-area maps (Equal Earth); pick the map for the job
- 'the polar stereographic map as polar coordinates: rings = latitude, spokes = longitude; reading it (a place tour)'
- 'the 10-hPa stratospheric polar vortex on 21 Jan 2026: east = tangential (theta-hat), north = -radial (-r-hat); westerlies anticlockwise seen from above
  the North Pole'
- choosing the origin of polar coordinates (flat ring; the vortex about the pole vs about its own centre)
