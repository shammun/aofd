  visual: 'Column first: ''e ≈ 2.718''; ''ln x: e to what power gives x?''; ''ln 1 = 0'', ''ln e = 1'' (68 px) on their words; a small curve of ln x (teal)
    through (1, 0) and (e, 1) on the left. AT(''Here''s the answer'') the main formula (96 px) with a gold underbrace under π/4 ''forty five degrees''.
    AT(''Let''s test it'') the table from s20 returns on the left with a new column ''formula''; the 60° row: inputs ''45° + 30° = 75°'', ''tan 75° ≈ 3.732'',
    ''ln 3.732 ≈ 1.317'' beside ''10° sum 1.313'' and ''1° sum 1.317'' (gold ''same'' tick). AT(14, ''At Brest'') the Brest row and the Mercator ladder''s
    Brest mark at 0.968 a ≈ 6165 km, with the plate carrée''s 5381 km mark beside it (slate) for comparison.'
  voiceover: 'Adding up tiny steps like this is the integration we met in Part 3, and this sum has an exact answer. To write it, we need one new tool, the
    natural logarithm, written l n. The number e is about two point seven one eight. The natural logarithm of a number answers one question: e to what power
    gives this number? So l n of one is zero, because e to the power zero is one. And l n of e is one. [beat] Here''s the answer to our sum: y equals the
    Earth''s radius, times the natural logarithm of the tangent of forty five degrees plus half the latitude. Forty five degrees is pi over four radians,
    so on screen it''s pi over four plus phi over two. Let''s test it against our table. At sixty degrees, forty five plus thirty is seventy five degrees.
    Its tangent is three point seven three two, and l n of three point seven three two is one point three one seven. [beat] Our ten-degree sum gave one
    point three one three, very close. With one-degree steps, the sum gives one point three one seven, the same to three decimals. [beat] At Brest, forty
    five plus half of forty eight point four is sixty nine point two degrees. Its tangent is two point six three two, and its l n is zero point nine six
    eight. So on a Mercator map, Brest sits zero point nine six eight times the Earth''s radius above the equator, about six thousand one hundred and sixty
    five kilometres. [beat] On the flat square map, it was five thousand three hundred and eighty one.'
