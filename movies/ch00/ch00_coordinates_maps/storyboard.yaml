    near 60° N 90° E brighten; readout ''≈ 79 m/s ≈ 284 km/h''. AT(12, ''stratospheric polar vortex'') keyword ''stratospheric polar vortex''.'
  voiceover: 'Now let''s put real weather on this map. The air pressure falls as we go up. About thirty kilometres up, in the stratosphere, the layer above
    the one where our weather happens, it''s only ten hectopascals, about a hundredth of the pressure at the ground. The height where the pressure is exactly
    ten hectopascals isn''t the same everywhere, and this map shows it on the twenty first of January, twenty twenty six. The colours show that height,
    and the lines join places where it''s the same, every four hundred metres. We''ll fade the place labels now, so that the weather is easy to see. The
    surface is lowest, about twenty eight point six kilometres, over the Barents Sea, at about seventy three degrees north and forty four degrees east.
    And it''s higher further south: about thirty point seven kilometres on average along thirty degrees north. [beat] Now let''s let the air move. The winds
    blow nearly along these lines, round and round the Arctic, from west to east. The fastest, nearly eighty metres per second, about two hundred and eighty
    four kilometres per hour, blow over Siberia, near sixty degrees north. [beat] This great winter whirl of cold air, high above the Arctic, is called
