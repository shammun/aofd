  beat: equal-area maps (Equal Earth), the climate example, angles off by 31 deg; pick the map for the job
  visual: 'Keywords row across the top (y 60-140) from frame 0. Two maps side by side under it, clearly apart (U-CO-077, Should 9): Mercator x 80-880 and
    Equal Earth x 960-1840 (gap >= 80 px), both y 190-700. AT(3, ''Equal Earth map'') the Equal Earth map fills in with Greenland and Africa outlined at
    true relative size. AT(5, ''same temperature map'') both maps show the ERA5 September 2026 2-m temperature anomaly (diverging blue-white-red, centred
    on 0, −6…+6 K); ONE shared colour bar under both maps (y 730-790, 52-px ticks, ''K, vs 1991–2020''), never on a map; source line under the colour bar
    (y <= 860). AT(8, ''far north looks huge'') the Arctic area on Mercator pulses; AT(9, ''shrinks to its true size'') the same area on Equal Earth pulses.
    AT(11, ''thirty one degrees'') a 90° angle mark at 60° N 30° E on both maps, Equal Earth''s skewed by 31° (gold arc). AT(13, ''pick the map for the
    job'') keywords ''conformal -> winds, directions'' and ''equal-area -> amounts''. AT(15, ''How weather maps are made'') keyword ''more: How weather
    maps are made''.'
  voiceover: 'For climate maps, sizes often matter more. If we want to know how much of the Earth was warmer than usual last month, a map that inflates
    the polar regions would mislead us. So climate scientists often use equal-area maps, such as the Equal Earth map, from twenty eighteen. On it, every
    patch keeps its true share of the Earth''s area, so Greenland shows at its real size, about a fourteenth of Africa. Here''s the same temperature map
    for September twenty twenty six, drawn both ways. The colours show how much warmer or colder each place was than its usual September, the average from
    nineteen ninety one to twenty twenty. That difference from the usual is called an anomaly. On the Mercator map, the far north looks huge. On the Equal
    Earth map, it shrinks to its true size. The price now is shape. Towards the poles, shapes get skewed: at sixty degrees north and thirty degrees east,
    angles can be off by about thirty one degrees. [beat] No flat map can keep both areas and shapes right everywhere. So the rule is: pick the map for
    the job. Use conformal maps for winds and directions, and equal-area maps for comparing amounts. Which maps forecasters use, and why, has its own movie
    later in this series: How weather maps are made.'
