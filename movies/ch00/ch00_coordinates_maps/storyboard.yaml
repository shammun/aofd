  voiceover: 'Next, we''ll build the simplest map step by step, with every number. That''s for anyone who enjoys every step. For the intuition behind weather,
    climate science or GIS, you only need the result, so if it feels like a lot, skip ahead to the time on screen. We''ll build it from the lines on the
    globe whose lengths we know. First, the equator. Cut it, and unroll it into a straight line across the page. Its length is two pi times the Earth''s
    radius, about forty thousand kilometres. A place at longitude lambda, in radians, is the Earth''s radius times lambda along the equator from the prime
    meridian. That''s the arc rule again. So we set x equal to the Earth''s radius times lambda. [beat] Second, the meridians. Each one runs from the equator
    to the pole, and a place at latitude phi is the Earth''s radius times phi from the equator, along its meridian. That''s the distance north from Part
    3. So we draw every meridian as a straight line going up the page, and set y equal to the Earth''s radius times phi. [beat] Let''s try Brest, at forty
    eight point four degrees north, and four and a half degrees west. In radians, that''s zero point eight four four six, and minus zero point zero seven
    eight four. So x is six thousand three hundred and seventy one times minus zero point zero seven eight four, about minus five hundred kilometres: just
    west of the middle line. [beat] And y is six thousand three hundred and seventy one times zero point eight four four six, about five thousand three
    hundred and eighty one kilometres. [beat] That''s exactly how far Brest is from the equator, walking north along its meridian. So along the equator,
    and along every meridian, this map is true to scale. It''s called the plate carrée, French for flat square, and most weather data come on exactly this
