  beat: 'D52: constant bearing = constant slant; Mercator stretches both parts equally, so the rhumb line is straight'
  visual: 'Left: the globe with the slate rhumb line; AT(5, ''Zoom into any short piece'') a zoom inset (house Zoom-reveal) of one short piece: a right
    triangle with legs ''west 4.9'' and ''south 1'' (teal, orange) and the bearing arc. AT(9, ''Now draw it on the Mercator map'') the triangle moves to
    the Mercator map (right), both legs grow by the same factor (two copies at two latitudes, ''× 1.31'' at 40° N and ''× 1.56'' at 50° N on the legs),
    the slant unchanged (gold ''same'' tick). AT(13, ''straight line'') the London-Los Angeles rhumb line draws straight on Mercator (slate) with a ruler
    glyph; AT(14, ''comes out curved'') the gold great circle bulges north on the same map. AT(15, ''swap looks'') the globe (left) and the map (right)
    side by side, both routes on each. AT(''here''s what to keep'') keyword ''if you skipped, keep this:'' (54 px, gold) and the takeaway''s numbers as
    keywords in the column, beside the picture named in the sentence. Here: the Mercator ladder with its steps growing towards the top, ''× 1/cos φ'' beside
    it.'
  voiceover: 'If you skipped, here''s what to keep. Mercator stretches north-south by the same amount as east-west, one over cosine phi, so his map grows
    taller and taller towards the poles, and it can never show the poles themselves. Now we can see why a rhumb line is straight on a Mercator map. A rhumb
    line keeps one compass bearing. Zoom into any short piece of it. On the globe, it''s a tiny slanted step: some distance west, and some distance south.
    Keeping the same bearing means the same slant everywhere. For our route at two hundred and fifty eight and a half degrees, every piece goes about four
    point nine kilometres west for each kilometre south. [beat] Now draw it on the Mercator map. At each latitude, Mercator stretches the west part and
    the south part by the same amount, one over cosine phi. Stretching both parts by the same amount leaves their ratio unchanged. So on the map, every
    piece of the route has the same slant, four point nine across for each one down. A line whose slant never changes is a straight line. [beat] The great
    circle keeps changing its bearing, so on this map it comes out curved, bulging towards the pole. The two routes swap looks: on the globe, the great
    circle looks straight and the rhumb line curves, and on Mercator''s map it''s the other way round.'
