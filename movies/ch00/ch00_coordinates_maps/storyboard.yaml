  voiceover: 'Now let''s use the rule from the dot product movie. The dot product of two arrows is the product of their lengths, times the cosine of the
    angle between them. Our two arrows both have length one, so their dot product is just the cosine of sigma. That''s the shadow picture again: the shadow
    of one arrow of length one on the other. To take the dot product, multiply the matching parts and add. Zero point six two two times minus zero point
    three nine two is minus zero point two four four. [beat] Minus zero point zero zero one times minus zero point seven three zero is about plus zero point
    zero zero one. [beat] And zero point seven eight three times zero point five six zero is zero point four three eight. [beat] Adding the three gives
    about zero point one nine five. So the cosine of sigma is zero point one nine five. [beat] Which angle has a cosine of zero point one nine five? A calculator''s
    inverse cosine says about seventy eight point seven degrees. [beat] A cosine just below zero point two means an angle a little less than ninety degrees,
    so London and Los Angeles are almost a quarter of the way round the Earth from each other.'
