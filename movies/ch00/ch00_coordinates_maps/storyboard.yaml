  voiceover: 'How can we be sure the formula is right everywhere, not just at a few points? Its slope must match the drawn step: one over cosine phi for
    each radian of phi. Let''s check its slope at sixty degrees with the centred difference from the derivatives movie. At sixty one degrees, the formula
    gives one point three five two four. At fifty nine degrees, it gives one point two eight two six. [beat] The difference is zero point zero six nine
    eight, and the two points are two degrees apart, which is zero point zero three four nine radians. Zero point zero six nine eight divided by zero point
    zero three four nine is about two point zero zero. [beat] And one over the cosine of sixty degrees is exactly two. So the formula''s slope is the stretch
    we wanted. Two more checks. At the equator, the tangent of forty five degrees is one, and l n of one is zero, so y is zero, as it should be. [beat]
    And at the pole, the angle becomes ninety degrees, where the tangent has no end: it grows without limit. So the pole is infinitely far up the map. At
    eighty five degrees, y is already three point one three times the Earth''s radius, about nineteen thousand nine hundred and fifty kilometres. [beat]
    That''s why Mercator maps are always cut off before the poles, usually somewhere past eighty degrees.'
