  beat: 'why: three good reasons (shape, measurement, meaning)'
  visual: 'Three beats, one per reason, each a mini picture filling the width in turn (first from frame 0, Should 18): (1) shape: the hurricane ring ''r
    = const'', the globe ''r = a'', the great circle with ''σ''; (2) measurement: a radar''s rings, a station''s i, j, k, the ERA5 latitude-longitude grid;
    (3) meaning: spin and inflow arrows round a storm, along/across arrows at a coast, round/in arrows on a small polar map. AT(11, ''Maps follow the same
    rule'') the three mini pictures shrink into a row and the Mercator and Equal Earth thumbnails join them.'
  voiceover: 'So why are there so many coordinate systems and maps? There are three good reasons. The first is shape. When the coordinates match the shape
    of the problem, the numbers become simple. A ring round a hurricane''s eye is just r equals a constant, the Earth''s surface is just r equals its radius,
    and a great circle route is just one angle, sigma. The second is measurement. We use the coordinates that our instruments and data use. A radar sees
    distance and direction, a weather station feels east, north and up, and weather data come on a grid of latitude and longitude. The third is meaning.
    The right coordinates split a vector into the parts that physics cares about: spin and inflow round a storm, along and across a coast, or round and
    in for a whirl round the pole, as we''ll see next. Maps follow the same rule: we choose the one that keeps what our question needs.'
