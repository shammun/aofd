  voiceover: 'Now let''s put coordinates to work on a question every airline asks: what''s the shortest way between two places? It matters, because a shorter
    route burns less fuel and takes less time. On a flat sheet of paper, the shortest way is a straight line. But a plane can''t tunnel through the Earth,
    so it has to follow the curved surface. On a sphere, the shortest way follows a great circle. A great circle is any circle on the sphere whose centre
    is the centre of the Earth. The equator is one, and so is every meridian, together with its partner on the other side of the globe. The other circles
    of latitude are not great circles: their centres sit on the Earth''s axis, above or below the Earth''s centre, so they''re smaller.'
