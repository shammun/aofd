  visual: 'Back to the polar map (field and trails at 70 %). AT(2, ''Its own centre'') the gold cross at 72.9° N 44.3° E with ''≈ 1900 km'' along a gold
    line to the pole. AT(4, ''ring two thousand kilometres from the pole'') a slate ring round the pole; its winds split into round (teal) and in/out (rose
    with a ''−'' glyph for in) ticks at 36 points, a legend ''ticks: round · in/out'' in the column (Should 10). Column bars (Balance style, one shared
    zero line): ''round ≈ 17.5 m/s'', ''in/out (typical) ≈ 33 m/s'', ratio bar ''≈ 1.9''. AT(''vortex''s own centre instead'') the ring re-centres on the
    gold cross (eased glide), the ticks re-split: ''round ≈ 47 m/s'', ''in/out ≈ 20 m/s'', ratio bar ''≈ 0.4'' beside the first (Should 10 kept). AT(8,
    ''just like the hurricane'') the Part 1 ring thumbnail. AT(11, ''Waves on the jet'') keywords ''more: Waves on the jet'' and then ''more: The polar
    vortex'' (>= 8 frames apart).'
  voiceover: 'Now back to the vortex. Its own centre isn''t at the pole. It''s at about seventy two point nine degrees north and forty four point three
    degrees east, over the Barents Sea, about one thousand nine hundred kilometres from the pole. Let''s draw a ring two thousand kilometres from the pole,
    and split the winds on it with the pole as the origin. The round part averages only about seventeen and a half metres per second, and the in and out
    part is typically about thirty three, almost twice as big: a ratio of about one point nine. [beat] Now draw a ring two thousand kilometres from the
    vortex''s own centre instead. The round part averages about forty seven metres per second, and the in and out part is typically about twenty, less than
    half: a ratio of about zero point four. [beat] So about its own centre, the vortex is mostly spin, just like the hurricane round its eye. Choosing the
    origin is part of choosing good coordinates: put it at the centre of the thing that turns. When the polar vortex weakens or splits, cold air can spill
    south into the places where people live. That story has its own movies later in this series: Waves on the jet, and The polar vortex.'
