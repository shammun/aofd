  beat: 'D50 part 1: Mercator y by adding up the drawn steps (table, 10-degree steps, midpoint stretch); Edward Wright 1599'
  visual: 'Left: a tall Mercator ladder (y axis in units of a, 0 at the equator) next to a globe slice; each 10° step on the globe (teal arc) is drawn on
    the ladder as a teal block whose height is the step × stretch; blocks stack up from the equator on their words, the first three computed in full, the
    rest quicker. Column: a table without boxes with columns ''step'', ''middle'', ''1/cos'', ''drawn step'', ''total'' (52-68 px, rows on their words,
    older rows at 60 %). AT(13, ''they grow'') a gold brace along the blocks. AT(14, ''eighty to ninety'') the 80-90 block is drawn as an open-topped block
    that runs off the top of the ladder with an upward arrow. AT(15, ''Edward Wright'') keyword ''1599: Edward Wright, a table of added-up steps''.'
  voiceover: 'So how high up the map is a place at latitude phi? It''s the sum of all the drawn steps, from the equator up to phi. Let''s add them up, ten
    degrees at a time. Ten degrees is zero point one seven four five radians. For each step, we use the stretch in the middle of the step. From zero to
    ten degrees, the middle is five degrees, where one over cosine is one point zero zero four. So the first step is drawn zero point one seven four five
    times one point zero zero four, about zero point one seven five times the Earth''s radius, or about one thousand one hundred and sixteen kilometres.
    [beat] From ten to twenty degrees, the middle is fifteen degrees, the stretch is one point zero three five, and the step is zero point one eight one.
    The running total is zero point three five six. [beat] From twenty to thirty degrees, the stretch is one point one zero three, the step is zero point
    one nine three, and the total is zero point five four nine. [beat] Let''s speed up. The total reaches about one point zero one at fifty degrees, one
    point three one at sixty, one point seven three at seventy, and two point four at eighty. [beat] Look at the steps: they grow as we go north, because
    the stretch grows. The last ten degrees, from eighty to ninety, add at least two more on their own, and we''ll see soon that they add far more. Navigators
    really did it this way: in fifteen ninety nine, the English mathematician Edward Wright published a table made by adding up such steps, one minute of
    latitude at a time.'
