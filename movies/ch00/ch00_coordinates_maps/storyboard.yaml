  beat: 'D52: constant bearing = constant slant; Mercator stretches both parts equally, so the rhumb line is straight'
  visual: 'Left: the globe with the slate rhumb line; AT(3, ''Zoom into any short piece'') a zoom inset (house Zoom-reveal) of one short piece: a right
    triangle with legs ''west 4.9'' and ''south 1'' (teal, orange) and the bearing arc. AT(7, ''Now draw it on the Mercator map'') the triangle moves to
    the Mercator map (right), both legs grow by the same factor (two copies at two latitudes, ''× 1.31'' at 40° N and ''× 1.56'' at 50° N on the legs),
    the slant unchanged (gold ''same'' tick). AT(11, ''straight line'') the London-Los Angeles rhumb line draws straight on Mercator (slate) with a ruler
    glyph; AT(12, ''comes out curved'') the gold great circle bulges north on the same map. AT(13, ''swap looks'') the globe (left) and the map (right)
    side by side, both routes on each.'
  voiceover: 'Now we can see why a rhumb line is straight on a Mercator map. A rhumb line keeps one compass bearing. Zoom into any short piece of it. On
    the globe, it''s a tiny slanted step: some distance west, and some distance south. Keeping the same bearing means the same slant everywhere. For our
    route at two hundred and fifty eight and a half degrees, every piece goes about four point nine kilometres west for each kilometre south. [beat] Now
    draw it on the Mercator map. At each latitude, Mercator stretches the west part and the south part by the same amount, one over cosine phi. Stretching
    both parts by the same amount leaves their ratio unchanged. So on the map, every piece of the route has the same slant, four point nine across for each
    one down. A line whose slant never changes is a straight line. [beat] The great circle keeps changing its bearing, so on this map it comes out curved,
    bulging towards the pole. The two routes swap looks: on the globe, the great circle looks straight and the rhumb line curves, and on Mercator''s map
    it''s the other way round.'
  on_screen_eq:
    latex: \frac{\text{west step}}{\text{south step}}=\tan(258.5^\circ-180^\circ)\approx4.9
    vallis_eq: 'none in Vallis: loxodrome (Snyder 1987 §7, tan α = Δλ/Δψ); fluidpy.geo.sphere.rhumb_line'
    page_png: null
  calc_rows:
