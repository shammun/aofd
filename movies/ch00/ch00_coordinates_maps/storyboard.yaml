  visual: 'One beat per sentence, mini pictures reused (no headings): the orange peel; the plate carrée with ''x = a λ, y = a φ'' and ''k = 1/cos φ''; the
    two Brest grid points with ''73.8 km''; the Mercator ladder with dy and the ln tan formula; the rhumb line straight on Mercator; the 100-km square ''×
    4'' and Greenland vs Africa; the Equal Earth map; the polar map with i = θ̂, j = −r̂ and the vortex centre; a gradient-arrow thumbnail with the keyword
    ''next: The gradient'' on the last sentence. Each spoken number on screen at its words.'
  voiceover: 'To sum up, flattening the Earth always stretches something. The flat square map, with x equal to the Earth''s radius times lambda, and y equal
    to the radius times phi, is true along the equator and the meridians, but it stretches east-west by one over cosine phi. Scale factors like this matter
    whenever we measure slopes on a weather grid. Mercator stretches north-south by the same amount, so small shapes and angles stay right, and rhumb lines
    are straight. His map''s height is the Earth''s radius times l n of the tangent of forty five degrees plus half the latitude. But areas grow by one
    over cosine phi, squared, so equal-area maps are better for comparing amounts. Seen from above the North Pole, a map is polar coordinates again: east
    is round, north is in, and the polar vortex is mostly spin about its own centre. Next in this series, we''ll measure how fast the temperature changes
    across a map: the gradient.'
