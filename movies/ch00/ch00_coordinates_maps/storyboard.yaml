  voiceover: 'Now look at a circle of latitude, called a parallel. On this map, every parallel is drawn as a straight line across the page, as long as the
    equator: two pi times the Earth''s radius, about forty thousand and thirty kilometres. But on the globe, the parallel through Brest is a smaller circle.
    As we saw in Part 3, its radius is the Earth''s radius times cosine phi, about four thousand two hundred and thirty kilometres. So its true length is
    two pi times four thousand two hundred and thirty, about twenty six thousand five hundred and eighty kilometres. [beat] The map draws twenty six thousand
    five hundred and eighty kilometres as forty thousand and thirty. So east-west distances at Brest are stretched by forty thousand and thirty divided
    by twenty six thousand five hundred and eighty, about one point five. [beat] Let''s write that with symbols. The stretch, called k, is two pi times
    the Earth''s radius, divided by two pi times the Earth''s radius times cosine phi. The two pi and the radius cancel, so k equals one over cosine phi.
    [beat] At Brest, that''s one over zero point six six four, about one point five. At sixty degrees north, it''s one over zero point five, which is two.
    And at Longyearbyen, on Svalbard, at seventy eight point two degrees north, it''s one over zero point two zero four, almost five. [beat] North-south
    distances aren''t stretched at all. So a small circle near Brest is drawn as an oval, one and a half times wider than it is tall, and near the poles,
    shapes are squashed flat.'
