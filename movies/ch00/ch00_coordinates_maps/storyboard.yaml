  beat: 'D55: east = tangential (theta-hat), north = -radial (-r-hat); u_theta = u, u_r = -v; westerlies anticlockwise'
  visual: 'Same map, field dimmed to 60 %, trails slowed. AT(2, ''Pick any point'') a point at 60° N 90° W (left) gets its east arrow i (orange) and north
    arrow j (orange). AT(3, ''theta hat'') the map''s polar arrows r̂ and θ̂ (slate) at the same point; θ̂ slides onto i with a gold ''same'' tick. AT(5,
    ''opposite of r hat'') r̂ flips onto j: tag ''−r̂''. Column: ''i = θ̂'', ''j = −r̂'', then ''u_θ = u'', ''u_r = −v'' on their words. AT(3, ''anticlockwise'')
    a gold arrow round the 60° ring. AT(10, ''hurricane in Part 1'') a small Part 1 hurricane-ring thumbnail beside the map with a size bar (≈ 100 km vs
    ≈ 6000 km across). AT(11, ''long winter night'') a dark polar-night cap over the middle of the map (slate shading north of the terminator for 21 Jan,
    from the solar declination).'
  voiceover: 'Let''s describe these winds in the map''s polar coordinates. Pick any point, and draw its east and north arrows. The east arrow points round
    the middle, anticlockwise as seen from above: it''s exactly the map''s theta hat at that point. The north arrow points straight at the middle, towards
    the pole. That''s the opposite of r hat, which points outward. So the north arrow is minus r hat. [beat] That means the eastward wind u is the tangential
    wind round the pole, and the northward wind v is the radial wind with its sign flipped, because blowing north means blowing in. So u sub theta equals
    u, and u sub r equals minus v. Westerly winds, the winds from the west, go round anticlockwise, as seen from above the North Pole. So the polar vortex
    spins the same way as the hurricane in Part 1, but it''s far wider: thousands of kilometres across, instead of about a hundred. And unlike a hurricane,
    it isn''t fed by a warm sea: it forms because the polar stratosphere cools in the long winter night.'
  on_screen_eq:
    latex: u_\theta=u,\qquad u_r=-v
    vallis_eq: 'none in Vallis: polar components on the polar map (Part 1 D04 with i = θ̂, j = −r̂); Vallis (2.29) v = i u + j v + k w for i, j'
    page_png: chapters/pages/ch02/p081.png
  calc_rows:
  - \mathbf i=\hat{\boldsymbol\theta},\qquad \mathbf j=-\hat{\mathbf r}
  physics_source:
    fn: fluidpy.core.coords.unit_vectors_polar; fluidpy.geo.sphere.enu_basis; fluidpy.geo.mapproj.forward('polar_stereographic')
