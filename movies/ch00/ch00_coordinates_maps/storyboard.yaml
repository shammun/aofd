  beat: 'D47: why some prefer the rhumb line (three reasons: steering, short trips, a ruler on Mercator)'
  visual: 'Three beats, one per reason, the globe staying left. Reason 1 AT(3, ''steering''): two compass dials in the column: the rhumb dial fixed at 258.5°
    (slate), the great-circle dial sweeping 312° -> 214° while the plane glyph flies the gold route (heading from DM12, same strip as s12). AT(6, ''a lot
    of calculation'') a small pencil-and-table glyph. Reason 2 AT(7, ''short trips''): the globe turns (eased) to Brest and Lisbon; the two routes drawn
    there lie on top of each other; column ''Brest -> Lisbon ≈ 1138 km'', ''rhumb + ≈ 150 m'' with a magnifier glyph. Reason 3 AT(10, ''Mercator map''):
    a small Mercator chart with a ruler laid from London to Los Angeles along the straight slate line and a protractor reading 258.5°. AT(12, ''rhumb-line
    legs'') on the globe, the gold great circle with four slate rhumb-line legs hugging it.'
  voiceover: 'So why would anyone choose the longer route? There are three reasons. The first is steering. A rhumb line needs one compass setting for the
    whole trip: set two hundred and fifty eight and a half degrees, and hold it. The great circle needs a new heading all the time, from three hundred and
    twelve degrees at London to two hundred and fourteen at Los Angeles. Before satellites and computers, a ship''s navigator with a compass could steer
    a rhumb line easily, but a great circle only with a lot of calculation. The second reason is that, on short trips, the extra distance is tiny. From
    Brest to Lisbon, about one thousand one hundred and thirty eight kilometres, the rhumb line is only about a hundred and fifty metres longer. [beat]
    The third reason is a map. On the most famous flat map, the Mercator map, a rhumb line is a straight line. So a navigator could draw the route with
    a ruler, read off its angle, and steer by it. That''s why long voyages were often split into a few rhumb-line legs that follow the great circle closely:
    each leg is easy to steer, and the whole route is nearly the shortest. To see why that map makes rhumb lines straight, we first need to flatten the
    Earth.'
  on_screen_eq: null
  calc_rows:
