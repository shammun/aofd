  beat: 'D48 (1)-(3): why x = a lambda and y = a phi make sense; Brest on the map'
  visual: 'Two views side by side (picture zone split): left, the globe with the equator gold; right, the empty page with the x axis. AT(3, ''Cut it, and
    unroll'') the equator unrolls from the globe onto the page as a straight gold line ''2πa ≈ 40 030 km'', with ticks every 30° of λ (each ''≈ 3336 km'').
    AT(7, ''So we set x'') ''x = a λ'' in the column with a gold link to one tick. AT(8, ''Second, the meridians'') Brest''s meridian lights teal on the
    globe and unrolls onto the page as a vertical line from the equator; AT(11, ''So we draw every meridian'') all meridians every 30° drop into place;
    ''y = a φ''. AT(''Let''s try Brest'') inputs row, CalcStack, and Brest''s dot lands on the page at (−500, 5381) km with dashed teal legs and gold links
    from the two numbers. AT(17, ''true to scale'') the equator and the meridians pulse. AT(18, ''plate carrée'') keyword ''plate carrée = flat square'';
    the BMNG plate carrée fills in under the lines.'
  voiceover: 'We''ll build it from the lines on the globe whose lengths we know. First, the equator. Cut it, and unroll it into a straight line across the
    page. Its length is two pi times the Earth''s radius, about forty thousand kilometres. A place at longitude lambda, in radians, is the Earth''s radius
    times lambda along the equator from the prime meridian. That''s the arc rule again. So we set x equal to the Earth''s radius times lambda. [beat] Second,
    the meridians. Each one runs from the equator to the pole, and a place at latitude phi is the Earth''s radius times phi from the equator, along its
    meridian. That''s the distance north from Part 3. So we draw every meridian as a straight line going up the page, and set y equal to the Earth''s radius
    times phi. [beat] Let''s try Brest, at forty eight point four degrees north, and four and a half degrees west. In radians, that''s zero point eight
    four four six, and minus zero point zero seven eight four. So x is six thousand three hundred and seventy one times minus zero point zero seven eight
    four, about minus five hundred kilometres: just west of the middle line. [beat] And y is six thousand three hundred and seventy one times zero point
    eight four four six, about five thousand three hundred and eighty one kilometres. [beat] That''s exactly how far Brest is from the equator, walking
    north along its meridian. So along the equator, and along every meridian, this map is true to scale. It''s called the plate carrée, French for flat
    square, and most weather data come on exactly this kind of grid.'
  on_screen_eq:
