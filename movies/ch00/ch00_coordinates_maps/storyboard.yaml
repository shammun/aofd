  beat: 'D56 part 1 (re-thought, U-CO-083): a flat ring of air, two origins, one point worked by hand'
  visual: 'Full picture zone, a clean flat diagram (no map): a ring of radius 1000 km (km ticks 52 px) round its centre C, ten teal arrows going round anticlockwise
    with moving dashes (10 m/s). AT(4, ''origin at its centre'') origin O₁ = C with r̂, θ̂ (orange) at one point; column ''round 10'', ''in/out 0''. AT(6,
    ''move the origin'') the origin glides 500 km west to O₂ (gold dot, the old origin stays faint). AT(7, ''top of the ring'') point P marked; its wind
    (−10, 0) as a teal arrow. AT(9, ''five hundred kilometres east'') dashed legs 500 east and 1000 north from O₂ to P, the slanted line O₂P with its length
    on AT(10, ''square root''); r̂ (orange) along O₂P. Column CalcStack with inputs ''u = −10, v = 0; r̂ = (0.447, 0.894)''. AT(12, ''radial wind is minus
    ten'') the wind''s shadow on r̂ (rose band, ''−'' glyph): ''u_r ≈ −4.5''. AT(14, ''tangential wind uses theta hat'') θ̂ about O₂ (orange) and the shadow
    on it (teal band): ''u_θ ≈ 8.9''. AT(17, ''Nothing is flowing in'') the radial bands at three more ring points appear (in on one side, out on the other)
    and a gold note ''from the origin, not the air''.'
  voiceover: 'There''s one more choice hidden in polar coordinates: where to put the origin. Let''s see why it matters with a simple flat example first.
    Picture a ring of air, a thousand kilometres from its own centre, going round anticlockwise at ten metres per second. With the origin at its centre,
    every air parcel on the ring moves purely round. The tangential wind is ten, and the radial wind is zero, all the way round. Now keep the same air,
    but move the origin five hundred kilometres to the west. Look at the top of the ring, due north of the centre. There, the wind blows due west: u is
    minus ten, and v is zero. Seen from the new origin, this point is five hundred kilometres east and a thousand kilometres north. Its distance is the
    square root of five hundred squared plus a thousand squared, about one thousand one hundred and eighteen kilometres. So its r hat is five hundred and
    a thousand, each divided by one thousand one hundred and eighteen: zero point four four seven, zero point eight nine four. [beat] The radial wind is
    minus ten times zero point four four seven, plus zero times zero point eight nine four, which is about minus four and a half. It looks as if the air
    is flowing in. [beat] The tangential wind uses theta hat, minus zero point eight nine four, zero point four four seven. It''s minus ten times minus
    zero point eight nine four, plus zero, which is about eight point nine. [beat] Same air, same wind, but the new origin splits it differently. Nothing
    is flowing in at all: the in and out part comes only from where we put the origin.'
  on_screen_eq:
    latex: u_r=\mathbf u\cdot\hat{\mathbf r},\qquad u_\theta=\mathbf u\cdot\hat{\boldsymbol\theta}
    vallis_eq: 'none in Vallis: polar components as dot products (Part 1 D04)'
    page_png: null
  calc_rows:
  - \sqrt{500^2+1000^2}\approx1118\ \text{km}
  - \hat{\mathbf r}=\left(\tfrac{500}{1118},\ \tfrac{1000}{1118}\right)\approx(0.447,\ 0.894)
  - u_r=(-10)(0.447)+(0)(0.894)\approx-4.5
  - u_\theta=(-10)(-0.894)+(0)(0.447)\approx8.9
