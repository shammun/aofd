    ''× 1.5'' (Brest), ''× 2'' (60° N), ''× 4.9'' (Svalbard); each strip grows taller by its own factor (strips at +48.4°, +60°, +78.2°). AT(9, ''watch
    a small circle'') the Brest Tissot oval (real sphere) in its strip grows taller until it is round (gold ring). AT(13, ''road crosses a meridian'') a
    tiny angle mark on the globe and the same angle on the map, gold ''same'' tick. AT(14, ''conformal'') keyword ''conformal = shapes and angles right
    in every small patch''.'
  voiceover: 'In fifteen sixty nine, the map maker Gerardus Mercator had a clever idea to fix the squashed shapes of the flat square map. Think of stretching
    a photo. If you stretch it only sideways, faces look too wide. But if you also stretch it up and down by the same amount, faces look right again, just
    bigger. Mercator did this to the map, one strip of latitude at a time. Near Brest, east-west is stretched by one point five, so he stretched north-south
    near Brest by one point five too. Near sixty degrees north, both by two. Near Svalbard, both by almost five. [beat] Now watch a small circle from the
    globe. On the flat square map, it becomes an oval, too wide. Stretch its strip north-south by the same factor, and it becomes a circle again, only bigger.
    Unlike a photo, though, each strip of latitude needs its own stretch, so the map grows taller and taller towards the poles. Because small shapes stay
    the right shape, small angles stay true as well: the angle at which a road crosses a meridian on the map is the angle on the ground. Maps like this
    are called conformal, which means that they keep shapes and angles right in every small patch.'
