honesty_notes:
- 'City centres, not airports (London 51.51 N 0.13 W; Los Angeles 34.05 N 118.24 W): 8755 km. Build 1''s airports gave 8761 km; flights also add climb,
  descent and wind routing, so "nearly ten hours" is said "before any help or hindrance from the winds".'
- s07 "the biggest circle bends the least" and the taut string are a picture, not a proof (said as a picture).
- 's10 "almost a quarter of the way round": 78.7 deg of 360 deg is 22 % of a full turn.'
- 's14: compass bearings are true bearings; magnetic variation is ignored (not said; recorded here). "Before satellites and computers" refers to open-ocean
  navigation by compass and chart.'
- 's20: the ten-degree midpoint sums are below the exact values by 0.1-1.5 % up to 80 deg; the 80-90 step is infinite in truth ("at least two more", "far
  more").'
- 's20: Edward Wright, Certaine Errors in Navigation (1599), tables of meridional parts by summing secants every minute of latitude; the ln tan form was
  noticed later (not dated on screen).'
- 's22: the slope check is numerical (decision 5); no symbolic derivative of ln or tan is claimed.'
- 's25: the anomaly values are not spoken; the map shows area distortion. Equal Earth angular deformation at 60 N 30 E is 31.4 deg (scale_factors).'
- 's27: polar stereographic true at 60 N (lat_ts = 60, the WMO convention for many polar charts); ring spacing grows outward (1565, 3186, 4924, 6864 km
  for 75-30 N), not said beyond "the distance from the middle grows with the distance from the pole".'
- 's29: daily-mean NCEP R1 at 2.5 deg; trails move through the frozen daily mean (1 s of screen = 3 h); the wind blows "nearly" along the height contours
  (geostrophic to good approximation in the stratosphere, not exactly).'
- 's30: the polar-night cap is drawn from the solar declination on 21 Jan (-20.2 deg): north of 69.8 N; the vortex size bar is an order of magnitude.'
- 's32: "typically" = root-mean-square of the radial wind round the ring; "averages" = ring mean of the tangential wind; NCEP winds, not geostrophic.'
- Exaggerations (title morph, magnified wedges and steps, the morph blends, time-compressed flights and trails) are listed per scene and in the manifest,
  not badged (HOUSE_STYLE §5).
quiz_hook: 'A plane flies from 60 deg N, 0 deg E to 60 deg N, 90 deg E. Which is shorter, the rhumb line (due east along the parallel) or the great circle,
  and which way does the great circle leave? (The great circle: about 4605 km against 5004 km; it leaves heading north-east, at about 49 deg, and bulges
  towards the pole, up to 67.8 deg N at 45 deg E.)'
