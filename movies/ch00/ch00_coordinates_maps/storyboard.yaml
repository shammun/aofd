  beat: recap ('To sum up'); last sentence names The gradient as the next movie
  visual: 'One beat per sentence, mini pictures reused (no headings): the three curvilinear pictures; the scale-factor table; the globe with the slicing
    sheet and σ; the face-on disc ''d = a σ'' with ''cos σ = r̂₁ · r̂₂''; ''78.7°'', ''≈ 8755 km''; the rhumb line beside the great circle ''+11 %''; the
    orange peel; the plate carrée with ''k = 1/cos φ''; the Mercator ladder with dy and the ln tan formula; the 100-km square ''× 4''; Greenland vs Africa;
    the polar map with i = θ̂, j = −r̂ and the vortex centre; a gradient-arrow thumbnail with the keyword ''next: The gradient'' on the last sentence. Each
    spoken number on screen at its words.'
  voiceover: 'To sum up, curvilinear coordinates have curved lines, unit vectors that turn, and scale factors that turn a change of coordinate into a distance.
    On the Earth, the scale factor of latitude is the Earth''s radius, and of longitude, the radius times cosine phi. The shortest way between two places
    follows a great circle, whose centre is the Earth''s centre. Its length is the Earth''s radius times sigma, the angle at the centre, and the cosine
    of sigma is the dot product of the two position arrows. From London to Los Angeles, that''s about seventy eight point seven degrees, or about eight
    thousand seven hundred and fifty five kilometres. A rhumb line keeps one compass bearing, so it''s easy to steer, but here it''s about eleven percent
    longer. Flattening the Earth always stretches something. The flat square map stretches east-west by one over cosine phi. Mercator stretches north-south
    by the same amount, so small shapes and angles stay right, and rhumb lines are straight. His map''s height is the Earth''s radius times l n of the tangent
    of forty five degrees plus half the latitude. But areas grow by one over cosine phi, squared, so equal-area maps are better for comparing amounts. Seen
    from above the North Pole, a map is polar coordinates again: east is round, north is in, and the polar vortex is mostly spin about its own centre. Next
    in this series, we''ll measure how fast the temperature changes across a map: the gradient.'
