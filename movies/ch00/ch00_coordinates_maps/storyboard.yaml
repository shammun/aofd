  voiceover: 'Let''s start by putting our coordinate systems side by side: polar coordinates on a flat map, cylindrical coordinates round a hurricane, and
    latitude and longitude on the Earth. They''re all called curvilinear coordinates, which means coordinates whose lines can curve. They share three features.
    First, the coordinate lines are curves: the rings round a radar, the circles of latitude, and the meridians. Second, the unit vectors change from place
    to place: r hat and theta hat turn as we go round, and so do the east and north arrows on the globe. Third, a change in a coordinate isn''t a distance
    by itself. Turning by one degree can mean a short walk or a long one, depending on where you are. That third feature needs a name, so let''s look at
    it closely.'
