# Pronunciation lexicon for Kokoro narration (tools/tts.py). Applied to the AUDIO text only; captions keep the script text.
# Keys are matched as whole words, case-insensitively; longer keys first. Values are respellings Kokoro reads well.
# Add a word whenever a reviewer hears it mispronounced (R1 §7 item 6).
respell:
  Vallis: "Valiss"
  Kundu: "Koondoo"
  Ekman: "Eckman"
  Sverdrup: "Svair-drup"
  Sverdrups: "Svair-drups"
  # IPA overrides (user UV2-30, 2026-10-27): the old respelling "jee-oh-strof-ic" was read ʤˈiˈOstɹˈɑfˈIk ("EYE-k")
  Coriolis: "[Coriolis](/kˌɔɹiˈOlɪs/)"
  Rossby: "Ross-bee"
  geostrophic: "[geostrophic](/ʤˌiOstɹˈɑfɪk/)"
  geostrophy: "[geostrophy](/ʤˌiOstɹˈɑfi/)"
  ageostrophic: "[ageostrophic](/ˌAʤiOstɹˈɑfɪk/)"
  beta-plane: "beta plane"
  f-plane: "eff plane"
  isopycnal: "eye-so-pick-nal"
  isopycnals: "eye-so-pick-nals"
  isentropic: "eye-sen-trop-ic"
  baroclinic: "barrow-clinic"
  barotropic: "barrow-tropic"
  Boussinesq: "Boo-sin-esk"
  Poincaré: "Pwan-car-ay"
  Hovmöller: "Hov-muller"
  Kelvin-Helmholtz: "Kelvin Helmholtz"
  Matsuno: "Mat-soo-no"
  Eady: "Ee-dee"
  Munk: "Munk"
  Stommel: "Stom-mel"
  Ferrel: "Ferrel"
  Hadley: "Hadley"
  hPa: "hecto-pascals"
  Sv: "sverdrups"
  QBO: "Q B O"
  ENSO: "en-so"
  AMOC: "ay-mock"
  ITCZ: "I T C Z"
  PV: "P V"
  # ch00_cross_product_why (2026-10-25): storm names
  Idai: "Ee-dye"
  Ciarán: "Keer-awn"
  # ch00_weather_basics (2026-10-27): misaki IPA overrides, checked with Kokoro G2P (KPipeline lang 'a').
  # Without them: ERA5 -> ˈɛɹə fˈIv ("era five"), Azores -> ˈAzˌɔɹz ("AY-zors"), Trappes -> tɹˈæps.
  ERA5: "[ERA5](/ˌiˌɑɹˈA fˈIv/)"
  Azores: "[Azores](/əzˈɔɹz/)"
  Trappes: "[Trappes](/tɹˈæp/)"
  # pinned to the default G2P (already right) so a later misaki update cannot change them
  hectopascal: "[hectopascal](/hˈɛktəpˌæskᵊl/)"
  hectopascals: "[hectopascals](/hˈɛktəpˌæskᵊlz/)"
  radiosonde: "[radiosonde](/ɹˈAdiOsˌɑnd/)"
  # Brest (bɹˈɛst), Singapore (sˈɪŋəpˌɔɹ), Brittany (bɹˈɪtəni) and the ITCZ entry above read correctly: no override
# Spoken maths: the script should already say maths in words; these catch common symbols if they slip through.
symbols:
  "Ω": "Omega"
  "φ": "phi"
  "β": "beta"
  "ζ": "zeta"
  "×": "cross"
  "·": "dot"
  "≈": "about"
  "°": "degrees"
  "f = 2Ω sin φ": "f equals two Omega sine phi"
  # the vector a (ch00_dot_product_why, 2026-10-22): a lone "a" is read as the article (ɐ) and "ay" as "eye";
  # these exact, case-sensitive phrases make Kokoro say the letter name (eɪ). "[A](/ˈA/)" is misaki's inline phoneme
  # override. Side effect: "arrow a " also matches inside "narrow a " (same sound, harmless).
  "a dot b": "[A](/ˈA/) dot b"
  # "Arrow A " alone still gave the article (ɐ) in "arrow A times" (phoneme check 2026-10-22), so all three use the override
  "Arrow a ": "Arrow [A](/ˈA/) "
  "arrow a ": "arrow [A](/ˈA/) "
  # ch00_dot_product_why v4 (2026-10-23): "vector a " was read vˈɛktəɹ ɐ (the article); with the override vˈɛktəɹ ˈA
  "Vector a ": "Vector [A](/ˈA/) "
  "vector a ": "vector [A](/ˈA/) "
  # v4 s09 "of b on arrow a, one point five seven": the comma form was not covered by "arrow a "
  "arrow a,": "arrow [A](/ˈA/),"
  # ch00_cross_product_why (2026-10-25): the vector a inside a cross product, same override as "a dot b"
  "a cross b": "[A](/ˈA/) cross b"
  "b cross a": "b cross [A](/ˈA/)"
  "b dot a": "b dot [A](/ˈA/)"
