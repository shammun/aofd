.v3d-ui { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.v3d-canvas { display: block; z-index: 0; }
.v3d-labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.v3d-label { font: 600 13px/1.2 var(--viz-font); color: var(--viz-text); padding: 1px 4px; border-radius: 4px;
  background: color-mix(in srgb, var(--viz-card) 72%, transparent); white-space: nowrap; }
.v3d-label .katex { font-size: 1em; }
.v3d-readout { font-weight: 500; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.v3d-bar { display: inline-block; height: 8px; min-width: 2px; border-radius: 4px; }
.v3d-badge { position: absolute; left: 6px; top: 6px; max-width: calc(100% - 12px); font: 600 12px/1.3 var(--viz-font);
  color: var(--viz-amber); background: color-mix(in srgb, var(--viz-card) 85%, transparent); border: 1px solid var(--viz-amber);
  border-radius: 999px; padding: 2px 8px; }
.v3d-badge[hidden] { display: none; }
.v3d-chips { position: absolute; left: 6px; bottom: 6px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 12px); }
.v3d-chip { font: 500 12px/1.3 var(--viz-font); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--viz-border);
  background: color-mix(in srgb, var(--viz-card) 85%, transparent); color: var(--viz-text-soft); }
.v3d-chip[data-kind="computed"] { border-color: var(--viz-teal); }
.v3d-chip[data-kind="data"] { border-color: var(--viz-blue); }
.v3d-chip[data-kind="schematic"] { border-color: var(--viz-amber); }
.v3d-chip[data-kind="fallback"] { border-color: var(--viz-muted); }
.v3d-paused { position: absolute; inset: 0; margin: auto; width: max-content; height: max-content; pointer-events: auto;
  font: 600 14px var(--viz-font); color: var(--viz-text); background: var(--viz-card); border: 1px solid var(--viz-border);
  border-radius: var(--viz-radius-sm); padding: 10px 14px; min-height: 40px; cursor: pointer; box-shadow: var(--viz-shadow); }
.v3d-paused[hidden] { display: none; }
.v3d-legend { position: absolute; right: 6px; top: 6px; padding: 4px 6px; border-radius: var(--viz-radius-sm);
  background: color-mix(in srgb, var(--viz-card) 85%, transparent); border: 1px solid var(--viz-border); font: 12px var(--viz-font); color: var(--viz-text); }
.v3d-legend canvas { display: block; width: 128px; height: 10px; }
.v3d-legend-ends { display: flex; justify-content: space-between; }
.v3d-legend-title { margin-bottom: 2px; }
/* VIZ3D_CSS:END */
</style>

      const pf = S3.get('pathFwd'), sf = S3.get('spaceFwd');
      if (pf.values && pf.values.endFwd && nn < N) ['x', 'y', 'z'].forEach((c, i) =>
        rows.push({ name: 'drawn Earth path (kit trajectory) end = RK4 state at 48 h, ' + c + ' (globe units)', js: pf.values.endFwd[i], expect: Xe[i], atol: 1e-9 }));
      if (st.frame === 'space' && sf.values && sf.values.endFwd && nn < N) ['x', 'y', 'z'].forEach((c, i) =>
        rows.push({ name: 'drawn space path end = R_z(Ωt)·Earth-frame RK4 state, ' + c, js: sf.values.endFwd[i], expect: Xi[i], atol: 1e-9 }));
      const gl = S3.get('glyph');
      if (gl && gl.values && gl.values.cross && run.lat[nn] !== 0) {
        const v = gl.values, res = v.cross, B = unitVectors(run.lat[nn], run.lon[nn]), ac = coriolisHorizontal(run.u[nn], run.v[nn], run.lat[nn]);
        const phys = rotZ([0, 1, 2].map(i => ac[0] * B.east[i] + ac[1] * B.north[i]), ang);
        rows.push({ name: 'glyph: drawn u × f k ⟂ u (|r̂·û| < 1e-9)', js: M3.dot(M3.unit(res), M3.unit(v.a)), expect: 0, atol: 1e-9 });
        rows.push({ name: 'glyph: result length = |a||b| (u ⟂ k)', js: M3.norm(res), expect: v.na * v.nb, rtol: 1e-9 });
        rows.push({ name: 'glyph: result points along coriolis_horizontal = −f k×u (sign of f)', js: M3.dot(M3.unit(res), M3.unit(phys)), expect: 1, atol: 1e-9 });
      }
      // GPU ↔ CPU leg: the f texture is read back on the GPU (float32) — build it for the probe if it is switched off
      if (!st.fshade && !S3.fallback) { S3.set('globe', { field: fField() }); const kit = S3.selftestRows(); S3.set('globe', { field: null }); S3.renderNow(); return rows.concat(kit); }
      return rows.concat(S3.selftestRows());
    }
    return rows;
  }
});

/* ---------------- 2-D views ---------------- */
function drawLocal(v, s, run, n, a) {
  v.clear(); if (v.w < 60 || v.h < 60) return;
  const pts = run.E.P.map((_, k) => localXY(run, run.lon[k], run.lat[k]));
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  pts.forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, half = Math.max(5, (x1 - x0) / 2, (y1 - y0) / 2) * 1.2;
  const P = v.plot({ xlim: [cx - half, cx + half], ylim: [cy - half, cy + half], equal: true, xlabel: 'x east [km]', ylabel: 'y north [km]' }).axes();
  P.clip(() => {
    if (s.ghost) { const gx = [], gy = []; for (let k = 0; k <= NSTEP; k += 10) { const g = greatCircle(run.lat0, run.lon0, run.u0, run.v0, k * DT); const q = localXY(run, g[0], g[1]); gx.push(q[0]); gy.push(q[1]); } P.line(gx, gy, { color: COL.ghost, width: 1.5, dash: [6, 4] }); }
    if (isFinite(run.circ.radius)) {
      const xc = km(run.v0 / run.f0), yc = km(-run.u0 / run.f0), Rk = km(run.circ.radius);
      const cxs = [], cys = []; for (let k = 0; k <= 96; k++) { cxs.push(xc + Rk * Math.cos(2 * Math.PI * k / 96)); cys.push(yc + Rk * Math.sin(2 * Math.PI * k / 96)); }
      P.line(cxs, cys, { color: Viz.color('muted'), width: 1, dash: [3, 4] });
      if (v.h > 150) P.text(xc, yc - Rk, 'f-plane circle U/|f₀|', { color: Viz.color('muted'), size: 12, align: 'center', dy: 10 });
    }
    P.line(pts.slice(0, n + 1).map(p => p[0]), pts.slice(0, n + 1).map(p => p[1]), { color: COL.path, width: 2.5, dash: [6, 4] });
    P.line(pts.slice(n).map(p => p[0]), pts.slice(n).map(p => p[1]), { color: COL.path, width: 1.8, alpha: 0.75 });
    for (let k = 0; k < pts.length; k += 180) P.dot(pts[k][0], pts[k][1], 2.5, { color: COL.path });
    const p = pts[n], u = run.u[n], vv = run.v[n], U = Math.hypot(u, vv) || 1, L = half * 0.28, fl = Math.sign(coriolisParameter(run.lat[n]));
    P.arrow(p[0], p[1], L * u / U, L * vv / U, { color: COL.u, width: 2.5 });
    if (fl) P.arrow(p[0], p[1], L * fl * vv / U, -L * fl * u / U, { color: COL.cor, width: 2.5 });
    P.dot(p[0], p[1], 5, { color: COL.path, stroke: '#fff', strokeWidth: 2 });
    if (v.w > 240) { P.text(p[0] + L * u / U, p[1] + L * vv / U, 'u', { color: COL.u, size: 13, weight: 700, dx: 6 }); if (fl) P.text(p[0] + L * fl * vv / U, p[1] - L * fl * u / U, '−f k×u', { color: COL.cor, size: 12, weight: 700, dx: 6 }); }
  });
  if (a && a.holding && isFinite(run.circ.radius)) {
    const lines = ['loop radius ' + Viz.fmt(km(run.circ.radius), { sig: 3 }) + ' km · period ' + Viz.fmt(run.circ.period / 3600, { sig: 3 }) + ' h'];
    if (run.drift) lines.push('drift per loop: ' + Viz.fmt(Math.abs(km(run.drift.dx)), { sig: 3 }) + ' km ' + (run.drift.dx < 0 ? 'west' : 'east'));
    Viz.card(v.ctx, v.w / 2, v.h * 0.22, lines, { color: COL.path });
  }
}
function drawF(v, s, run, n) {
  v.clear(); if (v.w < 60 || v.h < 60) return;
  const P = v.plot({ xlim: [-90, 90], ylim: [-1.6, 1.6], xlabel: 'latitude ϑ [°]', ylabel: 'f [10⁻⁴ s⁻¹]' }).axes();
  const xs = Viz.num.linspace(-90, 90, 181), fs = xs.map(x => coriolisParameter(x * D2R) * 1e4);
  P.fillBetween(xs, fs.map(y => Math.max(0, y)), 0, { color: Viz3D.lutCss('cmocean.balance', 0.85), alpha: 0.35 });
  P.fillBetween(xs, fs.map(y => Math.min(0, y)), 0, { color: Viz3D.lutCss('cmocean.balance', 0.15), alpha: 0.35 });
  P.line(xs, fs, { color: Viz.color('text'), width: 2 });
  P.line([-90, 90], [2 * OMEGA * 1e4, 2 * OMEGA * 1e4], { color: Viz.color('muted'), width: 1, dash: [4, 4] });
  if (v.w > 200) { P.text(-85, 1.1, 'f > 0: turns right', { size: 12, align: 'left', dx: 0 }); P.text(85, -1.1, 'f < 0: turns left', { size: 12, align: 'right' }); P.text(0, 2 * OMEGA * 1e4, '2Ω', { size: 12, dy: -8, color: Viz.color('muted') }); }
  const lat = run.lat[n] / D2R;
  P.dot(s.lat0, coriolisParameter(s.lat0 * D2R) * 1e4, 3.5, { color: Viz.color('muted') });
  P.dot(lat, coriolisParameter(lat * D2R) * 1e4, 5.5, { color: COL.path, stroke: '#fff', strokeWidth: 2 });
}
