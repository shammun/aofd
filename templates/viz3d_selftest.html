        S.add(Viz3D.cameraPresets({ glyphs: { pos: [4.2, -5.4, 3.4], target: [0, 0, -0.4] }, globe: { pos: [3.4, -1.8, 1.8], target: [0, 0, 0] }, surface: { pos: [0.8, -3.8, 3.0], target: [0, 0, 0] }, sag: { pos: [1.2, -1.6, 2.9], target: [0, 0, 0] } }));
        applyMode(s);
      });
    },
    draw(g, s) {
      applyVectors(s);
      if (S3 && S3._mode !== s.mode) { S3._mode = s.mode; applyMode(s); S3.goto(s.mode); }
      const v = g.view('bars'); v.clear();
      if (v.w < 60) return;
      const A = M.norm(vecA(s)), B = M.norm(vecB(s)), th = M.angle(vecA(s), vecB(s));
      const P = v.plot({ xlim: [0, 180], ylim: [-1.05 * A * B - 0.01, 1.05 * A * B + 0.01], xlabel: 'θ [°]', ylabel: 'value' }).axes();
      P.fn(t => A * B * Math.cos(t * Math.PI / 180), { color: '#16a34a', width: 2 });
      P.fn(t => A * B * Math.sin(t * Math.PI / 180), { color: '#7c3aed', width: 2, dash: [5, 4] });
      P.dot(deg(th), A * B * Math.cos(th), 5, { color: '#16a34a', stroke: '#fff', strokeWidth: 2 });
      P.dot(deg(th), A * B * Math.sin(th), 5, { color: '#7c3aed', stroke: '#fff', strokeWidth: 2 });
    }
  },
  explore: { intro: 'Move the components. The green curve is $|\\mathbf a||\\mathbf b|\\cos\\theta$ (the shadow), the dashed violet one $|\\mathbf a||\\mathbf b|\\sin\\theta$ (the area).', controls: ['ax', 'ay', 'az', 'bx', 'by', 'bz'], readouts: ['dot', 'cross', 'theta'] },
  tour: [
    { title: 'Two arrows', text: 'Teal is $\\mathbf a$, orange is $\\mathbf b$. Orbit the view: they share a tail.', set: { mode: 'glyphs', ax: 1.2, ay: 0.2, az: 0, bx: 0.5, by: 1, bz: 0 } },
    { title: 'The shadow', text: 'The thick segment under the lower pair is the shadow of $\\mathbf a$ on $\\mathbf b$: its signed length is $\\mathbf a\\cdot\\mathbf b/|\\mathbf b|$.', readouts: ['dot', 'theta'] },
    { title: 'The area', text: 'The violet sheet is the parallelogram of $\\mathbf a$ and $\\mathbf b$; the violet arrow, $\\mathbf a\\times\\mathbf b$, stands on it with length equal to its area.', readouts: ['cross'] },
    { title: 'Turning a wind', text: 'Preset $\\hat{\\mathbf k}\\times\\mathbf u$: the result lies flat, 90° to the left of the wind. That is the Coriolis turn.', set: { ax: 0, ay: 0, az: 1, bx: 1, by: 0.3, bz: 0 } },
    { title: 'Kit check: globe and surface', text: 'Switch to Globe and Surface: data texture, coastlines, legend, isolines and a where-from (dashed) / where-to (solid) path.', set: { mode: 'globe' } }
  ],
  equations: [
    { id: 'dot', title: 'Dot product', ref: '(E.1)', tex: '\\mathbf a\\cdot\\mathbf b = a_xb_x + a_yb_y + a_zb_z = |\\mathbf a||\\mathbf b|\\cos\\theta' },
    { id: 'cross', title: 'Cross product', ref: '(E.2)', tex: '\\begin{aligned}(\\mathbf a\\times\\mathbf b)_x &= a_yb_z - a_zb_y\\\\ (\\mathbf a\\times\\mathbf b)_y &= a_zb_x - a_xb_z\\\\ (\\mathbf a\\times\\mathbf b)_z &= a_xb_y - a_yb_x\\\\ |\\mathbf a\\times\\mathbf b| &= |\\mathbf a||\\mathbf b|\\sin\\theta\\end{aligned}' }
  ],
  explain: {
    html: s => {
      const a = vecA(s), b = vecB(s), d = M.dot(a, b), c = M.cross(a, b);
      return Viz.work.step(1, 'The dot product, component by component') +
        Viz.work.line('$a_xb_x + a_yb_y + a_zb_z$', Viz.fmt(a[0] * b[0]) + ' + ' + Viz.fmt(a[1] * b[1]) + ' + ' + Viz.fmt(a[2] * b[2]), '= ' + Viz.fmt(d)) +
        Viz.work.step(2, 'The cross product, component by component') +
        Viz.work.line('$\\mathbf a\\times\\mathbf b$', '(' + c.map(x => Viz.fmt(x)).join(', ') + ')', 'length ' + Viz.fmt(M.norm(c))) +
        Viz.work.step(3, 'Angle check') +
        Viz.work.line('$\\theta$', Viz.fmt(deg(M.angle(a, b))) + '°', 'from $\\cos\\theta = \\mathbf a\\cdot\\mathbf b/(|\\mathbf a||\\mathbf b|)$') +
        Viz.work.interpret(Math.abs(d) < 1e-9 ? 'The arrows are perpendicular: no shadow, largest area.' : 'The shadow and the area trade off as θ changes: cos and sin.', 'Reading the current setting');
    }
  },
  code: [{ id: 'np', title: 'The same numbers in Python', ref: '(E.1), (E.2)',
    src: `
import numpy as np

a = np.array([{{a}}])        # teal arrow
b = np.array([{{b}}])        # orange arrow
print(np.dot(a, b))          # {{dot}}: the signed shadow length times |b|
print(np.cross(a, b))        # {{cross}}: perpendicular to both, right-hand rule`,
    live: s => ({ a: vecA(s).join(', '), b: vecB(s).join(', '), dot: Viz.fmt(M.dot(vecA(s), vecB(s))), cross: '[' + M.cross(vecA(s), vecB(s)).map(x => Viz.fmt(x)).join(', ') + ']' }) }],
  check: [
    { q: 'When is $\\mathbf a\\cdot\\mathbf b = 0$ for non-zero arrows?', a: 'When they are perpendicular (θ = 90°): the shadow has no length.', set: { ax: 1, ay: 0, az: 0, bx: 0, by: 1, bz: 0 } },
    { q: 'Which way does $\\hat{\\mathbf k}\\times\\mathbf u$ point for an eastward wind?', a: 'North: 90° to the left of the wind, seen from above.' },
    { q: 'Why is the violet arrow zero for parallel arrows?', a: 'The parallelogram collapses to a line: area $|\\mathbf a||\\mathbf b|\\sin 0 = 0$.' }
  ],
  selftest: () => {
    const s = { ax: 1.2, ay: 0.2, az: -0.3, bx: 0.5, by: 1.0, bz: 0.4 }, a = vecA(s), b = vecB(s), c = M.cross(a, b);
    const rows = [
      { name: 'a·b (E.1) vs np.dot', js: M.dot(a, b), py: 'np.dot([1.2, 0.2, -0.3], [0.5, 1.0, 0.4])', rtol: 1e-12 },
      { name: '(a×b)_x (E.2) vs np.cross', js: c[0], py: 'np.cross([1.2, 0.2, -0.3], [0.5, 1.0, 0.4])[0]', rtol: 1e-12 },
      { name: '(a×b)_z (E.2) vs np.cross', js: c[2], py: 'np.cross([1.2, 0.2, -0.3], [0.5, 1.0, 0.4])[2]', rtol: 1e-12 },
      { name: 'lon/lat → xyz → lon/lat round trip', js: Viz3D.xyzToLonlat(Viz3D.lonlatToXYZ(-150, 35))[1], expect: 35, atol: 1e-12 },
      { name: 'RK4 solid-body rotation keeps radius (1 turn)', js: (() => { let p = [1, 0, 0]; for (let k = 0; k < 628; k++) p = M.rk4(swirl, p, 0, 0.01); return M.norm(p); })(), expect: 1, rtol: 1e-6 }
    ];
    return rows.concat(S3 ? S3.selftestRows() : []);
  }
});
