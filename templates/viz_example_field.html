          var need = 0, col = /column/.test(getComputedStyle(row).flexDirection), vs = [], sumF = 0;

        // check the estimate with the stage held at that height (chapter CSS may lay the views out as a grid)

          var m = Infinity; views.forEach(function (v) { if (v.el.offsetParent) m = Math.min(m, v.holder.clientHeight); });
          return m;
        }
        var m1 = minView(est);
        if (m1 < 59.5 && isFinite(m1)) {
          var m2 = minView(est + 80), slope = (m2 - m1) / 80;

      // choosing the picture/text split

        var b = [];

          stageNeed();
          pagers.forEach(function (p) { if (p.card.offsetParent) p.layout(); });

      }

      root.removeAttribute('data-room');
      var bad = dense();
      if (layout === 'portrait') {
        // move the split between picture and text: views squeezed below 60 px → "stage"; a formula taller than a
        // text page → "text". Keep the change only if it leaves fewer problems.
        var small = bad.some(function (b) { return /^view-too-small/.test(b.el); }), tall = tallPage();
        var tries = (tall ? ['text'] : []).concat(small ? ['stage'] : []);
        if (tries.length) {
          var best = { room: '', bad: bad, score: score(bad) }, last = '';
          tries.forEach(function (room) {
            root.setAttribute('data-room', room); last = room;
            var b2 = dense(), sc = score(b2);

          });
          if (best.room !== last) { if (best.room) root.setAttribute('data-room', best.room); else root.removeAttribute('data-room'); best.bad = dense(); }
          bad = best.bad;
        }
      }
      resizeCanvas(); drawNow();
      app.lastAudit = { layout: layout, dense: Number(root.getAttribute('data-dense')), overflow: bad, W: W, H: H, tab: app.tab, step: app.step };
      if (bad.length) console.warn('VIZ-OVERFLOW', JSON.stringify(app.lastAudit));

    };
    // One pass does not always settle: the page-turn bar appears after the pages were measured, and the picture/text
    // split is computed from the previous view. Every fit is therefore followed by one settling pass on the next frame
    // (a tab click, a walkthrough step and a derivation page then end in the same state as two fits in a row).

    app.fit = function () {
      var r = fitCore();

      return r;
    };
    var fitQueued = false;
    function queueFit() { if (fitQueued) return; fitQueued = true; global.requestAnimationFrame(function () { fitQueued = false; app.fit(); }); }
    var settleTimer = null;
    function settleFit() { if (settleTimer) clearTimeout(settleTimer); settleTimer = setTimeout(function () { settleTimer = null; queueFit(); }, 250); }
    global.addEventListener('resize', queueFit);
    // KaTeX loads a font face the first time a tab shows it; line heights change when it arrives, after the pages were measured
    if (doc.fonts && doc.fonts.addEventListener) doc.fonts.addEventListener('loadingdone', queueFit);
    if ('ResizeObserver' in global) { var ro2 = new ResizeObserver(function () { if (resizeCanvas()) drawNow(); }); views.forEach(function (v) { ro2.observe(v.holder); }); }

    /* ---------- errors ---------- */
    function reportError(e) {
      console.error('VIZ-ERROR', e && e.stack ? e.stack : e);
      if (!root.querySelector('.viz-error')) stageEl.appendChild(h('div', { class: 'viz-error', text: 'Something went wrong drawing this picture: ' + (e && e.message ? e.message : e) }));
    }
    app.reportError = reportError;

    /* ---------- boot ---------- */
    var hash = parseHash();
    Object.keys(params).forEach(function (k) { if (hash[k] !== undefined && hash[k] !== '') { var p = params[k]; var v = (p.type || 'range') === 'range' ? Number(hash[k]) : (p.type === 'toggle' ? hash[k] === '1' || hash[k] === 'true' : hash[k]); if (!(typeof v === 'number' && isNaN(v))) app.state[k] = v; } });
    try { resizeCanvas(); if (cfg.stage && isFn(cfg.stage.setup)) cfg.stage.setup(g, app.state); } catch (e) { reportError(e); }
    typeset(root);
    updateReadouts(); updateDynamic(true, true);
    if (hash.tab === 'calc') hash.tab = 'explain';
    var firstTab = hash.tab && app.tabs.indexOf(hash.tab) >= 0 ? hash.tab : (cfg.startTab || app.tabs[0]);
    if (cfg.tour && cfg.tour.length) app.goStep(hash.step ? Number(hash.step) - 1 : 0);
    if (der.els) app.goDerive(hash.d ? Number(hash.d) - 1 : 0, hash.ds ? Number(hash.ds) : 0, { quiet: firstTab !== 'derive' });
    app.setTab(firstTab);
    queueLive();
    if (animated && cfg.autoplay !== false) app.play(true); else app.draw();

    app.ready = loadKatex().then(function (ok) {
      app.katex = ok; retypesetPending(); queueLive();
      return new Promise(function (res) { global.requestAnimationFrame(function () { global.requestAnimationFrame(function () { app._ready = true; app.fit(); res(app.lastAudit); }); }); });
    });

    /* ---------- audit + self-test API (used by tools/shot.py) ---------- */
    app.selftest = function () {
      var out = [];
      if (!isFn(cfg.selftest)) return out;
      var rows; try { rows = cfg.selftest(app); } catch (e) { return [{ name: 'selftest() threw', ok: false, error: String(e) }]; }
      (rows || []).forEach(function (r) {
        var row = { name: r.name, js: r.js, py: r.py || null, rtol: r.rtol === undefined ? 1e-6 : r.rtol, atol: r.atol === undefined ? 0 : r.atol };

    };
    global.VIZ = {
      app: app, ready: app.ready, tabs: app.tabs, steps: (cfg.tour || []).length,
      derivations: (cfg.derivations || []).map(function (d) { return { id: d.id, title: d.title, ref: d.ref || '', pages: d.steps.length + 2, steps: d.steps.length }; }),
      goDerive: function (i, s) { app.goDerive(i, s); return app.fit(); },
      explainStats: function () { var b = calcPager ? calcPager.body : null; return b ? { sections: b.querySelectorAll('.viz-work-h').length, interpret: b.querySelectorAll('.viz-work-interp').length, boxes: b.querySelectorAll('.viz-work-res').length, live: b.querySelectorAll('[data-live]').length } : null; },
      features: { views: views.length, explain: !!cfg.explain, calc: !!cfg.explain, derivations: (cfg.derivations || []).length, code: !!(cfg.code && cfg.code.length), terms: !!cfg.terms, inspect: isFn(cfg.inspect), notes: isFn(cfg.notes), presets: (cfg.presets || []).length, transport: !!tr, modes: !!cfg.modes, status: !!cfg.status },
      audit: function () { return app.fit(); },
      selftest: function () { return app.selftest(); },
      setTab: function (id) { app.setTab(id); return app.fit(); },
      goStep: function (i) { app.goStep(i); return app.fit(); },
      play: function (on) { app.play(on); return app.playing; },
      set: function (o) { app.set(o); return app.fit(); },

  global.addEventListener('error', function (e) { console.error('VIZ-ERROR', e.message, e.filename + ':' + e.lineno); });

<script>
'use strict';
/* PHYSICS -------------------------------------------------------------------------------------------
   Velocity field  u = U - Ω y,  v = Ω x                         (E.1)
   Stagnation point where u = v = 0:  (x, y) = (0, U/Ω)          (E.2)
   Vorticity  ω = ∂v/∂x − ∂u/∂y = 2Ω  (the same everywhere)     (E.3)
   Stream function ψ with u = ∂ψ/∂y, v = −∂ψ/∂x:  ψ = U y − Ω (x² + y²)/2
   --------------------------------------------------------------------------------------------------- */
const vel = (s) => (x, y) => [s.U - s.Omega * y, s.Omega * x];
const psi = (s) => (x, y) => s.U * y - 0.5 * s.Omega * (x * x + y * y);
const stagnationY = (s) => (Math.abs(s.Omega) < 1e-12 ? Infinity : s.U / s.Omega);
const L = 2;                                       // half-width of the view [m]

let tracers = null, probe = null;

const app = Viz.app({
  title: 'Drift plus spin: where does the flow stand still?',
  subtitle: 'A uniform stream added to a solid-body rotation',
  params: {
    U:     { label: 'Stream speed $U$', min: -1.5, max: 1.5, step: 0.05, value: 0.6, unit: 'm/s', help: 'uniform drift to the right (negative = left)' },
    Omega: { label: 'Spin rate $\\Omega$', min: -2, max: 2, step: 0.05, value: 1.0, unit: 'rad/s', help: 'anticlockwise when positive' },
    speed: { label: 'Animation speed', min: 0.1, max: 3, step: 0.1, value: 1, optional: true },
    showPsi: { type: 'toggle', label: 'Colour by $\\psi$', value: true },
    showArrows: { type: 'toggle', label: 'Arrows', value: false, optional: true }
  },
  readouts: [
    { id: 'ys', label: 'Stagnation point $y_s$', unit: 'm', value: s => stagnationY(s) },
    { id: 'omega', label: 'Vorticity $\\omega$', unit: '1/s', value: s => 2 * s.Omega, tone: v => (v > 0 ? 'pos' : v < 0 ? 'neg' : '') },
    { id: 'probe', label: 'Speed at the probe', unit: 'm/s', value: s => { if (!probe) return NaN; const w = vel(s)(probe[0], probe[1]); return Math.hypot(w[0], w[1]); } }
  ],
  stage: {
    animate: true,
    setup(g, s) { tracers = Viz.field.particles((x, y) => vel(g.app.state)(x, y), { n: 160, bounds: [-L, L, -L, L], life: 6, trail: 8, seed: 7 }); },
    step(g, s, dt) { tracers.step(dt, g.t); },
    reset(g, s) { tracers = Viz.field.particles((x, y) => vel(g.app.state)(x, y), { n: 160, bounds: [-L, L, -L, L], life: 6, trail: 8, seed: 7 }); probe = null; },
    draw(g, s) {
      g.clear();
      const P = g.plot({ xlim: [-L, L], ylim: [-L, L], equal: true, xlabel: 'x [m]', ylabel: 'y [m]' });
      if (s.showPsi) Viz.field.heatmap(P, psi(s), { cmap: 'coolwarm', nx: 90, alpha: 0.55 });
      P.axes();
      const G = Viz.field.grid(psi(s), P.xlim, P.ylim, 80, 80);
      const lo = Viz.num.min(G.v), hi = Viz.num.max(G.v);
      Viz.field.drawContours(P, G, Viz.num.linspace(lo, hi, 16).slice(1, -1), { color: Viz.alpha(Viz.color('text'), 0.45), width: 1.1 });
      if (s.showArrows) Viz.field.quiver(P, vel(s), { nx: 12 });
      tracers.draw(P, { color: Viz.color('blue'), r: 1.8 });
      const ys = stagnationY(s);
      if (isFinite(ys) && Math.abs(ys) < P.ylim[1]) {
        P.dot(0, ys, 6, { color: Viz.color('orange'), stroke: '#fff', strokeWidth: 2 });
        P.text(0, ys, 'stagnation point', { dx: 10, dy: -12, color: Viz.color('orange'), weight: 650 });
      }
      if (probe) {
        const w = vel(s)(probe[0], probe[1]);
        P.arrow(probe[0], probe[1], 0.35 * w[0], 0.35 * w[1], { color: Viz.color('rose'), width: 2.5 });
        P.dot(probe[0], probe[1], 4, { color: Viz.color('rose') });
      }
      (g.app.badge.textContent = probe ? 'drag to move the probe' : 'click the picture to drop a velocity probe');
    },
    onPointer(g, ev, s) {
      if (ev.type !== 'pointerdown' && !(ev.type === 'pointermove' && g.pointer.down)) return false;
      const P = g.plot({ xlim: [-L, L], ylim: [-L, L], equal: true });
      probe = [P.ix(g.pointer.x), P.iy(g.pointer.y)];
      g.app.set('probeTick', (g.app.state.probeTick || 0) + 1);
      return true;
    }
  },
  presets: [
    { label: 'spin only', set: { U: 0, Omega: 1 } },
    { label: 'drift only', set: { U: 1, Omega: 0 } },
    { label: 'both', set: { U: 0.6, Omega: 1 } },
    { label: 'reverse spin', set: { U: 0.6, Omega: -1 } }
  ],
  status: s => Math.abs(s.Omega) < 1e-9 ? { text: 'no stagnation point', tone: 'warn' }
    : { text: `still point at y = ${Viz.fmt(stagnationY(s), { sig: 2 })} m`, tone: Math.abs(stagnationY(s)) < L ? 'good' : 'warn' },
  inspect: s => {
    if (!probe) return null;
    const [x, y] = probe, u = s.U - s.Omega * y, v = s.Omega * x;
    return `Probe at $(${Viz.tnum(x, 2)}, ${Viz.tnum(y, 2)})$ m:<br>$u = U - \\Omega y = ${Viz.tnum(s.U)} - ${Viz.tnum(s.Omega)}\\times${Viz.tnum(y, 2)} = \\mathbf{${Viz.tnum(u)}}$ m/s<br>` +
      `$v = \\Omega x = ${Viz.tnum(s.Omega)}\\times${Viz.tnum(x, 2)} = \\mathbf{${Viz.tnum(v)}}$ m/s<br>speed $= \\sqrt{u^2+v^2} = ${Viz.tnum(Math.hypot(u, v))}$ m/s`;
  },
  inspectHint: 'Click the picture to drop a probe: its velocity arithmetic appears here.',
  explain: {
    html: s => Viz.work.step(1, 'The velocity at any point') +
      Viz.work.line('$u = U - \\Omega y = ' + Viz.tnum(s.U) + ' - ' + Viz.tnum(s.Omega) + '\\,y$', '', 'drift minus spin') +
      Viz.work.line('$v = \\Omega x = ' + Viz.tnum(s.Omega) + '\\,x$', '', 'spin only') +
      Viz.work.step(2, 'Where is the flow still?') +
      Viz.work.line('set $u = U - \\Omega y = 0$', '$y_s = U/\\Omega$', 'the drift cancels the spin') +
      Viz.work.line('$y_s = ' + Viz.tnum(s.U) + '/' + Viz.tnum(s.Omega) + '$', Math.abs(s.Omega) < 1e-9 ? '∞' : Viz.fmt(stagnationY(s)) + ' m') +
      Viz.work.line('set $v = \\Omega x = 0$', '$x_s = 0$') +
      Viz.work.step(3, 'Spin everywhere') +
      Viz.work.line('$\\omega = \\partial v/\\partial x - \\partial u/\\partial y = \\Omega - (-\\Omega)$', Viz.fmt(2 * s.Omega) + ' 1/s', 'independent of $U$') +
      Viz.work.box('vorticity $\\omega = 2\\Omega = \\mathbf{' + Viz.tnum(2 * s.Omega) + '}$ 1/s at every point') +
      Viz.work.interpret(Math.abs(s.Omega) < 1e-9 ? 'With $\\Omega = 0$ there is no spin and no still point: every particle drifts at $U$.'
        : 'A uniform drift moves the still point (to $y_s = ' + Viz.fmt(stagnationY(s)) + '$ m) but cannot change the spin, which is $2\\Omega$ everywhere.', 'Reading the current setting')
  },
  code: [
    { id: 'field', title: 'The velocity field in Python', ref: '(E.1)–(E.2)',
      src: `
import numpy as np

def velocity(x, y, U, Omega):
    """Uniform stream U plus solid-body rotation Omega."""
    u = U - Omega * y            # x-component (E.1)
    v = Omega * x                # y-component (E.1)
    return u, v

def stagnation_point(U, Omega):
    return 0.0, U / Omega        # y_s = {{ys}} m for the current sliders (E.2)`,
      live: s => ({ ys: Math.abs(s.Omega) < 1e-9 ? 'inf' : stagnationY(s).toFixed(3) }) }
  ],
  explore: {
    intro: 'Blue dots are fluid particles. Grey lines are streamlines (curves of constant $\\psi$). Click anywhere to drop a probe.',
    controls: ['U', 'Omega', 'showPsi', 'showArrows', 'speed'],
    callouts: [{ kind: 'try', html: 'Set $U = 0$: the stagnation point jumps to the centre. Now flip the sign of $\\Omega$ — which way does it move?' }]
  },
  tour: [
    { title: 'Two simple motions', text: 'Picture a turntable spinning at rate $\\Omega$ while the whole table slides sideways at speed $U$. Each motion alone is easy. What happens when we add them?', set: { U: 0, Omega: 1 }, play: true },
    { title: 'Spin alone', text: 'With $U = 0$ every particle circles the origin. The centre is the only point that does not move: a <b>stagnation point</b>.', set: { U: 0, Omega: 1 }, readouts: ['ys'] },
    { title: 'Add the stream', text: 'Velocities simply add, point by point. Drag $U$ and watch the still point slide up or down the $y$-axis.', controls: ['U'], set: { U: 0.6 }, highlight: ['readout:ys'], readouts: ['ys'] },
    { title: 'Where exactly?', text: 'Set both velocity components to zero and solve. The answer is a one-line formula; the orange dot follows it.', eq: 'stag', set: { U: 0.9 } },
    { title: 'The same in Python', text: 'Two lines of code carry the whole field. The live comment shows your stagnation point.', code: { id: 'field', lines: [5, 10] } },
    { title: 'Spin is everywhere', text: 'Vorticity measures local spin. Adding a uniform stream does not change it: $\\omega = 2\\Omega$ at every point.', eq: 'vort', controls: ['Omega'] },
    { title: 'Your turn', text: 'Predict first: if you double $\\Omega$ and keep $U$, where does the stagnation point go? Then check with the sliders.', controls: ['U', 'Omega'], callout: { kind: 'key', html: 'Superposition works because the equations for the velocity field are linear.' } }
  ],
  equations: [
    { id: 'field', title: 'Velocity field', ref: '(E.1)', tex: 'u = U - \\Omega\\,y, \\qquad v = \\Omega\\,x',
      live: s => `u = ${Viz.tnum(s.U)} - ${Viz.tnum(s.Omega)}\\,y,\\quad v = ${Viz.tnum(s.Omega)}\\,x`,
      note: 'A uniform stream plus solid-body rotation.', symbols: [['U', 'stream speed', 'm/s'], ['\\Omega', 'rotation rate', 'rad/s']] },
    { id: 'stag', title: 'Stagnation point', ref: '(E.2)', tex: 'u = v = 0 \\;\\Rightarrow\\; (x_s, y_s) = \\left(0,\\; \\frac{U}{\\Omega}\\right)',
      live: s => `y_s = \\frac{${Viz.tnum(s.U)}}{${Viz.tnum(s.Omega)}} = ${Viz.tnum(stagnationY(s))}\\ \\text{m}`,
      note: 'Moves off to infinity as $\\Omega \\to 0$.' },
    { id: 'vort', title: 'Vorticity', ref: '(E.3)', tex: '\\omega = \\frac{\\partial v}{\\partial x} - \\frac{\\partial u}{\\partial y} = 2\\,\\Omega',
      live: s => `\\omega = 2 \\times ${Viz.tnum(s.Omega)} = ${Viz.tnum(2 * s.Omega)}\\ \\text{s}^{-1}` },
    { id: 'psi', title: 'Stream function', ref: '(E.4)', tex: '\\psi = U\\,y - \\tfrac{1}{2}\\,\\Omega\\,(x^2 + y^2)',
      note: 'Streamlines are the contours of $\\psi$; here they are circles centred on the stagnation point.' }
  ],
  check: [
    { q: 'With $U = 1$ m/s and $\\Omega = 0.5$ rad/s, where is the stagnation point?', a: 'At $y_s = U/\\Omega = 2$ m, on the $y$-axis.', set: { U: 1, Omega: 0.5 } },
    { q: 'Does the uniform stream change the vorticity?', a: 'No. A uniform velocity has no derivatives, so $\\omega = 2\\Omega$ regardless of $U$.' },
    { q: 'What shape are the streamlines, and why?', a: 'Circles centred on the stagnation point: completing the square in $\\psi$ gives $x^2 + (y - U/\\Omega)^2 = \\text{const}$.' }
  ],
  selftest: () => [
    { name: 'stagnation y for U=0.6, Omega=1.25', js: stagnationY({ U: 0.6, Omega: 1.25 }), py: '0.6 / 1.25', rtol: 1e-12 },
    { name: 'vorticity by finite difference = 2*Omega', js: (() => { const s = { U: 0.3, Omega: 0.8 }, h = 1e-5, f = vel(s);
        return (f(h, 0.2)[1] - f(-h, 0.2)[1]) / (2 * h) - (f(0.1, 0.2 + h)[0] - f(0.1, 0.2 - h)[0]) / (2 * h); })(), expect: 1.6, rtol: 1e-8 },
    { name: 'u = dpsi/dy', js: (() => { const s = { U: 0.3, Omega: 0.8 }, h = 1e-6; return (psi(s)(0.4, 0.7 + h) - psi(s)(0.4, 0.7 - h)) / (2 * h); })(), py: '0.3 - 0.8 * 0.7', rtol: 1e-6 }
  ]
});
