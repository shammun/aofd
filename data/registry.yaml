# AOFD dataset registry (open-data skill §5). One entry per dataset/file family. Read by fluidpy.data.registry.
# Fields: catalogue (R3 key), url, raw_url, access route, login, licence + licence_url, citation, attribution,
# size_bytes, sha256 (fixed files), variables, subset, coordinate order / sign conventions, fetch_date,
# redistributable, raw_files (under the data root), derived_on_root (under the data root), derived_in_repo.
datasets:
  NCEP1-hgt-daily:
    catalogue: NCEP1
    title: NCEP/NCAR Reanalysis 1, daily-mean geopotential height on pressure levels (2.5 deg)
    url: https://psl.noaa.gov/thredds/dodsC/Datasets/ncep.reanalysis.dailyavgs/pressure/hgt.2014.nc
    raw_url: https://downloads.psl.noaa.gov/Datasets/ncep.reanalysis.dailyavgs/pressure/hgt.2014.nc
    route: OPeNDAP server-side subset via pydap (preferred; one day x one level = 37 kB); HTTPS whole-year file as fallback
    fetcher: fluidpy.data.psl.fetch_daily / z500_day
    login: none
    licence: US Government work, public domain (no restrictions); PSL asks for an acknowledgement
    licence_url: https://psl.noaa.gov/data/gridded/data.ncep.reanalysis.html
    citation: "Kalnay, E., et al., 1996: The NCEP/NCAR 40-Year Reanalysis Project. Bull. Amer. Meteor. Soc., 77, 437-471, doi:10.1175/1520-0477(1996)077<0437:TNYRP>2.0.CO;2"
    attribution: NCEP/NCAR Reanalysis 1 data provided by the NOAA PSL, Boulder, Colorado, USA, from their website at https://psl.noaa.gov
    size_bytes: 84885420
    sha256: 3e1cf6ef52fbbadf6170410d72771bac2fa87a7bdb7206d33763d2fce117e838
    sha256_note: sha256 of the whole-year file hgt.2014.nc (fixed; year complete); OPeNDAP subsets are not hash-pinned
    variables: {hgt: "geopotential height [m]", level: "[hPa], 17 levels 1000-10", lat: "[deg]", lon: "[deg E]"}
    coordinates: lat runs N->S in the file (90 .. -90), sorted S->N by every fluidpy reader; lon 0..357.5 E; time daily, 00-24 UTC means
    subset: "2014-01-06, 500 hPa, global"
    fetch_date: "2026-10-21"
    redistributable: yes
    redownloadable: true
    raw_files: [raw/NCEP1-hgt-daily/hgt.2014.nc, raw/NCEP1-hgt-daily/hgt.2014-01-06.500hPa.nc]
    derived_on_root: [derived/ch00/ncep_r1_z500_20140106.nc]
