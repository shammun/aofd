    route: OPeNDAP server-side subset via pydap (preferred; one day x one level = 37 kB); HTTPS whole-year file as fallback
    fetcher: fluidpy.data.psl.fetch_daily / z500_day
    login: none
    licence: US Government work, public domain (no restrictions); PSL asks for an acknowledgement
    licence_url: https://psl.noaa.gov/data/gridded/data.ncep.reanalysis.html
    citation: "Kalnay, E., et al., 1996: The NCEP/NCAR 40-Year Reanalysis Project. Bull. Amer. Meteor. Soc., 77, 437-471, doi:10.1175/1520-0477(1996)077<0437:TNYRP>2.0.CO;2"
