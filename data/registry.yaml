# AOFD dataset registry (open-data skill §5). One entry per dataset/file family. Read by fluidpy.data.registry.
# Fields: catalogue (R3 key), url, raw_url, access route, login, licence + licence_url, citation, attribution,
# size_bytes, sha256 (fixed files), variables, subset, coordinate order / sign conventions, fetch_date,
# redistributable, raw_files (under the data root), derived_on_root (under the data root), derived_in_repo.
datasets:
