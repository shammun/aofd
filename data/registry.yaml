  FRONTS-orsi1995:
    catalogue: FRONTS
    title: Orsi et al. (1995) fronts of the Antarctic Circumpolar Current (STF, SAF, PF, SACCF, SB)
    url: https://data.aad.gov.au/metadata/antarctic_circumpolar_current_fronts
    raw_url: https://raw.githubusercontent.com/AustralianAntarcticDivision/orsifronts/76d4f6d901d6d02b12eae4625a080f615a18542a/data-raw/
    route: >-
      AADC record (CC-BY 4.0). The AADC download endpoint (https://data.aad.gov.au/eds/4892/download) needs an e-mail
      address to issue a one-time zip link, so it was NOT used without the user's consent. The same original Orsi files
      ({stf,saf,pf,saccf,sbdy}.txt; byte sizes match AADC's 'data from Alejandro Orsi/*.asc' within 1 byte) are read
      from the AAD's own GitHub package AustralianAntarcticDivision/orsifronts, pinned to commit 76d4f6d.
      (saccf_loop1/2.asc, two tiny SACCF loops, are not in the mirror.)
    fetcher: fluidpy.data.fronts.orsi_fronts
    login: none (mirror); e-mail address (AADC direct)
    licence: CC-BY 4.0 (data, per the AADC record); the R package code around it is GPL-3 and is not used
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: "Orsi, A.H., Whitworth III, T., Nowlin Jr., W.D., 1995: On the meridional extent and fronts of the Antarctic Circumpolar Current. Deep-Sea Res. I, 42(5), 641-673, doi:10.1016/0967-0637(95)00021-W. Data: Orsi, A.H., Harris, U. (2019) Fronts of the Antarctic Circumpolar Current - GIS data, Ver. 1, Australian Antarctic Data Centre."
    attribution: "ACC fronts: Orsi et al. (1995), via the Australian Antarctic Data Centre (CC BY 4.0)"
    size_bytes: 85249
    sha256_files:
      stf.txt: 1bb49d8dd8fbd825e5e3e585f8da86223de636c0a1b6cac711cdc31dd7ef0883
      saf.txt: f9130dd8469971f44629ddb02aaeb5baf366d61445c9050f7cf616f4d632e730
      pf.txt: 60674584751a21a67b6fb9dc1cf94cff9c4f70e26f60786ff20640b08fbd4d98
      saccf.txt: c7e4e59bfc650abf7828788faea3549cadf3221bce0ca8a6f3c7706831a90ffc
      sbdy.txt: 793ba88ba0139660da1b28f07116031c974e9641c083fa37875c29e35ca0a6f3
    variables: {lon: "[deg E]", lat: "[deg N]"}
    coordinates: text 'lon lat' rows, '%' lines separate segments; lon wrapped to -180..180 in the derived product
    subset: all five fronts
    fetch_date: "2026-10-21"
    redistributable: yes
    redownloadable: true
    raw_files: [raw/FRONTS-orsi1995/stf.txt, raw/FRONTS-orsi1995/saf.txt, raw/FRONTS-orsi1995/pf.txt, raw/FRONTS-orsi1995/saccf.txt, raw/FRONTS-orsi1995/sbdy.txt]
    derived_on_root: [derived/ch21/fig_21_23_fronts_orsi.npz]
    derived_in_repo: [data/derived/ch21/fig_21_23_fronts_orsi.npz]
  CURR-gdp-annual:
    catalogue: CURR
    title: NOAA Global Drifter Program drifter-derived annual-mean near-surface velocity (0.25 deg; Laurindo et al. 2017)
    url: https://erddap.aoml.noaa.gov/gdp/erddap/griddap/drifter_annualmeans.nc
    route: ERDDAP griddap server-side subset (lon -179.875..179.875, lat -72.875..-30.125; U,V,eU,eV,N)
    size_bytes: 9925136
    sha256_raw_subset: cfadb9239f5ccfd51445492060a22f049254b1ea75d52b7ffd448b6d4defc5ba  # informational; server-generated file, not pinned
    fetcher: fluidpy.data.gdp.southern_ocean_mean_velocity
    login: none
    licence: CC-BY 4.0 (dataset 'license' attribute on ERDDAP; R3 had listed it as public domain - corrected)
    licence_url: https://creativecommons.org/licenses/by/4.0/
    citation: "Laurindo, L., Mariano, A., Lumpkin, R., 2017: An improved near-surface velocity climatology for the global ocean from drifter observations. Deep-Sea Res. I, 124, 73-92, doi:10.1016/j.dsr.2017.04.009"
    attribution: "This study used data collected and made freely available by the NOAA Global Drifter Program (https://www.aoml.noaa.gov/phod/gdp/) accessed from https://erddap.aoml.noaa.gov/gdp/erddap/index.html"
    variables: {U: "eastward velocity [m s-1]", V: "northward velocity [m s-1]", eU: "[m s-1]", eV: "[m s-1]", N: "drifter-days per square degree"}
    coordinates: ERDDAP axis order (longitude, latitude); lat ascending; lon -180..180; transposed to (lat, lon) in the derived product
    subset: 72.875S-30.125S, all longitudes
    fetch_date: "2026-10-21"
    redistributable: yes
    redownloadable: true
    raw_files: [raw/CURR-gdp-annual/drifter_annualmeans_-72.875_-30.125.nc]
    derived_on_root: [derived/ch21/fig_21_23_gdp_mean_velocity.nc]
