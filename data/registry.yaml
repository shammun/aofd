    login: none
    licence: Public domain
    licence_url: https://www.naturalearthdata.com/about/terms-of-use/
    citation: Natural Earth, free vector and raster map data, naturalearthdata.com
    attribution: Made with Natural Earth (public domain)
    size_bytes: 2528623
    sha256: 5f0d480ffbd7a1dc39c48a9c29164b1a92094225d1d0399ab67ea61581add98a
    variables: {polygons: "areas deeper than 3000 m, WGS84 lon/lat [deg]"}
